  status: open
  assumption: >-
    Email is the sign-in name, unique, stored lowercase, and not editable in MVP. Invite and reset links
    work once, expire after 72 hours, and a new link expires the earlier ones; only a hash of the token
    is stored. Passwords have at least 12 characters. A session ends after 12 hours without activity,
