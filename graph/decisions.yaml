  question: When is a Credential checked, and how often is an Agency warned that one is expiring?
  status: open
  assumption: >-
    A job that runs every five minutes (D-68) checks each Credential waiting for its checks, so a check
    that cannot run is tried again at the next run. The expiry warning is sent once for each Credential,
    by a daily job at 08:00 in the program timezone, for every verified Credential not yet warned that no
    newer Credential replaces and that expires today or within the warning days. A later change to the
    warning days does not warn again.
