- decision_id: D-63
  origin: graph
  question: How is each list ordered and filtered, and what does it show when it is empty?
  status: open
  assumption: >-
    Lists of Shifts show those not yet ended first, soonest first, then ended ones, newest first. The
    Unit's exception list shows times outside tolerance first, then the oldest Shift. Agencies offered for
    a Shift show approved ones first, lowest contracted rate first. Badge requests show Requested ones
    first, oldest first. Tip Pools, Events, and Saved Reports show the newest first. Each list filters by
    the fields its requirement names, says in words when it is empty, and offers to clear filters that
    hide everything.
    An Agency's Releases show pending and accepted ones on Shifts not yet ended, soonest first, and the
    rest on a second tab, newest first. Its Timesheets open on Draft and Rejected ones, oldest work date
    first. Worker issues and Rate Reviews show the open ones first. Rate Lines open on approved lines in
    effect. Rosters sort by last name, a Unit's roster with its Favorite Workers first, and the
    program-wide Worker list by Agency first. Each list filters by the fields its requirement names.
  blocking: false
  answer: null
  sources:
