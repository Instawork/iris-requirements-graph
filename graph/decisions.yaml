- decision_id: D-34
  origin: graph
  question: What are the account security defaults?
  status: open
  assumption: >-
    Email is the sign-in name, unique, stored lowercase, and not editable in MVP. Invite and reset links
    work once, expire after 72 hours, and a new link expires the earlier ones; only a hash of the token
    is stored. Passwords have at least 12 characters. A session ends after 12 hours without activity,
    and at once when the User is deactivated or resets their password. A reset request shows the same
    message whether or not the email matched. An invite can be sent again until it is accepted.
  blocking: false
  answer: null
  sources:
  - SHEET PLT-4
