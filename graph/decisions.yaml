- decision_id: D-20
  origin: graph
  question: >-
    How does a recurring Request repeat, and must an Agency accept a chained block as a whole and keep
    the same Workers on every Shift?
  status: open
  assumption: >-
    A recurring Request repeats its lines on chosen weekdays, every one or more weeks, through an end
    date, and every Shift is created at booking. A line's date is its first Shift and must fall on a
    chosen weekday; the end date is included and is at most 52 weeks after that date. Weeks are counted
    in seven-day spans from each line's first date. A change applies to one Shift, or to every Shift of
    the same line that has not started. A chained block is such a recurring Request and nothing more in
    MVP: Iris stores no block flag, each Shift gets its own Release, the Shifts can be sent together
    and answered one by one or several at once, and the Agency may assign different Workers to each.
  blocking: false
  answer: null
  sources:
  - SHEET SC-4
