- decision_id: D-62
  origin: graph
  question: Which tasks are on each persona's to-do list, and what is at stake on each?
  status: open
  assumption: >-
    A to-do is work the User can do themselves. A Unit User has three: Timesheets to review, which is
    every Submitted Timesheet in scope, with their total billed amount and how many are late; headcount to
    send, which is Shifts not yet started that have unsent headcount, with the time until the earliest
    starts; and badge requests to issue at secured Units, with the age of the oldest. Outstanding invoices
    join in Phase 2.
    An Agency User has seven: pending Releases to answer and accepted Releases with open headcount, each
    with the time until the earliest Shift starts; Draft Timesheets and Rejected Timesheets, each with
    the age of the oldest and how many are late; Credentials that need action, with the earliest expiry
    date; requested Rate Reviews and open Worker issues, each with the age of the oldest. A Program User
    has three: Credentials needing review and pending Rate Lines, each with the age of the oldest, and
    Rate Lines flagged above the Peer Rate that never had a Rate Review, with the largest gap in dollars.
    The Agency home has no second section in MVP, and the Program home's is Units ranked by spend.
    Anomalous invoices join in Phase 2.
  blocking: false
  answer: null
