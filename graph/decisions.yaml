  question: >-
    May a Rate Line take effect on a past date, and may it start before a line that is already approved?
  status: open
  assumption: >-
    A Rate Line may take effect on any date, past or future, that is on or after the start of every
    approved line for the same Agency, Position, and Market or Unit. It ends the line before it on that
    date. Work already sent or billed keeps the rates stored on it and is flagged by the variance check.
  blocking: false
