  question: >-
    Where does a Unit's time zone come from, what does changing it do, and does a Unit's Market follow
    later changes to a Market's ZIP codes?
  status: open
  assumption: >-
    A Program User may enter the time zone. When it is left empty, Iris fills it from the Unit's ZIP code
    using a ZIP code table shipped with the build, and refuses the Unit when the table lacks that ZIP
    code. Changing a Unit's time zone moves no stored instant: the local times and work dates of the
    Unit's Shifts and Timesheets, past and future, are read in the new zone from then on, so the change
    is for correcting a wrong zone. A Unit's Market is set from its ZIP code when the Unit is saved. When
    a ZIP code is later added
    to a Market, the Units with that ZIP code move to that Market; removing a ZIP code from a Market
    changes no Unit.
  blocking: false
  answer: null
  sources:
  - DEMO lib/types.ts
  - PRD §3 Supplier Rates
