  status: open
  assumption: >-
    Shares are rounded down to the cent, and leftover cents go one each to the shares with the largest
    dropped fractions. A pool covers every Timesheet on its Shifts and is split across those with
    hours; a pool entered before any hours has no shares until hours are entered. It is split again
    whenever covered hours change, until its Timesheets lock. They lock together, only once every one
    of them is approved and past its Lock Window, so the split always follows hours worked; one
    Timesheet that is never approved keeps the others open. A Tip Pool or PIN tip that would cover a
    locked Timesheet is refused, so tips that arrive after the lock cannot be entered in MVP. Unit
    Users keep the cashier PIN map, and a PIN tip goes to one Timesheet of that Worker; it is refused
    when the PIN is not mapped or the Worker has no open Timesheet there that day. Tips on a no-show
    Timesheet count as zero. Agency Users add tips and expenses only on Draft and Rejected Timesheets.
    A tip they enter keeps its Timesheet from being approved automatically, so a Unit User sees it
    before it is billed. A Unit User decides each expense on a Submitted Timesheet, and a decided
    expense does not change; an approved expense counts even on a no-show Timesheet.
