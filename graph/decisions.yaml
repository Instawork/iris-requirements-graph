  origin: graph
  question: How do the rows of a Shifts file become Requests, and can a file cancel a Shift?
  status: open
  assumption: >-
    The rows of one file that create Shifts at the same Unit form one Request. A file creates and changes
    Shifts and assigns Workers; it does not cancel a Shift or change its Unit, Position, or Department.
    An agency named on a new row receives that Shift's whole headcount at the contracted rate, and the
    agency column is not read on a row that changes a Shift. A file carries no Bill Rate, so a row whose
    agency has no contracted rate is a problem and that Shift is sent from its page. A row to a non-contracted
    Agency gives the reason in its own column where the gate asks for one.
