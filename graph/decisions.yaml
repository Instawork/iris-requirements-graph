  question: >-
    When a Unit changes the Bill Rate on a Release, or sends off-contract with no Rate Line, what are the
    overtime and double-time Bill Rates?
  status: open
  assumption: >-
    A changed regular rate scales the contracted overtime and double-time rates by the same ratio. With no
    Rate Line, overtime is 1.5 times and double time 2 times the regular rate the Unit enters. A Release
    keeps the rates it was sent at when Rate Lines change later. Derived rates are rounded half up to the
    cent. The same scaling applies when an Agency bills another regular rate on a Timesheet.
