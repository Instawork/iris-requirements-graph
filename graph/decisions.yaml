- decision_id: D-17
  origin: graph
  question: In MVP, can one Shift go to more than one Agency, and how is its headcount split?
  status: open
  assumption: >-
    A Unit User sends a Shift to one chosen Agency. Each Release states its headcount, and a Shift's
    pending and accepted Releases never total more than its headcount, which cannot drop below that
    total. A new Release can be sent until the Shift starts; after that, headcount can only be added to
    an accepted Release. More headcount sent to an Agency already holding the Shift is added to its
    Release, which keeps its status and rates. An Agency answers for the whole Release, gives a reason
    to decline, and may decline an accepted Release until the Shift starts. The Unit may withdraw a
    pending Release, and one still pending at the Shift's start expires. Headcount that is declined,
    given back, withdrawn, or expired can be sent again. Automatic multi-Agency dispatch is Phase 2.
  blocking: false
  answer: null
  sources:
  - SHEET SC-7
  - SHEET SC-12
  - PRD Data Model
  - FEEDBACK a single agency, then request worker as a nested feature
- decision_id: D-18
  origin: graph
  question: Until when can a Unit change a Shift, and can Workers be added after it ends?
  status: open
  assumption: >-
    Headcount, times, and site instructions can change until the Shift ends, and a Shift can be
    cancelled until it starts. A new Shift must end in the future. Cancelling a Shift cancels its
    pending and accepted Releases and takes its assigned Workers off it. After it ends, only Timesheet
    corrections apply, and a Worker found on a Timesheet without an Assignment is assigned there, even
    beyond the headcount.
  blocking: false
  answer: null
  sources:
  - PRD §2 Shift statuses
  - SHEET SC-3
  - SHEET SC-5
- decision_id: D-19
  origin: graph
  question: When a Unit books more Workers than it needs, such as 55 for 50, which Workers are billed?
  status: open
  assumption: >-
    Every Worker who works is billed. The headcount needed is recorded on the Shift and has no effect on
    billing; MVP reports do not use it.
  blocking: false
