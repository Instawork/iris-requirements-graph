- decision_id: D-60
  origin: graph
  question: >-
    How are a Tip Pool's leftover cents shared, when is a split recomputed, who keeps cashier PINs, and
    until when can tips and expenses be added or decided?
  status: open
  assumption: >-
    Shares are rounded down to the cent, and leftover cents go one each to the shares with the largest
    dropped fractions. A pool is split again when covered hours change, until any covered Timesheet
    locks. Unit Users keep the cashier PIN map, and a PIN tip goes to one Timesheet of that Worker.
    Agency Users add tips and expenses only on Draft and Rejected Timesheets. A tip they enter keeps its
    Timesheet from being approved automatically, so a Unit User sees it before it is billed. A Unit User
    decides each expense on a Submitted Timesheet, and a decided expense does not change.
  blocking: false
  answer: null
  sources:
  - SHEET TS-11
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
- decision_id: D-61
  origin: graph
  question: >-
    What do the screens every persona shares do where no source says: which Role Grant a User acts in,
    the smallest phone width, what a refused sign-in says, and what the inbox shows?
  status: open
  assumption: >-
    A User acts in one context at a time: Unit User across all their Unit User grants, Agency User for one
    Agency, Program User, or Instawork Admin. A User with several contexts chooses one at each sign-in and
    can switch without signing out; the choice is kept on the session, so every request carries it, and
    switching changes the menu and no record. A User with no unrevoked
    grant can only sign out. Every page works at a width of 360 px. A refused sign-in does not say which
    part was wrong. The inbox shows an unread count, holds the notifications of every context, and opening
    one opens its record. A refused action shows its reason and keeps what was typed, Shift times show in
    the Unit's timezone, and to-dos are computed, never stored.
  blocking: false
  answer: null
