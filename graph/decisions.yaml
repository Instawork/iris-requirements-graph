    Submitted and Approved Timesheets, and a file time with no date is read as the one nearest the
    scheduled time. A split part starts in the status of the Timesheet it came from, the break stays
    on the first part unless the user moves minutes, and a part can be split again. The parts of one
    Assignment are checked together, and a part in a Position with no Rate Line keeps the original
    rates and is an exception. A bulk step skips what it cannot do and lists it.
