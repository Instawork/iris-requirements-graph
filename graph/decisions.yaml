  question: Does a User who holds several Role Grants act with all of them at once, or only as the role they chose?
  status: open
  assumption: >-
    Only as the role they chose. Every request carries an acting context: one role and, for an Agency
    User, one Agency. A Unit User context covers all the User's Unit User grants. Iris allows an action
    only when the acting role may take it and the User still holds an unrevoked grant for that role and
    Agency; their other grants count for nothing until they switch. The context is kept on the session.
