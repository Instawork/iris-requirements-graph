- decision_id: D-41
  origin: graph
  question: How are money amounts rounded?
  status: open
  assumption: >-
    Hours are whole minutes. An amount is a rate times minutes divided by 60, rounded half up to the
    cent, for each Timesheet and each hour class; totals add the rounded amounts.
  blocking: false
  answer: null
  sources:
  - PRD §5 Invoices
  - PRD §7 Agent Chat
- decision_id: D-42
  origin: graph
  question: >-
    What are the formulas for hours, headcount, fill rate, no-show rate, and an Agency's average Bill
    Rate? The sheet says metrics are to be defined with Foodbuy.
  status: open
  assumption: >-
    Fill rate is assigned Workers over headcount on Shifts that started; for one Agency, over the
    headcount of the Releases sent to it, leaving out withdrawn ones. No-show rate is no-show Timesheets
    over assigned Workers on worked Shifts. Hours are the minutes behind spend. An Agency's average Bill
    Rate is its spend on hours over its hours. A rate over nothing shows as not available.
  blocking: false
  answer: null
  sources:
  - SHEET RC-16
  - PRD §1 Metric definitions
  - PRD §1 Detailed requirements
- decision_id: D-43
  origin: graph
  question: >-
    Which dates count in labor cost as a percentage of sales, does labor cost include Compass's own
    employees, and what does a second sales upload for the same Unit and date do?
  status: open
  assumption: >-
    Only dates with revenue above zero count, in both the spend and the revenue; with none, the measure
    shows as not available. Labor cost is agency spend in Iris only. A second upload for the same Unit
    and date replaces the first.
  blocking: false
  answer: null
  sources:
  - SHEET REP-3
  - SHEET REP-4
  - PRD §6 Templates
- decision_id: D-44
  origin: graph
  question: How is an Event's projected cost computed?
  status: open
  assumption: >-
    The sum, over the pending and accepted Releases of the Event's Shifts, of headcount times scheduled
    minutes (end minus start minus the planned break) times the regular Bill Rate, rounded per Release.
    It holds no tips, expenses, or overtime premium, and follows the Releases as they change.
  blocking: false
  answer: null
  sources:
  - SHEET REP-2
- decision_id: D-45
  origin: graph
  question: >-
    Who keeps a Saved Report, what is a dashboard, and are the sheet's "top operators" Units or people?
  status: open
  assumption: >-
    Unit Users and Program Users ask questions within their scope; Agency Users get no reports in MVP. A
    Saved Report belongs to the User who saved it and is recomputed when reopened. An answer with
    several measures is a dashboard. Operators are ranked as Units.
  blocking: false
  answer: null
  sources:
  - SHEET REP-1
  - SHEET REP-9
  - SHEET 6.3
