    Only an Approved Timesheet locks. An unapproved one stays open after the window and shows as late
    on the Unit's and the Agency's to-dos. A Timesheet approved after its window has closed locks one
    Lock Window after it is approved, not at approval, so a Unit User can still review and correct it.
