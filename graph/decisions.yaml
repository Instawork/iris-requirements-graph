  status: open
  assumption: >-
    A Draft Timesheet is created when its Shift ends, and clock times are kept to the minute. A clock
    time is local to the Unit: one that does not exist on a daylight-saving change is refused, and one
    that occurs twice is read as the one nearest the schedule. Worked minutes are zero until both
