  origin: graph
  question: Who invites Users, is there a view-only scope, and can a Program User be limited to a sector?
  status: open
  assumption: >-
    Program Users invite any User, and an Agency User invites Users to their own Agency. MVP has no
    view-only role, and every Program User covers the whole program.
  blocking: false
  answer: null
  sources:
  - SHEET PLT-1
  - SHEET PLT-4
  - FAQ
