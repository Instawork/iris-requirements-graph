- decision_id: D-29
  origin: graph
  question: What counts as pending spend?
  status: open
  assumption: >-
    Hours worked on Shifts that have ended but whose Timesheets are not yet approved, at the hours entered
    or the scheduled hours when none are entered. Both are priced at the Release's Bill Rates: entered
    hours by hour class, and scheduled hours (end minus start minus the planned break) at the regular
    rate. Pending spend holds hours only; tips and expenses count once their Timesheet is approved.
  blocking: false
  answer: null
  sources:
  - PRD §1 Detailed requirements
  - SHEET REP-2
