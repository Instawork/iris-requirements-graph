- decision_id: D-110
  origin: graph
  question: >-
    In which order are a role's menu, Home, and screens built, and what does a User see before every
    screen exists?
  status: open
  assumption: >-
    Each role's menu and Home page are one requirement, built before that role's other screens. A menu
    shows an item once the screen it opens is delivered. Home holds the sections other requirements add
    to it, and says there is nothing to do when none has anything to show. Where a screen built earlier
    leads to one built later, such as a tab, a link, or a menu item, the later screen's requirement adds
    it. So the first slice can be used end to end before the other screens exist.
