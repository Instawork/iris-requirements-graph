- decision_id: D-42
  origin: graph
  question: >-
    What are the formulas for hours, headcount, fill rate, no-show rate, and an Agency's average Bill
    Rate? The sheet says metrics are to be defined with Foodbuy.
  status: open
  assumption: >-
    Fill rate is assigned Workers over headcount on Shifts that started; for one Agency, over the
    headcount of the Releases sent to it, leaving out withdrawn ones. No-show rate is no-show
    Timesheets over assigned Workers on worked Shifts. Hours are the minutes behind spend, and
    overtime hours are the overtime and double-time minutes within them. Headcount requested leaves
    out cancelled Shifts. Headcount and fill rate group by the Shift's Position and Department, spend
    and hours by the Timesheet's, and every measure by the Shift's Event. An Agency's average Bill
    Rate is its spend on hours over its hours. A rate over nothing shows as not available.
  blocking: false
  answer: null
  sources:
  - SHEET RC-16
  - PRD §1 Metric definitions
  - PRD §1 Detailed requirements
