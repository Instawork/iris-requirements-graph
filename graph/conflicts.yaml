# Where two sources disagree, what the graph keeps and what it drops. Precedence is in sources.yaml (rank).
conflicts:
- conflict_id: C-1
  topic: Names
  keep: Unit, Agency, Worker (sheet, feedback).
  drop: Buyer, Supplier, Professional or Pro (PRD, demo).
- conflict_id: C-2
  topic: Releasing to Agencies
  keep: >-
    MVP sends each Shift to a chosen Agency; dispatch rules come in Phase 2 (sheet SC-7, SC-12; D-17).
  drop: >-
    Tiered release every 4 hours as the default (PRD). Kept as the detail of the Phase 2 rule.
- conflict_id: C-3
  topic: Invoices
  keep: One weekly consolidated invoice, in Phase 2 (sheet INV-1).
  drop: >-
    A separate invoice per Agency per Shift, generated at the hours deadline and bundled into Invoice
    Groups (PRD).
- conflict_id: C-4
  topic: Confirming hours
  keep: >-
    The Agency submits and the Unit approves by exception (sessions, demo); Timesheets lock after a window
    (sheet TS-7 to TS-9; D-33). A Unit User's Timesheet file is saved as corrections to submitted and
    approved Timesheets.
  drop: >-
    Either side edits hours freely like a shared document, and a Unit can enter hours or mark a no-show
    before the Agency submits (PRD). Its change history and its rule that each change notifies the other
    party by email are kept.
- conflict_id: C-5
  topic: Hours deadline
  keep: Approved Timesheets lock 24 to 48 hours after the Shift, 48 by default (sheet TS-9; D-16).
  drop: Hours become final 72 hours after the Shift ends (PRD).
- conflict_id: C-6
  topic: Worker ratings
  keep: Favorite, Okay to return, or Block, with an optional review (sheet WA-3; PRD).
  drop: 1 to 5 stars feeding invoice anomaly weighting (PRD).
- conflict_id: C-7
  topic: Compliance
  keep: >-
    Inside Iris in MVP: requirements, uploads, AI validation, attestations (sheet 3.4).
  drop: Handled in a separate system (PRD).
- conflict_id: C-8
  topic: Units
  keep: >-
    Added by form or file in MVP (sessions); automatic sync in Phase 3 (sheet PLT-8).
  drop: Loaded only from an external vetted source (PRD).
- conflict_id: C-9
  topic: Org tree
  keep: Sector, Region, District, Unit, Department (sheet PLT-2).
  drop: Super sector and regional business levels (demo).
- conflict_id: C-10
  topic: Agency approval
  keep: Approval belongs to the Program, at an org scope (D-9).
  drop: Each Unit approves and ranks its own Agencies (PRD).
- conflict_id: C-11
  topic: Release notices
  keep: Agencies hear of a new Release by email or SMS, and in the app (sheet SC-8).
  drop: Release notices in the app only (PRD). The PRD's email on hour changes is kept.
- conflict_id: C-12
  topic: Users per role
  keep: Many Users per role, each with their own login (sheet PLT-1, PLT-4).
  drop: Each role is one user for now (PRD).
- conflict_id: C-13
  topic: Who sets up rates
  keep: >-
    Program Users can enter and load Rate Lines for any Agency, as well as Agencies for themselves
    (feedback; D-10).
  drop: Only Agencies upload rates; Compass does not set them up (PRD).
- conflict_id: C-14
  topic: Markup
  keep: Markup is shown as a percentage of the Pay Rate (feedback "just do % only"; D-11).
  drop: Markup as a dollar amount, bill minus pay, entered on the rate card (PRD).
- conflict_id: C-15
  topic: Comparing Agency rates
  keep: >-
    Program Users filter and sort Rate Lines by Position and Market, with the Peer Rate beside each line
    (feedback: too many Agencies to see side by side).
  drop: Every Agency's rates side by side (PRD).
- conflict_id: C-16
  topic: Bill Rate on a Shift
  keep: >-
    The contracted rate is set as the default, and a Unit User may change it with a reason (sheet SC-1,
    RC-11; sessions).
  drop: Nobody types a bill rate on a Shift (PRD).
- conflict_id: C-17
  topic: Hours, tips, and expenses uploads
  keep: Separate Timesheet, tips, and expense upload types (sheet TS-5, TS-11, TS-12).
  drop: Hours and tips as fields on the Shift file, not separate uploads (PRD).
- conflict_id: C-18
  topic: Labor cost against sales
  keep: Labor cost as a percentage of sales in MVP (sheet REP-3).
  drop: Comparison logic is not part of v1 (PRD).
- conflict_id: C-19
  topic: Requests from MyStaff
  keep: Requests start in Iris; MyStaff is Phase 3 (sheet PLT-11; D-6).
  drop: Open shifts come straight from MyStaff (FAQ).
- conflict_id: C-20
  topic: Invoice period
  keep: Weekly (sheet INV-1).
  drop: Every month rolls into one consolidated invoice (demo).
- conflict_id: C-21
  topic: Agency performance views
  keep: >-
    Agency scorecards in Phase 3 (sheet RC-16). In MVP, Program Users see each Agency's fill rate and
    no-show rate beside its spend (sheet REP-9), with formulas still to be defined with Foodbuy.
  drop: >-
    Units rank Agencies by spend, relationship, and performance on the dashboard, and Agencies see their
    own fill rate, time to fill, no-show rate, compliance, and average rating (PRD).
- conflict_id: C-22
  topic: Budget approvals
  keep: 'Phase 3 (sheet SC-15; feedback: skip unless it''s an issue).'
  drop: Every over-budget order needs approval from day one (FAQ, deck).
- conflict_id: C-23
  topic: Clock-in
  keep: >-
    Phase 3 and an open decision (sheet TS-1; D-5). MVP auto-approval compares billed times with the schedule.
  drop: Iris clock as the source of truth from day one (FAQ, deck, sessions, demo).
- conflict_id: C-24
  topic: Forecasts and savings
  keep: >-
    Only what the sheet lists: fill risk (Phase 2) and Department demand forecasting (Phase 3).
  drop: Spend forecasts and savings recommendations (FAQ, deck, sessions).
- conflict_id: C-25
  topic: Paying Agencies
  keep: Iris records what is owed and shows payment status in Phase 2 (sheet INV-7; D-31).
  drop: Agencies are paid through Iris (FAQ).
- conflict_id: C-26
  topic: AI in validation
  keep: >-
    An AI model judges credential documents for expiry, issuer, and signs of editing (sheet WA-15; D-3).
    Code does every other check.
  drop: Code does every validation check, with no exception (PRD).
- conflict_id: C-27
  topic: Upload file kinds
  keep: >-
    Timesheets, tips, expenses, and Credential documents also arrive as PDFs and images (sheet TS-5,
    WA-14; sessions; feedback on OCR).
  drop: Every upload is a CSV or Excel file (PRD).
- conflict_id: C-28
  topic: Accrual scope
  keep: >-
    Hours worked that no issued invoice covers, split into with the Agency, waiting for approval, and
    approved (sheet 5.3; sessions). The approved part is the INV-12 figure.
  drop: Approved, uninvoiced Timesheets only (sheet INV-12 read alone).
- conflict_id: C-29
  topic: Shift statuses after the Shift
  keep: >-
    A Shift ends as Worked, Unfilled, or Cancelled; hours, approval, and lock are tracked on each
    Timesheet (sheet TS-7 to TS-9; C-4).
  drop: Confirming hours, Final, and Invoiced as Shift statuses (PRD).
- conflict_id: C-30
  topic: Worker contact details
  keep: >-
    Email and phone are optional on a Worker, because a paper sign-in sheet carries only names (sessions,
    Timesheets, Tips & Expenses; the PRD's own Shift template makes the phone optional). The Agency is
    told when an assigned Worker has neither, so site instructions still reach the Worker (sheet SC-6; D-91).
  drop: Email and phone required on every Professional row (PRD).
- conflict_id: C-31
  topic: Which Workers a Unit can rate and request
  keep: >-
    A Unit can request and rate a Worker before they have worked there, so favorite rosters and blocks
    carry over (sheet WA-2, 3.2).
  drop: >-
    Buyers see and rate only professionals assigned to or who have worked at their locations (PRD).
- conflict_id: C-32
  topic: Double-booking inside one Agency
  keep: Conflict detection across Shifts and Agencies is Phase 3 (sheet WA-6).
  drop: A Worker booked elsewhere that day is held back at assignment in MVP (demo).
- conflict_id: C-33
  topic: ZIP codes on a rate card
  keep: >-
    ZIP codes belong to the Market, which Instawork loads; a rate card row names a city and state, or a
    Unit (D-21; D-1).
  drop: Each Agency lists ZIP codes on its own rate card rows, filled in when empty (PRD).
- conflict_id: C-34
  topic: Unit home and pages
  keep: >-
    The Unit home shows to-dos and the spend summary (sheet REP-7). Timesheets, Tips, Events, Reports, and
    Setup are their own screens, and invoices wait for Phase 2 (sheet 5.1).
  drop: >-
    The same six pages for every user, a Suppliers subtab where the Buyer approves and ranks Suppliers,
    and an outstanding-invoices to-do (PRD).
- conflict_id: C-35
  topic: Compliance status on the Unit's Worker roster
  keep: >-
    A Worker is eligible for one Shift at a time, so a Unit User sees eligibility on each assigned Worker
    of a Shift (sheet 3.1). Credentials stay with the Agency and Program Users.
  drop: A compliance status for each professional on the Buyer's, Agency's, and program's Worker lists (PRD).
- conflict_id: C-36
  topic: Agency and Program homes
  keep: >-
    The Agency home lists to-dos only, and Agency performance waits for scorecards in Phase 3 (sheet
    RC-16; C-21). The Program home lists Credentials to review, rate changes to approve, and rates above
    their peers, then ranks Units by spend against their normal level (D-30) with a count of off-contract
    and non-contracted Releases (D-2).
  drop: >-
    A Supplier to-do for professionals who need onboarding and a Shift performance subtab; a Compass
    to-do for anomalous invoices and a Buyers table flagged by anomalous invoices (PRD).
- conflict_id: C-45
  topic: Site instructions in a Shifts file
  keep: >-
    Five columns, parking, entrance, directions, site_contact, and attire, one for each structured site
    instruction field (sheet SC-6).
  drop: One free-text instructions column on the Shift template (PRD).
