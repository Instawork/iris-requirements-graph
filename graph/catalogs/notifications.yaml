# Every notification Iris sends. REQ-MESSAGING-0001 delivers them; the owner requirement decides when to send.
# Recipients never include the User whose action caused the notification. PASSWORD_RESET and
# INBOUND_REPLY are the exceptions: they answer that person.
notifications:
- type: RELEASE_NEW
  trigger: A Release is sent to an Agency, or more headcount is added to its Release.
  recipients: Every active Agency User of the Agency.
  channels: [EMAIL, SMS, IN_APP]
  owner: REQ-DISPATCH-0001
  sources: [SHEET SC-8]
- type: RELEASE_WITHDRAWN
  trigger: A pending Release is withdrawn, or its Shift is cancelled.
  recipients: Every active Agency User of the Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-DISPATCH-0001
  sources: [SHEET SC-8]
  decisions: [D-17]
- type: RELEASE_ANSWERED
  trigger: An Agency accepts or declines a Release, including a decline after accepting.
  recipients: The User who sent the Release.
  channels: [EMAIL, IN_APP]
  owner: REQ-DISPATCH-0002
  sources: [SHEET SC-8]
- type: SHIFT_CHANGED
  trigger: The times, headcount, or site instructions of a Shift with an open Release change.
  recipients: Every active Agency User of each Agency holding a pending or accepted Release on it.
  channels: [EMAIL, IN_APP]
  owner: REQ-ORDERING-0003
  sources: [SHEET SC-3]
  decisions: [D-18]
- type: WORKER_ASSIGNED
  trigger: A Worker is assigned to a Shift.
  recipients: The User who created the Request.
  channels: [IN_APP]
  owner: REQ-WORKFORCE-0003
  sources: [PRD §2 Shifts]
- type: WORKER_REMOVED
  trigger: >-
    A Worker is removed from a Shift for any reason except its cancellation or the Worker not being
    eligible, which WORKER_NOT_ELIGIBLE covers.
  recipients: The User who created the Request.
  channels: [EMAIL, IN_APP]
  owner: REQ-WORKFORCE-0003
  sources: [PRD §2 Shifts]
- type: SITE_INSTRUCTIONS
  trigger: A Worker is assigned to a Shift, or its site instructions change while Workers are assigned.
  recipients: The Worker, at their email or phone.
  channels: [EMAIL, SMS]
  owner: REQ-ORDERING-0006
  sources: [SHEET SC-6]
- type: WORKER_NOT_ELIGIBLE
  trigger: An assigned Worker stops being eligible for an upcoming Shift.
  recipients: Every active Agency User of the Worker's Agency, and the User who created the Request.
  channels: [EMAIL, IN_APP]
  owner: REQ-COMPLIANCE-0005
  sources: [SHEET WA-14, FAQ]
- type: CREDENTIAL_EXPIRING
  trigger: A verified credential's expiry is CREDENTIAL_EXPIRY_WARNING_DAYS away or less. Sent once for each credential.
  recipients: Every active Agency User of the Worker's Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-COMPLIANCE-0002
  sources: [SHEET WA-14]
  decisions: [D-16]
- type: CREDENTIAL_DECIDED
  trigger: A credential is verified or rejected.
  recipients: The User who uploaded it.
  channels: [IN_APP]
  owner: REQ-COMPLIANCE-0003
  sources: [SHEET WA-15]
- type: TIMESHEET_CHANGED
  trigger: >-
    A Unit User or an Agency User changes the hours, breaks, or no-show of a Timesheet that has been
    submitted at least once, or splits it.
  recipients: The other party, the Agency's active Agency Users or the Unit Users over the Unit.
  channels: [EMAIL, IN_APP]
  owner: REQ-TIME-0006
  sources: [PRD Overview, PRD §2 Shifts]
- type: TIMESHEET_REJECTED
  trigger: A Unit User rejects a Timesheet.
  recipients: Every active Agency User of the Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-TIME-0006
  sources: ['SESSIONS Timesheets, Tips & Expenses']
- type: OVERTIME_ALERT
  trigger: An Assignment or saved Timesheet hours add overtime for a Worker at a Unit in its Work Week.
  recipients: Every active Agency User of the Agency, and the User who created the Request.
  channels: [IN_APP]
  owner: REQ-LABOR-0003
  sources: [SHEET WA-19]
- type: RATE_LINE_PENDING
  trigger: An Agency User submits a Rate Line.
  recipients: Every active Program User.
  channels: [IN_APP]
  owner: REQ-RATES-0009
  decisions: [D-10]
- type: RATE_LINE_DECIDED
  trigger: A Program User approves or sends back an Agency's Rate Line.
  recipients: The User who submitted it.
  channels: [EMAIL, IN_APP]
  owner: REQ-RATES-0009
  decisions: [D-10]
- type: RATE_REVIEW_REQUESTED
  trigger: A Program User sends a Rate Review.
  recipients: Every active Agency User of the Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-RATES-0008
  sources: [SHEET RC-12]
- type: RATE_REVIEW_ANSWERED
  trigger: An Agency lowers a reviewed rate or gives a reason to keep it.
  recipients: The User who requested the review.
  channels: [IN_APP]
  owner: REQ-RATES-0008
  sources: [SHEET RC-12]
- type: WORKER_ISSUE_REPORTED
  trigger: A Unit User reports a Worker issue.
  recipients: Every active Agency User of the Worker's Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-WORKFORCE-0006
  sources: [SHEET WA-4]
- type: WORKER_ISSUE_RESOLVED
  trigger: An Agency resolves a Worker issue.
  recipients: The User who reported it.
  channels: [IN_APP]
  owner: REQ-WORKFORCE-0006
  sources: [SHEET WA-4]
- type: USER_INVITED
  trigger: A User is invited.
  recipients: The invited User.
  channels: [EMAIL]
  owner: REQ-IDENTITY-0002
  sources: [SHEET PLT-4]
  decisions: [D-34]
- type: PASSWORD_RESET
  trigger: A User asks to reset their password.
  recipients: That User.
  channels: [EMAIL]
  owner: REQ-IDENTITY-0002
  sources: [SHEET PLT-4]
  decisions: [D-34]
- type: INBOUND_REPLY
  trigger: Iris answers an email or text it received.
  recipients: The sender, on the channel they used.
  channels: [EMAIL, SMS]
  owner: REQ-MESSAGING-0002
  sources: [SHEET SC-10]
