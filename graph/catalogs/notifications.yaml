# Every notification Iris sends. REQ-MESSAGING-0001 delivers them; the owner requirement decides when to send.
# Recipients never include the User whose action caused the notification. PASSWORD_RESET and
# INBOUND_REPLY are the exceptions: they answer that person.
# channels: every channel a type may use. An owner may name fewer for one send (REQ-MESSAGING-0001.R3).
# No source gives the wording: the owner writes each title and body from the facts its rule names (D-101).
notifications:
- type: RELEASE_NEW
  trigger: A Release is sent to an Agency, or more headcount is added to its Release.
  recipients: Every active Agency User of the Agency.
  channels: [EMAIL, SMS, IN_APP]
  owner: REQ-DISPATCH-0001
  sources: [SHEET SC-8]
- type: RELEASE_WITHDRAWN
  trigger: A pending Release is withdrawn, or its Shift is cancelled.
  recipients: Every active Agency User of the Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-DISPATCH-0001
  sources: [SHEET SC-8]
  decisions: [D-179, D-180]
- type: RELEASE_ANSWERED
  trigger: An Agency accepts or declines a Release, including a decline after accepting.
  recipients: The User who sent the Release.
  channels: [EMAIL, IN_APP]
  owner: REQ-DISPATCH-0002
  sources: [SHEET SC-8]
- type: SHIFT_CHANGED
  trigger: The date, times, headcount, or site instructions of a Shift with a pending or accepted Release change.
  recipients: Every active Agency User of each Agency holding a pending or accepted Release on it.
  channels: [EMAIL, IN_APP]
  owner: REQ-ORDERING-0003
  sources: [SHEET SC-3]
  decisions: [D-18]
- type: WORKER_ASSIGNED
  trigger: A Worker is assigned to a Shift.
  recipients: Every active Unit User over the Shift's Unit.
  channels: [IN_APP]
  owner: REQ-WORKFORCE-0003
  sources: [PRD §2 Shifts]
  decisions: [D-160]
- type: WORKER_REMOVED
  trigger: >-
    A Worker is removed from a Shift for any reason except its cancellation, which RELEASE_WITHDRAWN
    covers, or the Worker not being eligible, which WORKER_NOT_ELIGIBLE covers.
  recipients: >-
    Every active Unit User over the Shift's Unit. When the Unit blocked the Worker, also every active
    Agency User of the Worker's Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-WORKFORCE-0003
  sources: [PRD §2 Shifts, SHEET WA-3]
  decisions: [D-51, D-160]
- type: SITE_INSTRUCTIONS
  trigger: A Worker is assigned to a Shift, or its site instructions change while Workers are assigned.
  recipients: The Worker, at their email or phone.
  channels: [EMAIL, SMS]
  owner: REQ-ORDERING-0006
  sources: [SHEET SC-6]
- type: INSTRUCTIONS_NOT_SENT
  trigger: Site instructions would be sent to an assigned Worker who has neither an email nor a phone.
  recipients: Every active Agency User of the Worker's Agency.
  channels: [IN_APP]
  owner: REQ-ORDERING-0006
  sources: [SHEET SC-6]
  decisions: [D-89]
- type: WORKER_NOT_ELIGIBLE
  trigger: An assigned Worker stops being eligible for an upcoming Shift.
  recipients: Every active Agency User of the Worker's Agency, and every active Unit User over the Shift's Unit.
  channels: [EMAIL, IN_APP]
  owner: REQ-COMPLIANCE-0005
  sources: [SHEET WA-14, "FAQ What happens if a worker doesn't meet the requirements?"]
  decisions: [D-51, D-160]
- type: CREDENTIAL_EXPIRING
  trigger: >-
    A verified credential's expiry is CREDENTIAL_EXPIRY_WARNING_DAYS away or less. Sent once for each credential,
    by a daily job, and recorded in Credential.expiry_warned_at.
  recipients: Every active Agency User of the Worker's Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-COMPLIANCE-0002
  sources: [SHEET WA-14]
  decisions: [D-16, D-156]
- type: CREDENTIAL_DECIDED
  trigger: A credential is verified or rejected.
  recipients: The User who uploaded it.
  channels: [IN_APP]
  owner: REQ-COMPLIANCE-0003
  sources: [SHEET WA-15]
- type: TIMESHEET_CHANGED
  trigger: >-
    A Unit User or an Agency User changes the hours, breaks, or no-show of a Timesheet that has been
    submitted at least once, or splits it; or a Unit User sets or clears a no-show on any Timesheet.
  recipients: The other party, the Agency's active Agency Users or the Unit Users over the Unit.
  channels: [EMAIL, IN_APP]
  owner: REQ-TIME-0006
  sources: [PRD §2 How hour changes work, PRD §2 Shifts]
  decisions: [D-70]
- type: TIMESHEET_REJECTED
  trigger: A Unit User rejects a Timesheet.
  recipients: Every active Agency User of the Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-TIME-0006
  sources: ['SESSIONS Timesheets, Tips & Expenses']
- type: OVERTIME_ALERT
  trigger: >-
    An Assignment or saved Timesheet hours add overtime for a Worker of one Agency, counting every Unit, in
    the Work Week of the Shift's Unit.
  recipients: Every active Agency User of the Agency, and every active Unit User over the Unit of the Shift that added it.
  channels: [IN_APP]
  owner: REQ-LABOR-0003
  sources: [SHEET WA-19]
  decisions: [D-4, D-141, D-73]
- type: TIP_NOT_CREDITED
  trigger: >-
    A change to a Timesheet leaves part of a Tip Pool unallocated, or makes a Timesheet that holds a cashier
    PIN tip a no-show.
  recipients: Every active Unit User whose scope covers the Unit.
  channels: [IN_APP]
  owner: REQ-TIPS-0004
  sources: [SHEET TS-11]
  decisions: [D-143]
- type: RATE_LINE_PENDING
  trigger: An Agency User submits a Rate Line.
  recipients: Every active Program User.
  channels: [IN_APP]
  owner: REQ-RATES-0009
  decisions: [D-10]
- type: RATE_LINE_DECIDED
  trigger: A Program User approves or sends back an Agency's Rate Line.
  recipients: The User who submitted it.
  channels: [EMAIL, IN_APP]
  owner: REQ-RATES-0009
  decisions: [D-10]
- type: RATE_REVIEW_REQUESTED
  trigger: A Program User sends a Rate Review.
  recipients: Every active Agency User of the Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-RATES-0008
  sources: [SHEET RC-12]
- type: RATE_REVIEW_ANSWERED
  trigger: An Agency lowers a reviewed rate or gives a reason to keep it.
  recipients: The User who requested the review.
  channels: [IN_APP]
  owner: REQ-RATES-0008
  sources: [SHEET RC-12]
- type: WORKER_ISSUE_REPORTED
  trigger: A Unit User reports a Worker issue.
  recipients: Every active Agency User of the Worker's Agency.
  channels: [EMAIL, IN_APP]
  owner: REQ-WORKFORCE-0006
  sources: [SHEET WA-4]
- type: WORKER_ISSUE_RESOLVED
  trigger: An Agency resolves a Worker issue.
  recipients: The User who reported it.
  channels: [IN_APP]
  owner: REQ-WORKFORCE-0006
  sources: [SHEET WA-4]
- type: USER_INVITED
  trigger: A User is invited.
  recipients: The invited User.
  channels: [EMAIL]
  owner: REQ-IDENTITY-0002
  sources: [SHEET PLT-4]
  decisions: [D-34]
- type: PASSWORD_RESET
  trigger: A User asks to reset their password.
  recipients: That User.
  channels: [EMAIL]
  owner: REQ-IDENTITY-0002
  sources: [SHEET PLT-4]
  decisions: [D-34]
- type: INBOUND_REPLY
  trigger: Iris answers an email or text it received.
  recipients: The sender. The owner names the one channel the message arrived on, so the reply never goes out on the other.
  channels: [EMAIL, SMS]
  owner: REQ-MESSAGING-0002
  sources: [SHEET SC-10]
