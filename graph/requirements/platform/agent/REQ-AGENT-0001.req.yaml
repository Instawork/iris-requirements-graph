requirement_id: REQ-AGENT-0001
requirement_target_layer: platform
requirement_target_module: AGENT
requirement_phase: MVP
requirement_title: Interpret with the LLM, compute with code
requirement_statement: >-
  Every call to the LLM goes through one gateway, which reads typed requests, column names, and text in
  files, and writes summaries and explanations. Code does every validation check, every match, and all
  money and hours math. The one exception is the AI check of credential documents.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The LLM is used only to read typed requests, column names, and text in files and messages, and to
    write summaries, questions, and explanations.
  rule_sources:
  - PRD §7 What the LLM does and what code does
  - SHEET TS-5
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Every validation check, every match to a stored record, and all money and hours math is done by code,
    never by the LLM.
  rule_sources:
  - PRD §7 What the LLM does and what code does
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Given the same values read from a file or request and the same user decisions, code returns the same
    checks, matches, and amounts every time.
  rule_sources:
  - PRD §7 What the LLM does and what code does
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    LLM output never changes a record directly: it becomes values in a Proposal, a question, or an answer
    to the user.
  rule_sources:
  - PRD §7 What the LLM does and what code does
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Credential document checks are the exception: the model reads each document file and returns its
    issuer, its dates, and any signs of editing, and REQ-COMPLIANCE-0003 saves the result without a Proposal.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-3
- rule_id: R6
  rule_statement: >-
    Every call to the LLM goes through this requirement, which alone holds the provider.
  rule_sources:
  - GRAPH the rules need one place that enforces them
  rule_decisions:
  - D-102
- rule_id: R7
  rule_statement: >-
    A reading returns a value for each field asked for, empty where the text or file gives none; output
    in any other shape, or no answer, is returned as a failure, never as a guess.
  rule_sources:
  - GRAPH the rules need one place that enforces them
  rule_decisions:
  - D-102
- rule_id: R8
  rule_statement: >-
    This requirement can read and change no record, so whatever the LLM returns reaches a record only
    through its caller's own rules.
  rule_sources:
  - PRD §7 What the LLM does and what code does
  rule_decisions:
  - D-102
- rule_id: R9
  rule_statement: >-
    A caller passes a text, or a PDF or image file, and the fields to read from it, or the facts to put
    into words.
  rule_sources:
  - SHEET WA-15
  - GRAPH signs of editing show in a document file and not in its OCR text
  rule_decisions:
  - D-102
requirement_sources:
- PRD §7 What the LLM does and what code does
- SHEET WA-15
requirement_decisions:
- D-3
- D-102
requirement_features: []
edges: []
data_model:
  status: not_applicable
  reads: []
  writes: []
  detail: >-
    Delivered as the one gateway that makes every LLM call, tested by R6 to R9. It stores nothing,
    and R1 to R5 bind every requirement that calls it.
requirement_starting_flow: true
