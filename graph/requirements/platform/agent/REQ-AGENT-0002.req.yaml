requirement_title: Save nothing until a person approves the Proposal
requirement_statement: >-
  Every AI-assisted change is a Proposal listing rows ready, rows with problems, and a suggested fix for
  each. Nothing is saved until a person approves it.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: The user accepts, edits, or rejects each fix, or accepts them all.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: Rejected rows are not saved, and approved rows are saved together.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: The Proposal is kept with who decided and when.
  rule_sources: []
  rule_decisions: []
