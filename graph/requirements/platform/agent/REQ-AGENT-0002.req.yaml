requirement_id: REQ-AGENT-0002
requirement_target_layer: platform
requirement_target_module: AGENT
requirement_phase: MVP
requirement_title: Save nothing until a person approves the Proposal
requirement_statement: >-
  Every change Iris prepares from a file or a message is a Proposal that lists each proposed change, any
  problem found, and a suggested fix. Nothing is saved until the person it was made for approves it, and
  each accepted item is rechecked as it is saved.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Proposal is created OPEN with its kind, its channel, the User it was made for, a summary, and one
    ProposalItem for each proposed change.
  rule_sources:
  - PRD §7 Agent Chat
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Each ProposalItem holds its action, record type, and values, and one entry for each problem a check
    found: the field it is on, a message, and any fix or candidates.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-102
- rule_id: R3
  rule_statement: >-
    While a Proposal is OPEN it has changed no record other than itself and its ProposalItems.
  rule_sources:
  - PRD §7 When the agent is unsure
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Only the User the Proposal was made for can decide it, and only while it is OPEN; any other attempt
    is refused.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions:
  - D-36
- rule_id: R5
  rule_statement: >-
    That User sets each item's decision to ACCEPTED, to EDITED with the values as they leave them, or
    to REJECTED, and can accept at once every undecided item that can be ACCEPTED.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    ACCEPTED puts each fix's value into field_values and is refused while a problem has neither a fix nor a
    picked candidate; EDITED applies no fix and keeps the User's values, changed or not.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-224
- rule_id: R7
  rule_statement: >-
    The User then applies the Proposal: an undecided item with no problem counts as ACCEPTED, and applying
    is refused while an item with a problem has no decision.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-224
- rule_id: R8
  rule_statement: >-
    On apply, the ACCEPTED and EDITED items are handed, in list order, to the save step of the Proposal's
    kind, whose owner rechecks each item against its own rules at that moment.
  rule_sources:
  - PRD §7 Agent Chat
  rule_decisions:
  - D-174
- rule_id: R9
  rule_statement: >-
    An item its owner saves gets result SAVED and the saved record's id in record_id; an item its owner
    refuses is not saved and gets FAILED_RECHECK with the owner's reason in result_message.
  rule_sources: []
  rule_decisions:
  - D-174
- rule_id: R10
  rule_statement: A REJECTED item is never saved and gets no result.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R11
  rule_statement: >-
    After apply the Proposal is APPLIED when every ACCEPTED or EDITED item is SAVED, and PARTLY_APPLIED
    when at least one is FAILED_RECHECK.
  rule_sources: []
  rule_decisions:
  - D-174
- rule_id: R12
  rule_statement: >-
    Rejecting the Proposal, or applying it with every item REJECTED, sets every item REJECTED and the
    Proposal REJECTED, and saves nothing.
  rule_sources:
  - PRD §6 Uploads
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R13
  rule_statement: >-
    Deciding sets decided_by_id and decided_at, and a decided Proposal never changes again, so a failed item
    is retried only in a new Proposal.
  rule_sources: []
  rule_decisions:
  - D-173
- rule_id: R14
  rule_statement: >-
    Each save is given the Proposal's id and channel and the deciding User, so the Audit Trail shows where
    the change came from.
  rule_sources: []
  rule_decisions:
  - D-37
- rule_id: R15
  rule_statement: >-
    An OPEN Proposal does not expire: it stays OPEN until its User decides it.
  rule_sources: []
  rule_decisions:
  - D-173
- rule_id: R16
  rule_statement: >-
    A User can list the Proposals made for them, OPEN ones first, and no one else's.
  rule_sources: []
  rule_decisions:
  - D-36
- rule_id: R17
  rule_statement: >-
    Accepting an item that has a fix which drops it, such as a duplicate row, sets its decision to REJECTED,
    and setting it EDITED keeps it.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-224
- rule_id: R18
  rule_statement: >-
    An item's values are one flat set of names and values: for FILE_ROWS the names are the upload type's
    catalog columns, and for any other kind the requirement that proposes it names them.
  rule_sources:
  - GRAPH two requirements build and read each item, so its shape is fixed here
  rule_decisions:
  - D-102
- rule_id: R19
  rule_statement: >-
    Candidates for a name are every stored record that matches it or, when none does, the three stored
    names closest to it by single-character edits, with ties in alphabetical order.
  rule_sources:
  - PRD §7 File attached
  - GRAPH the Names convention offers closest names and does not say how they are chosen
  rule_decisions:
  - D-225
- rule_id: R20
  rule_statement: >-
    The User picks at most one candidate for a problem, which stores that candidate's value in picked,
    and the owner saves the item against the record picked.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions:
  - D-224
- rule_id: R21
  rule_statement: >-
    Items that share a group_key make one record together, such as the Shifts of one Request, and are
    handed to the save step in one call.
  rule_sources:
  - GRAPH one Proposal of many rows can make one record
  rule_decisions:
  - D-174
- rule_id: R22
  rule_statement: >-
    Each item saves whole or not at all, with its Audit Trail entries and Notifications, and an item that
    is refused leaves every other item saved, in its group or outside it.
  rule_sources:
  - GRAPH the Saving together convention would otherwise make one file one transaction
  rule_decisions:
  - D-174
- rule_id: R23
  rule_statement: >-
    Each Proposal kind has one save step, registered by the requirement that proposes that kind; for FILE_ROWS
    it is REQ-INTAKE-0002, which hands each row to its upload type's owner.
  rule_sources:
  - GRAPH platform cannot call a product requirement, so the owner registers its save step
  rule_decisions:
  - D-174
- rule_id: R24
  rule_statement: >-
    When a name matches no stored record and exactly one stored name is closest to it, that name is
    the problem's fix as well as a candidate.
  rule_sources:
  - PRD §7 File attached
  rule_decisions:
  - D-225
- rule_id: R25
  rule_statement: >-
    A candidate the User picks replaces the problem's fix, so accepting the item uses the picked record.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-224
- rule_id: R26
  rule_statement: >-
    A problem on a field whose value lists several names says which entry it is about, and its fix or picked
    candidate replaces that entry only and leaves the others as they are.
  rule_sources:
  - GRAPH one cell can hold several names that each need their own fix
  rule_decisions:
  - D-261
requirement_sources:
- PRD §6 Uploads
- PRD §7 Agent Chat
requirement_decisions:
- D-36
- D-37
- D-102
- D-173
- D-174
- D-224
- D-225
- D-261
requirement_features: []
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-IDENTITY-0001
data_model:
  status: covered
  reads:
  - User.id
  writes:
  - Proposal.*
  - ProposalItem.*
  detail: >-
    The requirement that proposes a change passes the items, with their problems, fixes, candidates, and
    group keys; AGENT stores them and reads no other module's records.
requirement_starting_flow: true
