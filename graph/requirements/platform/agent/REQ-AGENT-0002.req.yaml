requirement_id: REQ-AGENT-0002
requirement_target_layer: platform
requirement_target_module: AGENT
requirement_phase: MVP
requirement_title: Save nothing until a person approves the Proposal
requirement_statement: >-
  Every change Iris prepares from a file or a message is a Proposal that lists each proposed change, any
  problem found, and a suggested fix. Nothing is saved until the person it was made for approves it, and
  each accepted item is rechecked as it is saved.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Proposal is created OPEN with its kind, its channel, the User it was made for, a summary, and one
    ProposalItem for each proposed change.
  rule_sources:
  - PRD §7 Agent Chat
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Each ProposalItem holds its action, record type, and values and, when a check found a problem, the
    problem and a suggested fix if there is one.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    While a Proposal is OPEN it has changed no record other than itself and its ProposalItems.
  rule_sources:
  - PRD §7 When the agent is unsure
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Only the User the Proposal was made for can decide it, and only while it is OPEN; any other attempt
    is refused.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions:
  - D-36
- rule_id: R5
  rule_statement: >-
    That User sets each item's decision to ACCEPTED, to EDITED after changing its values, or to REJECTED,
    and can accept every undecided item at once.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    ACCEPTED saves the item's values with its suggested fix applied, and EDITED saves the values as the
    User changed them.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    The User then applies the Proposal: an undecided item with no problem counts as ACCEPTED, and applying
    is refused while an item with a problem has no decision.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-36
- rule_id: R8
  rule_statement: >-
    On apply, each ACCEPTED or EDITED item is saved, in list order, through the requirement that owns
    its record type, which rechecks it against its own rules at that moment.
  rule_sources:
  - PRD §7 Agent Chat
  rule_decisions:
  - D-36
- rule_id: R9
  rule_statement: >-
    An item its owner saves gets result SAVED; an item its owner refuses is not saved and gets FAILED_RECHECK
    with the owner's reason in result_message.
  rule_sources: []
  rule_decisions:
  - D-36
- rule_id: R10
  rule_statement: A REJECTED item is never saved and gets no result.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R11
  rule_statement: >-
    After apply the Proposal is APPLIED when every ACCEPTED or EDITED item is SAVED, and PARTLY_APPLIED
    when at least one is FAILED_RECHECK.
  rule_sources: []
  rule_decisions:
  - D-36
- rule_id: R12
  rule_statement: >-
    Rejecting the Proposal, or applying it with every item REJECTED, sets every item REJECTED and the
    Proposal REJECTED, and saves nothing.
  rule_sources:
  - PRD §6 Uploads
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R13
  rule_statement: >-
    Deciding sets decided_by and decided_at, and a decided Proposal never changes again, so a failed item
    is retried only in a new Proposal.
  rule_sources: []
  rule_decisions:
  - D-36
- rule_id: R14
  rule_statement: >-
    Each save is given the Proposal's id and channel and the deciding User, so the Audit Trail shows where
    the change came from.
  rule_sources: []
  rule_decisions:
  - D-37
- rule_id: R15
  rule_statement: >-
    An OPEN Proposal does not expire: it stays OPEN until its User decides it.
  rule_sources: []
  rule_decisions:
  - D-36
- rule_id: R16
  rule_statement: >-
    A User can list the Proposals made for them, OPEN ones first, and no one else's.
  rule_sources: []
  rule_decisions:
  - D-36
requirement_sources:
- PRD §6 Uploads
- PRD §7 Agent Chat
requirement_decisions:
- D-36
- D-37
requirement_features: []
edges:
