requirement_id: REQ-AGENT-0003
requirement_target_layer: platform
requirement_target_module: AGENT
requirement_phase: MVP
requirement_title: Ask when unsure, and refuse data the user does not own
requirement_statement: >-
  Before proposing anything, Iris asks when it cannot tell what a file or request is, or when details
  are missing. When a user sends data their role may not send, Iris says who owns it and saves nothing.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    When a file or message could be more than one upload type or kind of request, Iris asks the user which
    it is and creates no Proposal until they answer.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    When a typed request lacks a detail the change needs, such as a date, a time, or a headcount, Iris
    asks for it before creating a Proposal.
  rule_sources:
  - PRD §7 When the agent is unsure
  - SHEET SC-9
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Who may send each upload type is the uploaders list for that type in the upload-types catalog, checked
    against the role the User is acting in, which the caller supplies.
  rule_sources:
  - PRD §6 Uploads
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-109
- rule_id: R4
  rule_statement: >-
    When that role is not among the type's uploaders, such as a Unit User sending a RATE_CARD, Iris names
    the roles that may send it, creates no Proposal, and saves nothing.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    For a typed request, the requirement that owns the change says whether the User may make it; if not,
    Iris says who can and creates no Proposal.
  rule_sources:
  - PRD §7 When the agent is unsure
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-109
- rule_id: R6
  rule_statement: >-
    A question or a refusal is given on the channel the file or message arrived on.
  rule_sources:
  - SHEET SC-9
  - SHEET SC-10
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A question goes back to the caller with what was understood so far, and the caller returns the answer
    with it; this requirement keeps nothing between the two.
  rule_sources:
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-109
requirement_sources:
- PRD §7 When the agent is unsure
- PRD §6 Uploads
requirement_decisions:
- D-109
requirement_features: []
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENT-0001
data_model:
  status: not_applicable
  reads: []
  writes: []
  detail: >-
    Asks or refuses before any Proposal exists and stores nothing. A question waiting for an answer is
    kept by its caller: the Upload for a file (NEEDS_TYPE), the conversation in the assistant, or the
    thread for a message.
