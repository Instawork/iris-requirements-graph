requirement_id: REQ-AGENT-0003
requirement_target_layer: platform
requirement_target_module: AGENT
requirement_phase: MVP
requirement_title: Ask when unsure, and refuse data the user does not own
requirement_statement: >-
  When a file could be more than one type or a request is missing details, Iris asks before proposing
  anything.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: If a request lacks a date, a time, or a headcount, Iris asks for it.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    If a user sends data they cannot change, such as a Unit User sending a Rate Card, Iris says who owns
    it and saves nothing.
  rule_sources: []
  rule_decisions: []
requirement_sources:
- PRD §7 Agent chat
