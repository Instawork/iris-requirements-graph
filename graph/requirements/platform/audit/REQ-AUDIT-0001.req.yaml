- rule_id: R2
  rule_statement: Entries are never edited or deleted.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Audited records include Units, Settings, Rate Lines, Shifts, Assignments, Timesheets, Credentials,
    and Attestations.
  rule_sources: []
