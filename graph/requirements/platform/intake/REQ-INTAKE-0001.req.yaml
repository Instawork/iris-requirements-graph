requirement_id: REQ-INTAKE-0001
requirement_target_layer: platform
requirement_target_module: INTAKE
requirement_phase: MVP
requirement_title: Accept a file and detect its upload type
requirement_statement: >-
  A User sends a CSV, Excel, PDF, or image file on the Uploads page, in the assistant, or attached to
  a message. Iris stores it privately, detects its upload type from the catalog, and asks when it cannot
  tell. It also keeps and serves the files other requirements store, such as a Worker's photo.
requirement_actors:
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Each file sent creates one Upload with status RECEIVED, its file name, the User who sent it, and the
    channel it arrived on: APP, ASSISTANT, EMAIL, or SMS.
  rule_sources:
  - PRD §6 Uploads
  - PRD §7 How it connects
  - SHEET SC-10
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The original file is kept unchanged in private storage, and file_url is never a public link.
  rule_sources: []
  rule_decisions:
  - D-152
- rule_id: R3
  rule_statement: >-
    CSV and Excel files are accepted for every upload type except CREDENTIALS, and PDF and image files
    only for TIMESHEETS, TIPS, EXPENSES, and CREDENTIALS; any other pairing of file and picked type becomes
    FAILED.
  rule_sources:
  - PRD §6 Templates
  - SHEET TS-5
  - SESSIONS Timesheets, Tips & Expenses
  - SHEET WA-14
  rule_decisions:
  - D-40
- rule_id: R4
  rule_statement: Text in a PDF or an image is read by OCR before the type is detected.
  rule_sources:
  - FEEDBACK OCR to match paper timesheets
  - SHEET TS-5
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    When the uploader picked a type, it is used; otherwise the LLM maps the file's column names to the
    catalog columns of every registered upload type that takes CSV and Excel, and code chooses one.
  rule_sources:
  - PRD §6 Uploads
  - PRD §7 Agent Chat
  rule_decisions:
  - D-104
- rule_id: R6
  rule_statement: >-
    When detection chooses one type, the Upload's type is set; when no type fits or the best ones tie,
    the status becomes NEEDS_TYPE and the uploader is asked to pick one.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    When the uploader picks a type for a NEEDS_TYPE Upload, the type is set and the status returns to
    RECEIVED.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    If the role the uploader is acting in, which the caller supplies, is not among the type's uploaders,
    the Upload becomes FAILED and failure_reason names the roles that may send that type.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    A file that cannot be opened, is not a CSV, Excel, PDF, or image file, or holds no rows or readable
    text becomes FAILED, with failure_reason saying why.
  rule_sources: []
  rule_decisions:
  - D-40
- rule_id: R10
  rule_statement: >-
    A type fits a file that holds every column of one of its identified_by sets in the catalog, or every
    column marked required yes when the type lists no set.
  rule_sources:
  - PRD §7 When the agent is unsure
  - GRAPH several upload types share column names
  rule_decisions:
  - D-104
- rule_id: R11
  rule_statement: >-
    For a PDF or an image, the LLM names the one upload type the OCR text holds, among the registered
    ones of TIMESHEETS, TIPS, EXPENSES, and CREDENTIALS, or none, which makes the Upload NEEDS_TYPE.
  rule_sources:
  - SHEET TS-5
  - GRAPH a PDF or an image has no column names
  rule_decisions:
  - D-104
- rule_id: R12
  rule_statement: >-
    A file larger than 10 MB is refused when it is sent and creates no Upload, and a file with more than
    5,000 rows becomes FAILED.
  rule_sources:
  - GRAPH no source gives a limit
  rule_decisions:
  - D-244
- rule_id: R13
  rule_statement: >-
    Excel means an .xlsx workbook and an image a JPEG or PNG file; the first row that holds a value is
    the header, and a workbook with rows on more than one sheet becomes FAILED.
  rule_sources:
  - GRAPH no source says which sheet is read
  rule_decisions:
  - D-245
- rule_id: R14
  rule_statement: >-
    The requirement that owns an upload type registers it, with its check step and its save step, when
    it is delivered, and until then the type is neither offered to pick nor detected.
  rule_sources:
  - GRAPH an upload type is built after INTAKE, by the requirement that owns it
  rule_decisions:
  - D-150
- rule_id: R15
  rule_statement: >-
    Among the types that fit a file, the one that covers the most of the file's columns is chosen.
  rule_sources:
  - PRD §7 When the agent is unsure
  - GRAPH several upload types share column names
  rule_decisions:
  - D-104
- rule_id: R16
  rule_statement: >-
    A requirement may store a PDF, JPEG, or PNG file of at most 10 MB without creating an Upload, such
    as a Worker's photo, and gets back its private reference.
  rule_sources:
  - GRAPH a photo or a document entered on a form is a file but not an Upload
  rule_decisions:
  - D-254
  - D-244
- rule_id: R17
  rule_statement: >-
    A stored file, an Upload's or not, is read only through this requirement, by the requirement that
    holds its reference or by a signed-in User whom that requirement says may see it.
  rule_sources:
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-107
  - D-152
requirement_sources:
- PRD §6 Uploads
- PRD §7 Agent Chat
- SHEET TS-5
requirement_decisions:
- D-40
- D-104
- D-107
- D-150
- D-152
- D-244
- D-245
- D-254
requirement_features: []
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-IDENTITY-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENT-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENT-0003
data_model:
  status: covered
  reads:
  - User.id
  writes:
  - Upload.file_name
  - Upload.file_url
  - Upload.type
  - Upload.uploaded_by
  - Upload.channel
  - Upload.status
  - Upload.failure_reason
  detail: >-
    The OCR and file storage providers sit behind this requirement. Detection reads graph/catalogs/upload-types.yaml:
    every type's columns, its identified_by sets, which columns are required, and its uploaders. The
    registry of upload types is code. A file stored for a caller has no record here, and the caller keeps
    its reference.
