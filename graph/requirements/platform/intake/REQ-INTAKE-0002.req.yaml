requirement_rules:
- rule_id: R1
  rule_statement: >-
    Dates are read as YYYY-MM-DD, times as 4:00 PM, and money without a dollar sign, and common variations
    become proposed fixes.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: Job titles are matched to the Position catalog, such as Svr to Server.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Missing required columns, duplicates, and references to unknown records are reported per row.
  rule_sources: []
  rule_decisions: []
