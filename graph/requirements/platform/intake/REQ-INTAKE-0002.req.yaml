requirement_id: REQ-INTAKE-0002
requirement_target_layer: platform
requirement_target_module: INTAKE
requirement_phase: MVP
requirement_title: Validate every row and propose fixes
requirement_statement: >-
  Iris reads every row of an Upload, checks it against the catalog's columns and its owner's rules, and
  creates a Proposal with a fix or candidates for each problem. It never changes a value from the file
  silently.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Once an Upload has a type its uploader may send, Iris sets total_rows and creates one FILE_ROWS Proposal
    for the uploader, with channel FILE_UPLOAD, or EMAIL or SMS when the Upload arrived that way.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-37
- rule_id: R2
  rule_statement: >-
    The LLM maps the file's column names to the type's columns in the upload-types catalog, and code does
    every check after that.
  rule_sources:
  - PRD §7 What the LLM does and what code does
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    For a PDF or an image, the LLM reads the OCR text into rows of the type's catalog columns, and those
    rows are checked like file rows.
  rule_sources:
  - SHEET TS-5
  - FEEDBACK OCR to match paper timesheets
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    A row with no value in a column the catalog marks required yes has a problem; a column required only
    under a condition is checked by the type's owner.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    A date, time, or money value in the template format is accepted as it is.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A date, time, or money value in another known form, such as 10/18/26 or $30, is a problem whose fix
    is the same value in template format.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    The known forms are month-first slash dates, 12-hour and 24-hour times such as 4pm or 16:00, and money
    with a dollar sign or thousands commas.
  rule_sources:
  - PRD §6 Templates
  rule_decisions:
  - D-40
- rule_id: R8
  rule_statement: >-
    A value that cannot be read as its column's kind of value is a problem with no fix.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    Each lookup the catalog names is resolved by the type's owner; a value matching no record or several
    is a problem with no fix, carrying the candidates of REQ-AGENT-0002 for the uploader to pick.
  rule_sources:
  - PRD §7 What the agent checks
  - PRD §7 Agent Chat
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-105
  - D-109
- rule_id: R10
  rule_statement: >-
    Checks across columns, across rows, or against stored records belong to the type's owner, which is
    given every row of the file at once and returns each row's problems for INTAKE to report.
  rule_sources:
  - PRD §7 What the agent checks
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-109
- rule_id: R11
  rule_statement: >-
    A row the type's owner reports as a duplicate of an earlier row has a problem whose fix is to drop
    the later row.
  rule_sources:
  - PRD §6 Uploads
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R12
  rule_statement: >-
    Every row becomes one ProposalItem carrying its row_no and one problem entry for each problem found,
    each naming the catalog column it is on.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-105
- rule_id: R13
  rule_statement: >-
    No value from the file is changed unless the uploader accepts a fix for it, picks a candidate, or
    edits it.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R14
  rule_statement: >-
    Creating the Proposal sets the Upload to IN_REVIEW with proposal_id and rows_to_review, the number
    of rows that have a problem.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R15
  rule_statement: >-
    On apply, each accepted row is saved by the type's owner, and a column with saved_by in the catalog
    by that requirement, each under its own rules.
  rule_sources:
  - PRD §7 Agent Chat
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-109
- rule_id: R16
  rule_statement: >-
    When the Proposal becomes APPLIED or PARTLY_APPLIED the Upload becomes SAVED, and when it becomes
    REJECTED the Upload becomes DISCARDED.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R17
  rule_statement: >-
    A file column the LLM maps to no catalog column of the type is left out of every item, and the Proposal's
    summary names each column left out.
  rule_sources:
  - PRD §7 What the LLM does and what code does
  - GRAPH files arrive with columns the template does not have
  rule_decisions:
  - D-106
- rule_id: R18
  rule_statement: >-
    Rows the type's owner says make one record together, such as the Shifts of one Request, get one group_key
    on their items.
  rule_sources:
  - GRAPH one Proposal of many rows can make one record
  rule_decisions:
  - D-105
requirement_sources:
- PRD §6 Uploads
- PRD §6 Templates
- PRD §7 What the agent checks
requirement_decisions:
- D-37
- D-40
- D-105
- D-106
- D-109
requirement_features: []
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-INTAKE-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENT-0002
data_model:
  status: covered
  reads:
  - Upload.type
  - Upload.file_url
  - Upload.uploaded_by
  - Proposal.status
  - ProposalItem.problems
  writes:
  - Upload.status
  - Upload.total_rows
  - Upload.rows_to_review
  - Upload.proposal_id
  detail: >-
    The Proposal and its items are created through REQ-AGENT-0002. Checks read graph/catalogs/upload-types.yaml
    for the type's columns, lookups, and saved_by requirements.
requirement_starting_flow: true
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
