requirement_id: REQ-INTAKE-0003
requirement_target_layer: platform
requirement_target_module: INTAKE
requirement_phase: MVP
requirement_title: Provide a template for each upload type
requirement_statement: >-
  Each upload type that takes CSV or Excel has a template whose columns come from the upload-types catalog,
  downloadable as CSV or Excel. The template is the same on the Uploads page and in the assistant.
requirement_actors:
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The template for an upload type has one header row holding that type's column names from the upload-types
    catalog, in catalog order.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A template can be downloaded as CSV or as an Excel .xlsx file, and a filled template is accepted in
    either format.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A User is offered templates only for the upload types registered under REQ-INTAKE-0001 whose uploaders
    in the catalog include the role they are acting in, which the caller supplies.
  rule_sources:
  - PRD §6 Uploads
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-107
- rule_id: R4
  rule_statement: The Uploads page and the assistant give the same template for a type.
  rule_sources:
  - PRD §7 How it connects
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Rows added to a template use dates as YYYY-MM-DD, times like 4:00 PM, and money without a dollar sign.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    CREDENTIALS has no template, because it takes one document for each Credential and never a CSV or
    Excel file.
  rule_sources:
  - SHEET WA-14
  rule_decisions:
  - D-40
requirement_sources:
- PRD §6 Templates
- PRD §7 How it connects
requirement_decisions:
- D-40
- D-107
requirement_features: []
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-INTAKE-0001
data_model:
  status: not_applicable
  reads: []
  writes: []
  detail: >-
    Templates are generated from graph/catalogs/upload-types.yaml; nothing is stored.
requirement_starting_flow: true
