requirement_id: REQ-IDENTITY-0001
requirement_target_layer: platform
requirement_target_module: IDENTITY
requirement_phase: MVP
requirement_title: Hold User accounts and sign in with email and password
requirement_statement: >-
  Every person who uses Iris has their own User, with an email, a name, and an optional phone. They sign
  in with email and password, and each sign-in is a Session that every later request is checked against.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A User belongs to one person and holds an email, a first name, a last name, an optional phone, and
    an active flag.
  rule_sources:
  - SHEET PLT-4
  - SHEET PLT-1
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The email is the sign-in name, and creating a User with an email another User holds is refused.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-190
- rule_id: R3
  rule_statement: >-
    A phone is accepted when exactly 10 digits remain after spaces, dashes, dots, parentheses, and a leading
    +1 or 1 are removed; any other value is refused.
  rule_sources: []
  rule_decisions:
  - D-155
- rule_id: R4
  rule_statement: A password has at least 12 characters, and only its hash is stored.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-189
- rule_id: R5
  rule_statement: >-
    Sign-in succeeds only when the email matches an active User and the password matches that User's hash;
    otherwise it is refused and no Session is created.
  rule_sources:
  - SHEET PLT-4
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A successful sign-in creates a Session for that User, returns its token while storing only the token's
    hash, and sets last_signed_in_at.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-99
- rule_id: R7
  rule_statement: >-
    A Session is open from sign-in until the User signs out, which sets ended_at, or until 12 hours have
    passed since its last accepted request.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-99
- rule_id: R8
  rule_statement: >-
    A request that needs a signed-in User is accepted only with the token of an open Session whose User
    is active, which sets last_active_at; otherwise it is refused.
  rule_sources: []
  rule_decisions:
  - D-99
- rule_id: R10
  rule_statement: >-
    At each start, when no User holds the deployment configuration's email, Iris creates the first Instawork
    Admin as an active User from the configured email, first name, last name, and password, with no inviter.
  rule_sources:
  - GRAPH the first User has nobody to invite them
  rule_decisions:
  - D-98
- rule_id: R11
  rule_statement: >-
    Creating or changing a User is recorded in the Audit Trail without the password hash, and Sessions
    and sign-ins are not recorded there.
  rule_sources: []
  rule_decisions:
  - D-37
- rule_id: R12
  rule_statement: >-
    A caller may store a context on an open Session, replacing any earlier one, and gets it back with
    every request; IDENTITY never reads it, and a new Session starts with none.
  rule_sources:
  - GRAPH the acting role and context belong to REQ-ORG-0009, which platform may not read
  rule_decisions:
  - D-239
- rule_id: R13
  rule_statement: >-
    A start never changes or reactivates a User who already holds the configured email, and REQ-ORG-0005
    adds that User's INSTAWORK_ADMIN grant when it holds none.
  rule_sources:
  - GRAPH the first User has nobody to invite them
  rule_decisions:
  - D-98
- rule_id: R14
  rule_statement: Every other User is created by an invite through REQ-IDENTITY-0002.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-25
requirement_sources:
- SHEET PLT-4
- SHEET PLT-1
requirement_decisions:
- D-25
- D-37
- D-98
- D-99
- D-155
- D-189
- D-190
- D-239
requirement_features:
- PLT-4
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-AUDIT-0001
data_model:
  status: covered
  reads:
  - User.*
  - Session.*
  writes:
  - User.email
  - User.first_name
  - User.last_name
  - User.password_hash
  - User.last_signed_in_at
  - User.active
  - Session.*
  detail: The session token reaches the browser in whatever way Instawork engineering chooses.
requirement_starting_flow: true
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
