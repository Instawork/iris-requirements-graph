requirement_id: REQ-IDENTITY-0003
requirement_target_layer: platform
requirement_target_module: IDENTITY
requirement_phase: MVP
requirement_title: Let a User change their own name and phone
requirement_statement: >-
  A signed-in User sees their own User and changes their own first name, last name, and phone. The email
  cannot be changed, and the password changes only by a reset link.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A signed-in User can read their own email, first name, last name, and phone, and never a password
    hash.
  rule_sources:
  - SHEET PLT-4
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A signed-in User can change their own first name, last name, and phone, and no other User's.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-172
- rule_id: R3
  rule_statement: >-
    Nobody can change a User's email, and a password changes only through an emailed reset link, never
    on the profile.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-172
  - D-171
- rule_id: R4
  rule_statement: >-
    A first or last name cannot be saved empty, a phone is checked as REQ-IDENTITY-0001 checks it, and
    saving the phone empty clears it.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-144
- rule_id: R5
  rule_statement: >-
    Each change is recorded in the Audit Trail as an UPDATE made by that User.
  rule_sources: []
  rule_decisions:
  - D-37
requirement_sources:
- SHEET PLT-4
requirement_decisions:
- D-37
- D-144
- D-171
- D-172
requirement_features:
- PLT-4
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-IDENTITY-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-AUDIT-0001
data_model:
  status: covered
  reads:
  - User.email
  - User.first_name
  - User.last_name
  - User.phone
  writes:
  - User.first_name
  - User.last_name
  - User.phone
  detail: null
requirement_starting_flow: false
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
