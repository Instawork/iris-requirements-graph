requirement_id: REQ-INTEGRATIONS-0001
requirement_target_layer: platform
requirement_target_module: INTEGRATIONS
requirement_phase: P3
requirement_title: Connect Agencies by API
requirement_statement: >-
  Agencies with their own platforms connect to Iris by API. Every other Agency keeps using file upload,
  and a connected Agency can use both.
requirement_actors:
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency that has its own platform can exchange data with Iris by API instead of by file.
  rule_sources:
  - SHEET PLT-5
  rule_decisions: []
- rule_id: R2
  rule_statement: An Agency connected by API can still upload files.
  rule_sources:
  - FEEDBACK
  rule_decisions: []
