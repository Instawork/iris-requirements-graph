requirement_id: REQ-MESSAGING-0001
requirement_target_layer: platform
requirement_target_module: MESSAGING
requirement_phase: MVP
requirement_title: Send notifications by email, SMS, and in the app
requirement_statement: >-
  Iris sends each notification type to the recipients its owner names, on the channels the notifications
  catalog lists for it. It records for every message whether it was sent, failed, or read.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The requirement that owns a notification type sends it by naming the type, the subject record, a title,
    a body, and the recipients; a type missing from the notifications catalog is refused.
  rule_sources:
  - SHEET SC-8
  - PRD Overview
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The owner works out who the catalog's recipients are; a recipient is a User, or an email address or
    phone number for a Worker or other person with no User.
  rule_sources:
  - SHEET SC-6
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-107
- rule_id: R3
  rule_statement: >-
    One Notification is created with status QUEUED for each recipient on each channel the catalog lists
    for the type, or only on those of them the owner names for that send.
  rule_sources:
  - SHEET SC-8
  - SHEET SC-6
  - SHEET SC-10
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    EMAIL goes to a User's email and SMS to a User's phone, stored in to_address when the Notification
    is created, and a channel the recipient has no address for is skipped.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-38
- rule_id: R5
  rule_statement: An IN_APP Notification is created only for a User.
  rule_sources:
  - PRD Overview
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    When the caller names the User whose action caused the notification, that User gets none; PASSWORD_RESET
    and INBOUND_REPLY name no such User, because they answer that person.
  rule_sources: []
  rule_decisions:
  - D-38
- rule_id: R7
  rule_statement: No Notification is created for a User whose active flag is false.
  rule_sources: []
  rule_decisions:
  - D-38
- rule_id: R8
  rule_statement: >-
    A secret the caller passes, such as a link, is stored in the secret field, never in body, added to
    the message when it is sent, and erased when the Notification becomes SENT or FAILED.
  rule_sources: []
  rule_decisions:
  - D-34
  - D-101
- rule_id: R9
  rule_statement: >-
    An IN_APP Notification becomes SENT, with sent_at, as soon as it is stored.
  rule_sources:
  - PRD Overview
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    An EMAIL or SMS Notification is first tried as soon as the change that queued it is saved, and becomes
    SENT, with sent_at, when the provider accepts it.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-38
- rule_id: R11
  rule_statement: >-
    A job of REQ-JOBS-0001 runs every five minutes and tries each EMAIL or SMS Notification still QUEUED;
    every try adds one to attempts, and the third refusal makes it FAILED with the provider's reason.
  rule_sources: []
  rule_decisions:
  - D-38
  - D-68
- rule_id: R12
  rule_statement: >-
    A FAILED Notification never undoes or blocks the change that caused it.
  rule_sources: []
  rule_decisions:
  - D-38
- rule_id: R13
  rule_statement: >-
    A User sees only their own IN_APP Notifications, newest first, and opening one sets read_at once.
  rule_sources:
  - PRD Overview
  rule_decisions: []
- rule_id: R14
  rule_statement: >-
    The title is the email's subject line and the inbox heading, and a text carries the body only; the
    owner words both in plain text from the facts its own rule names.
  rule_sources:
  - GRAPH no source gives the wording of any notification
  rule_decisions:
  - D-101
- rule_id: R15
  rule_statement: >-
    A try the provider does not answer counts as a refusal, and failure_reason then says the provider
    did not answer.
  rule_sources: []
  rule_decisions:
  - D-38
requirement_sources:
- SHEET SC-8
- SHEET SC-6
- PRD Overview
requirement_decisions:
- D-34
- D-38
- D-68
- D-101
- D-107
requirement_features: []
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-IDENTITY-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-JOBS-0001
data_model:
  status: covered
  reads:
  - User.email
  - User.phone
  - User.active
  writes:
  - Notification.*
  detail: >-
    The email and SMS providers sit behind this requirement. Each type's channels come from graph/catalogs/notifications.yaml,
    and the owner passes the recipients, the title, and the body.
requirement_starting_flow: true
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
