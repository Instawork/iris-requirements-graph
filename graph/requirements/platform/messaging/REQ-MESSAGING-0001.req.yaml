requirement_id: REQ-MESSAGING-0001
requirement_target_layer: platform
requirement_target_module: MESSAGING
requirement_phase: MVP
requirement_title: Send notifications by email, SMS, and in the app
requirement_statement: >-
  Iris sends each notification type to the recipients its owner names, on the channels the notifications
  catalog lists for it. It records for every message whether it was sent, failed, or read.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The requirement that owns a notification type sends it by naming the type, the subject record, the
    body, and the recipients; a type missing from the notifications catalog is refused.
  rule_sources:
  - SHEET SC-8
  - PRD Overview
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The owner works out who the catalog's recipients are; a recipient is a User, or an email address or
    phone number for a Worker or other person with no User.
  rule_sources:
  - SHEET SC-6
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    One Notification is created with status QUEUED for each recipient on each channel the catalog lists
    for the type.
  rule_sources:
  - SHEET SC-8
  - SHEET SC-6
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    EMAIL goes to a User's email and SMS to a User's phone, and a channel the recipient has no address
    for is skipped.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-38
- rule_id: R5
  rule_statement: An IN_APP Notification is created only for a User.
  rule_sources:
  - PRD Overview
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    When the caller names the User whose action caused the notification, that User gets none; PASSWORD_RESET
    and INBOUND_REPLY name no such User, because they answer that person.
  rule_sources: []
  rule_decisions:
  - D-38
- rule_id: R7
  rule_statement: No Notification is created for a User whose active flag is false.
  rule_sources: []
  rule_decisions:
  - D-38
- rule_id: R8
  rule_statement: >-
    A secret the caller passes, such as a link, is put into the message sent but never stored in body.
  rule_sources: []
  rule_decisions:
  - D-34
- rule_id: R9
  rule_statement: >-
    An IN_APP Notification becomes SENT, with sent_at, as soon as it is stored.
  rule_sources:
  - PRD Overview
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    An EMAIL or SMS Notification is first tried within one minute, and becomes SENT, with sent_at, when
    the provider accepts it.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-38
- rule_id: R11
  rule_statement: >-
    A refused EMAIL or SMS is tried up to three times in all; after the third refusal it becomes FAILED
    with the provider's reason in failure_reason.
  rule_sources: []
  rule_decisions:
  - D-38
- rule_id: R12
  rule_statement: >-
    A FAILED Notification never undoes or blocks the change that caused it.
  rule_sources: []
  rule_decisions:
  - D-38
- rule_id: R13
  rule_statement: >-
    A User sees only their own IN_APP Notifications, newest first, and opening one sets read_at once.
  rule_sources:
  - PRD Overview
  rule_decisions: []
requirement_sources:
- SHEET SC-8
- SHEET SC-6
- PRD Overview
requirement_decisions:
- D-34
- D-38
requirement_features: []
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-IDENTITY-0001
data_model:
  status: covered
  reads:
  - User.email
  - User.phone
  - User.active
  writes:
  - Notification.*
  detail: null
requirement_starting_flow: false
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
