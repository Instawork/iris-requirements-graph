requirement_id: REQ-MESSAGING-0002
requirement_target_layer: platform
requirement_target_module: MESSAGING
requirement_phase: MVP
requirement_title: Receive requests by email, SMS, and phone
requirement_statement: >-
  Iris has an email address, an SMS number, and a phone line answered by an AI voice agent. It matches
  each sender to a User, passes what they ask to the requirement that takes requests by message, and answers
  on the same channel.
requirement_actors:
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Every email, text, and call Iris receives is stored as one InboundMessage with its channel, sender,
    body, and received time.
  rule_sources:
  - SHEET SC-10
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A call is answered by an AI voice agent and stored as one InboundMessage when it begins, and its
    body is set to the transcript of both sides when the call ends.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-159
- rule_id: R3
  rule_statement: >-
    An email matches the active User whose email equals the sender's address, and a text or call the active
    User whose phone equals the sender's number, each compared in its stored form.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-39
- rule_id: R4
  rule_statement: >-
    When exactly one User matches, user_id is set; otherwise it stays empty and no Upload or Proposal
    is created.
  rule_sources: []
  rule_decisions:
  - D-39
- rule_id: R5
  rule_statement: >-
    Each attachment of a message the handling requirement accepts becomes an Upload through REQ-INTAKE-0001,
    sent by the matched User in the acting role it supplies, on the message's channel, and listed in attachment_upload_ids.
  rule_sources:
  - SHEET SC-10
  - SHEET Decisions & Inputs
  rule_decisions:
  - D-106
- rule_id: R6
  rule_statement: >-
    Each matched message that decides no Proposal goes to the handling requirement, REQ-ORDERING-0010
    in MVP, which supplies the sender's acting role and context and returns a question, a Proposal, or
    a refusal.
  rule_sources:
  - SHEET SC-10
  - PRD §7 Agent Chat
  - GRAPH platform reads no product records, so the caller supplies them
  rule_decisions:
  - D-106
  - D-256
  - D-107
- rule_id: R7
  rule_statement: >-
    An email replying to a stored message joins its thread, a text joins the sender's last text thread
    if that had a message in the past 24 hours, and anything else starts one.
  rule_sources:
  - SHEET SC-10
  - SHEET SC-9
  rule_decisions:
  - D-255
- rule_id: R8
  rule_statement: >-
    A reply in a thread, from the User its one OPEN Proposal was made for, applies that Proposal when
    it is an approval and rejects it when it is a refusal.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-158
- rule_id: R9
  rule_statement: >-
    Iris answers each email or text with an INBOUND_REPLY to the sender, naming the message's channel so
    it goes out on that channel only; on a call the voice agent answers aloud instead.
  rule_sources:
  - SHEET SC-10
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    The Proposal a message's words lead to is stored in its proposal_id, and a thread's Proposals are those
    of its messages and of the Uploads attached to them.
  rule_sources:
  - GRAPH a message with attachments leads to several Proposals
  rule_decisions:
  - D-255
- rule_id: R11
  rule_statement: >-
    Approval by reply accepts every item and applies the Proposal through REQ-AGENT-0002; when an item
    cannot be ACCEPTED, or the thread has several OPEN Proposals, Iris answers that it is decided in the
    app.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-158
- rule_id: R12
  rule_statement: >-
    A reply that is neither an approval nor a refusal is passed on as a new message in the thread, so
    it can answer a question or change the request.
  rule_sources:
  - SHEET SC-9
  rule_decisions:
  - D-158
- rule_id: R13
  rule_statement: >-
    On a call the voice agent says only what these rules produce: it asks each question aloud, reads a
    Proposal's summary aloud, and takes a spoken yes or no as the reply.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-159
  - D-94
- rule_id: R14
  rule_statement: >-
    A Proposal still OPEN when a call ends or a thread goes quiet stays OPEN, and its User decides it in
    the app or by a later reply.
  rule_sources: []
  rule_decisions:
  - D-191
  - D-158
- rule_id: R15
  rule_statement: >-
    When the handling requirement refuses the sender or the request, Iris answers with its reason and creates
    no Upload and no Proposal.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions:
  - D-106
- rule_id: R16
  rule_statement: >-
    An unmatched caller is told aloud, on every call, that Iris does not recognize the number, and the
    call then ends.
  rule_sources: []
  rule_decisions:
  - D-39
- rule_id: R17
  rule_statement: >-
    An email replies to a stored message when the message id it answers equals the provider_message_id
    of an InboundMessage, or of an INBOUND_REPLY, whose subject is the InboundMessage it answered.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-255
- rule_id: R18
  rule_statement: >-
    Code decides: a reply is an approval when its own text, without quoted earlier messages, punctuation,
    and case, is yes, approve, or confirm, and a refusal when it is no, reject, or cancel.
  rule_sources:
  - PRD §7 What the LLM does and what code does
  rule_decisions:
  - D-158
- rule_id: R19
  rule_statement: >-
    An answer that carries a Proposal tells the sender to reply yes to approve it or no to reject it.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-158
- rule_id: R20
  rule_statement: >-
    On a call, each thing the caller says is passed to the handling requirement as it is said, as a
    message in the call's thread is, and the answer is spoken.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-159
- rule_id: R21
  rule_statement: >-
    A call ends when the caller hangs up, or when the caller has said nothing for 30 seconds.
  rule_sources:
  - GRAPH no source says when a call ends
  rule_decisions:
  - D-159
- rule_id: R22
  rule_statement: >-
    Iris tells an unmatched email or text sender, at most once in 24 hours for one address or number,
    that it does not recognize them.
  rule_sources: []
  rule_decisions:
  - D-39
requirement_sources:
- SHEET SC-10
requirement_decisions:
- D-39
- D-94
- D-106
- D-107
- D-158
- D-159
- D-191
- D-255
- D-256
