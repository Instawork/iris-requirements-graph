requirement_id: REQ-AGENCY-WEB-0003
requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: Keep the Agency's Worker roster
requirement_statement: >-
  On the Workers screen an Agency User lists the Agency's Workers, adds them one at a time, changes
  their details, and deactivates them.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Workers screen lists the Agency's Workers by last name with name, email, phone, city, Positions,
    and whether active.
  rule_sources:
  - SHEET WA-1
  - PRD §4 Professionals
  rule_decisions:
  - D-108
- rule_id: R3
  rule_statement: >-
    The roster filters to active or inactive Workers and by Position, and searches by name, email, or
    phone.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  - DEMO components/pros/professionals-page.tsx
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Add Worker takes a first and last name and, optionally, an email, phone, city, Positions from the
    catalog, and a photo, and saves through REQ-WORKFORCE-0001.
  rule_sources:
  - SHEET WA-1
  rule_decisions:
  - D-50
- rule_id: R5
  rule_statement: >-
    Each Worker offers Edit for the same fields, and Deactivate or Reactivate; an inactive Worker is marked
    as one who cannot be assigned.
  rule_sources:
  - SHEET WA-1
  rule_decisions:
  - D-189
- rule_id: R9
  rule_statement: >-
    Deactivate first warns that the Worker comes off Shifts that have not started, as
    REQ-WORKFORCE-0001.R11 says.
  rule_sources: []
  rule_decisions:
  - D-89
requirement_sources:
