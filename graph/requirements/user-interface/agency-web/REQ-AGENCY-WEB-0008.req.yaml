requirement_id: REQ-AGENCY-WEB-0008
requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: See and resolve Worker issues reported by Units
requirement_statement: >-
  On the Issues tab of the Workers screen, an Agency User sees each issue a Unit reported on one of the
  Agency's Workers. They resolve it with a note the Unit can read.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Issues tab of the Workers screen of REQ-AGENCY-WEB-0003 lists each issue on the Agency's Workers
    with the Worker, Unit, category, description, the Shift when one was named, the report date, and status.
  rule_sources:
  - SHEET WA-4
  rule_decisions:
  - D-130
- rule_id: R2
  rule_statement: >-
    OPEN issues come first, oldest first, then RESOLVED ones, newest first, and the list filters by status,
    category, Worker, and Unit.
  rule_sources:
  - SHEET WA-4
  rule_decisions:
  - D-114
  - D-63
- rule_id: R3
  rule_statement: >-
    An OPEN issue offers Resolve, which takes a resolution note and calls REQ-WORKFORCE-0006.
  rule_sources:
  - SHEET WA-4
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    A RESOLVED issue shows its resolution, who resolved it, and when, and offers no further action.
  rule_sources:
  - SHEET WA-4
  rule_decisions: []
requirement_sources:
- SHEET WA-4
requirement_decisions:
- D-63
- D-130
- D-114
requirement_features:
