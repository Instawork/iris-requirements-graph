requirement_id: REQ-AGENCY-WEB-0002
requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: List the Releases sent to the Agency and answer them
requirement_statement: >-
  On the Shifts screen an Agency User sees every Release sent to their Agency, with its Shift, Bill Rates,
  and site instructions. They accept or decline each Release, or several at once.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Shifts screen lists each Release sent to the Agency with its Unit, Position, work date, start
    and end times, headcount, ASSIGNED count, and status, grouped by work date.
  rule_sources:
  - PRD §2 Shifts
  - SHEET SC-8
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    It opens on PENDING and ACCEPTED Releases whose Shifts have not ended, soonest first, and a second
    tab lists every other Release, newest first.
  rule_sources:
  - DEMO components/shifts/shifts-page.tsx
  rule_decisions:
  - D-63
- rule_id: R3
  rule_statement: Both tabs filter by status, Unit, Position, and date range.
  rule_sources:
  - DEMO components/shifts/shifts-page.tsx
  rule_decisions:
  - D-63
- rule_id: R4
  rule_statement: >-
    Opening a Release shows the Unit's name and address, the Shift's Position, times, and planned break,
    and the Release's headcount and regular, overtime, and double-time Bill Rates.
  rule_sources:
  - PRD §2 Shifts
  - PRD Data Model
  - SHEET SC-1
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    While the Release is PENDING or ACCEPTED, the page also shows the Shift's parking, entrance, directions,
    site contact, and attire, as REQ-ORDERING-0006 allows.
  rule_sources:
  - SHEET SC-6
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    Each Release shows its own headcount beside the Shift's whole headcount, whether any other Agency
    holds the Shift, and the total headcount other Agencies hold, as REQ-DISPATCH-0002.R9 gives them,
    never their names.
  rule_sources:
  - SESSIONS Shift Creation
  - PRD §2 Shifts
  rule_decisions:
  - D-90
- rule_id: R7
  rule_statement: >-
    A PENDING Release offers Accept, which calls REQ-DISPATCH-0002 for its whole headcount, and the Release
    then shows as ACCEPTED and can be staffed.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-17
- rule_id: R8
  rule_statement: >-
    A PENDING Release offers Decline, and an ACCEPTED one does until its Shift starts; Decline takes a
    reason and calls REQ-DISPATCH-0002.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-17
- rule_id: R9
  rule_statement: >-
    Before an ACCEPTED Release is declined, the page says how many ASSIGNED Workers will come off the
    Shift and asks the Agency User to confirm.
  rule_sources: []
  rule_decisions:
  - D-17
- rule_id: R10
  rule_statement: >-
    The Agency User can select several PENDING Releases, such as those of one chained block, and accept
    or decline them in one step; each is answered on its own, and any refused are listed.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
- rule_id: R11
  rule_statement: >-
    A DECLINED, WITHDRAWN, CANCELLED, or EXPIRED Release stays in the list under its status, with its
    decline reason when it has one, and offers no action.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-17
- rule_id: R12
  rule_statement: >-
    A PENDING or ACCEPTED Release lists the Workers the Unit requested by name, and each REQUESTED one
    offers Mark unavailable, which takes a reason and calls REQ-WORKFORCE-0004.
  rule_sources:
  - SHEET WA-2
  rule_decisions:
  - D-52
- rule_id: R13
  rule_statement: >-
    Upload assignments opens the Uploads send step of REQ-SHELL-0008 with SHIFTS picked, and REQ-ORDERING-0014
    assigns the Workers its accepted rows name.
  rule_sources:
  - PRD §6 Templates
  - PRD §7 Who uses it
  rule_decisions: []
- rule_id: R14
  rule_statement: >-
    The CSV download of the Releases list, through REQ-SHELL-0010, carries each Shift's shift_id as REQ-ORDERING-0014.R14
    requires, so the Agency can name Workers on its rows and send them back.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
