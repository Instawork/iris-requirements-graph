requirement_id: REQ-AGENCY-WEB-0006
requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: Assign, swap, and remove Workers on an accepted Release
requirement_statement: >-
  On an accepted Release, an Agency User picks Workers from the Agency's roster to fill its headcount,
  and swaps or removes them until the Shift ends. A Worker who cannot be assigned shows why.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An ACCEPTED Release whose Shift has not ended shows its ASSIGNED Workers and its open headcount, and
    offers Assign while any headcount is open.
  rule_sources:
  - SHEET WA-1
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The assign list holds the Agency's active Workers, searchable by name, with the Workers the Unit requested
    by name under REQ-WORKFORCE-0004 marked and listed first.
  rule_sources:
  - SHEET WA-2
  - DEMO components/shifts/assign-pros-dialog.tsx
  rule_decisions:
  - D-52
- rule_id: R3
  rule_statement: >-
    After requested Workers, those who can be assigned come first; each other Worker cannot be picked
    and shows why REQ-WORKFORCE-0003 or REQ-COMPLIANCE-0005 would refuse them.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  - DEMO components/shifts/assign-pros-dialog.tsx
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    The reasons shown are that the Worker is already on the Shift, is rated BLOCK by the Unit, or lacks
    named Credential Types, each with why it is not met.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  - SHEET WA-3
  - SHEET WA-13
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    The Agency User can pick at most as many Workers as the Release has open headcount, and the screen
    shows how many are picked.
  rule_sources:
  - DEMO components/shifts/assign-pros-dialog.tsx
  rule_decisions:
  - D-17
- rule_id: R6
  rule_statement: >-
    Confirming calls REQ-WORKFORCE-0003 once for each picked Worker, and a Worker it refuses, such as
    for overtime while OVERTIME_HARD_BLOCK is true, stays unassigned with the reason shown.
  rule_sources:
  - SHEET WA-19
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    When an assignment adds overtime and REQ-LABOR-0003 allows it, the screen tells the Agency User that
    the Worker now has overtime in that Work Week at that Unit.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
- rule_id: R8
  rule_statement: >-
    Until the Shift ends, each ASSIGNED Worker offers Remove, which calls REQ-WORKFORCE-0003 and reopens
    that headcount on the Release.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    Each ASSIGNED Worker also offers Swap, which opens the assign list to pick one replacement and calls
    REQ-WORKFORCE-0003 to swap the two in one step.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    Workers who came off the Release are listed below the assigned ones with the removal reason, such
    as NOT_ELIGIBLE or BLOCKED_BY_UNIT.
  rule_sources:
  - FAQ
  rule_decisions:
  - D-51
- rule_id: R11
  rule_statement: >-
    Each ASSIGNED Worker shows when site instructions were last sent to them under REQ-ORDERING-0006,
    or that none were sent.
  rule_sources:
  - SHEET SC-6
  rule_decisions: []
- rule_id: R12
  rule_statement: >-
    After the Shift ends, the Release lists its Workers with no Assign, Swap, or Remove, and each links
    to that Worker's Timesheet.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
requirement_sources:
