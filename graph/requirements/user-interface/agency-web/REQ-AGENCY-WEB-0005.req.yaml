requirement_id: REQ-AGENCY-WEB-0005
requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: Manage the Agency's Rate Card and answer Rate Reviews
requirement_statement: >-
  On the Rate Card screen an Agency User sees the Agency's Rate Lines with their Pay Rates, Bill Rates,
  and Markup. They submit new or changed lines by form or file, and answer Rate Reviews.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Rate Card screen lists the Agency's Rate Lines, sorted by Market or Unit and then Position, each
    with its six rates, the Markup of each pair as a percentage, effective_from, effective_to, and status.
  rule_sources:
  - PRD §3 Supplier Rates
  - FEEDBACK Just do % only
  rule_decisions:
  - D-11
  - D-108
- rule_id: R2
  rule_statement: >-
    It opens on APPROVED lines not yet ended, filters by status, Market or Unit, and Position, and searches
    by Position name.
  rule_sources:
  - DEMO components/rates/rates-page.tsx
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The screen never shows the Peer Rate or another Agency's rates (C-15).
  rule_sources:
  - PRD §3 Supplier Rates
  rule_decisions:
  - D-84
- rule_id: R4
  rule_statement: >-
    Add rate opens the form of REQ-RATES-0013 with no Agency field, and the saved line is listed as PENDING
    until a Program User approves it or sends it back.
  rule_sources:
  - SESSIONS Rate Cards & Supplier Sourcing
  rule_decisions:
  - D-10
- rule_id: R5
  rule_statement: >-
    An APPROVED line with no effective_to offers Change, which opens that form filled from the line; saving
    submits a new line through REQ-RATES-0009 and leaves the old one as it was.
  rule_sources:
  - SHEET RC-5
  rule_decisions:
  - D-10
- rule_id: R6
  rule_statement: >-
    A SENT_BACK line shows the Program User's reason and offers Submit again, which opens the form filled
    from it to submit a new line.
  rule_sources: []
  rule_decisions:
  - D-10
- rule_id: R7
  rule_statement: >-
    Upload rates opens the Uploads send step of REQ-SHELL-0008 with RATE_CARD picked, and REQ-RATES-0002
    submits each accepted row as a PENDING line.
  rule_sources:
  - SHEET RC-4
  - PRD §3 Supplier Rates
  rule_decisions:
  - D-10
- rule_id: R8
  rule_statement: >-
    A History tab lists every line the Agency ever submitted, as REQ-RATES-0003 keeps them, and each line
    opens its change history through REQ-SHELL-0011, shown to that Agency's Agency Users.
  rule_sources:
  - SHEET RC-5
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    REQUESTED Rate Reviews show above the list, each with the line under review and a statement that its
    rate is above its peers.
  rule_sources:
  - SHEET RC-12
  rule_decisions:
  - D-84
- rule_id: R10
  rule_statement: >-
    Each REQUESTED review offers Keep the rate, which takes a reason, and Lower the rate, which opens
    the form of REQ-RATES-0013 for the new line, as REQ-RATES-0008.R8 allows.
  rule_sources:
  - SHEET RC-12
  rule_decisions: []
- rule_id: R11
  rule_statement: >-
    A review answered with a reason shows as KEPT; one answered with a lower line stays REQUESTED until
    that line is APPROVED, then shows as LOWERED.
  rule_sources:
  - SHEET RC-12
  rule_decisions:
  - D-10
- rule_id: R12
  rule_statement: >-
    This requirement registers the Rate Card screen with REQ-SHELL-0007 for role AGENCY_USER: subject RateLine
    opens the History tab at that line, and subject RateReview the screen at that review.
  rule_sources: []
  rule_decisions:
  - D-107
  - D-252
