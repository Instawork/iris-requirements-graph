requirement_id: REQ-AGENCY-WEB-0014
requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: See the Workers a Unit requested by name and say when one cannot work
requirement_statement: >-
  On a Release, an Agency User sees the Workers the Unit requested by name and marks any who cannot work
  as unavailable. Requested Workers come first when assigning.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    This requirement adds to each PENDING or ACCEPTED Release on the Shifts screen of
    REQ-AGENCY-WEB-0002 a list of the Workers the Unit requested by name.
  rule_sources:
  - SHEET WA-2
  rule_decisions:
  - D-52
  - D-107
- rule_id: R2
  rule_statement: >-
    Each REQUESTED Worker in that list offers Mark unavailable, which takes a reason and calls
    REQ-WORKFORCE-0004.
  rule_sources:
  - SHEET WA-2
  rule_decisions:
  - D-52
- rule_id: R3
  rule_statement: >-
    In the assign list of REQ-AGENCY-WEB-0006, the Workers the Unit requested by name are marked and
    listed first.
  rule_sources:
  - SHEET WA-2
  - DEMO components/shifts/assign-pros-dialog.tsx
  rule_decisions:
  - D-52
  - D-107
requirement_sources:
- SHEET WA-2
requirement_decisions:
- D-52
- D-107
requirement_features:
- WA-2
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENCY-WEB-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENCY-WEB-0006
- edge_type: DEPENDS_ON
  requirement_id: REQ-WORKFORCE-0004
data_model:
  status: covered
  reads:
  - WorkerRequest.shift_id
  - WorkerRequest.worker_id
  - WorkerRequest.status
  - WorkerRequest.unavailable_reason
  - Worker.first_name
  - Worker.last_name
  - Release.shift_id
  - Release.status
  writes: []
  detail: null
requirement_starting_flow: false
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
