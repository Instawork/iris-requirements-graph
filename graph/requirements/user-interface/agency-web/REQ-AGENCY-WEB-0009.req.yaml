requirement_id: REQ-AGENCY-WEB-0009
requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: Enter hours, tips, and Expenses on a Timesheet
requirement_statement: >-
  On a Draft or Rejected Timesheet, an Agency User enters the hours billed, marks a no-show, splits it
  by role, and adds the Worker's tip and Expenses. In any other status the page is read-only and shows
  every change.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The page shows the Shift's Unit, Position, and scheduled times beside the Timesheet's clock_in, clock_out,
    break_minutes, minutes in each hour class, three Bill Rates, and the amount for each class.
  rule_sources:
  - PRD §2 Shifts
  - PRD §3 Supplier Rates
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    While the Timesheet is DRAFT or REJECTED and is_no_show is false, the Agency User can change clock_in,
    clock_out, and break_minutes through REQ-TIME-0001; otherwise those fields are read-only.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-33
  - D-69
- rule_id: R3
  rule_statement: >-
    The three Bill Rates are read-only in every status, as REQ-TIME-0001.R10 requires.
  rule_sources:
  - PRD §7 What the agent accepts
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-68
- rule_id: R4
  rule_statement: >-
    While the Timesheet is DRAFT or REJECTED, Mark no-show calls REQ-TIME-0009; Clear no-show is offered
    only on a mark an Agency User set, and a mark a Unit User set says so.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-33
  - D-69
  - D-214
- rule_id: R5
  rule_statement: >-
    Split by role asks for a switch time and a new Position, a new Department of the Unit, or both, calls
    REQ-TIME-0008, and then shows each part with its own rates.
  rule_sources:
  - SHEET TS-10
  - FEEDBACK split can also be department driven
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    The split form lets the Agency User move some of the break minutes to the new part, and shows that
    the two parts keep the original total.
  rule_sources: []
  rule_decisions:
  - D-59
- rule_id: R7
  rule_statement: >-
    The Agency User can enter, change, or remove a tip for the Worker through REQ-TIPS-0001, and the page
    says such a tip keeps the Timesheet from being approved automatically.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-28
  - D-129
- rule_id: R8
  rule_statement: >-
    Tips from a Tip Pool or a cashier PIN are listed with their source and cannot be changed here.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-28
- rule_id: R9
  rule_statement: >-
    Add Expense takes a kind of PARKING, BACKGROUND_CHECK, or OTHER, an amount, and a note, which OTHER
    requires, and saves a PENDING Expense through REQ-TIPS-0002.
  rule_sources:
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    A PENDING Expense can be changed or deleted while the Timesheet is DRAFT or REJECTED; a decided Expense
    shows APPROVED, or REJECTED with the Unit's reason, and cannot be changed.
  rule_sources:
  - SHEET TS-12
  rule_decisions:
  - D-129
  - D-235
- rule_id: R11
  rule_statement: >-
    A REJECTED Timesheet shows the Unit's rejected_reason above the hours until it is submitted again.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-33
- rule_id: R12
  rule_statement: >-
    The page embeds the Timesheet's change history through REQ-SHELL-0011, shown to Agency Users of the
    Worker's Agency, so each correction a Unit User made can be read with its reason.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R13
  rule_statement: >-
    The page opens from a row of the Timesheets screen of REQ-AGENCY-WEB-0004 and from each Worker of
    an ended Release on REQ-AGENCY-WEB-0006.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-107
- rule_id: R14
  rule_statement: >-
    This requirement registers the Timesheet's page with REQ-SHELL-0007 for subject Timesheet and role AGENCY_USER.
  rule_sources: []
  rule_decisions:
  - D-107
  - D-252
