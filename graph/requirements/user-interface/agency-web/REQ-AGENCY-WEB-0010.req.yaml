requirement_id: REQ-AGENCY-WEB-0010
requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: Manage the Agency's own Users
requirement_statement: >-
  On the Users screen an Agency User sees who has access to their Agency, invites colleagues, and revokes
  access or deactivates a User, within the limits REQ-ORG-0005 sets.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Users screen lists every User holding an AGENCY_USER Role Grant for the Agency, with name, email,
    phone, whether the invite was accepted, last sign-in, and whether the grant is revoked or the User
    inactive.
  rule_sources:
  - SHEET PLT-1
  - SHEET PLT-4
  rule_decisions:
  - D-25
- rule_id: R2
  rule_statement: >-
    Invite takes an email, first name, last name, and optional phone and calls REQ-ORG-0005 to grant AGENCY_USER
    for this Agency; the form offers no other role and no other Agency.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-25
- rule_id: R3
  rule_statement: >-
    A User who has not accepted their invite offers Send invite again, which sends a new link through
    REQ-IDENTITY-0002.
  rule_sources: []
  rule_decisions:
  - D-152
- rule_id: R4
  rule_statement: >-
    Each unrevoked grant offers Revoke and each revoked grant offers Restore, both through REQ-ORG-0005.
  rule_sources: []
  rule_decisions:
  - D-25
- rule_id: R5
  rule_statement: >-
    Deactivate and Reactivate call REQ-ORG-0005, which refuses them for a User who holds any Role Grant
    other than AGENCY_USER for this Agency.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-25
requirement_sources:
- SHEET PLT-1
- SHEET PLT-4
requirement_decisions:
- D-25
- D-152
requirement_features:
