requirement_id: REQ-AGENCY-WEB-0001
requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: Agency menu and Home page
requirement_statement: >-
  The Agency menu lists an Agency User's screens, and Home is the page they land on.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Agency User menu lists Home, Shifts, Workers, Timesheets, Rate Card, Uploads, and Users, in that
    order.
  rule_sources:
  - PRD Pages
  rule_decisions:
  - D-66
- rule_id: R12
  rule_statement: >-
    Home is the page an Agency User lands on, first in the menu; it holds only the sections other requirements
    add, and says there is nothing to do when none has anything to show.
  rule_sources:
  - PRD §1 Dashboard / Profile
  rule_decisions:
  - D-110
