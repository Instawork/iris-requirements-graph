requirement_target_layer: user-interface
requirement_target_module: AGENCY-WEB
requirement_phase: MVP
requirement_title: Upload Worker assignments from the Shifts screen
requirement_statement: >-
  From the Shifts screen an Agency User uploads a SHIFTS file that names the Workers to assign to the
  Shifts released to their Agency.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    This requirement adds Upload assignments to the Shifts screen of REQ-AGENCY-WEB-0002, which opens
    the Uploads send step of REQ-SHELL-0008 with SHIFTS picked, and REQ-ORDERING-0014 assigns the
    Workers its accepted rows name.
  rule_sources:
  - PRD §6 Templates
  - PRD §7 Who uses it
  rule_decisions:
  - D-108
