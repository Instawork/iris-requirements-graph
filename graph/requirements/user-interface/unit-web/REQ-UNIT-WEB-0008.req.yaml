requirement_id: REQ-UNIT-WEB-0008
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Follow one Shift and change it from its page
requirement_statement: >-
  A Shift's page shows its details, its Releases with each Agency's answer, and its Workers by name. From
  it a Unit User edits or cancels the Shift, sends headcount, and withdraws a pending Release.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The page shows the Shift's Position, Unit, Department, Event, start, end, planned break, headcount,
    needed headcount, status, and its five site instruction fields.
  rule_sources:
  - PRD §2 Shifts
  - SHEET SC-6
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    It lists each Release with its Agency, headcount, status, the three Bill Rates sent, any bill_rate_reason,
    any decline_reason, and whether it was off-contract or non-contracted.
  rule_sources:
  - SHEET SC-8
  - SHEET RC-10
  - SHEET RC-11
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Under each Release it lists the ASSIGNED Workers with name, photo, and Agency, and shows Open for
    each unit of its headcount not yet assigned.
  rule_sources:
  - PRD §2 Shifts
  - SHEET WA-1
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Unsent headcount shows as its own line with Send, which opens the send step of REQ-UNIT-WEB-0009.
  rule_sources:
  - SHEET SC-7
  rule_decisions:
  - D-17
- rule_id: R5
  rule_statement: >-
    Each ASSIGNED Worker shows whether REQ-COMPLIANCE-0005 finds them eligible before the Shift starts,
    and their eligible_at_start after it.
  rule_sources:
  - PRD §4 Professionals
  - SHEET 3.1
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    At a secured Unit, each ASSIGNED Worker also shows their BadgeRequest status.
  rule_sources:
  - SHEET WA-17
  rule_decisions:
  - D-27
- rule_id: R7
  rule_statement: >-
    Workers requested by name are listed as REQUESTED or UNAVAILABLE, with the Agency's unavailable_reason.
  rule_sources:
  - SHEET WA-2
  rule_decisions:
  - D-52
- rule_id: R8
  rule_statement: >-
    Workers removed from the Shift are listed below those assigned, each with the removal reason and time.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    Until the Shift ends, Edit changes headcount, needed headcount, times, planned break, and site instructions
    through REQ-ORDERING-0003 and REQ-ORDERING-0005.
  rule_sources:
  - SHEET SC-3
  - SHEET SC-5
  rule_decisions:
  - D-18
- rule_id: R10
  rule_statement: >-
    Until the Shift starts, Cancel calls REQ-ORDERING-0003 once the User confirms, and the page then shows
    its Releases cancelled and its Workers removed.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
  - D-65
- rule_id: R11
  rule_statement: >-
    On a Shift in a series, Edit and Cancel ask whether to apply to this Shift or to every Shift of the
    series not yet started, under REQ-ORDERING-0004.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
- rule_id: R12
  rule_statement: A PENDING Release offers Withdraw, which calls REQ-DISPATCH-0001.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-17
- rule_id: R13
  rule_statement: >-
    The Event control attaches the Shift to an Event of its Unit, moves it to another, or detaches it,
    through REQ-ORDERING-0011.
  rule_sources:
  - SHEET REP-2
  rule_decisions: []
- rule_id: R14
  rule_statement: >-
    Once the Shift has ended, Edit, Cancel, and Send are gone and the page links to the Shift's Timesheets.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
- rule_id: R15
  rule_statement: >-
    Each Worker's row offers Rate and Report an issue, which open the forms of REQ-UNIT-WEB-0004.
  rule_sources:
  - PRD §2 Shifts
  - SHEET WA-3
  - SHEET WA-4
  rule_decisions: []
- rule_id: R16
  rule_statement: >-
    The page embeds the Shift's change history through REQ-SHELL-0011, shown to Unit Users whose scope
    covers the Unit.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
requirement_sources:
- PRD §2 Shifts
- SHEET SC-3
- SHEET WA-1
