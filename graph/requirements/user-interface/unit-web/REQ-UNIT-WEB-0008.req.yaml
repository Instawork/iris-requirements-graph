requirement_id: REQ-UNIT-WEB-0008
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Follow one Shift and change it from its page
requirement_statement: >-
  A Shift's page shows its details, its Releases with each Agency's answer, and its Workers by name.
  From it a Unit User edits or cancels the Shift, sends headcount, and withdraws a pending Release.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The page shows the Shift's Position, Unit, Department, start, end, planned break, headcount, status,
    and its five site instruction fields.
  rule_sources:
  - PRD §2 Shifts
  - SHEET SC-6
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    It lists each Release with its Agency, headcount, status, the three Bill Rates sent, any
    bill_rate_reason, non_contracted_reason, or decline_reason, and whether it was off-contract or
    non-contracted.
  rule_sources:
  - SHEET SC-8
  - SHEET RC-10
  - SHEET RC-11
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Under each Release it lists the ASSIGNED Workers with name, photo, and Agency, and shows Open for
    each unit of its headcount not yet assigned.
  rule_sources:
  - PRD §2 Shifts
  - SHEET WA-1
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Unsent headcount shows as its own line with Send, which opens the send step of REQ-UNIT-WEB-0009.
  rule_sources:
  - SHEET SC-7
  rule_decisions:
  - D-157
- rule_id: R5
  rule_statement: >-
    Each ASSIGNED Worker shows whether REQ-COMPLIANCE-0005 finds them eligible before the Shift starts,
    and their is_eligible_at_start after it.
  rule_sources:
  - PRD §4 Professionals
  - SHEET 3.1
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    Workers removed from the Shift are listed below those assigned, each with the removal reason and time.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    Until the Shift ends, Edit changes headcount, date, times, planned break, and site instructions
    through REQ-ORDERING-0003.
  rule_sources:
  - SHEET SC-3
  - SHEET SC-5
  rule_decisions:
  - D-18
  - D-94
- rule_id: R10
  rule_statement: >-
    Until the Shift starts, Cancel calls REQ-ORDERING-0003 once the User confirms, and the page then shows
    its Releases cancelled and its Workers removed.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-162
  - D-122
- rule_id: R12
  rule_statement: A PENDING Release offers Withdraw, which calls REQ-DISPATCH-0001.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-161
- rule_id: R14
  rule_statement: Once the Shift has ended, Edit, Cancel, and Send are gone.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
- rule_id: R16
  rule_statement: >-
    The page embeds the Shift's change history through REQ-SHELL-0011, shown to Unit Users whose scope
    covers the Unit.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R18
  rule_statement: >-
    This requirement registers the Shift's page with REQ-SHELL-0007 for subject Release and role UNIT_USER,
    and a notification about a Release opens the page of that Release's Shift.
  rule_sources: []
  rule_decisions:
  - D-107
  - D-252
- rule_id: R19
  rule_statement: >-
    This requirement makes each row of the Shifts list of REQ-UNIT-WEB-0007 open that Shift's page.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-107
requirement_sources:
