requirement_id: REQ-UNIT-WEB-0004
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Keep the Unit's Worker roster, rate Workers, and report issues
requirement_statement: >-
  A Unit User sees the Workers assigned to or who have worked at their Units, with each Unit's rating
  of them. From the roster they rate a Worker and report an issue to the Agency.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Workers screen lists every Worker with an Assignment at a Unit in scope, past or upcoming, and
    every Worker a Unit in scope has rated.
  rule_sources:
  - PRD §4 Professionals
  - SHEET WA-2
  rule_decisions:
  - D-96
- rule_id: R2
  rule_statement: >-
    Each row shows the Worker's name, photo, Agency, Shifts worked at the Unit, the Unit's rating and
    review, and open issues, with FAVORITE Workers listed first.
  rule_sources:
  - PRD §4 Professionals
  - SHEET WA-3
  rule_decisions:
  - D-108
- rule_id: R3
  rule_statement: The roster filters by Unit, Agency, rating, and Worker name.
  rule_sources:
  - DEMO components/pros/professionals-page.tsx
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Rate sets FAVORITE, OKAY_TO_RETURN, or BLOCK for one Unit, with an optional review, through REQ-WORKFORCE-0005,
    and replaces that Unit's earlier rating.
  rule_sources:
  - SHEET WA-3
  - PRD §4 Professionals
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Choosing BLOCK first warns that the Worker comes off that Unit's Shifts that have not started and
    can no longer be assigned or requested there.
  rule_sources:
  - SHEET WA-3
  rule_decisions:
  - D-51
  - D-122
- rule_id: R6
  rule_statement: >-
    Add a Worker finds any active Worker by Agency and name, so a Unit can rate them before their first
    Shift there.
  rule_sources:
  - SHEET WA-2
  - SHEET 3.2
  rule_decisions:
  - D-96
- rule_id: R7
  rule_statement: >-
    Rate is offered on every roster row at any time, so a Worker can be rated straight after a Shift or
    before their first one.
  rule_sources:
  - SHEET WA-3
  - SHEET WA-2
  rule_decisions:
  - D-96
- rule_id: R8
  rule_statement: >-
    Report an issue takes the category, description, and optional Shift that REQ-WORKFORCE-0006.R1 defines,
    and saves through that requirement.
  rule_sources:
  - SHEET WA-4
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    The Issues tab lists the issues reported for Units in scope, OPEN first, each with its Worker, Agency,
    category, description, status, and the Agency's resolution.
  rule_sources:
  - SHEET WA-4
  rule_decisions: []
- rule_id: R11
  rule_statement: >-
    This requirement adds Rate and Report an issue to each Worker's row on the Shift's page of
    REQ-UNIT-WEB-0008, which open these forms.
  rule_sources:
  - PRD §2 Shifts
  - SHEET WA-3
  - SHEET WA-4
  rule_decisions:
  - D-107
- rule_id: R12
  rule_statement: >-
    This requirement registers the Workers screen with REQ-SHELL-0007 for role UNIT_USER: subject Worker
    opens the roster at that Worker's row, and subject WorkerIssue the Issues tab at that issue.
  rule_sources: []
  rule_decisions:
  - D-107
  - D-252
