requirement_id: REQ-UNIT-WEB-0016
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Decide Expenses and see tips on the Unit's Timesheets
requirement_statement: >-
  On the Timesheets screen a Unit User sees each Timesheet's tips and Expenses, and approves or rejects
  each pending Expense.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Each row of the Timesheets screen of REQ-UNIT-WEB-0003 also shows the Timesheet's tips and Expenses.
  rule_sources:
  - PRD §2 Shifts
  - SHEET TS-7
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Each PENDING Expense on a SUBMITTED Timesheet shows its kind, amount, and note with Approve and Reject,
    which call REQ-TIPS-0002; Reject requires a reason.
  rule_sources:
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-60
- rule_id: R3
  rule_statement: >-
    Tips show as each TipAllocation with its source: a Tip Pool share, a cashier PIN tip, or a tip the
    Agency entered, which is why the Timesheet carries AGENCY_TIP.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-22
  - D-28
  - D-60
requirement_sources:
- SHEET TS-12
- SHEET TS-11
- SESSIONS Timesheets, Tips & Expenses
requirement_decisions:
- D-22
- D-28
- D-60
requirement_features:
- TS-12
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-UNIT-WEB-0003
- edge_type: DEPENDS_ON
  requirement_id: REQ-TIPS-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-TIPS-0002
data_model:
  status: covered
  reads:
