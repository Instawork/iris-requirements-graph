requirement_id: REQ-UNIT-WEB-0002
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Book a Request by form or from a template
requirement_statement: >-
  A Unit User books a Request on a form with one line for each Position, or starts from a saved template.
  Each line can be sent to an Agency at its contracted rate as it is booked.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The form takes one Unit and one or more lines, each with a Position, date, start time, end time, and
    headcount, and optionally a planned break and a Department.
  rule_sources:
  - SHEET SC-2
  - PRD §2 Shifts
  - FEEDBACK
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Unit, Position, and Department are picked from active records in the User's scope, and a Position
    with a default Department at the Unit fills it in.
  rule_sources:
  - PRD Data Model
  - SHEET SC-11
  - FEEDBACK
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The five site instruction fields start filled with the Unit's defaults and can be changed for this
    Request.
  rule_sources:
  - SHEET SC-6
  - SHEET SC-11
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    An end time earlier than the start asks the User to confirm that the Shift ends the next day before
    the form can be submitted.
  rule_sources:
  - PRD §7 What the agent checks
  - PRD §7 File attached
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Start from template lists the Unit's Request templates; picking one and a date fills the lines through
    REQ-ORDERING-0007, and the User may change any line.
  rule_sources:
  - SHEET SC-11
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A repeat option takes weekdays, an interval in weeks, and an end date, under REQ-ORDERING-0004.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
- rule_id: R7
  rule_statement: >-
    A line can state a needed headcount below its headcount, which REQ-ORDERING-0005 records as overbooking.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-19
- rule_id: R8
  rule_statement: >-
    A line may name an Event of the Unit, and after the Request is created its Shift is attached through
    REQ-ORDERING-0011.
  rule_sources:
  - SHEET REP-2
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    Each line embeds the send step of REQ-UNIT-WEB-0009 to pick an Agency, or is left unsent.
  rule_sources:
  - SHEET SC-7
  - SHEET SC-1
  rule_decisions:
  - D-17
- rule_id: R10
  rule_statement: >-
    A line shows the break and minimum-wage flags REQ-ORDERING-0002 returns for its times and picked Agency,
    and a flag never stops the booking.
  rule_sources:
  - SHEET WA-18
  rule_decisions:
  - D-23
- rule_id: R11
  rule_statement: >-
    Submit creates the Request through REQ-ORDERING-0001, then sends each line that has an Agency through
    REQ-DISPATCH-0001, and opens the Shifts list of REQ-UNIT-WEB-0007 on the new Shifts.
  rule_sources:
  - SHEET SC-2
  - SHEET SC-7
  - PRD §7 Typed request
  rule_decisions: []
- rule_id: R12
  rule_statement: >-
    When REQ-ORDERING-0001 refuses a line, nothing is created and the form marks that line with the check
    that failed.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R13
  rule_statement: >-
    When the Request is created but REQ-DISPATCH-0001 refuses a send, that Shift stays unsent and the
    form names the gate or check that refused it.
  rule_sources:
  - SHEET RC-11
  rule_decisions: []
requirement_sources:
