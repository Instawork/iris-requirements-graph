requirement_id: REQ-UNIT-WEB-0007
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: List the Unit's Shifts by date
requirement_statement: >-
  A Unit User sees the Shifts of the Units in their scope grouped by date, with how much of each is
  filled and by which Agencies. From the list they book a Request or open a Shift.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Shifts list shows every Shift at the Units in scope, grouped by work date: Shifts not yet ended
    first, soonest first, then ended Shifts, newest first.
  rule_sources:
  - PRD §2 Shifts
  - DEMO components/shifts/shifts-page.tsx
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Each row shows the Position, Unit, Department, start and end, ASSIGNED Workers over headcount, the
    Agencies holding a PENDING or ACCEPTED Release, and the status, and opens the Shift's page of
    REQ-UNIT-WEB-0008.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A row whose Shift has not started and has unsent headcount shows how much is unsent.
  rule_sources:
  - SHEET SC-7
  rule_decisions:
  - D-17
- rule_id: R4
  rule_statement: >-
    The list filters by Unit, date range, Position, Agency, status, and Shifts with unsent headcount.
  rule_sources:
  - DEMO components/shifts/shifts-page.tsx
  rule_decisions:
  - D-63
- rule_id: R6
  rule_statement: >-
    New Shift opens the booking form of REQ-UNIT-WEB-0002.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    The list's CSV download, through REQ-SHELL-0010, carries each Shift's id in a shift_id column.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R8
  rule_statement: A CANCELLED Shift stays in the list, marked cancelled.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
requirement_sources:
- PRD §2 Shifts
- SHEET SC-2
