requirement_id: REQ-UNIT-WEB-0003
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Review Timesheets by exception and approve them
requirement_statement: >-
  A Unit User sees the Timesheets of their Units with the exception list first. They approve them one
  at a time, or all those shown for one Shift, one Event, or one work date.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Timesheets screen opens on the exception list of REQ-TIME-0005: every SUBMITTED Timesheet in scope,
    those with OUTSIDE_TOLERANCE first, then the oldest Shift first.
  rule_sources:
  - SHEET TS-7
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-108
- rule_id: R2
  rule_statement: >-
    Other tabs list the Timesheets in scope that are DRAFT or REJECTED with the Agency, APPROVED, and
    locked; every tab filters by Unit, work date, Shift, Event, Agency, and Worker.
  rule_sources:
  - SHEET TS-8
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Each row shows the Worker, Agency, Shift, Position, Department, the scheduled start and end beside
    the billed clock times, break, hours by class, Bill Rates, and amount.
  rule_sources:
  - PRD §2 Shifts
  - SHEET TS-7
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Each exception reason, including SHORT_BREAK, LATE_SUBMISSION, and ADDED_AFTER_SHIFT, is shown in
    words with what caused it, such as the minutes outside tolerance or the planned break beside the
    billed one.
  rule_sources:
  - SHEET TS-7
  rule_decisions:
  - D-22
- rule_id: R5
  rule_statement: >-
    A Timesheet whose Bill Rates differ from the contracted Rate Line shows the flag of REQ-RATES-0006
    with both rates, the difference, and the Release's bill_rate_reason, before and after approval.
  rule_sources:
  - SHEET RC-10
  rule_decisions:
  - D-22
  - D-68
- rule_id: R6
  rule_statement: >-
    The parts of a split Timesheet are shown together in time order, each with its own Position, Department,
    and Bill Rates.
  rule_sources:
  - SHEET TS-10
  rule_decisions:
  - D-204
- rule_id: R7
  rule_statement: >-
    A Timesheet still unapproved after its Lock Window closed is marked late on every tab, as REQ-TIME-0007
    defines.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-13
- rule_id: R8
  rule_statement: >-
    Approve calls REQ-TIME-0002 for one SUBMITTED Timesheet and is disabled, with the reason, while it
    carries MISSING_TIMES or PENDING_EXPENSE.
  rule_sources:
  - SHEET TS-8
  rule_decisions:
  - D-22
  - D-113
- rule_id: R9
  rule_statement: >-
    Approve all approves in one step every SUBMITTED Timesheet shown for one Shift, one Event, or one
    work date at a Unit, then lists those left unapproved with the reason.
  rule_sources:
  - SHEET TS-8
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-115
- rule_id: R17
  rule_statement: A locked Timesheet shows when it locked and offers no action.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-33
- rule_id: R18
  rule_statement: >-
    Each Timesheet opens its change history through REQ-SHELL-0011, shown to Unit Users whose scope covers
    its Unit.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R20
  rule_statement: >-
    Once a Shift has ended, its page under REQ-UNIT-WEB-0008 links to this screen filtered to that Shift.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-107
- rule_id: R21
  rule_statement: >-
    MIXED_WORK_WEEKS is shown with each other Unit's name and the weekday its Work Week starts, beside
    this Unit's, and with nothing else of the other Timesheet, even when that Unit is outside the User's
    scope.
  rule_sources:
  - SHEET WA-20
  rule_decisions:
  - D-133
  - D-244
- rule_id: R22
  rule_statement: >-
    This requirement registers the Timesheets screen with REQ-SHELL-0007 for subject Timesheet and role
    UNIT_USER, opened on the tab that lists that Timesheet, at its row.
  rule_sources: []
  rule_decisions:
  - D-107
  - D-252
