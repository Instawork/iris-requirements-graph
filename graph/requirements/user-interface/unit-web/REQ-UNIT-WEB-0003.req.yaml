requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Review and approve Timesheets
requirement_statement: >-
  A Unit User sees submitted Timesheets with exceptions first, and resolves each one from the same screen.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Each exception shows what the Agency billed beside the schedule, with the reason and Iris's proposed
    fix.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    From a Timesheet, the user approves, corrects times, rejects, splits by role, marks a no-show, or
    adds tips and expenses.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    When auto-approval is off, the user approves all clean Timesheets in one action.
  rule_sources: []
  rule_decisions: []
