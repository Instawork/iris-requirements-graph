requirement_id: REQ-UNIT-WEB-0003
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Review Timesheets by exception and approve them
requirement_statement: >-
  A Unit User sees the Timesheets of their Units with the exception list first and resolves each one on
  the same screen. They approve, correct, reject, split, mark a no-show, and decide Expenses.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Timesheets screen opens on the exception list of REQ-TIME-0005: every SUBMITTED Timesheet in scope,
    those with OUTSIDE_TOLERANCE first, then the oldest Shift first.
  rule_sources:
  - SHEET TS-7
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-63
- rule_id: R2
  rule_statement: >-
    Other tabs list the Timesheets in scope that are DRAFT or REJECTED with the Agency, APPROVED, and
    locked; every tab filters by Unit, work date, Shift, Event, Agency, and Worker.
  rule_sources:
  - SHEET TS-8
  rule_decisions:
  - D-63
- rule_id: R3
  rule_statement: >-
    Each row shows the Worker, Agency, Shift, Position, Department, the scheduled start and end beside
    the billed clock times, break, hours by class, Bill Rates, tips, Expenses, and amount.
  rule_sources:
  - PRD §2 Shifts
  - SHEET TS-7
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Each exception reason is shown in words with what caused it, such as the minutes outside tolerance
    or the Release's rate beside the billed rate.
  rule_sources:
  - SHEET TS-7
  - SHEET RC-10
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    A Timesheet whose Bill Rates differ from the contracted Rate Line shows the flag of REQ-RATES-0006
    with both rates and the difference, before and after approval.
  rule_sources:
  - SHEET RC-10
  rule_decisions:
  - D-22
- rule_id: R6
  rule_statement: >-
    The parts of a split Timesheet are shown together in time order, each with its own Position, Department,
    and Bill Rates.
  rule_sources:
  - SHEET TS-10
  rule_decisions:
  - D-59
- rule_id: R7
  rule_statement: >-
    A Timesheet still unapproved after its Lock Window closed is marked late on every tab, as REQ-TIME-0007
    defines.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-13
- rule_id: R8
  rule_statement: >-
    Approve calls REQ-TIME-0002 for one SUBMITTED Timesheet and is disabled, with the reason, while it
    carries MISSING_TIMES or PENDING_EXPENSE.
  rule_sources:
  - SHEET TS-8
  rule_decisions:
  - D-22
  - D-59
- rule_id: R9
  rule_statement: >-
    Approve all approves in one step every SUBMITTED Timesheet shown for one Shift, one Event, or one
    work date at a Unit, then lists those left unapproved with the reason.
  rule_sources:
  - SHEET TS-8
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-59
- rule_id: R10
  rule_statement: >-
    Correct opens the clock_in, clock_out, and break_minutes of a SUBMITTED or APPROVED Timesheet that
    is not locked, requires a reason, and saves through REQ-TIME-0006.
  rule_sources:
  - SHEET TS-7
  - PRD §2 Shifts
  rule_decisions:
  - D-33
- rule_id: R11
  rule_statement: >-
    On a Timesheet with OUTSIDE_TOLERANCE, Use scheduled times applies the Shift's start and end in one
    step through REQ-TIME-0006, still with a reason.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-5
- rule_id: R12
  rule_statement: >-
    Reject returns a SUBMITTED Timesheet to the Agency through REQ-TIME-0006 with a required reason, and
    is not offered on an APPROVED one.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-33
- rule_id: R13
  rule_statement: >-
    Split by role takes a switch time, a new Position, Department, or both, any break minutes to move,
    and a reason, and saves through REQ-TIME-0008.
  rule_sources:
  - SHEET TS-10
  - FEEDBACK
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-33
- rule_id: R14
  rule_statement: >-
    No-show sets or clears the mark on a SUBMITTED or APPROVED Timesheet that is not locked, with a reason,
    through REQ-TIME-0009.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-33
- rule_id: R15
  rule_statement: >-
    Each PENDING Expense on a SUBMITTED Timesheet shows its kind, amount, and note with Approve and Reject,
    which call REQ-TIPS-0002; Reject requires a reason.
  rule_sources:
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-60
- rule_id: R16
  rule_statement: >-
    Tips show as each TipAllocation with its source: a Tip Pool share, a cashier PIN tip, or a tip the
    Agency entered, which is why the Timesheet carries AGENCY_TIP.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-22
  - D-28
  - D-60
- rule_id: R17
  rule_statement: A locked Timesheet shows when it locked and offers no action.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-33
- rule_id: R18
  rule_statement: >-
    Each Timesheet opens its change history through REQ-SHELL-0011, shown to Unit Users whose scope covers
    its Unit.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R19
  rule_statement: >-
    Upload corrections opens the Uploads send step with TIMESHEETS picked; REQ-TIME-0003 saves the accepted
    rows as corrections with one reason for the file.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-59
