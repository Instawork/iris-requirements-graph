requirement_id: REQ-UNIT-WEB-0009
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Pick an Agency and a rate in one send step
requirement_statement: >-
  Wherever a Unit User sends a Shift, one step lists the Agencies with their contracted rates and takes
  the headcount and any other rate with a reason.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The step lists every active Agency approved for the Unit with its contracted regular Bill Rate for
    the Shift, as REQ-ORDERING-0002 returns it, lowest rate first.
  rule_sources:
  - SHEET SC-1
  - SHEET SC-7
  rule_decisions:
  - D-109
- rule_id: R2
  rule_statement: >-
    The Agencies REQ-ORDERING-0002.R2 marks non-contracted follow the approved ones, and an Agency it
    gives no contracted rate shows none.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-9
- rule_id: R3
  rule_statement: >-
    Picking an Agency fills in its contracted regular Bill Rate and the Shift's unsent headcount, which
    the User may lower to no less than 1.
  rule_sources:
  - SHEET SC-1
  rule_decisions:
  - D-157
- rule_id: R4
  rule_statement: >-
    The User may type another regular Bill Rate, and must type one when there is no contracted rate;
    either way the step requires a reason, saved as bill_rate_reason.
  rule_sources:
  - SHEET SC-1
  - SHEET RC-11
  rule_decisions:
  - D-24
- rule_id: R5
  rule_statement: >-
    Before sending, the step shows what REQ-ORDERING-0002.R4 returns for the picked Agency and rate, and
    names the gate when the send would be refused.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-16
- rule_id: R8
  rule_statement: >-
    Send calls REQ-DISPATCH-0001 for the Release, and a refused send saves nothing.
  rule_sources:
  - SHEET SC-7
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    When the Agency already holds a PENDING or ACCEPTED Release on the Shift, the step says the headcount
    will be added to it at the rates already sent.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-157
- rule_id: R11
  rule_statement: >-
    Once the Shift has started, the step offers only Agencies that hold an ACCEPTED Release on it.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-158
- rule_id: R12
  rule_statement: >-
    When the picked Agency is non-contracted and REQ-RATES-0007 answers SOFT, the step takes a second
    reason, saved as non_contracted_reason under REQ-DISPATCH-0001.R9.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-9
requirement_sources:
- SHEET SC-1
- SHEET SC-7
- FEEDBACK a single agency, then request worker as a nested feature
