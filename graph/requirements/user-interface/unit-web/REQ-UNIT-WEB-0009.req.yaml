requirement_id: REQ-UNIT-WEB-0009
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Pick an Agency, a rate, and Workers in one send step
requirement_statement: >-
  Wherever a Unit User sends a Shift, one step lists the Agencies with their contracted rates and takes
  the headcount and any other rate with a reason. In the same step they can request Workers by name.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The step lists every active Agency approved for the Unit with its contracted regular Bill Rate for
    the Shift, as REQ-ORDERING-0002 returns it, lowest rate first.
  rule_sources:
  - SHEET SC-1
  - SHEET SC-7
  rule_decisions:
  - D-63
- rule_id: R2
  rule_statement: >-
    Active Agencies with no approval covering the Unit follow, marked non-contracted, and an Agency with
    no contracted rate shows no rate.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-9
- rule_id: R3
  rule_statement: >-
    Picking an Agency fills in its contracted regular Bill Rate and the Shift's unsent headcount, which
    the User may lower to no less than 1.
  rule_sources:
  - SHEET SC-1
  rule_decisions:
  - D-17
- rule_id: R4
  rule_statement: >-
    The User may type another regular Bill Rate, and must type one when there is no contracted rate; either
    way the step requires a reason.
  rule_sources:
  - SHEET SC-1
  - SHEET RC-11
  rule_decisions:
  - D-24
- rule_id: R5
  rule_statement: >-
    Before sending, the step shows what REQ-RATES-0007 requires for that Agency and rate: nothing, a reason,
    or that the send is refused, naming the gate.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-16
- rule_id: R6
  rule_statement: >-
    The step flags a regular Bill Rate that REQ-RATES-0008 judges to be above the Peer Rate.
  rule_sources:
  - SHEET 1.4
  - SHEET RC-12
  rule_decisions:
  - D-12
- rule_id: R7
  rule_statement: >-
    Request Workers by name lists the picked Agency's active Workers, those the Unit rated FAVORITE first,
    and leaves out Workers the Unit rated BLOCK.
  rule_sources:
  - SHEET WA-2
  - FEEDBACK
  rule_decisions:
  - D-52
- rule_id: R8
  rule_statement: >-
    Send calls REQ-DISPATCH-0001 for the Release and then REQ-WORKFORCE-0004 for each Worker named, and
    a refused send saves neither.
  rule_sources:
  - SHEET SC-7
  - SHEET WA-2
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    When the Agency already holds a PENDING or ACCEPTED Release on the Shift, the step says the headcount
    will be added to it at the rates already sent.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-17
- rule_id: R10
  rule_statement: >-
    For a series or a block, one step sends every chosen Shift of the Request to the Agency and then lists
    any Shift whose send was refused.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
- rule_id: R11
  rule_statement: >-
    Once the Shift has started, the step offers only Agencies that hold an ACCEPTED Release on it.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-17
  - D-18
