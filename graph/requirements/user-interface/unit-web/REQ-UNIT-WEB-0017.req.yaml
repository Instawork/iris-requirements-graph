requirement_id: REQ-UNIT-WEB-0017
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Repeat a Request weekly and act on its series
requirement_statement: >-
  A Unit User makes a Request repeat on chosen weekdays when booking it. The Shifts of one repeating
  line show as a series, which can be sent, edited, or cancelled together.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    This requirement adds a repeat option to the booking form of REQ-UNIT-WEB-0002, which takes
    weekdays, an interval in weeks, and an end date, under REQ-ORDERING-0004.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
  - D-107
- rule_id: R2
  rule_statement: >-
    On the Shifts list of REQ-UNIT-WEB-0007, the Shifts of one recurring Request line are marked as a
    series.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-165
- rule_id: R3
  rule_statement: >-
    For a series, the send step of REQ-UNIT-WEB-0009 sends every chosen Shift of the Request to the
    Agency under REQ-DISPATCH-0001.R15, and then lists any Shift whose send was refused.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-166
- rule_id: R4
  rule_statement: >-
    On a Shift in a series, Edit and Cancel on the Shift's page of REQ-UNIT-WEB-0008 ask whether to
    apply to this Shift or to every Shift of the series not yet started.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-165
requirement_sources:
- SHEET SC-4
requirement_decisions:
- D-20
- D-107
- D-165
- D-166
