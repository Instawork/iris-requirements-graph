requirement_id: REQ-UNIT-WEB-0011
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Keep Request templates and the Unit's booking defaults
requirement_statement: >-
  On the Setup screen a Unit User keeps a Unit's Request templates, the default Department for each Position,
  and its default site instructions.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Setup screen is for one Unit and has three sections: Request templates, Position defaults, and
    default site instructions.
  rule_sources:
  - SHEET SC-11
  rule_decisions:
  - D-64
- rule_id: R2
  rule_statement: >-
    Request templates lists the Unit's templates by name with their lines, and creates, changes, and deletes
    a template through REQ-ORDERING-0007.
  rule_sources:
  - SHEET SC-11
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A template line takes a Position, headcount, start time, and end time, and optionally a Department
    and a planned break; an end before the start must be confirmed as next day.
  rule_sources:
  - SHEET SC-11
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Each template offers Book, which opens the booking form of REQ-UNIT-WEB-0002 with that template picked.
  rule_sources:
  - SHEET SC-11
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Position defaults lists each Position with its default Department at the Unit and sets or changes
    it through REQ-ORDERING-0007.
  rule_sources:
  - SHEET SC-11
  - FEEDBACK Departments within venues
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    Default site instructions shows the Unit's default parking, entrance, directions, site contact, and
    attire, and saves changes through REQ-ORG-0002.
  rule_sources:
  - SHEET SC-6
  - SHEET SC-11
  rule_decisions:
  - D-53
- rule_id: R7
  rule_statement: >-
    The Unit's address, timezone, Cost Center, Work Week start, secured-site flag, and each Department's
    name and Cost Center are shown read-only.
  rule_sources:
  - SHEET PLT-2
  rule_decisions:
  - D-53
- rule_id: R8
  rule_statement: >-
    This requirement adds Start from template to the booking form of REQ-UNIT-WEB-0002, which lists the
    Unit's Request templates and, for the one picked and a date, fills the lines through
    REQ-ORDERING-0007.
  rule_sources:
  - SHEET SC-11
  rule_decisions:
  - D-107
- rule_id: R9
  rule_statement: >-
    On that form, picking a Position that has a default Department at the Unit fills the Department in.
  rule_sources:
  - SHEET SC-11
  - FEEDBACK Departments within venues
  rule_decisions:
  - D-107
- rule_id: R10
  rule_statement: >-
    Each Department on that screen shows its default parking, entrance, directions, site contact, and
    attire, and the Unit User can change them through REQ-ORG-0002.
  rule_sources: []
  rule_decisions:
  - D-264
- rule_id: R11
  rule_statement: >-
    The Setup screen also shows the Unit's primary operator and, from REQ-ORG-0011, its Account Manager,
    Account Owner, and Support Lead, each with name, email, and phone.
  rule_sources: []
  rule_decisions:
  - D-265
  - D-266
requirement_sources:
- SHEET SC-11
- SHEET SC-6
requirement_decisions:
- D-53
- D-64
- D-107
- D-264
