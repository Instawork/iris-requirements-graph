requirement_id: REQ-UNIT-WEB-0001
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: 'Unit home: to-dos, a spend summary, and the Unit menu'
requirement_statement: >-
  A Unit User's home lists their to-dos and a summary of spend for the Units in their scope. It also names
  the Unit menu and lets them narrow every screen to one Unit.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Unit User menu lists Home, Shifts, Timesheets, Tips, Workers, Agencies, Events, Reports, Uploads,
    and Setup, in that order.
  rule_sources:
  - PRD Pages
  rule_decisions:
  - D-65
- rule_id: R2
  rule_statement: >-
    A Unit User whose scope covers several Units sees them together and can narrow every Unit screen to
    one Unit, a choice kept from screen to screen.
  rule_sources:
  - SHEET PLT-1
  - SHEET REP-7
  rule_decisions:
  - D-65
- rule_id: R3
  rule_statement: >-
    Home shows the to-do list of REQ-SHELL-0003 with three lines: Timesheets to review, headcount to send,
    and badge requests to issue.
  rule_sources:
  - PRD §1 Detailed requirements
  rule_decisions:
  - D-62
- rule_id: R4
  rule_statement: >-
    Timesheets to review counts every SUBMITTED Timesheet in scope, shows their total billed amount and
    how many are late, and opens the exception list.
  rule_sources:
  - SHEET TS-7
  - PRD §1 Detailed requirements
  rule_decisions:
  - D-13
  - D-62
- rule_id: R5
  rule_statement: >-
    Headcount to send counts Shifts in scope that have not started and have unsent headcount, shows the
    time until the earliest starts, and opens the Shifts list filtered to them.
  rule_sources:
  - SHEET SC-7
  - SHEET SC-8
  rule_decisions:
  - D-17
  - D-62
- rule_id: R6
  rule_statement: >-
    Badge requests to issue counts REQUESTED BadgeRequests at secured Units in scope, shows the age of
    the oldest, and opens the Badges tab.
  rule_sources:
  - SHEET WA-17
  rule_decisions:
  - D-27
  - D-62
- rule_id: R7
  rule_statement: >-
    The second section is the spend summary from REQ-REPORTING-0008: the month to date against budget
    and the prior month, and the Work Week to date against the prior Work Week.
  rule_sources:
  - SHEET REP-7
  - PRD §1 Detailed requirements
  rule_decisions:
  - D-14
- rule_id: R8
  rule_statement: >-
    Each spend figure shows its APPROVED_SPEND and PENDING_SPEND parts, and the summary links to the Reports
    screen for the breakdowns.
  rule_sources:
  - PRD §1 Detailed requirements
  rule_decisions:
  - D-29
