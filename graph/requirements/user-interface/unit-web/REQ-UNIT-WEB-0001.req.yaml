requirement_id: REQ-UNIT-WEB-0001
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Unit menu, Home page, and the one-Unit filter
requirement_statement: >-
  The Unit menu lists a Unit User's screens, and Home is the page they land on. A Unit User over several
  Units can narrow every Unit screen to one Unit.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Unit User menu lists Home, Shifts, Timesheets, Tips, Workers, Agencies, Events, Reports, Uploads,
    and Setup, in that order.
  rule_sources:
  - PRD Pages
  rule_decisions:
  - D-65
- rule_id: R2
  rule_statement: >-
    A Unit User whose scope covers several Units sees them together and can narrow every Unit screen to
    one Unit, a choice kept from screen to screen until they change it or sign out.
  rule_sources:
  - SHEET PLT-1
  - SHEET REP-7
  rule_decisions:
  - D-131
- rule_id: R9
  rule_statement: >-
    Home is the page a Unit User lands on, first in the menu; it holds only the sections other requirements
    add, and says there is nothing to do when none has anything to show.
  rule_sources:
  - PRD §1 Dashboard / Profile
  rule_decisions:
  - D-110
requirement_sources:
- PRD Pages
- PRD §1 Dashboard / Profile
- SHEET PLT-1
requirement_decisions:
- D-65
- D-110
- D-131
