requirement_id: REQ-UNIT-WEB-0021
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Request Workers by name when sending a Shift and on its page
requirement_statement: >-
  When sending a Shift to an Agency, or later on the Shift's page, a Unit User names the Workers they
  want from that Agency. The page shows each request and the Agency's answer.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    This requirement adds Request Workers by name to the send step of REQ-UNIT-WEB-0009, which lists the
    picked Agency's active Workers, those the Unit rated FAVORITE first, and leaves out Workers the Unit
    rated BLOCK.
  rule_sources:
  - SHEET WA-2
  - FEEDBACK a single agency, then request worker as a nested feature
  rule_decisions:
  - D-190
  - D-107
- rule_id: R2
  rule_statement: >-
    After Send saves the Release, the step calls REQ-WORKFORCE-0004 for each Worker named, and a refused
    send requests nobody.
  rule_sources:
  - SHEET SC-7
  - SHEET WA-2
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    On the Shift's page of REQ-UNIT-WEB-0008, each PENDING or ACCEPTED Release offers Request Workers,
    which lists that Agency's Workers as R1 does and saves each one picked through REQ-WORKFORCE-0004.
  rule_sources:
  - SHEET WA-2
  rule_decisions:
  - D-190
- rule_id: R4
  rule_statement: >-
    The Shift's page lists Workers requested by name as REQUESTED or UNAVAILABLE, with the Agency's
    unavailable_reason, and each offers Withdraw until the Shift starts, through REQ-WORKFORCE-0004.R7.
  rule_sources:
  - SHEET WA-2
  rule_decisions:
  - D-52
  - D-95
requirement_sources:
- SHEET WA-2
- FEEDBACK a single agency, then request worker as a nested feature
requirement_decisions:
- D-52
- D-95
- D-107
- D-190
requirement_features:
