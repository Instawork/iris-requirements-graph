requirement_id: REQ-UNIT-WEB-0014
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: 'Unit Home: to-dos and a spend summary'
requirement_statement: >-
  A Unit User's Home lists their to-dos and a summary of spend for the Units in their scope.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Home (REQ-UNIT-WEB-0001) shows the to-do list of REQ-SHELL-0003 with three lines: Timesheets to review,
    headcount to send, and badge requests to issue.
  rule_sources:
  - PRD §1 Detailed requirements
  rule_decisions:
  - D-62
- rule_id: R2
  rule_statement: >-
    Timesheets to review counts every SUBMITTED Timesheet in scope, shows their total billed amount and
    how many are late, and opens the exception list of REQ-UNIT-WEB-0003.
  rule_sources:
  - SHEET TS-7
  - PRD §1 Detailed requirements
  rule_decisions:
  - D-13
  - D-62
- rule_id: R3
  rule_statement: >-
    Headcount to send counts Shifts in scope that have not started and have unsent headcount, shows the
    time until the earliest starts, and opens the Shifts list of REQ-UNIT-WEB-0007 filtered to them.
  rule_sources:
  - SHEET SC-7
  - SHEET SC-8
  rule_decisions:
  - D-17
  - D-62
- rule_id: R4
  rule_statement: >-
    Badge requests to issue counts REQUESTED BadgeRequests at secured Units in scope, shows the age of
    the oldest, and opens the Badges tab of REQ-UNIT-WEB-0013.
  rule_sources:
  - SHEET WA-17
  rule_decisions:
  - D-27
  - D-62
- rule_id: R5
  rule_statement: >-
    The second section is the spend summary from REQ-REPORTING-0008: the month to date against budget
    and the prior month, and the Work Week to date against the prior Work Week.
  rule_sources:
  - SHEET REP-7
  - PRD §1 Detailed requirements
  rule_decisions:
  - D-14
- rule_id: R6
  rule_statement: >-
    Each spend figure shows its APPROVED_SPEND and PENDING_SPEND parts, and the summary links to the Reports
    screen of REQ-UNIT-WEB-0006 for the breakdowns.
  rule_sources:
  - PRD §1 Detailed requirements
  rule_decisions:
  - D-29
