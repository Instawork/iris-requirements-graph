requirement_id: REQ-UNIT-WEB-0010
requirement_target_layer: user-interface
requirement_target_module: UNIT-WEB
requirement_phase: MVP
requirement_title: Name Events and see each Event's projected and actual cost
requirement_statement: >-
  A Unit User names Events for a Unit, attaches Shifts to them, and sees each Event's projected cost beside
  its actual cost.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Events screen lists the Events of the Units in scope, latest Shift date first, each with its Unit,
    dates, number of Shifts, projected cost, actual cost, and difference from REQ-REPORTING-0004.
  rule_sources:
  - SHEET REP-2
  rule_decisions:
  - D-109
- rule_id: R2
  rule_statement: >-
    Actual cost shows its APPROVED_SPEND and PENDING_SPEND parts, with the estimated part of PENDING_SPEND
    apart and labelled as an estimate, as REQ-REPORTING-0004.R4 requires.
  rule_sources:
  - SHEET REP-2
  rule_decisions:
  - D-29
- rule_id: R3
  rule_statement: >-
    New Event takes a Unit and a name, and Rename changes the name, both through REQ-ORDERING-0011.
  rule_sources:
  - SHEET REP-2
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Opening an Event lists its Shifts with Position, start and end, headcount, and Agencies, and each
    row opens the Shift's page of REQ-UNIT-WEB-0008.
  rule_sources:
  - SHEET REP-2
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    From an Event the User attaches Shifts of the same Unit that have no Event and detaches Shifts, through
    REQ-ORDERING-0011.
  rule_sources:
  - SHEET REP-2
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    Approve Timesheets opens the Timesheets screen of REQ-UNIT-WEB-0003 filtered to the Event, where they
    are approved in one step.
  rule_sources:
  - SHEET TS-8
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    This requirement adds an Event field to each line of the booking form of REQ-UNIT-WEB-0002, and
    after the Request is created the line's Shift is attached through REQ-ORDERING-0011.
  rule_sources:
  - SHEET REP-2
  rule_decisions:
  - D-108
- rule_id: R8
  rule_statement: >-
    This requirement adds each Shift's Event to the rows and the filters of the Shifts list of
    REQ-UNIT-WEB-0007.
  rule_sources:
  - SHEET REP-2
  rule_decisions:
  - D-108
- rule_id: R9
  rule_statement: >-
    This requirement adds to the Shift's page of REQ-UNIT-WEB-0008 the Shift's Event and a control that
    attaches the Shift to an Event of its Unit, moves it to another, or detaches it, through
    REQ-ORDERING-0011.
  rule_sources:
  - SHEET REP-2
  rule_decisions:
  - D-108
requirement_sources:
- SHEET REP-2
