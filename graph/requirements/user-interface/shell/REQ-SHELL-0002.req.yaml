requirement_id: REQ-SHELL-0002
requirement_target_layer: user-interface
requirement_target_module: SHELL
requirement_phase: MVP
requirement_title: Show who the User is acting as and let them switch
requirement_statement: >-
  Every page shows the role the signed-in User is acting in and its scope, such as an Agency or a Unit.
  A User whose Role Grants give more than one context chooses which to act in.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A User acts in one context at a time, as REQ-ORG-0009.R9 defines it, so all their UNIT_USER grants
    make one context and each Agency makes its own.
  rule_sources:
  - SHEET PLT-1
  rule_decisions:
  - D-25
  - D-61
  - D-82
- rule_id: R2
  rule_statement: >-
    Only unrevoked Role Grants give a context, and a User with none sees a page that says they have no
    access and offers only sign out.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-25
  - D-61
- rule_id: R3
  rule_statement: >-
    A User with one context starts in it after sign-in; a User with several is asked to choose one at
    each sign-in, and can switch from any page without signing out.
  rule_sources:
  - DEMO components/shell/sidebar.tsx
  rule_decisions:
  - D-25
  - D-61
- rule_id: R4
  rule_statement: >-
    Every page shows the acting role and its scope: the org nodes of the UNIT_USER grants, the Agency's
    name, or the whole program.
  rule_sources:
  - FEEDBACK show visually that we're talking like supplier vs buyer vs corporate
  - SHEET PLT-1
  rule_decisions:
  - D-61
- rule_id: R5
  rule_statement: >-
    Entering a context, at sign-in or by switching, opens its Home under REQ-UNIT-WEB-0001, REQ-AGENCY-WEB-0001,
    REQ-PROGRAM-WEB-0001, or REQ-ADMIN-WEB-0001, shows that role's menu, and changes no product record.
  rule_sources:
  - DEMO hooks/use-switch-workspace.ts
  rule_decisions:
  - D-61
- rule_id: R6
  rule_statement: >-
    The chosen role and context are saved on the User's session through REQ-IDENTITY-0001, in the form
    REQ-ORG-0009 defines, so every request carries them.
  rule_sources:
  - SHEET PLT-1
  rule_decisions:
  - D-61
requirement_sources:
- SHEET PLT-1
- FEEDBACK show visually that we're talking like supplier vs buyer vs corporate
requirement_decisions:
- D-25
- D-61
- D-82
requirement_features:
