requirement_id: REQ-SHELL-0002
requirement_target_layer: user-interface
requirement_target_module: SHELL
requirement_phase: MVP
requirement_title: Show who the User is acting as and let them switch
requirement_statement: >-
  Every page shows the role the signed-in User is acting in and its scope, such as an Agency or a Unit.
  A User whose Role Grants give more than one context chooses which to act in.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A User acts in one context at a time: UNIT_USER across all their UNIT_USER grants, AGENCY_USER for
    one Agency, PROGRAM_USER, or INSTAWORK_ADMIN.
  rule_sources:
  - SHEET PLT-1
  rule_decisions:
  - D-25
  - D-61
- rule_id: R2
  rule_statement: >-
    Only unrevoked Role Grants give a context, and a User with none sees a page that says they have no
    access and offers only sign out.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-25
  - D-61
- rule_id: R3
  rule_statement: >-
    A User with one context starts in it after sign-in; a User with several is asked to choose one, and
    can switch from any page without signing out.
  rule_sources:
  - DEMO components/shell/sidebar.tsx
  rule_decisions:
  - D-25
  - D-61
- rule_id: R4
  rule_statement: >-
    Every page shows the acting role and its scope: the org nodes of the UNIT_USER grants, the Agency's
    name, or the whole program.
  rule_sources:
  - FEEDBACK
  - SHEET PLT-1
  rule_decisions:
  - D-61
- rule_id: R5
  rule_statement: >-
    Switching opens the Home of the chosen context, changes the menu to that role's screens, and changes
    no record.
  rule_sources:
  - DEMO hooks/use-switch-workspace.ts
  rule_decisions:
  - D-61
- rule_id: R6
  rule_statement: >-
    The acting role is the role the screens give REQ-INTAKE-0001, REQ-INTAKE-0003, and REQ-AGENT-0003
    when those ask which role the User is acting in.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-61
requirement_sources:
- SHEET PLT-1
- FEEDBACK
requirement_decisions:
- D-25
- D-61
requirement_features:
- PLT-1
