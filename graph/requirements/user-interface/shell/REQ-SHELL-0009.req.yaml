requirement_id: REQ-SHELL-0009
requirement_target_layer: user-interface
requirement_target_module: SHELL
requirement_phase: MVP
requirement_title: Frame every signed-in page with the acting role's menu
requirement_statement: >-
  Every page after sign-in sits in one frame with a menu of the screens for the role the User is acting
  in and an account menu. It never lists a screen that role cannot use.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Every page after sign-in shows one frame: the menu, the name of the page, and the account menu.
  rule_sources:
  - PRD Pages
  - DEMO components/shell/app-shell.tsx
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The menu lists only the screens of the role the User is acting in, with Home first.
  rule_sources:
  - PRD Pages
  - SHEET PLT-1
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Opening a screen or record the User's Role Grants do not cover shows the refusal of REQ-ORG-0009 and
    a link to Home, and nothing of the record.
  rule_sources:
  - SHEET PLT-1
  rule_decisions:
  - D-25
- rule_id: R4
  rule_statement: >-
    The account menu shows the User's first name, last name, and email, and offers their profile and sign
    out.
  rule_sources:
  - SHEET PLT-4
  - DEMO components/shell/sidebar.tsx
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Sign out ends the session through REQ-IDENTITY-0001 and shows the sign-in page.
  rule_sources:
  - SHEET PLT-4
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    When REQ-IDENTITY-0001 refuses a request because the session ended or the User was deactivated, the
    sign-in page replaces the frame.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-34
requirement_sources:
- PRD Pages
- SHEET PLT-1
requirement_decisions:
- D-25
- D-34
requirement_features:
- PLT-1
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-SHELL-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-SHELL-0013
- edge_type: DEPENDS_ON
  requirement_id: REQ-IDENTITY-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
