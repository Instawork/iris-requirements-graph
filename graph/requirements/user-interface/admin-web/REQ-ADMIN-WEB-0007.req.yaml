requirement_id: REQ-ADMIN-WEB-0007
requirement_target_layer: user-interface
requirement_target_module: ADMIN-WEB
requirement_phase: P2
requirement_title: Keep billing details, Payment Terms, and purchase orders
requirement_statement: >-
  On the Billing screen an Instawork Admin keeps Payment Terms, each Sector's Billing Profile and purchase
  orders, and each Agency's billing details.
requirement_actors:
- INSTAWORK_ADMIN
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Billing screen has three tabs: Payment Terms, Sectors, and Agencies.
  rule_sources: []
  rule_decisions:
  - D-270
- rule_id: R2
  rule_statement: >-
    Payment Terms lists each term with its days due and whether active, and adds, changes, deactivates, or
    reactivates one through REQ-INVOICING-0012.
  rule_sources: []
  rule_decisions:
  - D-268
- rule_id: R3
  rule_statement: >-
    Sectors lists each Sector, marking one with no Billing Profile, and opening one edits its bill-to,
    Payment Terms, payee number, and invoice recipients through REQ-INVOICING-0012.
  rule_sources: []
  rule_decisions:
  - D-268
  - D-271
- rule_id: R4
  rule_statement: >-
    A Sector also lists its purchase orders with number, dates, limit, and whether active, and adds or
    deactivates one through REQ-INVOICING-0012.
  rule_sources: []
  rule_decisions:
  - D-269
- rule_id: R5
  rule_statement: >-
    Agencies lists each Agency, marking one with no billing details, and opening one edits its legal name,
    remit-to address, Payment Terms, and payee number through REQ-INVOICING-0012.
  rule_sources: []
  rule_decisions:
  - D-270
requirement_sources:
- GRAPH Instawork staff keep CompanyInvoicingSettings, payment terms, and purchase orders in Django admin
requirement_decisions:
- D-268
- D-269
- D-270
- D-271
requirement_features: []
edges:
