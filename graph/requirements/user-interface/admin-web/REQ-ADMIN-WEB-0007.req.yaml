requirement_id: REQ-ADMIN-WEB-0007
requirement_target_layer: user-interface
requirement_target_module: ADMIN-WEB
requirement_phase: P2
requirement_title: Keep Payment Terms and VMS fees
requirement_statement: >-
  On the Billing screen an Iris Admin keeps the Payment Terms list, sets each Agency's VMS fee
  percent, and marks monthly fee statements paid.
requirement_actors:
- IRIS_ADMIN
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Billing screen has three tabs: Payment Terms, Agency fees, and Fee statements.
  rule_sources: []
  rule_decisions:
  - D-270
  - D-272
- rule_id: R2
  rule_statement: >-
    Payment Terms lists each term with its days due and whether active, and adds, changes, deactivates, or
    reactivates one through REQ-INVOICING-0012.
  rule_sources: []
  rule_decisions:
  - D-268
- rule_id: R3
  rule_statement: >-
    Agency fees lists each Agency with its VMS fee percent, marking one with none, and sets or clears it
    through REQ-INVOICING-0012 once a Program User has saved that Agency's billing details.
  rule_sources: []
  rule_decisions:
  - D-272
- rule_id: R4
  rule_statement: >-
    Fee statements lists each statement by Agency and month with its amount and status, and Mark paid takes
    a paid date and saves through REQ-INVOICING-0013.
  rule_sources: []
  rule_decisions:
  - D-272
- rule_id: R5
  rule_statement: >-
    This requirement adds Billing to the end of the Iris Admin menu of REQ-ADMIN-WEB-0001.
  rule_sources: []
  rule_decisions:
  - D-124
requirement_sources:
- GRAPH Iris is software that Agencies bill Compass through, and it earns a VMS fee
requirement_decisions:
- D-124
- D-268
- D-270
- D-272
requirement_features: []
