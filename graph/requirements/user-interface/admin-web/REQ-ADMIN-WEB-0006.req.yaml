requirement_id: REQ-ADMIN-WEB-0006
requirement_target_layer: user-interface
requirement_target_module: ADMIN-WEB
requirement_phase: MVP
requirement_title: Keep the ids other systems use for Iris records
requirement_statement: >-
  On the Outside ids screen an Instawork Admin sets the Fieldglass, SAP, and MyStaff ids of Units,
  Departments, Companies, Agencies, and Positions.
requirement_actors:
- INSTAWORK_ADMIN
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Outside ids screen picks a system and a record type and lists every record of that type by name,
    or by name for a Company, with its id there or empty.
  rule_sources: []
  rule_decisions:
  - D-267
- rule_id: R2
  rule_statement: >-
    The list is searched by name, code, or id, and can show only records with no id in the picked system.
  rule_sources: []
  rule_decisions:
  - D-267
- rule_id: R3
  rule_statement: >-
    Set id and Remove save through REQ-INTEGRATIONS-0009, and a refused id names the record that already
    holds it.
  rule_sources: []
  rule_decisions:
  - D-267
requirement_sources:
- GRAPH Instawork's Business admin keeps outside ids such as salesforce_account_id and netsuite_id on the record
requirement_decisions:
- D-267
