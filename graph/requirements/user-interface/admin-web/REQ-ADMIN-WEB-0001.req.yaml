requirement_id: REQ-ADMIN-WEB-0001
requirement_target_layer: user-interface
requirement_target_module: ADMIN-WEB
requirement_phase: MVP
requirement_title: 'Instawork Admin home: reference data and the first Program User'
requirement_statement: >-
  An Instawork Admin's home shows what reference data is loaded and lets them invite the first Program
  User. It also names the Instawork Admin menu.
requirement_actors:
- INSTAWORK_ADMIN
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Instawork Admin menu lists Home, Positions, Markets, and Labor rules, in that order.
  rule_sources: []
  rule_decisions:
  - D-26
  - D-66
- rule_id: R2
  rule_statement: >-
    Home has no to-do list; it shows how many active Positions, how many Markets, and how many Labor Rules
    in effect today, in the program timezone, are loaded.
  rule_sources: []
  rule_decisions:
  - D-26
  - D-66
  - D-68
- rule_id: R3
  rule_statement: >-
    While no active User holds an unrevoked PROGRAM_USER grant, Home offers Invite the first Program User,
    which embeds the invite form of REQ-PROGRAM-WEB-0007 with the role fixed to PROGRAM_USER.
  rule_sources: []
  rule_decisions:
  - D-26
  - D-85
- rule_id: R4
  rule_statement: >-
    Once an active Program User exists, Home says so and no longer offers the invite.
  rule_sources: []
  rule_decisions:
  - D-26
  - D-85
requirement_sources:
- SHEET PLT-1
requirement_decisions:
- D-26
- D-66
- D-68
- D-85
requirement_features: []
