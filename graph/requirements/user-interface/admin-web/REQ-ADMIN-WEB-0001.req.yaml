requirement_id: REQ-ADMIN-WEB-0001
requirement_target_layer: user-interface
requirement_target_module: ADMIN-WEB
requirement_phase: MVP
requirement_title: 'Instawork Admin home: reference data and the first Program User'
requirement_statement: >-
  An Instawork Admin's home shows what reference data is loaded and lets them invite the first Program
  User. It also names the Instawork Admin menu.
requirement_actors:
- INSTAWORK_ADMIN
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Instawork Admin menu lists Home, Positions, Markets, Labor rules, Account team, and Outside ids,
    in that order.
  rule_sources: []
  rule_decisions:
  - D-26
  - D-124
  - D-265
  - D-267
- rule_id: R2
  rule_statement: >-
    Home, the page an Instawork Admin lands on, has no to-do list; it shows how many active Positions, how
    many Markets, and how many Labor Rules in effect today, in the program timezone, are loaded.
  rule_sources: []
  rule_decisions:
  - D-26
  - D-124
  - D-213
- rule_id: R3
  rule_statement: >-
    While REQ-ORG-0005.R6 allows a grant, Home offers Invite a Program User, which embeds the invite
    form of REQ-PROGRAM-WEB-0007 with the role fixed to PROGRAM_USER.
  rule_sources: []
  rule_decisions:
  - D-82
- rule_id: R4
  rule_statement: >-
    Below the invite, Home lists each User with an unaccepted PROGRAM_USER invite, with their name, email,
    and invite date, and offers Send invite again and Revoke under REQ-ORG-0005.R15.
  rule_sources: []
  rule_decisions:
  - D-82
- rule_id: R5
  rule_statement: >-
    While REQ-ORG-0005.R6 refuses a grant, Home says a Program User is in place and offers no invite, and
    when REQ-ORG-0005.R18 applies it names that User and offers Revoke after a confirmation.
  rule_sources: []
  rule_decisions:
  - D-82
  - D-256
- rule_id: R6
  rule_statement: >-
    Home lists the other Instawork Admins with name, email, and whether active, and offers Deactivate or
    Reactivate under REQ-ORG-0005.R19.
  rule_sources: []
  rule_decisions:
  - D-257
requirement_sources:
- SHEET PLT-1
