requirement_id: REQ-PROGRAM-WEB-0015
requirement_target_layer: user-interface
requirement_target_module: PROGRAM-WEB
requirement_phase: MVP
requirement_title: Upload Agencies from the Agencies screen
requirement_statement: >-
  From the Agencies screen a Program User uploads an AGENCIES file to add many Agencies, their first
  contacts, and their approvals at once.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    This requirement adds Upload Agencies to the Agencies screen of REQ-PROGRAM-WEB-0006, which opens
    the Uploads send step of REQ-SHELL-0008 with AGENCIES picked.
  rule_sources:
  - FEEDBACK Creating an agency in bulk
  rule_decisions:
  - D-108
- rule_id: R2
  rule_statement: >-
    REQ-AGENCIES-0010 saves the Agencies, contacts, and approvals of the accepted rows.
  rule_sources:
  - FEEDBACK Creating an agency in bulk
  rule_decisions: []
requirement_sources:
- FEEDBACK Creating an agency in bulk
requirement_decisions:
- D-108
