requirement_id: REQ-PROGRAM-WEB-0009
requirement_target_layer: user-interface
requirement_target_module: PROGRAM-WEB
requirement_phase: MVP
requirement_title: Approve Agency rate changes, show Peer Rates, and follow Rate Reviews
requirement_statement: >-
  On the Rates screen a Program User approves or sends back each Rate Line an Agency submitted. They see
  each line beside its Peer Rate, send Rate Reviews, and follow each until it is answered.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The approval queue, a tab of the Rates screen of REQ-PROGRAM-WEB-0003, lists PENDING Rate Lines, oldest
    first, each with its Agency, Position, Market or Unit, six rates, effective_from, and who submitted
    it.
  rule_sources:
  - SESSIONS Rate Cards & Supplier Sourcing
  rule_decisions:
  - D-10
  - D-66
- rule_id: R2
  rule_statement: >-
    Each queued line shows the APPROVED line it would replace, when there is one, the change in each rate,
    and the submitter's change_reason.
  rule_sources:
  - SHEET RC-5
  rule_decisions:
  - D-10
- rule_id: R3
  rule_statement: >-
    A queued Market line also shows the Peer Rate for its Position and Market, when there is one, and
    whether REQ-RATES-0008 would flag its regular Bill Rate.
  rule_sources:
  - SHEET RC-12
  rule_decisions:
  - D-12
- rule_id: R4
  rule_statement: >-
    Approve calls REQ-RATES-0009, and the line then leaves the queue and shows as APPROVED in the Rate
    Lines list.
  rule_sources:
  - SESSIONS Rate Cards & Supplier Sourcing
  rule_decisions:
  - D-10
- rule_id: R5
  rule_statement: >-
    Send back takes a reason and calls REQ-RATES-0009, and the line leaves the queue as SENT_BACK.
  rule_sources:
  - DEMO lib/types.ts
  rule_decisions:
  - D-10
- rule_id: R6
  rule_statement: >-
    A queued line whose effective_from is before that of the APPROVED line it would replace is marked
    as one that cannot be approved, and offers only Send back.
  rule_sources: []
  rule_decisions:
  - D-55
- rule_id: R7
  rule_statement: >-
    A Rate Reviews tab lists each review with its Agency, the line, the Peer Rate when it was requested,
    who requested it, when, and its status.
  rule_sources:
  - SHEET RC-12
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    A KEPT review shows the Agency's reason, and a review answered with a lower line links to that line
    and shows LOWERED once the line is APPROVED.
  rule_sources:
  - SHEET RC-12
  rule_decisions:
  - D-10
- rule_id: R9
  rule_statement: >-
    Reviews list REQUESTED ones first, then newest first, and filter by status and Agency.
  rule_sources: []
  rule_decisions:
  - D-114
  - D-63
- rule_id: R10
  rule_statement: >-
    This requirement adds to the Rates screen of REQ-PROGRAM-WEB-0003 the Peer Rate of each Market Rate
    Line in effect today, and highlights a line REQ-RATES-0008 flags above it with the gap in dollars
    and percent.
  rule_sources:
  - SHEET RC-12
  - FEEDBACK A lot of vendors side by side
  rule_decisions:
  - D-12
  - D-108
- rule_id: R11
  rule_statement: >-
    A line that REQ-RATES-0008.R2 gives no Peer Rate shows none and is never highlighted.
  rule_sources: []
  rule_decisions:
  - D-12
- rule_id: R12
  rule_statement: >-
    A flagged line with no REQUESTED Rate Review offers Send Rate Review, which calls REQ-RATES-0008,
    and a line under review shows the review's status instead.
  rule_sources:
  - SHEET RC-12
  - SESSIONS Invoicing & Accruals
  rule_decisions:
  - D-2
