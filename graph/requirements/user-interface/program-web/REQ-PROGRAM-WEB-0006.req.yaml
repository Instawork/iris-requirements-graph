requirement_id: REQ-PROGRAM-WEB-0006
requirement_target_layer: user-interface
requirement_target_module: PROGRAM-WEB
requirement_phase: MVP
requirement_title: Manage Agencies and where each is approved
requirement_statement: >-
  On the Agencies screen a Program User adds Agencies, renames or deactivates them, and approves each
  one at Sectors, Regions, Districts, or Units.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Agencies screen lists every Agency with its name, whether it is active, and the number of org
    nodes it is approved at, and searches by name.
  rule_sources:
  - FEEDBACK Creating an agency in bulk
  rule_decisions:
  - D-9
- rule_id: R2
  rule_statement: >-
    Add Agency takes the Agency's name and a first contact's first name, last name, email, and optional
    phone, and calls REQ-AGENCIES-0001, which invites the contact as the first Agency User.
  rule_sources:
  - FEEDBACK Creating an agency in bulk
  rule_decisions:
  - D-25
- rule_id: R3
  rule_statement: >-
    Each Agency offers Rename and Deactivate through REQ-AGENCIES-0001, and an inactive Agency is marked
    as receiving no new Release.
  rule_sources: []
  rule_decisions:
  - D-53
- rule_id: R4
  rule_statement: >-
    An Agency's page lists its approvals with the org node, its level, who approved it, and when, and
    removed approvals with who removed them and when.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-9
- rule_id: R5
  rule_statement: >-
    Approve picks a Sector, Region, District, or Unit from the org tree where the Agency has no unremoved
    approval, and calls REQ-AGENCIES-0002.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-9
- rule_id: R6
  rule_statement: >-
    Remove approval calls REQ-AGENCIES-0002 after the page says that Releases already sent do not change.
  rule_sources: []
  rule_decisions:
  - D-9
requirement_sources:
- FEEDBACK Creating an agency in bulk
- SHEET RC-11
requirement_decisions:
