requirement_id: REQ-PROGRAM-WEB-0001
requirement_target_layer: user-interface
requirement_target_module: PROGRAM-WEB
requirement_phase: MVP
requirement_title: Program menu and Home page
requirement_statement: >-
  The Program menu lists a Program User's screens, and Home is the page they land on.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Program User menu lists Home, Shifts, Workers, Rates, Credentials, Agencies, Org, Users, Reports,
    Uploads, and Settings, in that order.
  rule_sources:
  - PRD Pages
  rule_decisions:
  - D-66
- rule_id: R11
  rule_statement: >-
    Home is the page a Program User lands on, first in the menu; it holds only the sections other requirements
    add, and says there is nothing to do when none has anything to show.
  rule_sources:
  - PRD §1 Dashboard / Profile
  rule_decisions:
  - D-110
requirement_sources:
- PRD Pages
