requirement_id: REQ-PROGRAM-WEB-0013
requirement_target_layer: user-interface
requirement_target_module: PROGRAM-WEB
requirement_phase: MVP
requirement_title: 'Program Home: to-dos and Units ranked by spend'
requirement_statement: >-
  A Program User's Home lists their to-dos: Credentials to review, rate changes to approve, and rates
  above their peers. Its second section ranks every Unit by spend.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Home (REQ-PROGRAM-WEB-0001) shows the to-do list of REQ-SHELL-0003 with three lines: Credentials to
    review, rate changes to approve, and rates above their peers.
  rule_sources:
  - PRD §1 Dashboard / Profile
  rule_decisions:
  - D-224
- rule_id: R2
  rule_statement: >-
    Credentials to review counts NEEDS_REVIEW Credentials, shows the age of the oldest since it was uploaded,
    and opens the review queue of REQ-PROGRAM-WEB-0010.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-3
  - D-224
  - D-225
- rule_id: R3
  rule_statement: >-
    Rate changes to approve counts PENDING Rate Lines, shows the age of the oldest since it was submitted,
    and opens the approval queue of REQ-PROGRAM-WEB-0009.
  rule_sources:
  - SESSIONS Rate Cards & Supplier Sourcing
  rule_decisions:
  - D-10
  - D-224
  - D-225
- rule_id: R4
  rule_statement: >-
    Rates above their peers counts Rate Lines flagged above the Peer Rate under REQ-RATES-0008 that never
    had a Rate Review, shows the largest gap in dollars, and opens them on the Rates screen of REQ-PROGRAM-WEB-0003.
  rule_sources:
  - SHEET RC-12
  rule_decisions:
  - D-2
  - D-224
  - D-225
- rule_id: R5
  rule_statement: >-
    The second section is the Units view, which ranks every Unit by SPEND for the current calendar month,
    highest first, and shows each Unit's APPROVED_SPEND and PENDING_SPEND.
  rule_sources:
  - PRD §1 Compass view
  - SHEET REP-9
  rule_decisions:
  - D-29
- rule_id: R6
  rule_statement: >-
    Each Unit shows this month's SPEND against its normal level as the percentage REQ-REPORTING-0009 computes,
    with no flag, and shows no comparison where that requirement gives none.
  rule_sources:
  - PRD §1 Dashboard / Profile
  rule_decisions:
  - D-30
- rule_id: R7
  rule_statement: >-
    Each Unit also shows how many of its Releases this month were off-contract or non-contracted, as REQ-REPORTING-0009.R7
    counts them.
  rule_sources:
  - SHEET RC-11
  - PRD §1 Compass view
  rule_decisions:
  - D-2
- rule_id: R8
  rule_statement: The Units view can be narrowed to one Sector, Region, or District.
  rule_sources:
  - SHEET REP-9
  - SHEET PLT-2
  rule_decisions:
  - D-185
- rule_id: R9
  rule_statement: >-
    Selecting a Unit opens the Program Shifts screen of REQ-PROGRAM-WEB-0011 filtered to that Unit.
  rule_sources:
  - PRD §1 Who sees what
  rule_decisions: []
requirement_sources:
