requirement_id: REQ-PROGRAM-WEB-0003
requirement_target_layer: user-interface
requirement_target_module: PROGRAM-WEB
requirement_phase: MVP
requirement_title: Compare Rate Lines across Agencies and enter rates
requirement_statement: >-
  On the Rates screen a Program User filters every Agency's Rate Lines by Position and Market and sees
  each beside its Peer Rate. They enter or load lines for any Agency, send Rate Reviews, and read the
  rate history.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The Rates screen lists Rate Lines across all Agencies, one row per line, with Agency, Position, Market
    or Unit, the six rates, Markup as a percentage, effective dates, and status.
  rule_sources:
  - PRD §3 Supplier Rates
  - FEEDBACK Just do % only
  rule_decisions:
  - D-11
- rule_id: R2
  rule_statement: >-
    It filters by Market, Position, Agency, Unit, and status and sorts by any rate, rather than placing
    Agencies side by side (C-15).
  rule_sources:
  - FEEDBACK A lot of vendors side by side
  rule_decisions: []
- rule_id: R3
  rule_statement: It opens on APPROVED lines in effect today.
  rule_sources:
  - DEMO components/rates/rates-page.tsx
  rule_decisions:
  - D-112
- rule_id: R4
  rule_statement: >-
    Each Market Rate Line in effect today shows its Peer Rate, and a line flagged above it under REQ-RATES-0008
    is highlighted with the gap in dollars and as a percentage.
  rule_sources:
  - SHEET RC-12
  - FEEDBACK A lot of vendors side by side
  rule_decisions:
  - D-12
- rule_id: R5
  rule_statement: >-
    A line that REQ-RATES-0008.R2 gives no Peer Rate shows none and is never highlighted.
  rule_sources: []
  rule_decisions:
  - D-12
- rule_id: R6
  rule_statement: >-
    A flagged line with no REQUESTED Rate Review offers Send Rate Review, which calls REQ-RATES-0008;
    a line under review shows the review's status instead.
  rule_sources:
  - SHEET RC-12
  - SESSIONS Invoicing & Accruals
  rule_decisions:
  - D-2
- rule_id: R7
  rule_statement: >-
    Add rate opens the form of REQ-RATES-0013 with an Agency field, and the saved line is listed as APPROVED
    at once (C-13).
  rule_sources:
  - FEEDBACK Rate Cards needs to be its own CRM
  rule_decisions:
  - D-10
- rule_id: R8
  rule_statement: >-
    An APPROVED line with no effective_to offers Change, which opens that form filled from the line; saving
    adds a new APPROVED line through REQ-RATES-0009 that ends the old one on its effective_from.
  rule_sources:
  - SHEET RC-5
  rule_decisions:
  - D-10
- rule_id: R9
  rule_statement: >-
    Upload rates opens the Uploads send step of REQ-SHELL-0008 with RATE_CARD picked; the rows name the
    Agency, and REQ-RATES-0002 saves each accepted row as an APPROVED line.
  rule_sources:
  - SHEET RC-4
  - FEEDBACK Rate Cards needs to be its own CRM
  rule_decisions:
  - D-10
- rule_id: R10
  rule_statement: >-
    A History tab lists every line of every Agency, including superseded, PENDING, and SENT_BACK ones,
    as REQ-RATES-0003 keeps them, and each opens its change history through REQ-SHELL-0011, shown to Program
    Users.
  rule_sources:
  - SHEET RC-5
  rule_decisions: []
- rule_id: R11
  rule_statement: >-
    An APPROVED line with no effective_to also offers End, which takes an end date and a reason and saves
    through REQ-RATES-0009.R14.
  rule_sources:
  - SHEET RC-5
  rule_decisions:
  - D-78
