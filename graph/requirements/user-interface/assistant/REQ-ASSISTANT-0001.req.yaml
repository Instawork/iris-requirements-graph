requirement_id: REQ-ASSISTANT-0001
requirement_target_layer: user-interface
requirement_target_module: ASSISTANT
requirement_phase: MVP
requirement_title: Open the Iris assistant from any page
requirement_statement: >-
  Every signed-in page opens the assistant, a chat panel where a User types a request or attaches a file.
  It opens with starters for the role the User is acting in.
requirement_actors:
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The frame of REQ-SHELL-0009 has a control that opens the assistant as a panel over the page, without
    leaving it.
  rule_sources:
  - PRD §7 Agent Chat
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The panel has one input for typed text and attached files, and shows the User's messages and Iris's
    answers in order.
  rule_sources:
  - PRD §7 Opening screen
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    For a Unit User it opens with four starters: book a Shift, upload Shifts, download the Shifts template,
    and approve recent Timesheets.
  rule_sources:
  - PRD §7 Opening screen
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    For an Agency User the starters are upload a Rate Card, upload Workers, download a template, assign
    Workers to Shifts, and submit hours.
  rule_sources:
  - PRD §7 Opening screen
  rule_decisions:
  - D-111
- rule_id: R5
  rule_statement: >-
    For a Program User the starters are ask a spend question, upload Units, upload Agencies, upload a
    Rate Card, and download a template.
  rule_sources:
  - SESSIONS Reporting
  - FEEDBACK
  rule_decisions:
  - D-64
- rule_id: R6
  rule_statement: >-
    A starter opens the file chooser for an upload, gives the template through REQ-INTAKE-0003 for a download,
    or begins that request in the conversation.
  rule_sources:
  - PRD §7 Opening screen
  - PRD §7 How it works
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A file attached in the panel is sent through REQ-INTAKE-0001 with channel ASSISTANT, and its status
    and its Proposal card appear in the conversation.
  rule_sources:
  - PRD §7 How it connects
  - PRD §7 File attached
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    When Iris cannot tell an attached file's upload type, the panel asks the User to pick one of the types
    the acting role may send.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    When the acting role may not send the file's type, the panel names the roles that may, and nothing
    is saved.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    Each time it opens, the panel lists the User's OPEN Proposals, oldest first, whichever channel they
    came through, each as the card of REQ-ASSISTANT-0002.
  rule_sources: []
  rule_decisions:
  - D-36
  - D-64
- rule_id: R11
  rule_statement: >-
    The conversation lasts for the session only; after sign-out the User still finds their Uploads in
    the upload log and their OPEN Proposals in the panel.
  rule_sources: []
  rule_decisions:
  - D-36
  - D-64
requirement_sources:
- PRD §7 Agent Chat
requirement_decisions:
- D-36
- D-64
- D-111
