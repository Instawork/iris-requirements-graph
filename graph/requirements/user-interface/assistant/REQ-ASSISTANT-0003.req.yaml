requirement_id: REQ-ASSISTANT-0003
requirement_target_layer: user-interface
requirement_target_module: ASSISTANT
requirement_phase: MVP
requirement_title: Hand each typed request to the requirement that owns it
requirement_statement: >-
  The assistant passes each typed request to the product requirement that owns that kind of change, and
  shows its question, Proposal, or answer. The assistant itself saves nothing.
requirement_actors:
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A typed request is read under REQ-AGENT-0001 and handed to exactly one owner named below, and the
    assistant makes no change of its own.
  rule_sources:
  - PRD §7 What the LLM does and what code does
  - PRD §7 Agent Chat
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Unit User's request for Workers goes to REQ-ORDERING-0009, which drafts the Request.
  rule_sources:
  - SHEET SC-9
  - PRD §7 Typed request
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A request to change hours, split a Timesheet, mark a no-show, or approve or submit Timesheets goes
    to REQ-TIME-0004.
  rule_sources:
  - SHEET TS-6
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    A Unit User's request to enter a Tip Pool goes to REQ-TIPS-0001, and an Agency User's request to add
    Expenses goes to REQ-TIPS-0002.
  rule_sources:
  - SHEET TS-11
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    An Agency User's request that names Workers for a Shift goes to REQ-WORKFORCE-0003, which proposes
    the Assignments.
  rule_sources:
  - PRD §7 Who uses it
  - SHEET WA-1
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A question about spend or labor from a Unit User or a Program User goes to REQ-REPORTING-0003.
  rule_sources:
  - SHEET REP-1
  - SESSIONS Reporting
  rule_decisions:
  - D-45
- rule_id: R7
  rule_statement: >-
    An attached file is not routed here; it goes through REQ-INTAKE-0001, and the owner of its upload
    type checks and saves its rows.
  rule_sources:
  - PRD §7 How it works
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    When a request fits several owners or is missing a detail, the assistant shows the question REQ-AGENT-0003
    asks and hands nothing on until the User answers.
  rule_sources:
  - PRD §7 When the agent is unsure
  - SHEET SC-9
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    When the owner says the acting role may not make the change, the assistant says who can, and no Proposal
    is created.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    A request no owner takes, such as changing or cancelling a Shift, creates no Proposal; the assistant
    says so and names the screen where it is done.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions:
  - D-64
- rule_id: R11
  rule_statement: >-
    Each Proposal an owner returns is shown as the card of REQ-ASSISTANT-0002 in the conversation.
  rule_sources:
  - PRD §7 Typed request
  rule_decisions: []
requirement_sources:
- PRD §7 Agent Chat
