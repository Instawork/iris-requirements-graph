requirement_id: REQ-ORDERING-0003
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Edit a Shift until it ends and cancel it before it starts
requirement_statement: >-
  Until a Shift ends, a Unit User can change its headcount, times, and site instructions. Until it starts,
  they can cancel it. Agencies holding the Shift are told of each change.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Until a Shift's ends_at, a Unit User over its Unit may change its headcount, start time, end time,
    planned break, and site instruction fields, unless it is CANCELLED.
  rule_sources:
  - SHEET SC-3
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
- rule_id: R2
  rule_statement: >-
    An edit is refused unless the changed Shift still passes every check a new Shift must pass.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Headcount cannot be lowered below the total headcount of the Shift's PENDING and ACCEPTED Releases.
  rule_sources:
  - SHEET SC-3
  rule_decisions:
  - D-17
  - D-18
- rule_id: R4
  rule_statement: >-
    When an edit changes the times, headcount, or site instructions of a Shift with a PENDING or ACCEPTED
    Release, SHIFT_CHANGED is sent to the active Agency Users of each Agency holding one.
  rule_sources:
  - SHEET SC-3
  rule_decisions:
  - D-18
- rule_id: R5
  rule_statement: >-
    Until a Shift's starts_at, a Unit User over its Unit may cancel it while it is OPEN, PARTIALLY_FILLED,
    or FILLED, which sets status CANCELLED, cancelled_by, and cancelled_at.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
- rule_id: R6
  rule_statement: >-
    After a cancel, REQ-DISPATCH-0001 cancels the Shift's PENDING and ACCEPTED Releases and REQ-WORKFORCE-0003
    removes its ASSIGNED Workers; this requirement changes neither record.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
- rule_id: R7
  rule_statement: A CANCELLED Shift cannot be edited, sent to an Agency, or staffed.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    After its ends_at a Shift cannot be edited or cancelled; changes to the hours worked are made on Timesheets.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
- rule_id: R9
  rule_statement: >-
    The same rules apply to an edit or a cancel whichever Channel it comes through.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
requirement_sources:
- SHEET SC-3
- PRD §2 Shift statuses
