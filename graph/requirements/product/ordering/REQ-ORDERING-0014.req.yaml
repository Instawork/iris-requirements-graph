requirement_id: REQ-ORDERING-0014
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Load Shifts from a file
requirement_statement: >-
  A Unit User uploads a SHIFTS file to create or change many Shifts at once. An Agency User uploads one
  to assign named Workers to Shifts released to their Agency.
requirement_actors:
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Each row of a SHIFTS file becomes a Proposal item under REQ-INTAKE-0002 that creates a Shift, changes
    a Shift, or assigns a Worker.
  rule_sources:
  - PRD §6 Templates
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Unit User's row with no shift_id creates a Shift at a Unit in their scope through REQ-ORDERING-0001,
    with created_via set to the Proposal's channel.
  rule_sources:
  - PRD §6 Templates
  - SHEET SC-2
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The rows of one file that create Shifts at the same Unit share one group_key and form one Request.
  rule_sources:
  - SHEET SC-2
  rule_decisions:
  - D-49
- rule_id: R4
  rule_statement: >-
    A Unit User's row with a shift_id changes that Shift's date, times, break, headcount, or site instructions
    through REQ-ORDERING-0003 and its Event through REQ-ORDERING-0011; an empty column changes nothing.
  rule_sources:
  - PRD §6 Templates
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    A change row is refused when REQ-ORDERING-0003 does not allow that change in the Shift's current status.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A row that creates a Shift must give a unit, position, date, start_time, end_time, and headcount,
    and a row that assigns a Worker must give the Worker's first and last name.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    On a row that creates a Shift, an agency value sends the Shift's whole headcount to that Agency through
    REQ-DISPATCH-0001 at the contracted rate, under that requirement's checks.
  rule_sources:
  - PRD §7 After the user approves
  - SHEET SC-7
  rule_decisions:
  - D-17
  - D-188
- rule_id: R8
  rule_statement: >-
    An Agency User's row assigns the person it names through REQ-WORKFORCE-0003 to the Agency's ACCEPTED
    Release on its shift_id, and a person who matches no Worker of the Agency is proposed as a new Worker.
  rule_sources:
  - PRD §6 Templates
  - PRD §7 Who uses it
  - PRD §7 What the agent accepts
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    An Agency User's row cannot create or change a Shift, and a Unit User's row cannot assign a Worker.
  rule_sources:
  - PRD §6 Templates
  - PRD §7 Who uses it
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    The unit, position, and agency are looked up by name, and the department and event by name within
    the row's Unit.
  rule_sources:
  - PRD §6 Templates
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R11
  rule_statement: >-
    The date, start_time, and end_time are checked as a new Shift's are, and a filled parking, entrance,
    directions, site_contact, or attire column replaces that default.
  rule_sources:
  - PRD §6 Templates
  - PRD §7 What the agent checks
  - SHEET SC-6
  rule_decisions:
  - D-264
- rule_id: R12
  rule_statement: >-
    A row that would create a Shift with the same Unit, Position, Department, start, and end as an earlier
    row, or as a Shift that is not CANCELLED, is reported as a duplicate.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R13
  rule_statement: >-
    A shift_id that matches no Shift the uploader may act on is a problem with no suggested fix.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R14
  rule_statement: >-
    shift_id is the Shift's id, which every downloaded list of Shifts or Releases carries, so its rows
    can be changed and uploaded again as a SHIFTS file.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R15
  rule_statement: >-
    On a row with a shift_id, a unit, position, or department that differs from the Shift's is a problem,
    and the agency column is not read.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions:
  - D-187
  - D-188
- rule_id: R16
  rule_statement: >-
    A row whose agency has no contracted rate for the new Shift is a problem whose fix clears the agency,
    because a file carries no Bill Rate.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions:
  - D-188
- rule_id: R17
  rule_statement: >-
    A row whose agency is non-contracted needs a non_contracted_reason where REQ-RATES-0007 answers SOFT
    and is a problem where it answers HARD; both are found before the Proposal is shown.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-188
- rule_id: R18
  rule_statement: >-
    A row with no date, where every other row of the file for the same Event gives one date, is a problem
    whose fix is that date.
  rule_sources:
  - PRD §7 File attached
  rule_decisions:
  - D-102
- rule_id: R19
  rule_statement: >-
    The person an Agency User's row names is matched under REQ-WORKFORCE-0002, and a proposed new Worker
    is created through REQ-WORKFORCE-0001 from the row's name, email, and phone when the row is accepted.
  rule_sources:
  - PRD §4 How the system matches a professional
  - PRD §7 What the agent accepts
  rule_decisions: []
- rule_id: R20
  rule_statement: >-
    Before the Proposal is shown, a row that assigns a matched Worker is checked under REQ-WORKFORCE-0003.R26,
    and each reason it would be refused is a row problem.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
