data_model:
  status: covered
  reads:
  - Shift.id
  - Shift.status
  - Shift.request_id
  - Shift.position_id
  - Shift.department_id
  - Request.unit_id
  - Event.unit_id
  - Event.name
  - OrgNode.name
  - Unit.org_node_id
  - Unit.timezone
  - Department.name
  - Department.unit_id
  - Position.name
  - Agency.name
  - Release.shift_id
  - Release.agency_id
  - Release.status
  - Worker.agency_id
  - Worker.first_name
  - Worker.last_name
  - Worker.email
  - Worker.phone
  writes:
  - Request.unit_id
  - Shift.event_id
  - Shift.department_id
  - Shift.position_id
  - Shift.starts_at
  - Shift.ends_at
  - Shift.break_minutes
  - Shift.headcount
  - Shift.parking
  - Shift.entrance
  - Shift.directions
  - Shift.site_contact
  - Shift.attire
  detail: >-
    Every save goes through REQ-ORDERING-0001, REQ-ORDERING-0003, or REQ-ORDERING-0011. The Request and
    Shift fields are listed as writes because the upload-types catalog maps this type's columns to them.
