requirement_id: REQ-ORDERING-0007
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Save Request templates and Unit defaults
requirement_statement: >-
  A Unit User saves Request templates, such as a game-day package of 5 bartenders and 4 concessions workers.
  They also set the Department each Position defaults to, which prefills new Requests.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User over a Unit may create, change, and delete its Request templates, each with a name that
    is unique within the Unit.
  rule_sources:
  - SHEET SC-11
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A template line holds an active Position, a headcount of at least 1, a start time, and an end time,
    and may hold a Department of the Unit and a planned break.
  rule_sources:
  - SHEET SC-11
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A template line whose end time is before its start time is saved only after the User confirms that
    it ends the next day.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Applying a template to a date fills a new Request with one Shift line per template line, and the Unit
    User may change any line before creating it.
  rule_sources:
  - SHEET SC-11
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    A Request made from a template is created through REQ-ORDERING-0001 as any other Request is, so changing
    or deleting the template later changes no Request.
  rule_sources:
  - SHEET SC-11
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A Unit User over a Unit may set one default Department for each Position there, and a new Shift line
    for that Position is prefilled with it.
  rule_sources:
  - SHEET SC-11
  - FEEDBACK Departments within venues, with their own cost centers
  rule_decisions: []
requirement_sources:
- SHEET SC-11
requirement_decisions: []
requirement_features:
- SC-11
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORDERING-0001
