requirement_id: REQ-ORDERING-0008
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Keep each Shift's status in step with its Workers and the clock
requirement_statement: >-
  Iris sets each Shift's status from its ASSIGNED Workers, its headcount, and the clock. No User sets
  a status by hand.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Before its ends_at, a Shift that is not CANCELLED is OPEN with no ASSIGNED Worker, PARTIALLY_FILLED
    with fewer than its headcount, and FILLED with its headcount or more.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    When REQ-WORKFORCE-0003 makes an Assignment ASSIGNED or REMOVED, or REQ-ORDERING-0003 changes a Shift's
    headcount, the status of that Shift, if it has not ended, is set again under R1.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    An interval job of REQ-JOBS-0001 sets each PARTIALLY_FILLED or FILLED Shift whose ends_at has passed
    to WORKED.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-68
- rule_id: R4
  rule_statement: The same job sets each OPEN Shift whose ends_at has passed to UNFILLED.
  rule_sources: []
  rule_decisions:
  - D-47
  - D-68
- rule_id: R5
  rule_statement: >-
    When REQ-WORKFORCE-0003 assigns a Worker from a Timesheet to an UNFILLED Shift, the Shift becomes WORKED.
  rule_sources: []
  rule_decisions:
  - D-47
  - D-182
- rule_id: R6
  rule_statement: >-
    A CANCELLED Shift never changes status, and a WORKED Shift stays WORKED.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R7
  rule_statement: No User can set a Shift's status directly.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
requirement_sources:
- PRD §2 Shift statuses
requirement_decisions:
- D-47
