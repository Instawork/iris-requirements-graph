requirement_id: REQ-ORDERING-0008
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Keep each Shift's status in step with its Workers and the clock
requirement_statement: >-
  Iris sets each Shift's status from its ASSIGNED Workers, its headcount, and the clock. No User sets
  a status by hand.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Before its ends_at, a Shift that is not CANCELLED is OPEN with no ASSIGNED Worker, PARTIALLY_FILLED
    with fewer than its headcount, and FILLED with its headcount or more.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The status is worked out again whenever an Assignment on the Shift becomes ASSIGNED or REMOVED and
    whenever the Shift's headcount changes.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    When ends_at passes, a PARTIALLY_FILLED or FILLED Shift becomes WORKED.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R4
  rule_statement: When ends_at passes, an OPEN Shift becomes UNFILLED.
  rule_sources: []
  rule_decisions:
  - D-47
- rule_id: R5
  rule_statement: >-
    An UNFILLED Shift becomes WORKED when a Worker is assigned to it from a Timesheet.
  rule_sources: []
  rule_decisions:
  - D-18
- rule_id: R6
  rule_statement: >-
    A CANCELLED Shift never changes status, and a WORKED Shift stays WORKED.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R7
  rule_statement: No User can set a Shift's status directly.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
requirement_sources:
- PRD §2 Shift statuses
requirement_decisions:
- D-18
- D-47
