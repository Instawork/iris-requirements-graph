requirement_id: REQ-ORDERING-0008
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Track each Shift's status
requirement_statement: >-
  A Shift is Open, Partially filled, Filled, Worked, or Cancelled. The status follows from its assignments
  and its times.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Open means no Worker is assigned, Partially filled means some headcount is, and Filled means all of
    it is.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: A Shift becomes Worked when its end time passes.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: Only a Shift that has not started can be Cancelled.
  rule_sources: []
  rule_decisions: []
- rule_id: R4
  rule_statement: Removing a Worker from a Filled Shift makes it Partially filled again.
  rule_sources: []
  rule_decisions: []
requirement_sources:
- PRD §2 Shift statuses
