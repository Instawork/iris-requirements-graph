requirement_id: REQ-ORDERING-0004
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Book recurring and chained Shifts
requirement_statement: >-
  One Request can repeat its Shift lines on a weekly pattern, or book a multi-week assignment as one block,
  so recurring needs are not entered again.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A recurring Request states recurrence_weekdays, recurrence_every_weeks of at least 1, and recurrence_ends_on,
    and each line creates one Shift for every matching date up to that end date.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
- rule_id: R2
  rule_statement: >-
    Weeks are counted in seven-day spans starting on each line's first date.
  rule_sources: []
  rule_decisions:
  - D-20
- rule_id: R3
  rule_statement: >-
    Every occurrence is created as a Shift when the Request is created, passes the checks of a new Shift,
    and has its own status, Releases, and Assignments.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
- rule_id: R4
  rule_statement: Shifts created from the same line share its line_no and form a series.
  rule_sources: []
  rule_decisions:
  - D-20
- rule_id: R5
  rule_statement: >-
    A Unit User may apply an edit or a cancel to one Shift or to its whole series, and a series change
    applies only to the Shifts that have not started.
  rule_sources: []
  rule_decisions:
  - D-20
  - D-18
- rule_id: R6
  rule_statement: >-
    A chained Request is a recurring Request with is_block true, which books a multi-week assignment as
    one block.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
requirement_sources:
- SHEET SC-4
requirement_decisions:
- D-18
- D-20
requirement_features:
