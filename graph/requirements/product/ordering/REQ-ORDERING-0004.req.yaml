requirement_id: REQ-ORDERING-0004
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Book recurring and chained Shifts
requirement_statement: >-
  One Request can repeat its Shift lines on a weekly pattern until an end date, so recurring needs are
  not entered again. A multi-week assignment, a chained block, is booked as one such Request.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A recurring Request states recurrence_weekdays, recurrence_every_weeks of at least 1, and recurrence_ends_on,
    and each line creates one Shift for every matching date from its own date through that end date.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
- rule_id: R2
  rule_statement: >-
    A date matches when it is one of the recurrence_weekdays and falls in a counted seven-day span: the
    first starts on the line's date, and then every recurrence_every_weeks-th span counts.
  rule_sources: []
  rule_decisions:
  - D-20
- rule_id: R3
  rule_statement: >-
    Every occurrence is created as a Shift through REQ-ORDERING-0001 when the Request is created, passes
    the checks of a new Shift, and has its own status, Releases, and Assignments.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-20
- rule_id: R4
  rule_statement: Shifts created from the same line share its line_no and form a series.
  rule_sources: []
  rule_decisions:
  - D-165
- rule_id: R5
  rule_statement: >-
    A Unit User may apply an edit or a cancel to one Shift or to its whole series, and a series change
    applies only to the Shifts that have not started.
  rule_sources: []
  rule_decisions:
  - D-165
- rule_id: R6
  rule_statement: >-
    A chained block, a multi-week assignment, is booked as one recurring Request; Iris stores nothing
    more for it and treats its Shifts as any series.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-166
- rule_id: R7
  rule_statement: >-
    A line's date must fall on one of the recurrence_weekdays, and recurrence_ends_on is included, is on
    or after that date, and is at most 52 weeks after it.
  rule_sources: []
  rule_decisions:
  - D-20
requirement_sources:
- SHEET SC-4
requirement_decisions:
- D-20
- D-165
- D-166
requirement_features:
- SC-4
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORDERING-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORDERING-0003
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
- edge_type: DEPENDS_ON
  requirement_id: REQ-AUDIT-0001
data_model:
  status: covered
  reads:
  - Shift.request_id
  - Shift.line_no
  - Shift.starts_at
  - Shift.status
  writes:
  - Request.recurrence_weekdays
  - Request.recurrence_every_weeks
  - Request.recurrence_ends_on
  detail: >-
    Shifts are created through REQ-ORDERING-0001 and changed or cancelled through REQ-ORDERING-0003; this
    requirement writes only the recurrence fields.
requirement_starting_flow: false
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
