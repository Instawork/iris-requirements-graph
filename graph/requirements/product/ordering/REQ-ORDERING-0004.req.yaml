requirement_phase: MVP
requirement_title: Book recurring and chained Shifts
requirement_statement: >-
  One Request can repeat Shifts on a pattern or book a multi-week assignment as one block, so recurring
  needs are not re-entered.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A recurring Request names the weekdays, the interval in weeks, and an end date, and creates one Shift
    per occurrence.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A chained Request is one block that an Agency accepts and staffs as a whole.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Editing one occurrence leaves the others unchanged, unless the user edits the whole series.
  rule_sources: []
  rule_decisions: []
