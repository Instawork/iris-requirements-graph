requirement_id: REQ-ORDERING-0002
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Show the contracted rate for each Shift line while booking
requirement_statement: >-
  While booking, a Unit User sees the contracted Bill Rate of each Agency a Shift line could go to, before
  anything is sent. Break and minimum-wage flags show on the line too. The rates a Release is sent at
  are saved on the Release, not on the Shift.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    For each Shift line, the Unit User sees every active Agency approved for the Unit with its contracted
    regular Bill Rate for the line's Position, Unit, and work date, as REQ-RATES-0005 finds it.
  rule_sources:
  - SHEET SC-1
  - PRD §2 Shifts
  - SESSIONS Shift Creation
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    An active Agency with no approval covering the Unit can still be picked and is marked non-contracted,
    and an Agency with no contracted rate for the line shows no rate.
  rule_sources:
  - SHEET RC-11
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    When an Agency is picked for a line, its contracted regular Bill Rate is filled in as the rate the
    Release will be sent at.
  rule_sources:
  - SHEET SC-1
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Before sending, the line shows what REQ-RATES-0007 requires for the picked Agency and Bill Rate: nothing,
    a reason, or that the send is refused.
  rule_sources:
  - SHEET RC-11
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Each line is also checked by REQ-LABOR-0002, using its times, its planned break, and the picked Agency's
    regular Pay Rate, and a rule not met shows as a flag that never blocks booking.
  rule_sources:
  - SHEET WA-18
  rule_decisions:
  - D-23
- rule_id: R6
  rule_statement: >-
    Pricing a line saves no rate on the Shift; Bill Rates are saved only on a Release when it is sent.
  rule_sources:
  - PRD Data Model
  rule_decisions:
  - D-17
requirement_sources:
