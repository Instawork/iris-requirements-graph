requirement_id: REQ-ORDERING-0010
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Take Requests and Shift changes by email, SMS, or phone
requirement_statement: >-
  A Unit User can order by email, text, or phone call. Iris drafts the Request, fills gaps from what the
  Unit ordered before, and creates nothing until the sender confirms on the same channel. A message that
  asks to change or cancel a Shift is drafted the same way.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An email, text, or call that REQ-MESSAGING-0002 matched to a Unit User and that asks for Workers is
    drafted the way REQ-ORDERING-0009 drafts typed text.
  rule_sources:
  - SHEET SC-10
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    When the message leaves out the times, Department, or Agency for a Position, Iris fills them from
    the Shift most recently created at the Unit for that Position that is not CANCELLED.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-48
- rule_id: R3
  rule_statement: >-
    The draft goes back to the sender on the channel they used, and for an email or a text a reply in
    the same thread approves or rejects it, as REQ-MESSAGING-0002 provides.
  rule_sources:
  - SHEET SC-10
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    On approval, the Request is created with created_via EMAIL, SMS, or PHONE, and each line with an Agency
    is sent through REQ-DISPATCH-0001.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-17
- rule_id: R5
  rule_statement: >-
    On a call, the AI agent reads the draft aloud, and the caller's spoken yes approves it and spoken
    no rejects it on that call, as a reply does in a thread.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-94
- rule_id: R6
  rule_statement: >-
    A matched Unit User's message that asks to change or cancel a Shift is drafted as REQ-ORDERING-0003
    drafts a typed request, and is answered and approved as a booking is.
  rule_sources:
  - SHEET SC-3
  - SESSIONS Shift Creation
  rule_decisions:
  - D-227
- rule_id: R7
  rule_statement: >-
    A message has no session: its sender acts as UNIT_USER across their unrevoked UNIT_USER grants, which
    REQ-ORG-0009 checks, and a sender with none is refused with that reason.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-256
- rule_id: R8
  rule_statement: >-
    The Agency is filled only when every Release of that Shift went to the same Agency, and otherwise
    Iris asks as REQ-ORDERING-0009.R3 does.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-48
- rule_id: R9
  rule_statement: >-
    The draft marks each value filled from an earlier Shift.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-48
requirement_sources:
- SHEET SC-10
requirement_decisions:
