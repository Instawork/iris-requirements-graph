requirement_id: REQ-ORDERING-0010
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Take Requests by email, SMS, or phone
requirement_statement: >-
  A Unit User can order by email, text, or phone call. Iris drafts the Request, fills gaps from what the
  Unit ordered before, and creates nothing until the sender confirms on the same channel.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An email, text, or call that REQ-MESSAGING-0002 matched to a Unit User and that asks for Workers is
    drafted the way REQ-ORDERING-0009 drafts typed text.
  rule_sources:
  - SHEET SC-10
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    When the message leaves out the times, Department, or Agency for a Position, Iris fills them from
    the Unit's most recent Shift for that Position and marks each filled value in the draft.
  rule_sources:
  - SHEET SC-10
  - >-
    GRAPH unit memory is read from the Unit's past Shifts, pending a decision
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The draft goes back to the sender on the channel they used, and a reply in the same thread approves
    or rejects it, as REQ-MESSAGING-0002 provides.
  rule_sources:
  - SHEET SC-10
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    On approval, the Request is created with created_via EMAIL, SMS, or PHONE, and each line with an Agency
    is sent through REQ-DISPATCH-0001.
  rule_sources:
  - SHEET SC-10
  rule_decisions:
  - D-17
requirement_sources:
- SHEET SC-10
requirement_decisions: []
requirement_features:
- SC-10
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORDERING-0009
- edge_type: DEPENDS_ON
  requirement_id: REQ-MESSAGING-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENT-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
data_model:
  status: covered
  reads:
  - InboundMessage.channel
  - InboundMessage.user_id
  - InboundMessage.thread_key
  - InboundMessage.body
  - Request.unit_id
  - Shift.request_id
  - Shift.position_id
  - Shift.department_id
  - Shift.starts_at
  - Shift.ends_at
  - Release.shift_id
  - Release.agency_id
  writes: []
  detail: null
requirement_starting_flow: false
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
