requirement_id: REQ-ORDERING-0006
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Share structured site instructions with the Agency and Workers
requirement_statement: >-
  Each Shift carries site instructions in five fields: parking, entrance, directions, site contact, and
  attire. The Agency sees them on its Release, and each assigned Worker receives them by text or email.
requirement_actors:
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Shift's site instructions are its parking, entrance, directions, site_contact, and attire fields,
    each an optional text.
  rule_sources:
  - SHEET SC-6
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    An Agency User sees the five fields on each PENDING or ACCEPTED Release their Agency holds on the
    Shift.
  rule_sources:
  - SHEET SC-6
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    When REQ-WORKFORCE-0003 makes an Assignment ASSIGNED on a Shift that has not ended and has a site
    instruction filled, SITE_INSTRUCTIONS is sent to the Worker by EMAIL and SMS, whichever addresses
    the Worker has.
  rule_sources:
  - SHEET SC-6
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    When REQ-ORDERING-0003 changes a site instruction of a Shift that has not ended, SITE_INSTRUCTIONS
    is sent again to every ASSIGNED Worker on it.
  rule_sources:
  - SHEET SC-6
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Each send sets instructions_sent_at on the Assignment through REQ-WORKFORCE-0003.
  rule_sources:
  - SHEET SC-6
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    When R3 or R4 would send to a Worker with neither an email nor a phone, nothing is sent, and INSTRUCTIONS_NOT_SENT
    goes in the app to every active Agency User of the Worker's Agency.
  rule_sources:
  - SHEET SC-6
  rule_decisions:
  - D-89
- rule_id: R7
  rule_statement: >-
    A SITE_INSTRUCTIONS message names the Unit, the Position, and the Shift's date and start and end times,
    followed by each filled site instruction field; INSTRUCTIONS_NOT_SENT names the Worker and the Shift.
  rule_sources:
  - SHEET SC-6
  rule_decisions:
  - D-89
requirement_sources:
- SHEET SC-6
requirement_decisions:
- D-89
requirement_features:
- SC-6
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORDERING-0003
- edge_type: DEPENDS_ON
  requirement_id: REQ-WORKFORCE-0003
- edge_type: DEPENDS_ON
  requirement_id: REQ-MESSAGING-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
