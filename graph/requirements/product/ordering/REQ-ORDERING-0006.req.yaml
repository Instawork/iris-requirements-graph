  status: covered
  reads:
  - Request.unit_id
  - Unit.org_node_id
  - OrgNode.name
  - Position.name
  - Shift.request_id
  - Shift.position_id
  - Shift.starts_at
  - Shift.parking
  - Shift.entrance
  - Shift.directions
  - Shift.site_contact
  - Shift.attire
  - Shift.ends_at
