requirement_id: REQ-ORDERING-0005
requirement_target_layer: product
requirement_target_module: ORDERING
requirement_phase: MVP
requirement_title: Overbook and add headcount on the day
requirement_statement: >-
  A Unit User can book more Workers than needed, such as 55 when 50 are needed, and Iris records both
  numbers. They can also add headcount on the day, until the Shift ends.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    When booking more Workers than needed, a Unit User sets headcount to the number booked and needed_headcount
    to the number needed.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-19
- rule_id: R2
  rule_statement: >-
    needed_headcount is at least 1 and at most headcount; setting it outside that range is refused here,
    and lowering headcount below it is refused by REQ-ORDERING-0003.
  rule_sources: []
  rule_decisions:
  - D-19
- rule_id: R3
  rule_statement: >-
    needed_headcount is a record only: Shift status and Releases use headcount, every Worker who works
    counts toward spend, and no MVP report reads it.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-19
- rule_id: R4
  rule_statement: >-
    A Unit User may raise a Shift's headcount on the day it is worked, even after it has started, until
    its ends_at.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-18
- rule_id: R5
  rule_statement: >-
    Headcount added on the day stays unsent until the Unit User sends it to an Agency through REQ-DISPATCH-0001.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-17
requirement_sources:
- SHEET SC-5
requirement_decisions:
- D-17
- D-18
- D-19
requirement_features:
- SC-5
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORDERING-0003
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
- edge_type: DEPENDS_ON
  requirement_id: REQ-AUDIT-0001
data_model:
  status: covered
  reads:
  - Shift.headcount
  - Shift.ends_at
  - Shift.status
  writes:
  - Shift.needed_headcount
  detail: >-
    Headcount itself is raised through REQ-ORDERING-0003, which writes it.
requirement_starting_flow: false
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
