requirement_id: REQ-FINANCE-0002
requirement_target_layer: product
requirement_target_module: FINANCE
requirement_phase: P2
requirement_title: Close out swapped and no-show Workers automatically
requirement_statement: >-
  Workers who were swapped out or did not show are closed out of Requests automatically, so they do not
  inflate accruals.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Worker who was swapped out of a Shift or marked as a no-show is closed out without manual work and
    adds nothing to an accrual snapshot.
  rule_sources:
  - SHEET INV-13
  rule_decisions: []
