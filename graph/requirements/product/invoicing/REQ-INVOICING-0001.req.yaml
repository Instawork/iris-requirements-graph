requirement_id: REQ-INVOICING-0001
requirement_target_layer: product
requirement_target_module: INVOICING
requirement_phase: P2
requirement_title: Build one weekly consolidated invoice
requirement_statement: >-
  Each week Iris builds one Consolidated Invoice from Approved Timesheets, with every Agency inside it.
  It opens on a summary and drills down from Unit to Agency, Shift, and Worker.
requirement_actors:
- SYSTEM
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Iris keeps one Consolidated Invoice per week and, inside it, one Agency Invoice for each Agency with
    lines that week.
  rule_sources:
  - SHEET INV-1
  - SESSIONS Invoicing & Accruals
  - PRD Key Terms
  rule_decisions:
  - D-132
- rule_id: R2
  rule_statement: >-
    When a Timesheet becomes APPROVED, this requirement adds its line to the current week's
    Consolidated Invoice, which starts OPEN, creating that invoice and the Agency's Agency Invoice in
    it when missing.
  rule_sources:
  - SESSIONS Invoicing & Accruals
  rule_decisions:
  - D-132
- rule_id: R3
  rule_statement: >-
    A daily job of REQ-JOBS-0001 makes a Consolidated Invoice and its Agency Invoices ISSUED once its
    week has closed and sets issued_at; their lines then change only through adjustments on a later
    invoice.
  rule_sources:
  - SHEET INV-3
  - SESSIONS Invoicing & Accruals
  rule_decisions:
  - D-132
  - D-68
- rule_id: R4
  rule_statement: >-
    The invoice opens on a summary: one total for the week, each Agency's total, and totals by Cost Center.
  rule_sources:
  - SHEET INV-1
  - SESSIONS Invoicing & Accruals
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    From the summary, a User drills down from Unit to Agency, then to Shift, then to Worker.
  rule_sources:
  - SHEET INV-1
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A Program User sees every invoice, a Unit User sees the lines for Units in their scope, and an Agency
    User sees only their own Agency Invoices.
  rule_sources:
  - PRD §5 Invoices
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A new line stores its Timesheet, the work date of its Shift, and the five amounts
    REQ-INVOICING-0002 computes; a new Agency Invoice starts OPEN with paid_amount 0 and no contract
    type.
  rule_sources:
  - SHEET INV-4
  - SHEET INV-5
  rule_decisions:
  - D-35
requirement_sources:
- SHEET INV-1
- SHEET 5.1
- START
- SESSIONS Invoicing & Accruals
requirement_decisions:
- D-31
- D-35
- D-68
- D-132
requirement_features:
