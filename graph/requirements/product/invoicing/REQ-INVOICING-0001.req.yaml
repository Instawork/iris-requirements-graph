data_model:
  status: covered
  reads:
  - Timesheet.status
  - Timesheet.approved_at
  - Timesheet.assignment_id
  - Assignment.release_id
  - Release.agency_id
  - Release.shift_id
  - Shift.starts_at
  - Shift.request_id
  - Request.unit_id
  - Unit.timezone
  - InvoiceLine.*
  writes:
  - ConsolidatedInvoice.week_start
  - ConsolidatedInvoice.status
  - ConsolidatedInvoice.issued_at
  - AgencyInvoice.consolidated_invoice_id
  - AgencyInvoice.agency_id
  - AgencyInvoice.status
  - AgencyInvoice.paid_amount
  - InvoiceLine.agency_invoice_id
  - InvoiceLine.timesheet_id
  - InvoiceLine.work_date
  - InvoiceLine.regular_amount
  - InvoiceLine.overtime_amount
  - InvoiceLine.double_time_amount
  - InvoiceLine.tips_amount
  - InvoiceLine.expenses_amount
  detail: >-
    Creates every invoice record with all its required fields. The day the invoice week starts and
    closes waits on D-132.
