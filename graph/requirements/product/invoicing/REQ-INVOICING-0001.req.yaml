requirement_id: REQ-INVOICING-0001
requirement_target_layer: product
requirement_target_module: INVOICING
requirement_phase: P2
requirement_title: Build each Sector's weekly consolidated invoice
requirement_statement: >-
  Each week Iris builds one Consolidated Invoice per Sector from Approved Timesheets, with every Agency
  that worked in that Sector inside it.
  It opens on a summary and drills down from Unit to Agency, Shift, and Worker.
requirement_actors:
- SYSTEM
- PROGRAM_USER
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Iris keeps one Consolidated Invoice per Sector per week and, inside it, one Agency Invoice for each
    Agency with lines in that Sector that week.
  rule_sources:
  - SHEET INV-1
  - SESSIONS Invoicing & Accruals
  - PRD Key Terms
  - FAQ One consolidated invoice
  rule_decisions:
  - D-240
  - D-241
- rule_id: R2
  rule_statement: >-
    When a Timesheet becomes APPROVED, this requirement adds its line to the current week's
    Consolidated Invoice of its Unit's Sector, which starts OPEN, creating that invoice and the Agency's Agency Invoice in
    it when missing.
  rule_sources:
  - SESSIONS Invoicing & Accruals
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A daily job of REQ-JOBS-0001 makes a Consolidated Invoice and its Agency Invoices ISSUED once its
    week has closed and sets issued_at; their lines then change only through adjustments on a later
    invoice.
  rule_sources:
  - SHEET INV-3
  - SESSIONS Invoicing & Accruals
  rule_decisions:
  - D-67
  - D-241
- rule_id: R4
  rule_statement: >-
    The invoice opens on a summary: one total for the week, each Agency's total, and totals by Department cost center.
  rule_sources:
  - SHEET INV-1
  - SESSIONS Invoicing & Accruals
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    From the summary, a User drills down from Unit to Agency, then to Shift, then to Worker.
  rule_sources:
  - SHEET INV-1
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A Program User sees every invoice, a Unit User sees the lines for Units in their scope, and an Agency
    User sees only their own Agency Invoices.
  rule_sources:
  - PRD §5 Invoices
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A new line stores its Timesheet, the work date of its Shift, and the five amounts
    REQ-INVOICING-0002 computes; a new Agency Invoice starts OPEN with paid_amount 0 and no contract
    type.
  rule_sources:
  - SHEET INV-4
  - SHEET INV-5
  rule_decisions:
  - D-35
- rule_id: R8
  rule_statement: >-
    While its invoice is OPEN, a line's five amounts are computed again whenever its Timesheet's hours,
    tips, or Expenses change, as when a Tip Pool is split again.
  rule_sources:
  - PRD §5 Invoices
  rule_decisions:
  - D-137
- rule_id: R9
  rule_statement: >-
    On issue, a Consolidated Invoice takes the next program-wide invoice number, a copy of its Sector's
    Billing Profile name and address as bill_to, and the active purchase order covering week_start.
  rule_sources: []
  rule_decisions:
  - D-268
  - D-269
- rule_id: R10
  rule_statement: >-
    On issue, each Agency Invoice's due_on is the issue date plus the days due of its Agency Billing
    Profile's Payment Terms.
  rule_sources: []
  rule_decisions:
  - D-268
  - D-270
- rule_id: R12
  rule_statement: >-
    On issue, each Agency Invoice's vms_fee_amount is its total times its Agency's vms_fee_pct divided by
    100, rounded half up to the cent, or empty when no fee percent is set.
  rule_sources: []
  rule_decisions:
  - D-272
- rule_id: R11
  rule_statement: >-
    An invoice whose Sector or Agency has no billing details still issues, with bill_to or due_on empty,
    and is shown to Program Users as missing them.
  rule_sources: []
  rule_decisions:
  - D-268
