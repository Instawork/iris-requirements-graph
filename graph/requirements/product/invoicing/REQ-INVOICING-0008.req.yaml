requirement_id: REQ-INVOICING-0008
requirement_target_layer: product
requirement_target_module: INVOICING
requirement_phase: P2
requirement_title: Handle contract types on invoices
requirement_statement: >-
  A contract type (client-pay payroll, pass-through, or full service) decides who receives an invoice.
  Whether the type is set per Agency or per Unit is an open decision.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Each Agency Invoice carries one contract type: CLIENT_PAY_PAYROLL, PASS_THROUGH, or FULL_SERVICE.
  rule_sources:
  - SHEET INV-8
  rule_decisions:
  - D-35
- rule_id: R2
  rule_statement: The contract type decides who receives the Agency Invoice.
  rule_sources:
  - SHEET INV-8
  rule_decisions:
  - D-35
  - D-14
requirement_sources:
- SHEET INV-8
requirement_decisions:
- D-35
- D-14
