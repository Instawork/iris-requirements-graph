requirement_id: REQ-INVOICING-0004
requirement_target_layer: product
requirement_target_module: INVOICING
requirement_phase: P2
requirement_title: Show prior-period adjustments separately
requirement_statement: >-
  Corrections to earlier weeks appear in their own section of the invoice, apart from the current week's
  charges.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A change to the amounts of a line on an ISSUED invoice becomes an adjustment line on the OPEN
    invoice, pointing to the line it adjusts and carrying that line's Timesheet and work date.
  rule_sources:
  - SHEET INV-3
  - SHEET INV-5
  rule_decisions:
  - D-145
- rule_id: R2
  rule_statement: >-
    Each invoice shows its adjustment lines in their own section with their own total, apart from the
    current week's charges.
  rule_sources:
  - SHEET INV-3
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A line whose work date is before its invoice's week, such as a Timesheet approved late, is shown
    in that section as well.
  rule_sources:
  - SHEET INV-3
  - SHEET INV-5
  rule_decisions: []
requirement_sources:
- SHEET INV-3
requirement_decisions:
- D-145
requirement_features:
- INV-3
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-INVOICING-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-AUDIT-0001
data_model:
  status: covered
  reads:
  - InvoiceLine.agency_invoice_id
  - AgencyInvoice.status
  - InvoiceLine.work_date
  - ConsolidatedInvoice.week_start
  writes:
  - InvoiceLine.*
  detail: >-
    Creates each adjustment line with every required field; the caller gives the amounts of the
    difference.
requirement_starting_flow: false
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
