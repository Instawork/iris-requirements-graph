requirement_id: REQ-INVOICING-0004
requirement_target_layer: product
requirement_target_module: INVOICING
requirement_phase: P2
requirement_title: Show prior-period adjustments separately
requirement_statement: >-
  Corrections to earlier weeks appear in their own section of the invoice, apart from the current week's
  charges.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A correction to a line on an ISSUED invoice becomes an adjustment line on the OPEN invoice, pointing
    to the line it adjusts.
  rule_sources:
  - SHEET INV-3
  - DEMO InvoiceStatus
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Each invoice shows its adjustment lines in their own section with their own total, apart from the
    current week's charges.
  rule_sources:
  - SHEET INV-3
  rule_decisions: []
requirement_sources:
- SHEET INV-3
requirement_decisions: []
requirement_features:
