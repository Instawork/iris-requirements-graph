requirement_id: REQ-AGENCIES-0001
requirement_target_layer: product
requirement_target_module: AGENCIES
requirement_phase: MVP
requirement_title: Add an Agency
requirement_statement: >-
  A Program User adds each Agency that staffs Compass Shifts. Adding an Agency also invites its first
  Agency User.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: Only a Program User adds an Agency.
  rule_sources:
  - FEEDBACK Creating an agency in bulk
  rule_decisions:
  - D-53
- rule_id: R2
  rule_statement: >-
    An Agency needs a name that no other Agency has, and a duplicate name is refused.
  rule_sources: []
  rule_decisions:
  - D-54
- rule_id: R3
  rule_statement: >-
    Each new Agency needs a first contact with a first name, last name, and email; a phone number is optional.
  rule_sources:
  - DEMO lib/types.ts
  rule_decisions:
  - D-25
- rule_id: R4
  rule_statement: >-
    Adding an Agency invites its contact once through REQ-IDENTITY-0002 and then grants that User AGENCY_USER
    for the new Agency through REQ-ORG-0005.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-25
- rule_id: R7
  rule_statement: >-
    A Program User renames, deactivates, or reactivates an Agency; an inactive Agency keeps its records and receives
    no new Release.
  rule_sources: []
  rule_decisions:
  - D-53
requirement_sources:
- FEEDBACK Creating an agency in bulk
requirement_decisions:
- D-25
- D-53
- D-54
requirement_features: []
