requirement_id: REQ-AGENCIES-0010
requirement_target_layer: product
requirement_target_module: AGENCIES
requirement_phase: MVP
requirement_title: Load Agencies from a file
requirement_statement: >-
  A Program User loads many Agencies at once from an AGENCIES file, each with its first Agency User and
  the org nodes it is approved for. The rows become a Proposal, and nothing is saved until the Program
  User approves it.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: Only a Program User sends an AGENCIES file, with one row per Agency.
  rule_sources:
  - FEEDBACK Creating an agency in bulk
  rule_decisions:
  - D-53
- rule_id: R2
  rule_statement: >-
    Each row must give agency, contact_first_name, contact_last_name, and contact_email, and may give contact_phone
    and approved_for.
  rule_sources:
  - FEEDBACK Creating an agency in bulk
  - DEMO lib/types.ts
  rule_decisions:
  - D-25
- rule_id: R3
  rule_statement: >-
    Before the Proposal is shown, each row is checked without saving, its contact_phone against REQ-IDENTITY-0001.R3,
    its contact_email against REQ-IDENTITY-0002.R13, and each approved_for name as R5 says, and each failure
    is a row problem.
  rule_sources:
  - PRD §6 Uploads
  - PRD §7 What the agent checks
  rule_decisions:
  - D-141
- rule_id: R4
  rule_statement: >-
    A row that repeats an earlier row's agency is reported as a duplicate of that row.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    The approved_for column lists org node names separated by semicolons, and a name several org nodes share
    is a row problem whose candidates show each node with its path.
  rule_sources:
  - FEEDBACK Creating an agency in bulk
  rule_decisions:
  - D-9
  - D-54
- rule_id: R6
  rule_statement: >-
    An accepted row saves its Agency through REQ-AGENCIES-0001, which invites the contact once and grants
    them AGENCY_USER, and then approves each approved_for node through REQ-AGENCIES-0002.
  rule_sources:
  - FEEDBACK Creating an agency in bulk
  rule_decisions:
  - D-25
  - D-141
- rule_id: R7
  rule_statement: >-
    A row whose agency is already an Agency in Iris is a row problem whose fix drops the row, because an
    AGENCIES file adds Agencies and never changes one.
  rule_sources:
  - PRD §6 Uploads
  - FEEDBACK Creating an agency in bulk
  rule_decisions:
  - D-54
requirement_sources:
- FEEDBACK Creating an agency in bulk
- PRD §6 Uploads
requirement_decisions:
- D-9
- D-25
- D-53
- D-54
- D-141
requirement_features: []
edges:
