  requirement_id: REQ-AGENCIES-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENCIES-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-INTAKE-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENT-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
data_model:
  status: covered
  reads:
  - Agency.name
  - OrgNode.name
  - OrgNode.level
  - OrgNode.parent_id
  writes: []
  detail: >-
    Saves nothing itself: REQ-AGENCIES-0001 saves the Agency, REQ-IDENTITY-0002 the contact, and REQ-AGENCIES-0002
    the approvals, as saved_by says for each AGENCIES column in the catalog.
