requirement_title: Approve an Agency for part of the org
requirement_statement: >-
  A Program User approves an Agency at a Sector, Region, District, or Unit. Units under that scope may
  send Requests to it.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency without an approval covering a Unit is a non-contracted Agency for that Unit.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: Sending to a non-contracted Agency follows the off-contract gate.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Removing an approval stops new Releases to that Agency, and Shifts already released are unaffected.
  rule_sources: []
  rule_decisions: []
