requirement_id: REQ-DISPATCH-0002
requirement_target_layer: product
requirement_target_module: DISPATCH
requirement_phase: MVP
requirement_title: Accept or decline a Release
requirement_statement: >-
  An Agency User accepts or declines each Release sent to their Agency, and the Unit User who sent it
  is told. A Release nobody answers expires when the Shift starts.
requirement_actors:
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Before the Shift starts, an Agency User of the Release's Agency may accept a PENDING Release, which
    becomes ACCEPTED with responded_by and responded_at.
  rule_sources:
  - SHEET SC-8
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Before the Shift starts, an Agency User of the Release's Agency may decline a PENDING Release with
    a decline_reason, which becomes DECLINED with responded_by and responded_at.
  rule_sources:
  - SHEET SC-8
  rule_decisions:
  - D-17
- rule_id: R3
  rule_statement: >-
    An answer covers the Release's whole headcount; an Agency cannot accept part of it.
  rule_sources: []
  rule_decisions:
  - D-17
- rule_id: R4
  rule_statement: >-
    Until the Shift starts, an Agency User may decline an ACCEPTED Release with a decline_reason; it becomes
    DECLINED with responded_by and responded_at set again, and REQ-WORKFORCE-0016 then removes its ASSIGNED
    Workers.
  rule_sources: []
  rule_decisions:
  - D-17
- rule_id: R5
  rule_statement: >-
    An interval job of REQ-JOBS-0001 sets each Release still PENDING once its Shift's starts_at has passed
    to EXPIRED with closed_at set.
  rule_sources: []
  rule_decisions:
  - D-17
  - D-68
- rule_id: R6
  rule_statement: >-
    Only an answer, a withdrawal, a cancellation, or the Shift's start ends a PENDING Release; release
    windows between Agencies are Phase 2.
  rule_sources:
  - SHEET SC-12
  rule_decisions:
  - D-17
- rule_id: R7
  rule_statement: >-
    Each accept and each decline, including a decline after accepting, sends RELEASE_ANSWERED to the User
    who sent the Release.
  rule_sources:
  - SHEET SC-8
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    An Agency User may answer several PENDING Releases in one step, such as those of a block, and each
    Release is accepted or declined on its own.
  rule_sources: []
  rule_decisions:
  - D-20
- rule_id: R9
  rule_statement: >-
    An Agency User sees the Shift's whole headcount, their own Release's headcount, whether any other
    Agency holds a PENDING or ACCEPTED Release on the Shift, and the total headcount those hold.
  rule_sources:
  - SESSIONS Shift Creation
  - PRD §2 Shifts
  rule_decisions:
  - D-88
- rule_id: R10
  rule_statement: >-
    An Agency User never sees which other Agencies hold the Shift, or their rates, answers, or Workers.
  rule_sources: []
  rule_decisions:
  - D-88
requirement_sources:
- SHEET SC-8
- SESSIONS Shift Creation
requirement_decisions:
