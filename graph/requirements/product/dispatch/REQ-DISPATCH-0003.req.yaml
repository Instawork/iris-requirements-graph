requirement_id: REQ-DISPATCH-0003
requirement_target_layer: product
requirement_target_module: DISPATCH
requirement_phase: P2
requirement_title: Release Shifts by dispatch rules
requirement_statement: >-
  A Unit sets how its Shifts reach Agencies: one preferred Agency, several at once, or a release order
  that opens to all approved Agencies after a set time.
requirement_actors:
- UNIT_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User may set a DispatchRule for a Unit, for one Position or for all, with mode PREFERRED, SEVERAL,
    or RELEASE_ORDER and the Agencies it names.
  rule_sources:
  - SHEET SC-12
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Under RELEASE_ORDER, each next Agency receives the Shift after window_hours, 4 by default, and every
    approved Agency receives it after open_to_all_after_hours.
  rule_sources:
  - SHEET SC-12
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Agencies already holding the Shift keep it as later ones are added, and no further Agency receives
    it once it is FILLED.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    A rule may hold every Release until hold_until_hours_before hours before the Shift starts.
  rule_sources:
  - FAQ Levy releases shifts 72 hours before doors
  rule_decisions: []
requirement_sources:
- SHEET SC-12
- PRD §2 Shifts
- FAQ Levy releases shifts 72 hours before doors
requirement_decisions:
- D-17
- D-157
requirement_features:
- SC-12
edges:
