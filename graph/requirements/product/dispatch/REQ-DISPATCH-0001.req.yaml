requirement_id: REQ-DISPATCH-0001
requirement_target_layer: product
requirement_target_module: DISPATCH
requirement_phase: MVP
requirement_title: Send a Shift's headcount to a chosen Agency
requirement_statement: >-
  A Unit User picks one Agency and sends it some or all of a Shift's headcount. Each send is a Release
  that stores the Bill Rates it was sent at, and the Agency is notified.
requirement_actors:
- UNIT_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User over a Shift's Unit may send any part of its unsent headcount to one active Agency they
    choose, which creates a PENDING Release with released_by and released_at.
  rule_sources:
  - SHEET SC-7
  rule_decisions:
  - D-17
- rule_id: R2
  rule_statement: >-
    Unsent headcount is the Shift's headcount less the headcounts of its PENDING and ACCEPTED Releases;
    a Release's headcount is at least 1 and never more than the unsent headcount.
  rule_sources: []
  rule_decisions:
  - D-175
- rule_id: R3
  rule_statement: >-
    A new Release can be sent until the Shift starts; from then until its ends_at, headcount can only
    be added to an ACCEPTED Release.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-176
- rule_id: R4
  rule_statement: >-
    Sending more headcount to an Agency that already holds a PENDING or ACCEPTED Release on the Shift
    raises that Release's headcount and keeps its status and rates, so an ACCEPTED Release is not answered
    again.
  rule_sources:
  - SHEET SC-5
  rule_decisions:
  - D-175
- rule_id: R5
  rule_statement: >-
    The Release stores rate_line_id and the regular, overtime, and double-time Bill Rates of the contracted
    Rate Line that REQ-RATES-0005 finds for the Agency, Position, Unit, and work date.
  rule_sources:
  - SHEET SC-1
  - PRD Data Model
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A Unit User may enter another regular Bill Rate with a bill_rate_reason, and the Release then stores
    the overtime and double-time Bill Rates that REQ-RATES-0007 returns for it.
  rule_sources:
  - SHEET SC-1
  - SHEET RC-11
  - SESSIONS Rate Cards & Supplier Sourcing
  rule_decisions:
  - D-24
- rule_id: R7
  rule_statement: >-
    With no contracted Rate Line, rate_line_id is empty, the Unit User enters the regular Bill Rate and
    a bill_rate_reason, and the other two rates are those REQ-RATES-0007 returns.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-24
- rule_id: R8
  rule_statement: >-
    Before a Release is saved, REQ-RATES-0007 checks its Agency and regular Bill Rate under OFF_CONTRACT_RATE_GATE
    and NON_CONTRACTED_AGENCY_GATE, and a send it refuses saves nothing.
  rule_sources:
  - SHEET RC-11
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    non_contracted is set true when REQ-RATES-0007 finds no approval covering the Unit, and the reason
    it then requires is stored in non_contracted_reason, apart from any bill_rate_reason.
  rule_sources:
  - SHEET RC-11
  rule_decisions:
  - D-9
- rule_id: R10
  rule_statement: A Release keeps the rates it was sent at when Rate Lines change later.
  rule_sources:
  - SHEET SC-1
  rule_decisions:
  - D-211
- rule_id: R11
  rule_statement: >-
    Creating a Release, or raising its headcount, sends RELEASE_NEW to the Agency's active Agency Users.
  rule_sources:
  - SHEET SC-8
  rule_decisions: []
- rule_id: R12
  rule_statement: >-
    A Unit User over the Unit may withdraw a PENDING Release, which becomes WITHDRAWN with closed_at set
    and sends RELEASE_WITHDRAWN to the Agency's active Agency Users.
  rule_sources: []
  rule_decisions:
  - D-179
- rule_id: R13
  rule_statement: >-
    When REQ-ORDERING-0003 cancels a Shift, it calls this requirement, which sets each of the Shift's
    PENDING and ACCEPTED Releases to CANCELLED with closed_at and sends RELEASE_WITHDRAWN to each Agency's
    active Agency Users.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-180
- rule_id: R14
  rule_statement: >-
    The headcount of a DECLINED, WITHDRAWN, or EXPIRED Release is unsent again and can be sent in a new
    Release.
  rule_sources: []
  rule_decisions:
  - D-179
- rule_id: R15
  rule_statement: >-
    Several Shifts of one Request, such as a block, can be sent to one Agency in one step, and each
    Shift's Release is saved on its own, so a refused Shift stops no other.
  rule_sources:
  - SHEET SC-4
  rule_decisions:
  - D-184
- rule_id: R16
  rule_statement: >-
    A send asked for by a SHIFTS file row or an approved assistant draft is saved by this requirement
    under the same checks.
  rule_sources:
  - PRD §7 After the user approves
  rule_decisions: []
