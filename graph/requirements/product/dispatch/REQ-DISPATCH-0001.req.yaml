requirement_id: REQ-DISPATCH-0001
requirement_target_layer: product
requirement_target_module: DISPATCH
requirement_phase: MVP
requirement_title: Send a Shift to a chosen Agency
requirement_statement: >-
  The Unit User picks the Agency each Shift goes to and sends it. Each send creates a Release, and the
  Agency is notified at once.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Agencies approved for the Unit are offered, and sending to any other Agency follows the off-contract
    gate.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Shift can be released to more than one Agency, and each Agency staffs its own Workers.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The Release carries the Shift details, the site instructions, and the Agency's contracted Bill Rate.
  rule_sources: []
  rule_decisions: []
- rule_id: R4
  rule_statement: The Agency is notified by email or SMS, and in the app.
  rule_sources: []
  rule_decisions: []
