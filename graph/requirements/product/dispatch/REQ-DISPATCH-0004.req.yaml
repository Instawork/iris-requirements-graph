requirement_phase: P2
requirement_title: Show fill status for open Requests
requirement_statement: >-
  A Unit User sees every open Request with the headcount each Agency has filled and the time left before
  each Shift starts, without chasing notifications.
requirement_actors:
- UNIT_USER
