requirement_id: REQ-TIPS-0002
requirement_target_layer: product
requirement_target_module: TIPS
requirement_phase: MVP
requirement_title: Add and approve expenses
requirement_statement: >-
  An Agency User adds expenses the Agency paid for a Worker on a Shift, such as parking or a required
  background check. A Unit User approves or rejects each one, and approved expenses pass through at cost.
requirement_actors:
- AGENCY_USER
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency User adds an Expense to a DRAFT or REJECTED Timesheet of a Worker of their own Agency.
  rule_sources:
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-33
  - D-129
- rule_id: R2
  rule_statement: >-
    An Expense has a kind of PARKING, BACKGROUND_CHECK, or OTHER, an amount above zero, and a note,
    which is required when the kind is OTHER.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-70
- rule_id: R3
  rule_statement: >-
    An Expense is added one at a time in the app, from an EXPENSES file, or in the assistant as a
    Proposal of kind EXPENSE_ENTRY.
  rule_sources:
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    An EXPENSES row's Shift is the one with its shift_id, or else the single Shift at the named Unit
    on that date for that Position; REQ-WORKFORCE-0002 matches its Worker within the uploader's
    Agency.
  rule_sources:
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-216
- rule_id: R5
  rule_statement: >-
    A new Expense is PENDING with added_by_id set, and the Agency User can change or delete it while it is
    PENDING and its Timesheet is DRAFT or REJECTED.
  rule_sources:
  - GRAPH data model ApprovalStatus
  rule_decisions:
  - D-33
  - D-129
- rule_id: R6
  rule_statement: >-
    A Unit User whose scope covers the Shift's Unit approves or rejects each PENDING Expense on a SUBMITTED
    Timesheet, which sets decided_by_id and decided_at.
  rule_sources:
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A rejection needs a reason, saved as rejected_reason, and an APPROVED or REJECTED Expense is never
    changed.
  rule_sources:
  - GRAPH data model ApprovalStatus
  rule_decisions:
  - D-235
- rule_id: R8
  rule_statement: >-
    An APPROVED Expense passes through at its amount with no markup, and a REJECTED one adds nothing.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    A matched row points to the Timesheet of that Worker's Assignment on that Shift, or to its first
    part if split; a row with no single Shift, Worker, or Timesheet is a problem.
  rule_sources:
  - SHEET TS-12
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-216
- rule_id: R10
  rule_statement: >-
    An Agency User can ask the assistant to add one Expense to several Workers of a Shift; the
    EXPENSE_ENTRY Proposal lists one item for each Timesheet with the Worker, kind, amount, and note.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-215
- rule_id: R11
  rule_statement: >-
    A request for everyone who worked a Shift covers each DRAFT or REJECTED Timesheet of the Agency's
    Workers on it that is not a no-show; Timesheets in another status are left out and named.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-215
- rule_id: R12
  rule_statement: >-
    When the request does not fit exactly one Shift, or names a Worker who fits several Timesheets,
    Iris asks which before proposing anything, as REQ-AGENT-0003 requires.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions: []
- rule_id: R13
  rule_statement: >-
    Each accepted item is saved as a PENDING Expense under the same rules as one added in the app.
  rule_sources:
  - PRD §7 Agent Chat
  rule_decisions: []
- rule_id: R14
  rule_statement: >-
    An EXPENSES row or typed Expense that repeats a saved Expense or an earlier row in Timesheet,
    kind, and amount is a duplicate, whose suggested fix is to reject it.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions:
  - D-71
- rule_id: R15
  rule_statement: >-
    Deciding an Expense publishes the change, and REQ-TIME-0005 then checks its SUBMITTED Timesheet
    again, as REQ-TIME-0005.R1 requires; this requirement changes no Timesheet.
  rule_sources:
  - SHEET TS-7
  - SHEET TS-12
  rule_decisions: []
