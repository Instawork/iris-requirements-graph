requirement_id: REQ-TIPS-0004
requirement_target_layer: product
requirement_target_module: TIPS
requirement_phase: MVP
requirement_title: Split Tip Pools by hours and credit cashier PIN tips
requirement_statement: >-
  A Unit User enters a Tip Pool for a Unit and date, or one Shift or Event on it, and Iris splits it across
  Workers by minutes worked. A tip entered under a cashier PIN goes whole to the Worker that PIN is
  mapped to. A share is fixed once its Timesheet locks.
requirement_actors:
- UNIT_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User enters a Tip Pool for a Unit in their scope and a work date, with an amount above zero,
    optionally narrowed to one Shift or to one Event, never both.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-28
  - D-134
- rule_id: R2
  rule_statement: >-
    A pool is entered in the app, from a TIPS file, or in the assistant as a Proposal of kind TIP_ENTRY
    that shows each share before anything is saved.
  rule_sources:
  - SHEET TS-11
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A pool covers every Timesheet on a Shift at that Unit on that work date, narrowed to its Shift or
    Event when set, whatever the Agency or the Timesheet's status.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-134
- rule_id: R4
  rule_statement: >-
    A pool's open amount is its amount less its shares on locked Timesheets, each of which keeps the
    share it held when it locked.
  rule_sources:
  - SHEET TS-11
  - SHEET TS-9
  rule_decisions:
  - D-60
- rule_id: R5
  rule_statement: >-
    Each covered Timesheet that is not locked and has worked_minutes above 0 gets a share: the open amount
    times its worked_minutes divided by the worked_minutes of all such Timesheets, rounded down to the
    cent.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-60
  - D-142
- rule_id: R6
  rule_statement: >-
    Cents left over go one each to the shares with the largest dropped fractions, ties to the lowest
    Timesheet id, so the shares add up to the open amount exactly.
  rule_sources: []
  rule_decisions:
  - D-142
- rule_id: R7
  rule_statement: >-
    A covered Timesheet with no hours entered, or marked a no-show, has worked_minutes of 0 under
    REQ-TIME-0001.R7 and gets no share.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-60
- rule_id: R8
  rule_statement: Each share is a TipAllocation with tip_pool_id set.
  rule_sources:
  - SHEET TS-11
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    While no covered Timesheet that is not locked has worked_minutes above 0, the open amount is unallocated:
    it stays on the pool, is credited to no Timesheet, and adds nothing to spend.
  rule_sources: []
  rule_decisions:
  - D-60
- rule_id: R10
  rule_statement: >-
    Iris splits the open amount when the pool is entered, and again whenever the pool changes or a covered
    Timesheet's hours or no-show change, which REQ-TIME-0001.R15 publishes.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-60
- rule_id: R11
  rule_statement: >-
    When a Timesheet's change leaves unallocated an open amount that was shared before it, Iris sends
    TIP_NOT_CREDITED to every active Unit User whose scope covers the pool's Unit, naming the pool and
    the amount.
  rule_sources: []
  rule_decisions:
  - D-143
- rule_id: R12
  rule_statement: >-
    A Unit User can change or delete a Tip Pool or a PIN tip of a Unit in their scope.
  rule_sources: []
  rule_decisions:
  - D-28
  - D-140
- rule_id: R13
  rule_statement: >-
    Entering, changing, or deleting a Tip Pool is refused when a Timesheet it covers or would cover is
    locked, and so is a PIN tip whose Timesheet is locked.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-140
- rule_id: R14
  rule_statement: >-
    A Unit User maps a cashier PIN at a Unit in their scope to one Worker from valid_from until an optional
    valid_to.
  rule_sources:
  - SHEET 4.4
  rule_decisions:
  - D-136
- rule_id: R15
  rule_statement: >-
    A mapping is refused when the same PIN at that Unit is already mapped on any of its dates.
  rule_sources:
  - SHEET 4.4
  rule_decisions:
  - D-136
- rule_id: R16
  rule_statement: >-
    A Unit User may set or change the valid_to of a cashier PIN mapping in their scope, and its PIN,
    Worker, and valid_from never change.
  rule_sources:
  - SHEET 4.4
  rule_decisions:
  - D-136
- rule_id: R17
  rule_statement: >-
    A tip entered with a cashier PIN creates one TipAllocation, with cashier_pin_id set, for the whole
    amount on the Timesheet of that PIN's Worker at that Unit on that date.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-135
- rule_id: R18
  rule_statement: >-
    When that Worker has several Timesheets there on that date, the tip goes to the one on the
    earliest Shift among those neither a no-show nor locked, and to its first part if split.
  rule_sources: []
  rule_decisions:
  - D-252
- rule_id: R19
  rule_statement: >-
    A PIN tip is refused when no CashierPin is valid for that PIN, Unit, and date, or its Worker has
    no Timesheet there on that date that is neither a no-show nor locked.
  rule_sources: []
  rule_decisions:
  - D-252
- rule_id: R20
  rule_statement: >-
    When a Timesheet that holds a PIN tip becomes a no-show, the tip stays on it and counts as zero,
    and Iris sends TIP_NOT_CREDITED to the Unit Users R11 names.
  rule_sources: []
  rule_decisions:
  - D-143
  - D-144
- rule_id: R21
  rule_statement: >-
    In a TIPS file, a row with a cashier PIN is a PIN tip and every other row is a Tip Pool.
  rule_sources:
  - SHEET TS-11
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R22
  rule_statement: >-
    A TIPS row or typed pool that repeats a saved one or an earlier row in Unit, work date, Shift,
    Event, PIN, and amount is a duplicate, whose suggested fix is to reject it.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions:
  - D-72
