requirement_id: REQ-TIPS-0004
requirement_target_layer: product
requirement_target_module: TIPS
requirement_phase: MVP
requirement_title: Split Tip Pools by hours and credit cashier PIN tips
requirement_statement: >-
  A Unit User enters a Tip Pool for a Unit and date, or one Shift or Event on it, and Iris splits it across
  Workers by minutes worked. Scheduled minutes count until a Worker's hours are entered, and a share is
  fixed once its Timesheet locks. A tip entered under a cashier PIN goes whole to the Worker that PIN is
  mapped to.
requirement_actors:
- UNIT_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User enters a Tip Pool for a Unit in their scope and a work date, with an amount above zero,
    optionally narrowed to one Shift or to one Event, never both.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-28
  - D-126
- rule_id: R2
  rule_statement: >-
    A pool is entered in the app, from a TIPS file, or in the assistant as a TIP_ENTRY Proposal with one
    item per pool, whose summary lists each Worker's share before anything is saved.
  rule_sources:
  - SHEET TS-11
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A pool covers every Timesheet on a Shift at that Unit on that work date, narrowed to its Shift or
    Event when set, whatever the Agency or the Timesheet's status.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-126
- rule_id: R4
  rule_statement: >-
    A pool's open amount is its amount less its shares on locked Timesheets, each of which keeps the
    share it held when it locked.
  rule_sources:
  - SHEET TS-11
  - SHEET TS-9
  rule_decisions:
  - D-60
- rule_id: R5
  rule_statement: >-
    Each covered Timesheet that is not locked and has counted minutes (R7) gets a share: the open amount
    times those minutes divided by the counted minutes of all such Timesheets, rounded down to the cent.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-60
  - D-134
- rule_id: R6
  rule_statement: >-
    Cents left over go one each to the shares with the largest dropped fractions, ties to the lowest
    Timesheet id, so the shares add up to the open amount exactly.
  rule_sources: []
  rule_decisions:
  - D-134
- rule_id: R7
  rule_statement: >-
    A covered Timesheet's counted minutes are its worked_minutes once both clock times are entered, its
    Shift's scheduled minutes less the planned break until then, and 0 while it is a no-show.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-60
- rule_id: R8
  rule_statement: Each share is a TipAllocation with tip_pool_id set.
  rule_sources:
  - SHEET TS-11
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    While no covered Timesheet that is not locked has counted minutes, the open amount is unallocated:
    it stays on the pool, is credited to no Timesheet, and adds nothing to spend.
  rule_sources: []
  rule_decisions:
  - D-60
- rule_id: R10
  rule_statement: >-
    Iris splits the open amount when the pool is entered or changed, and whenever REQ-TIME-0001.R15
    publishes that a covered Timesheet was created or that its hours or no-show changed.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-60
- rule_id: R11
  rule_statement: >-
    When a Timesheet's change leaves unallocated an open amount that was shared before it, Iris sends
    TIP_NOT_CREDITED to every active Unit User whose scope covers the pool's Unit, naming the pool and
    the amount.
  rule_sources: []
  rule_decisions:
  - D-135
- rule_id: R12
  rule_statement: >-
    A Unit User can change or delete a Tip Pool or a PIN tip of a Unit in their scope.
  rule_sources: []
  rule_decisions:
  - D-28
  - D-132
- rule_id: R13
  rule_statement: >-
    Entering, changing, or deleting a Tip Pool is refused when a Timesheet it covers, would cover, or
    holds a share on is locked, and so is a PIN tip whose Timesheet is locked.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-132
- rule_id: R14
  rule_statement: >-
    A Unit User maps a cashier PIN at a Unit in their scope to one Worker from valid_from until an optional
    valid_to.
  rule_sources:
  - SHEET 4.4
  rule_decisions:
  - D-128
- rule_id: R15
  rule_statement: >-
    A mapping is refused when the same PIN at that Unit is already mapped on any of its dates.
  rule_sources:
  - SHEET 4.4
  rule_decisions:
  - D-128
- rule_id: R16
  rule_statement: >-
    A Unit User may set or change the valid_to of a cashier PIN mapping in their scope, and its PIN,
    Worker, and valid_from never change.
  rule_sources:
  - SHEET 4.4
  rule_decisions:
  - D-128
- rule_id: R17
  rule_statement: >-
    A Unit User enters a cashier PIN tip at a Unit in their scope, creating one TipAllocation, with
    cashier_pin_id set, for the whole amount on the Timesheet of that PIN's Worker there on that date.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-28
  - D-127
- rule_id: R18
  rule_statement: >-
    When that Worker has several Timesheets there on that date, the tip goes to the one on the
    earliest Shift among those neither a no-show nor locked, and to its first part if split.
  rule_sources: []
  rule_decisions:
  - D-234
- rule_id: R19
  rule_statement: >-
    A PIN tip is refused when no CashierPin is valid for that PIN, Unit, and date, or its Worker has
    no Timesheet there on that date that is neither a no-show nor locked.
  rule_sources: []
  rule_decisions:
  - D-234
- rule_id: R20
  rule_statement: >-
    When a Timesheet that holds a PIN tip becomes a no-show, the tip stays on it and counts as zero,
    and Iris sends TIP_NOT_CREDITED to the Unit Users R11 names.
  rule_sources: []
  rule_decisions:
  - D-135
  - D-136
- rule_id: R21
  rule_statement: >-
    In a TIPS file, a row with a cashier PIN is a PIN tip and every other row is a Tip Pool.
  rule_sources:
  - SHEET TS-11
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R22
  rule_statement: >-
    A TIPS row or typed pool that repeats a saved one or an earlier row in Unit, work date, Shift,
    Event, PIN, and amount is a duplicate, whose suggested fix is to reject it.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions:
  - D-71
- rule_id: R23
  rule_statement: >-
    When REQ-ORDERING-0011 attaches a Shift to an Event, moves it to another, or detaches it, Iris splits
    again the open amount of every pool narrowed to either Event on the Shift's work date.
  rule_sources:
  - SHEET TS-11
  - SHEET REP-2
  rule_decisions:
  - D-242
- rule_id: R24
  rule_statement: >-
    After such a change a Timesheet the pool no longer covers loses its share unless it is locked, and
    a locked Timesheet the pool now covers gets none.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-242
- rule_id: R25
  rule_statement: >-
    When REQ-TIME-0007 locks a covered Timesheet while another, not a no-show, lacks a clock time, Iris
    sends TIP_HOURS_MISSING to the Unit Users R11 names, naming the pool and the Workers whose hours are
    missing.
  rule_sources:
  - SHEET TS-11
  - SHEET TS-9
  rule_decisions:
  - D-60
  - D-135
- rule_id: R26
  rule_statement: >-
    TIP_HOURS_MISSING is sent at most once for a pool: sending it sets the pool's hours_missing_notified_at,
    and a pool that has it set sends none.
  rule_sources: []
  rule_decisions:
  - D-135
