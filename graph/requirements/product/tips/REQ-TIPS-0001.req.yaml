data_model:
  status: covered
  reads:
  - Timesheet.assignment_id
  - Timesheet.split_from_id
  - Timesheet.worked_minutes
  - Timesheet.clock_in
  - Timesheet.status
  - Timesheet.locked_at
  - Assignment.worker_id
  - Assignment.release_id
  - Release.shift_id
  - Shift.request_id
  - Shift.starts_at
  - Shift.event_id
  - Request.unit_id
  - Event.unit_id
  - Event.name
  - Unit.org_node_id
  - Unit.timezone
  - OrgNode.name
  - Worker.agency_id
  - Timesheet.no_show
  writes:
  - TipPool.*
  - CashierPin.*
  - TipAllocation.*
  detail: >-
    Timesheet.locked_at is set by REQ-TIME-0007, which depends on this requirement and is built after
    it; until then it is always empty, and the lock rules here have nothing to refuse.
