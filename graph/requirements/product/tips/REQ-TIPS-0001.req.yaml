requirement_id: REQ-TIPS-0001
requirement_target_layer: product
requirement_target_module: TIPS
requirement_phase: MVP
requirement_title: Hold each Timesheet's tips and take the tips an Agency enters
requirement_statement: >-
  Every tip is an allocation on one Timesheet and passes through at cost. An Agency User enters a Worker's
  own tip on the Timesheet, in the app or by chat. No tip changes once its Timesheet locks.
requirement_actors:
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R14
  rule_statement: >-
    An Agency User enters, changes, or removes a tip for a Worker of their own Agency on a DRAFT or REJECTED
    Timesheet, as a TipAllocation with no pool and no PIN.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-28
  - D-137
  - D-33
- rule_id: R15
  rule_statement: >-
    A Timesheet's tips are the sum of its TipAllocations, counted as zero while it is a no-show, and
    pass through at that amount with no markup.
  rule_sources:
  - PRD §5 Invoices
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-144
- rule_id: R17
  rule_statement: >-
    No TipAllocation is added to, changed on, or removed from a locked Timesheet, and any action that
    would do so is refused.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-33
- rule_id: R18
  rule_statement: >-
    A typed tip that repeats a tip an Agency User already saved on the same Timesheet for the same
    amount is a duplicate, whose suggested fix is to reject it.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions:
  - D-72
- rule_id: R19
  rule_statement: >-
    An Agency User can also ask the assistant to enter a Worker's tip; the TIP_ENTRY Proposal lists
    each Timesheet and amount, and accepted items are saved under R14.
  rule_sources:
  - SHEET TS-11
  - PRD §7 Who uses it
  rule_decisions:
  - D-28
- rule_id: R20
  rule_statement: >-
    This requirement registers the TIP_ENTRY save step, which saves an Agency User's tip under R14 and
    hands a Tip Pool item to REQ-TIPS-0004 once that requirement registers for it.
  rule_sources:
  - GRAPH two requirements propose tips, and a Proposal kind has one save step
  rule_decisions:
  - D-146
