requirement_id: REQ-TIPS-0001
requirement_target_layer: product
requirement_target_module: TIPS
requirement_phase: MVP
requirement_title: Enter tips in bulk or by chat and split them by hours
requirement_statement: >-
  A Unit User enters a Tip Pool for a Unit and date, or one Shift or Event on it, and Iris splits it across
  Workers by minutes worked. Tips pass through at cost.
requirement_actors:
- UNIT_USER
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User enters a Tip Pool for a Unit in their scope and a work date, with an amount above zero,
    optionally narrowed to one Shift or to one Event, never both.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-28
- rule_id: R2
  rule_statement: >-
    A pool is entered in the app, from a TIPS file, or in the assistant as a Proposal of kind TIP_ENTRY
    that shows each share before anything is saved.
  rule_sources:
  - SHEET TS-11
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A pool covers every Timesheet with worked_minutes above 0 on a Shift at that Unit with that work date,
    narrowed to its Shift or Event when set, whatever the Agency.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-28
- rule_id: R4
  rule_statement: >-
    Each covered Timesheet's share is the pool amount times its worked_minutes divided by the covered
    worked_minutes in total, rounded down to the cent.
  rule_sources:
  - SHEET TS-11
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Cents left over go one each to the shares with the largest dropped fractions, ties to the lowest Timesheet
    id, so the shares add up to the pool amount exactly.
  rule_sources: []
  rule_decisions:
  - D-60
- rule_id: R6
  rule_statement: >-
    Each share is a TipAllocation with tip_pool_id set; a pool whose covered Timesheets have no worked_minutes
    yet has no shares until hours are entered.
  rule_sources:
  - GRAPH data model TipAllocation
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    Iris recomputes a pool's shares whenever a covered Timesheet's worked_minutes change or the pool changes,
    until any covered Timesheet locks; from then on the shares stay fixed.
  rule_sources: []
  rule_decisions:
  - D-33
  - D-60
- rule_id: R8
  rule_statement: >-
    A Unit User can change or delete a Tip Pool or a PIN tip in their scope until a Timesheet it covers
    locks.
  rule_sources: []
  rule_decisions:
  - D-28
  - D-60
- rule_id: R9
  rule_statement: >-
    A Unit User maps a cashier PIN at a Unit in their scope to one Worker from valid_from until an optional
    valid_to; a PIN already mapped on any of those dates is refused.
  rule_sources:
  - SHEET 4.4
  rule_decisions:
  - D-28
  - D-60
- rule_id: R10
  rule_statement: >-
    A tip entered with a cashier PIN creates one TipAllocation, with cashier_pin_id set, for the whole
    amount on the Timesheet of that PIN's Worker at that Unit on that date.
  rule_sources:
  - SHEET TS-11
  rule_decisions:
  - D-28
- rule_id: R11
  rule_statement: >-
    When that Worker has several Timesheets there on that date, the tip goes to the one on the earliest
    Shift, and to its first part if split.
  rule_sources: []
  rule_decisions:
  - D-28
  - D-60
- rule_id: R12
  rule_statement: >-
    A PIN tip is refused when no CashierPin is valid for that PIN, Unit, and date, or its Worker has no
    Timesheet there on that date.
  rule_sources: []
  rule_decisions:
  - D-28
  - D-60
- rule_id: R13
  rule_statement: >-
    In a TIPS file, a row with a cashier PIN is a PIN tip and every other row is a Tip Pool.
  rule_sources:
  - SHEET TS-11
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R14
  rule_statement: >-
    An Agency User enters, changes, or removes a tip for a Worker of their own Agency on a DRAFT or REJECTED
    Timesheet, as a TipAllocation with no pool and no PIN.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-28
  - D-33
- rule_id: R15
  rule_statement: >-
    A Timesheet's tips are the sum of its TipAllocations, and pass through at that amount with no markup.
  rule_sources:
  - PRD §5 Invoices
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
requirement_sources:
- SHEET TS-11
- SHEET 4.4
- SESSIONS Timesheets, Tips & Expenses
- PRD §5 Invoices
