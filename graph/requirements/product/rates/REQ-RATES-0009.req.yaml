requirement_id: REQ-RATES-0009
requirement_target_layer: product
requirement_target_module: RATES
requirement_phase: MVP
requirement_title: Submit Rate Lines and approve them before they price work
requirement_statement: >-
  Every Rate Line enters Iris through this requirement. An Agency User's line waits as PENDING until a
  Program User approves it or sends it back, and a Program User's own line is APPROVED at once.
requirement_actors:
- AGENCY_USER
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency User submits Rate Lines only for their own Agency, and a Program User submits them for any
    Agency (C-13).
  rule_sources:
  - SHEET RC-4
  - SHEET Decisions & Inputs
  - SESSIONS Rate Cards & Supplier Sourcing
  rule_decisions:
  - D-10
- rule_id: R2
  rule_statement: >-
    A submitted line must pass every check in REQ-RATES-0001, or it is not saved.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A line an Agency User submits is saved as PENDING, and RATE_LINE_PENDING is sent to every active Program
    User for each line, including each accepted row of a file.
  rule_sources:
  - SESSIONS Rate Cards & Supplier Sourcing
  rule_decisions:
  - D-10
- rule_id: R4
  rule_statement: >-
    A line a Program User submits is saved as APPROVED, with no second approval.
  rule_sources:
  - SHEET RC-4
  rule_decisions:
  - D-10
- rule_id: R5
  rule_statement: >-
    Only a Program User approves a PENDING line or sends it back, and sending back requires a reason;
    either way the line records the reviewer and the time.
  rule_sources:
  - SESSIONS Rate Cards & Supplier Sourcing
  - DEMO lib/types.ts
  rule_decisions:
  - D-10
- rule_id: R6
  rule_statement: >-
    When a PENDING line is approved or sent back, RATE_LINE_DECIDED is sent to the User who submitted
    it, with the reason if it was sent back.
  rule_sources: []
  rule_decisions:
  - D-10
- rule_id: R7
  rule_statement: >-
    A SENT_BACK line never changes again, and the submitter answers it by submitting a new line.
  rule_sources: []
  rule_decisions:
  - D-10
- rule_id: R8
  rule_statement: >-
    A line becomes APPROVED only if its effective_from is on or after the effective_from of every APPROVED
    line for the same Agency, Position, and Market or Unit that prices at least one date.
  rule_sources: []
  rule_decisions:
  - D-55
  - D-77
- rule_id: R9
  rule_statement: >-
    When a line becomes APPROVED, the APPROVED line in effect on its effective_from for the same Agency,
    Position, and Market or Unit gets that date as its effective_to, and the new line's replaces_id names
    it.
  rule_sources:
  - SHEET RC-5
  - DEMO lib/types.ts
  rule_decisions:
  - D-10
  - D-55
- rule_id: R10
  rule_statement: >-
    Once saved, a line's Agency, Position, Market or Unit, rates, effective_from, and change_reason never
    change, and its effective_to changes only when a later line replaces it or a Program User ends it.
  rule_sources:
  - SHEET RC-5
  rule_decisions:
  - D-77
- rule_id: R11
  rule_statement: Each line records who submitted it and the channel it came through.
  rule_sources:
  - SHEET RC-5
  rule_decisions: []
- rule_id: R12
  rule_statement: >-
    A line submitted while an APPROVED line exists for the same Agency, Position, and Market or Unit must
    give a change_reason, or it is not saved; a first line needs none.
  rule_sources:
  - SHEET RC-5
  rule_decisions: []
- rule_id: R13
  rule_statement: >-
    A line whose six rates equal those of the APPROVED line in effect on its effective_from for the same
    Agency, Position, and Market or Unit is refused as unchanged.
  rule_sources:
  - SHEET RC-5
  rule_decisions:
  - D-192
- rule_id: R14
  rule_statement: >-
    A Program User ends an APPROVED line that has no effective_to by setting effective_to on or after
    its effective_from, with an end_reason; a line ended on its effective_from never prices work.
  rule_sources:
  - SHEET RC-5
  rule_decisions:
  - D-77
- rule_id: R15
  rule_statement: >-
    When a line that answers a Rate Review is approved or sent back, REQ-RATES-0008 updates that review.
  rule_sources:
  - SHEET RC-12
  rule_decisions:
  - D-10
- rule_id: R16
  rule_statement: >-
    A RATE_LINE_PENDING or RATE_LINE_DECIDED message names the line's Agency, Position, Market or Unit,
    regular Bill Rate, and effective_from, and RATE_LINE_PENDING also names who submitted it.
  rule_sources: []
  rule_decisions:
  - D-10
  - D-253
requirement_sources:
- SESSIONS Rate Cards & Supplier Sourcing
- SHEET RC-4
- SHEET RC-5
