requirement_id: REQ-RATES-0002
requirement_target_layer: product
requirement_target_module: RATES
requirement_phase: MVP
requirement_title: Load Rate Lines in bulk
requirement_statement: >-
  An Agency User or a Program User loads many Rate Lines at once from a RATE_CARD file. The rows become
  a Proposal, and each accepted row is submitted as a Rate Line.
requirement_actors:
- AGENCY_USER
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A RATE_CARD file has one row per Agency, Position, and Market or Unit, and each row must give the
    position, all six rates, and effective_from.
  rule_sources:
  - SHEET RC-4
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    An Agency User's rows are for their own Agency, and a Program User's rows must name the Agency in
    the agency column (C-13).
  rule_sources:
  - FEEDBACK
  rule_decisions:
  - D-10
- rule_id: R3
  rule_statement: >-
    A row names a Market by city and state, or a Unit by unit; a row that gives both, or neither, is a
    row problem.
  rule_sources:
  - PRD §6 Templates
  - SHEET RC-6
  rule_decisions:
  - D-1
  - D-21
- rule_id: R4
  rule_statement: >-
    An agency, a city and state, a unit, or a position that does not match exactly one record is a row
    problem and never creates one.
  rule_sources:
  - PRD §7 Agent Chat
  rule_decisions:
  - D-21
- rule_id: R5
  rule_statement: >-
    Markup and ZIP code columns are ignored, because Markup is computed and ZIP codes belong to the Market
    (C-14).
  rule_sources:
  - FEEDBACK
  rule_decisions:
  - D-11
  - D-21
- rule_id: R6
  rule_statement: >-
    Each row is checked against REQ-RATES-0001 before the Proposal is shown, and a failing row lists the
    check it failed.
  rule_sources:
  - PRD §7 Agent Chat
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    Rows in one file with the same Agency, Position, Market or Unit, and effective_from are all row problems.
  rule_sources:
  - PRD §7 Agent Chat
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    Each accepted row is submitted through REQ-RATES-0009 in the uploader's name with FILE_UPLOAD as its
    channel, so it is PENDING for an Agency User and APPROVED for a Program User.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-10
requirement_sources:
- SHEET RC-4
- PRD §6 Templates
- FEEDBACK
requirement_decisions:
- D-10
requirement_features:
- RC-4
