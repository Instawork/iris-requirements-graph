requirement_id: REQ-RATES-0004
requirement_target_layer: product
requirement_target_module: RATES
requirement_phase: MVP
requirement_title: Price a Position for one Unit
requirement_statement: >-
  A Rate Line can price a Position at one Unit instead of in a Market. It then applies only to work at
  that Unit.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: A Unit Rate Line names one Unit that exists and no Market.
  rule_sources:
  - SHEET RC-6
  rule_decisions:
  - D-1
- rule_id: R2
  rule_statement: >-
    A Unit Rate Line passes the same checks and the same submission, approval, and effective dating as
    a Market Rate Line.
  rule_sources:
  - SHEET RC-6
  rule_decisions:
  - D-1
  - D-10
- rule_id: R3
  rule_statement: >-
    A Unit Rate Line replaces only an earlier line for the same Agency, Position, and Unit, never a Market
    Rate Line.
  rule_sources: []
  rule_decisions:
  - D-1
requirement_sources:
- SHEET RC-6
requirement_decisions:
- D-1
requirement_features:
- RC-6
