requirement_id: REQ-RATES-0006
requirement_target_layer: product
requirement_target_module: RATES
requirement_phase: MVP
requirement_title: Flag rate variance at booking and on Timesheets
requirement_statement: >-
  When the Bill Rate on a Shift or a Timesheet differs from the contracted rate, Iris flags it with both
  rates, the difference, and the reason.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: A Unit User who changes a Shift's Bill Rate must give a reason.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Timesheet billed at a rate different from the contracted rate is flagged before approval and stays
    flagged after it.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Each flag links to the Rate Line, the Shift, and the person who set the rate.
  rule_sources: []
  rule_decisions: []
