requirement_id: REQ-RATES-0006
requirement_target_layer: product
requirement_target_module: RATES
requirement_phase: MVP
requirement_title: Flag rate variance at booking and on Timesheets
requirement_statement: >-
  Iris compares the Bill Rates used when a Shift is sent, or billed on a Timesheet, with the contracted
  rate. A difference is flagged with both rates and the amount.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Given an Agency, Position, Unit, work date, and Bill Rates, the check compares each given rate with
    the same rate on the contracted Rate Line.
  rule_sources:
  - SHEET RC-10
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A given Bill Rate that differs from the contracted one, higher or lower, is a rate variance.
  rule_sources:
  - SHEET RC-10
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The result names the contracted Rate Line and, for each differing rate, the contracted rate, the rate
    used, and the difference in dollars.
  rule_sources:
  - SHEET RC-10
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    When no contracted rate exists, the result is off-contract and shows no difference.
  rule_sources:
  - SHEET RC-11
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    The check uses the work date both when a Shift is sent and on its Timesheets, and a variance stays
    flagged after the Timesheet is approved.
  rule_sources:
  - SHEET RC-10
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A flag raised when a Shift is sent shows the reason the Unit User gave for the rate (C-16).
  rule_sources:
  - SHEET RC-10
  - SHEET SC-1
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    Program Users see every rate variance flag, and a Unit User sees the flags on Shifts and Timesheets
    of the Units their grant covers.
  rule_sources:
  - SHEET Decisions & Inputs
  rule_decisions:
  - D-2
requirement_sources:
- SHEET RC-10
requirement_decisions:
- D-2
requirement_features:
- RC-10
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-RATES-0005
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
data_model:
  status: covered
  reads:
  - RateLine.*
  writes: []
  detail: >-
    Reads only and returns its result to the caller. The rates and reasons it compares are passed in by
    the caller and kept on Release and Timesheet by the requirements that own them. R5 is gone and its id
    is not reused: a Timesheet never bills a rate other than its Release's (D-69).
requirement_starting_flow: true
