requirement_id: REQ-CATALOG-0003
requirement_target_layer: product
requirement_target_module: CATALOG
requirement_phase: P2
requirement_title: Map each Agency's titles to Positions
requirement_statement: >-
  Each Agency's own titles map to Compass Positions, so a Unit orders a Bartender and never sees an Agency's
  name for the job.
requirement_actors:
- AGENCY_USER
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A mapping ties one title used by one Agency to one Position, and an Agency has one mapping per title.
  rule_sources:
  - SHEET RC-1
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    When a file for an Agency uses a title with no mapping, Iris proposes a Position and the User who
    sent the file confirms or changes it.
  rule_sources:
  - SHEET RC-1
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A confirmed mapping is applied without asking to later files for that Agency.
  rule_sources:
  - SHEET RC-1
  rule_decisions: []
- rule_id: R4
  rule_statement: Unit Users see only Compass Position names, never an Agency's title.
  rule_sources:
  - SHEET RC-1
  rule_decisions: []
requirement_sources:
- SHEET RC-1
requirement_decisions: []
requirement_features:
- RC-1
