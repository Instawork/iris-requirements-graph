requirement_id: REQ-CATALOG-0001
requirement_target_layer: product
requirement_target_module: CATALOG
requirement_phase: MVP
requirement_title: Hold the Compass Position catalog
requirement_statement: >-
  Iris holds one catalog of Positions in Compass's own names, loaded and kept by Instawork Admins. Every
  Shift, Rate Line, and Credential Requirement names a Position from it.
requirement_actors:
- INSTAWORK_ADMIN
requirement_rules:
- rule_id: R1
  rule_statement: Only an Instawork Admin adds, renames, deactivates, or reactivates a Position.
  rule_sources:
  - PRD §6 Position list
  rule_decisions:
  - D-26
- rule_id: R2
  rule_statement: Two Positions never share a name.
  rule_sources:
  - SHEET RC-2
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    At each start an empty catalog gets, as active Positions, Server, Banquet server, Bartender, Barback,
    Line cook, Prep cook, Dishwasher, Food runner, Busser, Cashier, Barista, Concessions attendant, Event
    staff, Porter, and Housekeeper (I-7).
  rule_sources:
  - PRD §6 Position list
  - SHEET RC-2
  rule_decisions:
  - D-26
  - D-98
- rule_id: R4
  rule_statement: >-
    An inactive Position cannot be chosen for a new Shift or a new Rate Line, and records that already
    name it are unchanged.
  rule_sources:
  - GRAPH a retired Position stays on past records
  rule_decisions:
  - D-26
- rule_id: R5
  rule_statement: >-
    Unit Users and Agency Users choose Positions from the catalog and cannot add one.
  rule_sources:
  - PRD Data Model
  - PRD §3 Supplier Rates
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A title in a file that equals no Position name is a row problem and never adds a Position.
  rule_sources:
  - PRD §7 What the agent checks
  - PRD §6 Position list
  rule_decisions: []
requirement_sources:
- SHEET RC-2
- PRD §6 Position list
requirement_decisions:
- D-26
- D-98
