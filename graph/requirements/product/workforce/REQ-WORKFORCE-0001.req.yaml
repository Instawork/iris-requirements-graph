requirement_id: REQ-WORKFORCE-0001
requirement_target_layer: product
requirement_target_module: WORKFORCE
requirement_phase: MVP
requirement_title: Hold each Agency's Worker roster
requirement_statement: >-
  Each Agency keeps its Workers in Iris. A Worker belongs to one Agency, so one person at two Agencies
  is two Workers.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency User may add a Worker to their own Agency, and created_via records the Channel the Worker
    came through.
  rule_sources:
  - SHEET WA-1
  - PRD §4 Professionals
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Worker needs a first name and a last name; email, phone, city, Positions, and photo are optional.
  rule_sources:
  - PRD §6 Templates
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-50
- rule_id: R3
  rule_statement: >-
    Within one Agency no two Workers share an email or share a phone, and a save that would break this
    is refused.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    A Worker belongs to exactly one Agency, and the same person at two Agencies is two Workers.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A requirement that reads a name from a file or a typed request and matches no Worker of the Agency creates
    the Worker here, with a first and last name, once the User approves.
  rule_sources:
  - PRD §4 Professionals
  - FEEDBACK OCR to match paper timesheets
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    An Agency User may change the details of their Agency's Workers and set active to false or true; an
    inactive Worker cannot be assigned.
  rule_sources:
  - SHEET WA-1
  rule_decisions:
  - D-189
- rule_id: R8
  rule_statement: >-
    A Worker's Positions are informational and do not limit the Shifts the Worker can be assigned to.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    A Unit User sees a Worker's name, photo, and Agency, and never their email or phone.
  rule_sources:
  - PRD §2 Shifts
  - PRD §4 Professionals
  rule_decisions:
  - D-91
- rule_id: R11
  rule_statement: >-
    When a Worker is made inactive, REQ-WORKFORCE-0016 reacts by taking them off the Shifts they are
    assigned to that have not started; this requirement changes no Assignment.
  rule_sources: []
  rule_decisions:
  - D-89
- rule_id: R13
  rule_statement: >-
    A Worker's phone is accepted in the forms REQ-IDENTITY-0001.R3 accepts.
  rule_sources:
  - PRD §6 Templates
  rule_decisions:
  - D-144
- rule_id: R14
  rule_statement: >-
    A photo is a JPEG or PNG file stored through REQ-INTAKE-0001, and photo_url holds its reference.
  rule_sources: []
  rule_decisions:
  - D-236
- rule_id: R15
  rule_statement: >-
    A Worker's photo may be opened only by an Agency User of the Worker's Agency, a Program User, and
    a Unit User who sees the Worker under R10.
  rule_sources: []
  rule_decisions:
  - D-91
  - D-142
requirement_sources:
