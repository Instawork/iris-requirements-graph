requirement_id: REQ-WORKFORCE-0001
requirement_target_layer: product
requirement_target_module: WORKFORCE
requirement_phase: MVP
requirement_title: Hold each Agency's Worker roster
requirement_statement: >-
  Each Agency keeps its Workers in Iris. In MVP a Worker belongs to one Agency, so one person at two Agencies
  is two Workers.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Worker has a first name, last name, email, and phone, and optionally a city and the Positions they
    work.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    An Agency User adds Workers one at a time, from a file, or from new names in a Timesheet file.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Every new name is matched against existing Workers before anyone is created.
  rule_sources: []
  rule_decisions: []
