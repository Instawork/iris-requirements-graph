requirement_id: REQ-WORKFORCE-0001
requirement_target_layer: product
requirement_target_module: WORKFORCE
requirement_phase: MVP
requirement_title: Hold each Agency's Worker roster
requirement_statement: >-
  Each Agency keeps its Workers in Iris, added one at a time or from a WORKERS file. A Worker belongs
  to one Agency, so one person at two Agencies is two Workers.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency User may add Workers to their own Agency one at a time or from a WORKERS file, and created_via
    records the Channel.
  rule_sources:
  - SHEET WA-1
  - PRD §4 Professionals
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Worker needs a first name and a last name; email, phone, city, Positions, and photo are optional.
  rule_sources:
  - PRD §6 Templates
  - FEEDBACK
  rule_decisions:
  - D-50
- rule_id: R3
  rule_statement: >-
    Email is stored lowercase and phone as digits only; within one Agency no two Workers share an email
    or share a phone, and a save that would break this is refused.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    A Worker belongs to exactly one Agency, and the same person at two Agencies is two Workers.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Each WORKERS row is matched under REQ-WORKFORCE-0002; a row that matches an existing Worker proposes
    changes to that Worker, and only an unmatched row proposes a new one.
  rule_sources:
  - PRD §7 What the agent checks
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A Worker named in a SHIFTS or Timesheet file who matches no Worker of the Agency is created here,
    with at least a name, once the uploader approves.
  rule_sources:
  - PRD §4 Professionals
  - FEEDBACK
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    An Agency User may change the details of their Agency's Workers and set active to false or true; an
    inactive Worker cannot be assigned.
  rule_sources:
  - SHEET WA-1
  rule_decisions:
  - D-50
- rule_id: R8
  rule_statement: >-
    A Worker's Positions are informational and do not limit the Shifts the Worker can be assigned to.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    In a WORKERS row, positions are looked up by Position name, separated by semicolons, and a name that
    matches no Position is a problem.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    A Unit User sees a Worker's name, photo, and Agency, and never their email or phone.
  rule_sources:
  - PRD §2 Shifts
  - PRD §4 Professionals
  rule_decisions:
  - D-52
requirement_sources:
- SHEET WA-1
- PRD §4 Professionals
- PRD §6 Templates
requirement_decisions:
