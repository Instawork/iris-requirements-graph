requirement_id: REQ-WORKFORCE-0003
requirement_target_layer: product
requirement_target_module: WORKFORCE
requirement_phase: MVP
requirement_title: Assign named Workers to an accepted Release
requirement_statement: >-
  An Agency User assigns their Agency's own Workers to a Shift through a Release it accepted, and can
  swap or remove them. The Unit sees each assigned Worker by name, with their Agency.
requirement_actors:
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency User may assign a Worker of their own Agency to a Shift only through their Agency's ACCEPTED
    Release on it, until the Shift's ends_at.
  rule_sources:
  - SHEET WA-1
  - PRD §2 Shift statuses
  rule_decisions:
  - D-164
- rule_id: R2
  rule_statement: >-
    A Release never holds more ASSIGNED Workers than its headcount, and a Worker has at most one ASSIGNED
    Assignment on a Shift.
  rule_sources: []
  rule_decisions:
  - D-157
- rule_id: R3
  rule_statement: >-
    An assignment is refused, with the reason shown, when the Worker is inactive, belongs to another Agency,
    or is rated BLOCK by the Shift's Unit.
  rule_sources:
  - SHEET WA-3
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    An assignment is refused when REQ-COMPLIANCE-0005 does not find the Worker eligible for the Shift,
    and the Credential Types not met are shown.
  rule_sources:
  - SHEET WA-13
  - SESSIONS Worker Assignment & Compliance
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Before an assignment is saved, REQ-LABOR-0003 is given the Worker's ASSIGNED Shifts at every Unit
    with work dates within six days of this Shift's, at scheduled minutes less planned breaks, with and
    without this Shift.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
  - D-133
- rule_id: R6
  rule_statement: >-
    When REQ-LABOR-0003 answers to refuse, as REQ-LABOR-0003.R6 says it does for overtime under
    OVERTIME_HARD_BLOCK, the assignment is not saved; otherwise it is saved.
  rule_sources:
  - SHEET WA-19
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    Workers are assigned in the app, by SHIFTS file rows, or by a typed request under REQ-WORKFORCE-0018;
    every channel passes the same checks, and assigned_via records it.
  rule_sources:
  - PRD §6 Templates
  - PRD §7 Who uses it
  - PRD §7 Opening screen
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    A caller that assigns from a file or a typed request passes the Worker it matched, or created through
    REQ-WORKFORCE-0001, and this requirement matches no name.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    Until the Shift's ends_at, an Agency User may remove their Agency's ASSIGNED Worker; the Assignment
    becomes REMOVED with REMOVED_BY_AGENCY, removed_by, and removed_at.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    An Agency User may swap an ASSIGNED Worker for another in one step: the old Assignment becomes REMOVED
    with SWAPPED, removed_by, removed_at, and replaced_by_id, and the new one must pass every check.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  rule_decisions: []
- rule_id: R16
  rule_statement: >-
    WORKER_ASSIGNED goes to every active Unit User over the Shift's Unit when an Assignment becomes
    ASSIGNED, and WORKER_REMOVED when one becomes REMOVED for any reason except SHIFT_CANCELLED or
    NOT_ELIGIBLE.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-149
- rule_id: R17
  rule_statement: >-
    Unit Users over the Shift's Unit see each ASSIGNED Worker's name and Agency.
  rule_sources:
  - PRD §2 Shifts
  - SHEET WA-1
  rule_decisions: []
- rule_id: R19
  rule_statement: >-
    instructions_sent_at holds the time the Shift's site instructions were last sent to the Worker for
    that Assignment.
  rule_sources:
  - SHEET SC-6
  rule_decisions: []
- rule_id: R20
  rule_statement: >-
    After a Shift ends, a Worker is assigned only when a Timesheet names a Worker of the Agency who has
    no Assignment on it, and that Assignment may exceed the Release's headcount.
  rule_sources: []
  rule_decisions:
  - D-164
  - D-19
- rule_id: R21
  rule_statement: >-
    When REQ-LABOR-0003 allows an assignment that adds overtime, the answer to the assigning User names
    each Unit and Work Week it adds overtime in, because OVERTIME_ALERT is not sent to the User who
    caused it.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
  - D-72
  - D-133
  - D-176
- rule_id: R22
  rule_statement: >-
    For BLOCKED_BY_UNIT, WORKER_REMOVED also goes to every active Agency User of the Worker's Agency,
    because the Agency did not cause that removal.
  rule_sources:
  - SHEET WA-3
  rule_decisions:
  - D-51
- rule_id: R23
  rule_statement: >-
    REQ-WORKFORCE-0016 takes Workers off Shifts through this requirement, giving the removal_reason;
    such a removal sets removed_at, leaves removed_by empty, and follows R16 and R22.
  rule_sources: []
  rule_decisions:
  - D-160
  - D-162
  - D-51
  - D-89
- rule_id: R24
  rule_statement: >-
    When the assigned Worker has neither an email nor a phone, the answer to the assigning User says
    so, because INSTRUCTIONS_NOT_SENT is not sent to the User whose action caused it.
  rule_sources:
  - SHEET SC-6
  rule_decisions:
  - D-176
  - D-88
- rule_id: R25
  rule_statement: >-
    When an Assignment becomes ASSIGNED, REQ-ORDERING-0006, REQ-ORDERING-0008, REQ-COMPLIANCE-0006, and
    REQ-TIME-0001 each react under their own rules, as REQ-ORDERING-0008 does when one becomes REMOVED;
    this requirement calls none of them.
  rule_sources:
  - SHEET SC-6
  - PRD §2 Shift statuses
  rule_decisions:
  - D-27
- rule_id: R26
  rule_statement: >-
    Asked about a Worker and a Release without assigning, this requirement answers whether R1 to R6 would
    refuse the assignment and why, and saves nothing.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  rule_decisions: []
- rule_id: R27
  rule_statement: >-
    WORKER_ASSIGNED and WORKER_REMOVED have the Assignment's Release as subject and name the Worker, their
    Agency, the Shift's Unit, Position, date, and times, and, for a removal, the removal_reason.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-252
  - D-253
