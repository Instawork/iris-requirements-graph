requirement_id: REQ-WORKFORCE-0017
requirement_target_layer: product
requirement_target_module: WORKFORCE
requirement_phase: MVP
requirement_title: Load Workers from a file
requirement_statement: >-
  An Agency User loads many Workers at once from a WORKERS file. Each row is matched to the Agency's Workers,
  and the rows become a Proposal that adds or changes Workers once the Agency User approves it.
requirement_actors:
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Only an Agency User sends a WORKERS file, with one row for each Worker of their own Agency.
  rule_sources:
  - SHEET WA-1
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Each WORKERS row is matched under REQ-WORKFORCE-0002; a row that matches an existing Worker proposes
    changes to that Worker, and only an unmatched row proposes a new one.
  rule_sources:
  - PRD §7 What the agent checks
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    In a WORKERS row, positions are looked up by Position name, separated by semicolons, and a name that
    matches no Position is a problem.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Two WORKERS rows are duplicates when they share an email or share a phone, and the later row is the
    duplicate.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Before the Proposal is shown, each row is checked, without saving, against REQ-WORKFORCE-0001.R2, R3,
    and R13 as the Worker it would add or change, and each failure is a row problem.
  rule_sources:
  - PRD §7 What the agent checks
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    An accepted row adds or changes its Worker through REQ-WORKFORCE-0001, and a new Worker's created_via
    is the Proposal's channel.
  rule_sources:
  - PRD §6 Uploads
  - SHEET WA-1
  rule_decisions: []
requirement_sources:
- SHEET WA-1
- PRD §6 Templates
- PRD §4 How the system matches a professional
requirement_decisions: []
requirement_features:
- WA-1
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-WORKFORCE-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-WORKFORCE-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-CATALOG-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-INTAKE-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENT-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
data_model:
  status: covered
  reads:
  - Worker.agency_id
  - Worker.first_name
  - Worker.last_name
  - Worker.email
  - Worker.phone
  - Position.name
  writes: []
  detail: >-
    Saves nothing itself: REQ-WORKFORCE-0001 saves each Worker, as saved_by says for every WORKERS column
    in the catalog.
requirement_starting_flow: false
