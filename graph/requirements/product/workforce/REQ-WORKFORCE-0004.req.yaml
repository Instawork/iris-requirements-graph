requirement_id: REQ-WORKFORCE-0004
requirement_target_layer: product
requirement_target_module: WORKFORCE
requirement_phase: MVP
requirement_title: Request specific Workers by name
requirement_statement: >-
  When sending a Shift to an Agency, a Unit User can name the Workers they want from that Agency. The
  Agency sees who was asked for and says when one cannot work.
requirement_actors:
- UNIT_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User over a Shift's Unit may name Workers they want on it, each saved as a WorkerRequest with
    status REQUESTED and requested_by_id.
  rule_sources:
  - SHEET WA-2
  - SESSIONS Worker Assignment & Compliance
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Worker can be requested only while their Agency holds a PENDING or ACCEPTED Release on the Shift,
    so a request sits inside the send to one Agency.
  rule_sources:
  - FEEDBACK a single agency, then request worker as a nested feature
  rule_decisions:
  - D-17
- rule_id: R3
  rule_statement: >-
    A Worker who is inactive, or rated BLOCK by the Shift's Unit, cannot be requested, and a Worker is
    requested at most once for a Shift.
  rule_sources:
  - SHEET WA-3
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    When picking, the Unit User sees the Agency's active Workers, with those the Unit rated FAVORITE listed
    first.
  rule_sources:
  - SHEET WA-2
  rule_decisions:
  - D-190
- rule_id: R5
  rule_statement: >-
    Agency Users see the requested Workers marked and listed first when assigning, and may still assign
    other Workers.
  rule_sources:
  - SHEET WA-2
  rule_decisions:
  - D-52
- rule_id: R6
  rule_statement: >-
    An Agency User of the Worker's Agency may mark a REQUESTED WorkerRequest UNAVAILABLE with an unavailable_reason.
  rule_sources:
  - SHEET WA-2
  rule_decisions:
  - D-52
- rule_id: R7
  rule_statement: >-
    Until the Shift starts, a Unit User over its Unit may withdraw a WorkerRequest in either status, which
    deletes it.
  rule_sources: []
  rule_decisions:
  - D-95
- rule_id: R8
  rule_statement: >-
    A WorkerRequest is shown, and can be marked, only while the Worker's Agency holds a PENDING or ACCEPTED
    Release on the Shift, and it keeps its status when that Release closes.
  rule_sources: []
  rule_decisions:
  - D-220
requirement_sources:
- SHEET WA-2
- FEEDBACK a single agency, then request worker as a nested feature
- SESSIONS Worker Assignment & Compliance
