data_model:
  status: covered
  reads:
  - Request.unit_id
  - Shift.request_id
  - Shift.starts_at
  - Shift.status
  - Unit.timezone
  - Release.shift_id
  - Release.status
  - Worker.active
  - WorkerRating.unit_id
  - WorkerRating.worker_id
  - WorkerRating.rating
  - Assignment.release_id
  - Assignment.worker_id
  - Assignment.status
  writes:
  - Assignment.eligible_at_start
  detail: >-
    Removals are saved through REQ-WORKFORCE-0003, which writes the other Assignment fields and makes
    the ASSIGNED to REMOVED transition.
