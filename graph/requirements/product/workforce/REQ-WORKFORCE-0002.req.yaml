requirement_id: REQ-WORKFORCE-0002
requirement_target_layer: product
requirement_target_module: WORKFORCE
requirement_phase: MVP
requirement_title: Match a named person to an existing Worker
requirement_statement: >-
  When a file, a message, or a form names a person, Iris looks for that person among one Agency's Workers
  in a fixed order before anyone new is created.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Matching looks only at the Workers of the one Agency the row or message is for.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R2
  rule_statement: A named person with the same email as a Worker is that Worker.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Otherwise, a named person with the same phone number as a Worker, once it is put in the stored form,
    is that Worker.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    Otherwise, a Worker with the same first and last name is only a possible match, which the person approving
    must confirm or reject; Iris never matches on name alone.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    When several Workers share that name, the person approving picks one of them or none.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    With no match, the caller proposes a new Worker from the named person's details, and none is created
    until a person approves.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions: []
requirement_sources:
- PRD §4 How the system matches a professional
requirement_decisions: []
