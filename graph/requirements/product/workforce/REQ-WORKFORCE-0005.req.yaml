requirement_id: REQ-WORKFORCE-0005
requirement_target_layer: product
requirement_target_module: WORKFORCE
requirement_phase: MVP
requirement_title: Rate a Worker as Favorite, Okay to return, or Block
requirement_statement: >-
  A Unit User rates a Worker for one Unit as Favorite, Okay to return, or Block, with an optional review.
  The rating holds for that Worker at that Unit until it is changed.
requirement_actors:
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User over a Unit may rate a Worker FAVORITE, OKAY_TO_RETURN, or BLOCK for that Unit, with an
    optional written review.
  rule_sources:
  - SHEET WA-3
  - PRD §4 Professionals
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Unit holds one current rating per Worker; rating again replaces it and sets rated_by and rated_at.
  rule_sources:
  - SHEET WA-3
  - SHEET 3.2
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A Worker can be rated before working a Shift at the Unit, so a Unit's existing favorite and block
    lists can be entered, one Worker at a time.
  rule_sources:
  - SHEET WA-2
  - SHEET 3.2
  rule_decisions:
  - D-99
- rule_id: R4
  rule_statement: >-
    A rating applies only at the Unit that gave it, and only to that Worker of that Agency.
  rule_sources:
  - SHEET WA-3
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    Agency Users see the ratings and reviews of their own Agency's Workers, and Program Users see every
    rating.
  rule_sources:
  - PRD §4 Professionals
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    Saving a BLOCK rating is the event REQ-WORKFORCE-0016 reacts to by taking the Worker off that Unit's
    Shifts that have not started; this requirement changes no Assignment.
  rule_sources:
  - SHEET WA-3
  rule_decisions:
  - D-51
requirement_sources:
