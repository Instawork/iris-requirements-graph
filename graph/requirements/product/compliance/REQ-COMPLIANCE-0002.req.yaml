data_model:
  status: covered
  reads:
  - CredentialType.*
  - Credential.*
  - Worker.agency_id
  - Worker.first_name
  - Worker.last_name
  - Worker.email
  - RoleGrant.user_id
  - RoleGrant.role
  - RoleGrant.agency_id
  - RoleGrant.revoked_at
  - Upload.file_url
  writes:
  - Credential.worker_id
  - Credential.credential_type_id
  - Credential.file_url
  - Credential.issuer
  - Credential.number
  - Credential.issued_on
  - Credential.expires_on
  - Credential.status
  - Credential.check_attempts
  - Credential.uploaded_by
  - Credential.replaces_id
  - Credential.expiry_warned_at
  detail: >-
    A Credential comes from a form, whose document is stored through REQ-INTAKE-0001, or from one CREDENTIALS
    Upload, whose file_url it takes. A new Credential has check_attempts 0. The daily job of R9 writes only
    expiry_warned_at.
