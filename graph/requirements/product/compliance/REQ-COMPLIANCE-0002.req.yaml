requirement_id: REQ-COMPLIANCE-0002
requirement_target_layer: product
requirement_target_module: COMPLIANCE
requirement_phase: MVP
requirement_title: Upload a Credential with its expiry
requirement_statement: >-
  An Agency User uploads a Worker's Credential document with its type, issuer, number, and expiry date.
  Iris warns the Agency once before a verified Credential expires.
requirement_actors:
- AGENCY_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency User uploads a Credential only for a Worker of their own Agency and an active Credential
    Type, with the document file.
  rule_sources:
  - SHEET WA-14
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Issuer, number, and issued_on are optional, and expires_on is required when the Credential Type's
    has_expiry is true; a Credential missing it is not saved.
  rule_sources:
  - SHEET WA-14
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The CREDENTIALS upload type takes one PDF or image document for each Credential, and documents sent
    together are separate Uploads.
  rule_sources:
  - SHEET WA-14
  - PRD §4 Professionals
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    A document sent without details is a CREDENTIALS Upload: Iris reads the Worker's name, Credential
    Type, issuer, number, and dates from it into a one-item Proposal for the Agency User to confirm.
  rule_sources:
  - SHEET WA-15
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    The Worker a document names is matched within the Agency by REQ-WORKFORCE-0002; a document with no
    matching Worker is a problem and never creates a Worker.
  rule_sources:
  - PRD §4 How the system matches a professional
  rule_decisions:
  - D-197
- rule_id: R6
  rule_statement: >-
    A saved Credential starts as PENDING_CHECK with uploaded_by set and file_url naming the stored document,
    and is then checked by REQ-COMPLIANCE-0003.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-3
- rule_id: R7
  rule_statement: >-
    A new Credential for a Worker and Credential Type that already has one sets replaces_id to the latest
    earlier one, which is kept unchanged.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  - GRAPH data model Credential.replaces_id
  rule_decisions:
  - D-195
- rule_id: R8
  rule_statement: >-
    After upload, an Agency User cannot change a Credential; a correction or a renewal is uploaded as
    a new Credential.
  rule_sources: []
  rule_decisions:
  - D-3
  - D-195
- rule_id: R9
  rule_statement: >-
    A daily job of REQ-JOBS-0001, at 08:00 in the program timezone, sends CREDENTIAL_EXPIRING for each VERIFIED
    Credential with no expiry_warned_at whose expires_on is today or at most CREDENTIAL_EXPIRY_WARNING_DAYS
    days later.
  rule_sources:
  - SHEET WA-14
  rule_decisions:
  - D-16
  - D-67
  - D-213
  - D-145
- rule_id: R10
  rule_statement: >-
    CREDENTIAL_EXPIRING goes by email and in the app to every active Agency User of the Worker's Agency
    and sets expiry_warned_at, and is never sent for a Credential that a newer one replaces.
  rule_sources:
  - SHEET WA-14
  rule_decisions:
  - D-145
- rule_id: R11
  rule_statement: >-
    A Credential needs action when it is REJECTED, or VERIFIED with an expires_on already past or at
    most CREDENTIAL_EXPIRY_WARNING_DAYS away, and no newer Credential of that Worker and Credential
    Type exists.
  rule_sources:
  - SHEET WA-14
  rule_decisions:
  - D-16
  - D-66
- rule_id: R12
  rule_statement: >-
    Today, for a Credential, is the current date in the program timezone that REQ-JOBS-0001 names.
  rule_sources:
  - GRAPH a Credential belongs to no Unit, so it has no Unit timezone
  rule_decisions:
  - D-213
- rule_id: R13
  rule_statement: >-
    A Credential entered on a form with its details stores its document through REQ-INTAKE-0001 and creates
    no Upload and no Proposal.
  rule_sources:
  - SHEET WA-14
  rule_decisions:
  - D-236
- rule_id: R14
  rule_statement: >-
    Only an Agency User of the Worker's Agency and a Program User may open a Credential's document, which
    REQ-INTAKE-0001 returns to them (C-35).
  rule_sources:
  - SHEET WA-14
  - SHEET WA-16
  rule_decisions:
  - D-142
- rule_id: R15
  rule_statement: >-
    A CREDENTIAL_EXPIRING message names the Worker, the Credential Type, and the expires_on date.
  rule_sources:
  - SHEET WA-14
  rule_decisions:
  - D-253
