requirement_id: REQ-COMPLIANCE-0003
requirement_target_layer: product
requirement_target_module: COMPLIANCE
requirement_phase: MVP
requirement_title: Validate Credential documents with AI and review what it cannot settle
requirement_statement: >-
  Iris checks each uploaded Credential document for expiry, issuer, and signs of editing, and with the
  issuer or a public registry where available. A Program User decides the ones the checks cannot settle.
requirement_actors:
- SYSTEM
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An interval job of REQ-JOBS-0001 checks each PENDING_CHECK Credential for four things: the expiry date
    on the document, the issuer named on it, signs of editing, and the issuer or registry record.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-67
  - D-86
- rule_id: R2
  rule_statement: >-
    The issuer or registry check is made through REQ-INTEGRATIONS-0006; when its result is not available,
    that check is skipped and the result rests on the document checks.
  rule_sources:
  - SHEET WA-15
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The stored document file is passed to REQ-AGENT-0001, which returns the issuer and dates it shows
    and whether it shows signs of editing, and code sets the status from them without a Proposal.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-3
- rule_id: R4
  rule_statement: >-
    The result is REJECTED when the expiry date on the document is before today in the program timezone,
    or REQ-INTEGRATIONS-0006 returns not confirmed.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-3
  - D-194
- rule_id: R5
  rule_statement: >-
    The result is VERIFIED when it is not REJECTED, no sign of editing is found, the document's issuer
    and dates match the details uploaded, and every check that ran passed.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-3
  - D-194
- rule_id: R6
  rule_statement: >-
    Any other outcome, including a document from which the model reads neither an issuer nor a date,
    is NEEDS_REVIEW.
  rule_sources: []
  rule_decisions:
  - D-3
  - D-194
- rule_id: R7
  rule_statement: >-
    Each result sets checked_at and a status_reason naming every check that failed or could not finish,
    and verification_reference when REQ-INTEGRATIONS-0006 returned a reference.
  rule_sources:
  - SHEET WA-15
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    A Program User decides each NEEDS_REVIEW Credential as VERIFIED or REJECTED with a review_note, which
    sets reviewed_by and reviewed_at.
  rule_sources:
  - SHEET WA-16
  rule_decisions:
  - D-3
- rule_id: R9
  rule_statement: >-
    VERIFIED and REJECTED are final: nobody changes the status of such a Credential.
  rule_sources:
  - GRAPH data model CredentialStatus transitions
  rule_decisions:
  - D-195
- rule_id: R10
  rule_statement: >-
    When a Credential becomes VERIFIED or REJECTED, Iris sends CREDENTIAL_DECIDED in the app to the User
    who uploaded it, with the status_reason or review_note.
  rule_sources:
  - SHEET WA-15
  rule_decisions: []
- rule_id: R11
  rule_statement: >-
    The document matches when its issuer, issue date, and expiry date equal the uploaded issuer, issued_on,
    and expires_on; a detail left empty on upload is not compared, and issuers compare ignoring case and
    spacing.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-194
- rule_id: R12
  rule_statement: >-
    A run in which REQ-AGENT-0001 returns a failure leaves the Credential PENDING_CHECK and adds one to
    check_attempts, and the third such run makes it NEEDS_REVIEW.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-86
requirement_sources:
- SHEET WA-15
- SHEET WA-16
- SESSIONS Worker Assignment & Compliance
requirement_decisions:
- D-3
- D-67
- D-86
- D-194
- D-195
requirement_features:
- WA-15
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-COMPLIANCE-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-AGENT-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-INTAKE-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-INTEGRATIONS-0006
- edge_type: DEPENDS_ON
  requirement_id: REQ-JOBS-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-MESSAGING-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
- edge_type: DEPENDS_ON
  requirement_id: REQ-AUDIT-0001
data_model:
  status: covered
  reads:
  - Credential.*
  - CredentialType.name
  - CredentialType.has_expiry
  writes:
  - Credential.status
  - Credential.status_reason
  - Credential.verification_reference
  - Credential.checked_at
  - Credential.check_attempts
  - Credential.reviewed_by
  - Credential.reviewed_at
  - Credential.review_note
  detail: >-
    The job reads each document through REQ-INTAKE-0001 by the Credential's file_url and passes the file
    itself, not its OCR text, to REQ-AGENT-0001.
requirement_starting_flow: true
requirement_review:
  status: draft
  by: null
  at: null
  notes: null
requirement_delivery:
  status: not_started
  pull_requests: []
