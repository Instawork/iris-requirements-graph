requirement_id: REQ-COMPLIANCE-0001
requirement_target_layer: product
requirement_target_module: COMPLIANCE
requirement_phase: MVP
requirement_title: Set Credential Types and where each is required
requirement_statement: >-
  A Program User defines Credential Types, such as a food handler card or a TB test, and where each is
  required. A requirement applies by org node, by Position, or by both.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Only a Program User adds or changes a Credential Type, and adds or removes a Credential Requirement.
  rule_sources:
  - SHEET WA-13
  rule_decisions:
  - D-3
  - D-56
- rule_id: R2
  rule_statement: >-
    A Credential Type has a unique name, a proof of ATTESTATION or VERIFIED_DOCUMENT, and a has_expiry
    flag; a duplicate name is refused.
  rule_sources:
  - SHEET WA-13
  rule_decisions:
  - D-3
- rule_id: R3
  rule_statement: >-
    A proof of ATTESTATION means an Agency Attestation satisfies the type, and VERIFIED_DOCUMENT means
    only a verified Credential document does.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  rule_decisions:
  - D-3
- rule_id: R4
  rule_statement: >-
    A Credential Requirement names one active Credential Type, an org node or none, and a Position or
    none.
  rule_sources:
  - SHEET WA-13
  rule_decisions:
  - D-56
- rule_id: R5
  rule_statement: >-
    A requirement with an org node applies to every Unit at or under that node, and one with no org node
    applies to every Unit.
  rule_sources:
  - SHEET WA-13
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A requirement with a Position applies only to Shifts for that Position, and one with no Position applies
    to Shifts for every Position.
  rule_sources:
  - SHEET WA-13
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A second requirement with the same Credential Type, org node, and Position is refused.
  rule_sources:
  - GRAPH data model uniqueness
  rule_decisions:
  - D-56
- rule_id: R8
  rule_statement: >-
    A Credential Type is never deleted; setting active to false stops it being required and keeps its
    Credentials and Attestations, and it can be made active again.
  rule_sources:
  - GRAPH data model CredentialType.active
  rule_decisions:
  - D-154
- rule_id: R9
  rule_statement: >-
    Adding, changing, or removing a type or a requirement changes no stored Credential or Attestation and
    applies to every eligibility check made afterward, including for Workers already assigned.
  rule_sources:
  - SHEET WA-13
  - GRAPH eligibility is computed when asked
  rule_decisions:
  - D-51
- rule_id: R10
  rule_statement: >-
    Removing a Credential Requirement deletes it, with the removal kept in the Audit Trail, and the same
    requirement can be added again later.
  rule_sources:
  - SHEET WA-13
  rule_decisions:
  - D-56
requirement_sources:
- SHEET WA-13
