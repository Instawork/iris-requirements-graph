requirement_id: REQ-COMPLIANCE-0005
requirement_target_layer: product
requirement_target_module: COMPLIANCE
requirement_phase: MVP
requirement_title: Decide whether a Worker is eligible for a Shift
requirement_statement: >-
  A Worker is eligible for a Shift when every required Credential Type is satisfied on the Shift date.
  Iris gives the reason when they are not.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Credential Type is satisfied by a verified, unexpired credential, or by an attestation where the
    type accepts one.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The same check runs whoever assigns, whether an Agency User, a file, or the assistant.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    When a credential lapses before an assigned Shift, the Agency is told to renew it or replace the Worker.
  rule_sources: []
  rule_decisions: []
