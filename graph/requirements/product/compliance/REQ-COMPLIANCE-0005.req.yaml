requirement_id: REQ-COMPLIANCE-0005
requirement_target_layer: product
requirement_target_module: COMPLIANCE
requirement_phase: MVP
requirement_title: Decide whether a Worker is eligible for a Shift
requirement_statement: >-
  A Worker is eligible for a Shift when every Credential Type the Shift requires is satisfied on its work
  date. Iris answers for a given Worker and Shift, with the reasons when the Worker is not eligible.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Shift requires every active Credential Type that has a Credential Requirement applying to the Shift's
    Unit and Position, as REQ-COMPLIANCE-0001 defines.
  rule_sources:
  - SHEET WA-13
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A required type is satisfied by a Credential of the Worker for that type that is VERIFIED and has
    no expires_on, or an expires_on on or after the Shift's work date.
  rule_sources:
  - SHEET WA-14
  - DEMO lib/compliance.ts
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A required type whose proof is ATTESTATION is also satisfied by the Worker's Attestation for it that
    is current on the work date, as REQ-COMPLIANCE-0004 defines.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  rule_decisions:
  - D-3
- rule_id: R4
  rule_statement: >-
    A Credential that is PENDING_CHECK, NEEDS_REVIEW, or REJECTED never satisfies a type.
  rule_sources:
  - SHEET WA-15
  rule_decisions:
  - D-3
- rule_id: R5
  rule_statement: >-
    The Worker is eligible when every required type is satisfied, and always when the Shift requires none.
  rule_sources:
  - SHEET WA-13
  - FAQ
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    When the Worker is not eligible, the answer names each unsatisfied type and why: nothing on file,
    expired by the work date, still being checked, or rejected.
  rule_sources:
  - SESSIONS Worker Assignment & Compliance
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    The answer is computed from the records at the moment it is asked, is not stored, and is the same
    whichever channel asks.
  rule_sources:
  - DEMO lib/compliance.ts
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    When REQ-WORKFORCE-0003 asks about a Worker already assigned to a Shift that has not started and the
    answer is not eligible, Iris sends WORKER_NOT_ELIGIBLE.
  rule_sources:
  - SHEET WA-14
  - FAQ
  rule_decisions:
  - D-51
- rule_id: R9
  rule_statement: >-
    WORKER_NOT_ELIGIBLE goes by email and in the app to every active Agency User of the Worker's Agency
    and to the User who created the Request, with the reasons.
  rule_sources:
  - SHEET WA-14
  - FAQ
  rule_decisions:
  - D-51
- rule_id: R10
  rule_statement: >-
    This requirement never reads or changes Assignments; removing the Worker with NOT_ELIGIBLE is done
    by REQ-WORKFORCE-0003.
  rule_sources:
  - GRAPH keeps the dependency graph free of cycles
  rule_decisions: []
requirement_sources:
- SHEET WA-13
- SHEET WA-14
- FAQ
- SESSIONS Worker Assignment & Compliance
- DEMO lib/compliance.ts
