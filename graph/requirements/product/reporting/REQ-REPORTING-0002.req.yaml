requirement_id: REQ-REPORTING-0002
requirement_target_layer: product
requirement_target_module: REPORTING
requirement_phase: MVP
requirement_title: Define the standard measures and the dimensions that group them
requirement_statement: >-
  Hours, headcount, fill rate, and no-show rate each have one formula, and every measure groups by the
  same dimensions. The formulas are provisional: the sheet leaves metrics to be defined with Foodbuy.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    HOURS is the minutes behind SPEND, shown in hours: worked minutes on APPROVED Timesheets plus the
    entered or scheduled minutes counted in PENDING_SPEND.
  rule_sources:
  - PRD §1 Detailed requirements
  - GRAPH hours must match the spend they sit behind
  rule_decisions:
  - D-29
  - D-179
- rule_id: R2
  rule_statement: >-
    OVERTIME_HOURS is the overtime and double-time minutes within HOURS, and scheduled minutes with no
    hours entered add none.
  rule_sources:
  - SHEET WA-19
  - 'GRAPH data model: Measure.OVERTIME_HOURS'
  rule_decisions:
  - D-179
- rule_id: R3
  rule_statement: >-
    HEADCOUNT_REQUESTED is the sum of headcount on Shifts that are not CANCELLED.
  rule_sources:
  - PRD §1 Detailed requirements
  - GRAPH a cancelled Shift adds nothing, as with spend
  rule_decisions:
  - D-180
- rule_id: R4
  rule_statement: >-
    FILL_RATE is ASSIGNED Assignments divided by headcount, over Shifts that have started.
  rule_sources:
  - PRD §1 Metric definitions
  - SHEET RC-16
  rule_decisions:
  - D-42
- rule_id: R5
  rule_statement: >-
    Grouped by Agency, FILL_RATE divides the Agency's ASSIGNED Assignments by the headcount of the Releases
    sent to it, leaving out WITHDRAWN Releases.
  rule_sources:
  - PRD §1 Metric definitions
  - SHEET RC-16
  rule_decisions:
  - D-42
- rule_id: R6
  rule_statement: >-
    NO_SHOW_RATE is Timesheets marked as a no-show divided by ASSIGNED Assignments, over Shifts whose
    status is WORKED.
  rule_sources:
  - PRD §1 Metric definitions
  - SHEET RC-16
  rule_decisions:
  - D-178
- rule_id: R7
  rule_statement: >-
    A rate whose denominator is zero shows as not available, never as zero.
  rule_sources: []
  rule_decisions:
  - D-182
- rule_id: R8
  rule_statement: >-
    Every measure groups and filters by Sector, Region, District, Unit, Department, Cost Center, Agency,
    Position, Event, work date, Work Week, and month.
  rule_sources:
  - SHEET 6.1
  - SHEET PLT-2
  - PRD §1 Detailed requirements
  - SHEET WA-20
  rule_decisions:
  - D-125
- rule_id: R9
  rule_statement: >-
    For spend and hours, the Position and Department are the Timesheet's, which differ from the Shift's
    after a split, and the Agency is the Release's.
  rule_sources:
  - SHEET TS-10
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    For HEADCOUNT_REQUESTED and FILL_RATE, the Position and Department are the Shift's, and for every
    measure the Event is the Shift's.
  rule_sources:
  - SHEET REP-2
  - 'GRAPH data model: Shift.event_id, Shift.position_id, Shift.department_id'
  rule_decisions:
  - D-183
- rule_id: R11
  rule_statement: >-
    Grouping by Work Week puts each work date in the Work Week of its own Unit, and a month is a calendar
    month of work dates.
  rule_sources:
  - SHEET WA-20
  rule_decisions:
  - D-125
