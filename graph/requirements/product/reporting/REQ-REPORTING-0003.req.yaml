requirement_id: REQ-REPORTING-0003
requirement_target_layer: product
requirement_target_module: REPORTING
requirement_phase: MVP
requirement_title: Answer plain-language questions with a chart, table, or dashboard
requirement_statement: >-
  A Unit User or a Program User asks a question about spend and labor in plain language and gets a chart,
  a table, or a dashboard. They can save the answer and reopen it.
requirement_actors:
- UNIT_USER
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User or a Program User asks a question in plain language, such as what was spent by Agency
    last week, and Iris answers with a chart or a table.
  rule_sources:
  - SHEET REP-1
  - SESSIONS Reporting
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    The LLM only turns the question into measures, groupings, filters, and a period, and code computes
    every number.
  rule_sources:
  - PRD §7 Agent Chat
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A question may use any measure Iris defines: spend, hours, headcount, fill rate, no-show rate, budget,
    labor cost as a percentage of sales, and late Timesheets.
  rule_sources:
  - SHEET 6.1
  - 'GRAPH data model: the Measure enum is the full list'
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    An answer can be grouped or filtered by any dimension REQ-REPORTING-0002 lists, down to one Event.
  rule_sources:
  - SHEET 6.1
  - SHEET REP-2
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    An answer with one measure is a chart or a table, and an answer with several measures shows them together
    as a dashboard.
  rule_sources:
  - SHEET REP-1
  rule_decisions:
  - D-45
- rule_id: R6
  rule_statement: >-
    An answer holds only records inside the asking User's scope, as REQ-ORG-0009 checks: the Units under
    a Unit User's Role Grants, or the whole program for a Program User.
  rule_sources:
  - SHEET PLT-1
  rule_decisions:
  - D-25
- rule_id: R7
  rule_statement: No answer shows a Pay Rate or a Markup.
  rule_sources:
  - PRD §3 Supplier Rates
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    When Iris cannot tell which measure or period a question means, it asks the User instead of guessing.
  rule_sources:
  - PRD §7 Agent Chat
  rule_decisions: []
- rule_id: R9
  rule_statement: Asking a question saves nothing, so it needs no Proposal.
  rule_sources:
  - PRD §7 Agent Chat
  - GRAPH a question changes no records
  rule_decisions: []
- rule_id: R10
  rule_statement: >-
    The User can save an answer under a name as a Saved Report, which stores the measures, groupings,
    filters, and period, not the numbers.
  rule_sources:
  - SHEET REP-1
  - SESSIONS Reporting
  - 'GRAPH data model: SavedReport'
  rule_decisions: []
- rule_id: R11
  rule_statement: >-
    A Saved Report's period is either fixed start and end dates or a relative period, such as the last
    four Work Weeks, never both.
  rule_sources:
  - >-
    GRAPH data model: SavedReport.relative_period is used instead of fixed dates
  rule_decisions:
  - D-14
- rule_id: R12
  rule_statement: >-
    Only the User who saved a Saved Report can reopen it, and reopening recomputes it from current records
    within that User's current scope.
  rule_sources: []
  rule_decisions:
  - D-45
- rule_id: R13
  rule_statement: >-
    Only the User who saved a Saved Report can rename or delete it.
  rule_sources: []
  rule_decisions:
  - D-45
