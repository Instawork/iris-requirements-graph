requirement_id: REQ-REPORTING-0009
requirement_target_layer: product
requirement_target_module: REPORTING
requirement_phase: MVP
requirement_title: Show Program Users top Agencies, Events, and Units with trends
requirement_statement: >-
  A Program User sees which Agencies, Events, and Units carry the most spend, how spend moves over time,
  and how each Agency performs.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    For a chosen period, a Program User sees Agencies, Events, and Units each ranked by SPEND, highest
    first.
  rule_sources:
  - SHEET REP-9
  - PRD §1 Detailed requirements
  rule_decisions:
  - D-139
- rule_id: R2
  rule_statement: >-
    A trend shows a measure per Work Week or per calendar month across the chosen period.
  rule_sources:
  - SHEET REP-9
  - GRAPH trend steps
  rule_decisions:
  - D-133
- rule_id: R3
  rule_statement: >-
    Each Agency shows its FILL_RATE and NO_SHOW_RATE beside its SPEND, as that Agency's performance.
  rule_sources:
  - SHEET REP-9
  - SHEET RC-16
  rule_decisions:
  - D-42
- rule_id: R4
  rule_statement: >-
    Each Unit shows this month's SPEND as a percentage above or below the average of its prior full calendar
    months, up to three, with no flag threshold.
  rule_sources:
  - PRD §1 Dashboard / Profile
  rule_decisions:
  - D-30
- rule_id: R5
  rule_statement: A Unit with no prior full calendar month of spend shows no comparison.
  rule_sources:
  - GRAPH a new Unit has no normal level yet
  rule_decisions:
  - D-30
- rule_id: R6
  rule_statement: >-
    The views cover the whole program and can be filtered to a Sector, Region, or District.
  rule_sources:
  - SHEET REP-9
  - SHEET PLT-2
  rule_decisions:
  - D-25
- rule_id: R7
  rule_statement: >-
    Each Unit also shows how many of its Releases for work dates in the period carry a
    bill_rate_reason or are non_contracted.
  rule_sources:
  - SHEET RC-11
  - PRD §1 Compass view
  rule_decisions:
  - D-2
requirement_sources:
- SHEET REP-9
- SHEET 6.3
requirement_decisions:
- D-2
- D-25
- D-30
- D-42
- D-139
- D-133
requirement_features:
- REP-9
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-REPORTING-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-REPORTING-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0009
data_model:
  status: covered
  reads:
  - Release.bill_rate_reason
  - Release.non_contracted
  - Release.shift_id
  - Agency.name
  - Event.name
  - Event.unit_id
  - OrgNode.name
  - OrgNode.level
  - OrgNode.parent_id
  writes: []
  detail: >-
    Computed on demand from the measures of REQ-REPORTING-0001 and REQ-REPORTING-0002; nothing is stored.
requirement_starting_flow: false
requirement_review:
  status: draft
  by: null
