requirement_id: REQ-REPORTING-0010
requirement_target_layer: product
requirement_target_module: REPORTING
requirement_phase: MVP
requirement_title: 'Report Timesheet compliance: missed breaks and late approvals'
requirement_statement: >-
  Iris reports Timesheets with missed breaks and Timesheets approved late, for any period and grouping.
requirement_actors:
- PROGRAM_USER
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    For a chosen period, the report counts Timesheets with a missed break and late Timesheets, grouped
    by any dimension REQ-REPORTING-0002 lists, such as Unit or Agency.
  rule_sources:
  - SHEET REP-10
  - SHEET 6.3
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Timesheet has a missed break when its exception reasons include MISSED_BREAK.
  rule_sources:
  - SHEET REP-10
  - SHEET WA-18
  rule_decisions:
  - D-22
- rule_id: R3
  rule_statement: >-
    A Timesheet is late when it is not APPROVED by LOCK_WINDOW_HOURS after its Shift ends, and it stays
    counted as late if approved afterwards.
  rule_sources:
  - SHEET REP-10
  - SHEET TS-9
  rule_decisions:
  - D-13
  - D-16
- rule_id: R4
  rule_statement: >-
    LOCK_WINDOW_HOURS is the value REQ-ORG-0006 resolves for the Timesheet's Unit.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-16
- rule_id: R5
  rule_statement: >-
    LATE_TIMESHEETS counts late Timesheets by the work date of their Shift.
  rule_sources:
  - SHEET REP-10
  - 'GRAPH data model: Measure.LATE_TIMESHEETS'
  rule_decisions:
  - D-13
- rule_id: R6
  rule_statement: >-
    A Program User sees the report for the whole program, and a Unit User for the Units in their scope.
  rule_sources:
  - SHEET 6.3
  - SHEET PLT-1
  rule_decisions: []
requirement_sources:
- SHEET REP-10
- SHEET 6.3
requirement_decisions:
- D-13
- D-16
- D-22
requirement_features:
