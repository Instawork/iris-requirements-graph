requirement_id: REQ-REPORTING-0007
requirement_target_layer: product
requirement_target_module: REPORTING
requirement_phase: MVP
requirement_title: Load Unit budgets from a file
requirement_statement: >-
  A Program User loads labor budgets from a file, one row per Unit and date range. Dashboards compare
  spend with the budget for any period.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Only a Program User uploads a BUDGETS file, and each row gives a Unit, a period start date, a
    period end date, and an amount, all required.
  rule_sources:
  - SHEET REP-8
  rule_decisions:
  - D-14
- rule_id: R2
  rule_statement: >-
    A Budget belongs to one Unit, and Department budgets are not part of MVP.
  rule_sources:
  - SHEET REP-8
  rule_decisions:
  - D-14
- rule_id: R3
  rule_statement: >-
    A BUDGETS row is reported as a problem when its unit matches no Unit or more than one, or its end
    date is before its start date.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions:
  - D-14
  - D-54
- rule_id: R4
  rule_statement: >-
    A row whose dates overlap another Budget of the same Unit, saved or in the same file, is reported
    as a problem, unless its dates equal a saved Budget's.
  rule_sources:
  - 'GRAPH data model: a Unit''s Budgets never overlap in dates'
  rule_decisions:
  - D-14
- rule_id: R5
  rule_statement: >-
    A row with the same Unit and dates as a saved Budget is proposed as an update to its amount.
  rule_sources:
  - GRAPH a second upload corrects a Budget
  rule_decisions:
  - D-14
- rule_id: R6
  rule_statement: >-
    No BUDGETS row is saved until the Program User approves the Proposal, and each accepted row is saved
    as a Budget linked to its Upload.
  rule_sources:
  - PRD §6 Uploads
  - PRD §7 Agent Chat
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    BUDGET for a Unit and period is the sum of its Budgets' amounts, each prorated by the share of its
    days in the period and rounded half up to the cent before summing.
  rule_sources:
  - SHEET REP-7
  - GRAPH proration, because each Budget carries its own dates
  rule_decisions:
  - D-14
  - D-77
- rule_id: R8
  rule_statement: >-
    A period in which a Unit has no Budget day shows no budget rather than zero.
  rule_sources:
  - GRAPH no Budget is different from a Budget of zero
  rule_decisions:
  - D-14
requirement_sources:
- SHEET REP-8
