requirement_id: REQ-LABOR-0003
requirement_target_layer: product
requirement_target_module: LABOR
requirement_phase: MVP
requirement_title: Track overtime within each Agency and alert
requirement_statement: >-
  Iris adds up a Worker's minutes at a Unit in its Work Week and alerts when an Assignment or Timesheet
  hours add overtime. Where OVERTIME_HARD_BLOCK is on, an Assignment that adds overtime is refused instead.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Overtime is tracked for one Worker at one Unit within one Work Week of that Unit; minutes at other
    Units or with other Agencies are not counted.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
- rule_id: R2
  rule_statement: >-
    The caller gives the Worker's counted Shifts in that week, each with its work date, start time, and
    minutes, both before and after the change being checked.
  rule_sources: []
  rule_decisions:
  - D-4
  - D-58
- rule_id: R3
  rule_statement: >-
    When Timesheet hours are saved, REQ-TIME-0001 counts a Shift at its Timesheets' worked_minutes once
    hours are entered, and otherwise at its scheduled minutes less the planned break.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
- rule_id: R4
  rule_statement: >-
    When a Worker is assigned, REQ-WORKFORCE-0003 counts every Shift at its scheduled minutes less the
    planned break, because it cannot read Timesheets.
  rule_sources: []
  rule_decisions:
  - D-4
  - D-58
- rule_id: R5
  rule_statement: >-
    A change adds overtime when the week's overtime plus double-time minutes, classified as in REQ-LABOR-0005,
    are greater after the change than before it.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
  - D-58
- rule_id: R6
  rule_statement: >-
    When an Assignment would add overtime and OVERTIME_HARD_BLOCK is true for the Unit, the answer is
    to refuse it, and no alert is sent.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-16
- rule_id: R7
  rule_statement: >-
    In every other case a change that adds overtime is allowed and Iris sends OVERTIME_ALERT; Timesheet
    hours are never refused for overtime.
  rule_sources:
  - SHEET WA-19
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    OVERTIME_ALERT goes in the app to every active Agency User of the Worker's Agency and to the User
    who created the Shift's Request, naming the Worker, the Work Week, and the overtime minutes.
  rule_sources:
  - SHEET WA-19
  rule_decisions: []
requirement_sources:
- SHEET WA-19
requirement_decisions:
- D-4
- D-16
- D-58
requirement_features:
