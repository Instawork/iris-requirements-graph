requirement_id: REQ-LABOR-0003
requirement_target_layer: product
requirement_target_module: LABOR
requirement_phase: MVP
requirement_title: Track overtime within each Agency and alert
requirement_statement: >-
  Iris adds up the minutes a Worker works for one Agency, across Units, in each Unit's Work Week, and
  alerts when an Assignment or Timesheet hours add overtime. Where OVERTIME_HARD_BLOCK is on, an Assignment
  that adds overtime is refused instead.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Overtime is tracked for one Worker of one Agency across every Unit, never across Agencies, in each
    distinct Work Week holding the changed work date at a Unit of the Worker's counted Shifts.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
  - D-133
- rule_id: R2
  rule_statement: >-
    The caller gives the Worker's counted Shifts with work dates within six days of the changed work
    date, each with its Unit, work date, start time, and minutes, both before and after the change.
  rule_sources: []
  rule_decisions:
  - D-4
  - D-202
- rule_id: R3
  rule_statement: >-
    When Timesheet hours are saved, REQ-TIME-0001 counts a Shift at its Timesheets' worked_minutes once
    hours are entered, and otherwise at its scheduled minutes less the planned break.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-202
- rule_id: R4
  rule_statement: >-
    When a Worker is assigned, REQ-WORKFORCE-0003 counts every Shift at its scheduled minutes less the
    planned break, because it cannot read Timesheets.
  rule_sources: []
  rule_decisions:
  - D-202
- rule_id: R5
  rule_statement: >-
    A change adds overtime at a Unit when the overtime plus double-time minutes of the Shifts at that
    Unit, classified as in REQ-LABOR-0005 within that Unit's Work Week, are greater after the change
    than before.
  rule_sources:
  - SHEET WA-19
  - SHEET WA-20
  rule_decisions:
  - D-58
  - D-133
- rule_id: R6
  rule_statement: >-
    When an Assignment would add overtime at a Unit and OVERTIME_HARD_BLOCK is true for that Unit or
    for the Unit of the Shift being assigned, the answer is to refuse it and send no alert.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-16
  - D-243
- rule_id: R7
  rule_statement: >-
    In every other case a change that adds overtime is allowed, and Iris sends one OVERTIME_ALERT for
    each Unit where it adds overtime; Timesheet hours are never refused for overtime.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-243
- rule_id: R8
  rule_statement: >-
    Each OVERTIME_ALERT goes in the app to every active Agency User of the Worker's Agency and every
    active Unit User over that Unit or over the changed Shift's Unit.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-72
  - D-243
- rule_id: R9
  rule_statement: >-
    An OVERTIME_ALERT names the Worker, the Unit, its Work Week, and the overtime plus double-time minutes
    of the Worker's Shifts at that Unit in that week after the change.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-72
requirement_sources:
- SHEET WA-19
requirement_decisions:
