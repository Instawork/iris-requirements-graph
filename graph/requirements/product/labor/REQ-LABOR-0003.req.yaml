requirement_phase: MVP
requirement_title: Track overtime within each Agency and alert
requirement_statement: >-
  Iris adds up each Worker's hours in the Work Week at their Agency and alerts before an assignment takes
  them past the overtime threshold.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Hours counted are approved Timesheet hours plus the scheduled hours of upcoming assigned Shifts.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Overtime is flagged, not blocked, unless the overtime hard block Setting is on.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: Hours at other Agencies are not counted in MVP.
  rule_sources: []
  rule_decisions: []
