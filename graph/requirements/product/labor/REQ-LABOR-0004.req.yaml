requirement_id: REQ-LABOR-0004
requirement_target_layer: product
requirement_target_module: LABOR
requirement_phase: MVP
requirement_title: Use each Unit's own Work Week for overtime and reporting
requirement_statement: >-
  Each Unit has its own Work Week, starting on the weekday stored as its work_week_start. A Program User
  sets that day when adding or editing the Unit.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit's Work Week is seven dates in a row that begin on its work_week_start weekday, with dates taken
    in the Unit's timezone.
  rule_sources:
  - SHEET WA-20
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A work date belongs to the Work Week that begins on the latest work_week_start weekday on or before
    it.
  rule_sources:
  - SHEET WA-20
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A Shift and its Timesheets belong to the Work Week of the Shift's work date, even when the Shift ends
    on a later date.
  rule_sources:
  - GRAPH data model work date
  rule_decisions:
  - D-219
- rule_id: R4
  rule_statement: >-
    Overtime tracking, the classification of minutes, and weekly reporting for a Unit all use this Work
    Week.
  rule_sources:
  - SHEET WA-20
  rule_decisions:
  - D-141
- rule_id: R5
  rule_statement: >-
    The Work Week for any date is worked out from the work_week_start stored on the Unit at the time it
    is asked for.
  rule_sources: []
  rule_decisions:
  - D-221
requirement_sources:
- SHEET WA-20
requirement_decisions:
- D-141
- D-219
- D-221
requirement_features:
