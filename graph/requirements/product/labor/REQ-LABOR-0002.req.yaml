requirement_title: Check labor rules at booking and on Timesheets
requirement_statement: >-
  Iris checks each Shift against its Unit's state and city rules when it is booked, and each Timesheet
  when it is submitted. These checks flag, not block.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    At booking, a Shift long enough to need a break with none planned is flagged.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    At booking, a Bill Rate whose Pay Rate is below the local minimum wage is flagged.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: On a Timesheet, a missed required break is flagged as an exception.
  rule_sources: []
  rule_decisions: []
