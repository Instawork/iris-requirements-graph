requirement_phase: MVP
requirement_title: Split a Timesheet when a Worker changes role
requirement_statement: >-
  When a Worker moves to another Position or Department partway through a Shift, the Timesheet splits
  at that time, such as bartender to barback.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Each part is its own Timesheet with its own Position, Department, and Bill Rate, linked to the other
    part.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: The parts' hours add up to the original hours.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: Each part is charged to its own Cost Center.
  rule_sources: []
  rule_decisions: []
