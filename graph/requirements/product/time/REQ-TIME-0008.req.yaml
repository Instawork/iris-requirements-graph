requirement_id: REQ-TIME-0008
requirement_target_layer: product
requirement_target_module: TIME
requirement_phase: MVP
requirement_title: Split a Timesheet when a Worker changes role
requirement_statement: >-
  When a Worker moves to another Position or Department partway through a Shift, the Timesheet splits
  at that time. Each part keeps its own Position, Department, Bill Rates, and Cost Center.
requirement_actors:
- AGENCY_USER
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency User splits a DRAFT or REJECTED Timesheet, and a Unit User, with a reason, a SUBMITTED or
    APPROVED one that is not locked.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-33
- rule_id: R2
  rule_statement: >-
    The user gives a switch time after clock_in and before clock_out, and a new Position, a new
    Department of the Shift's Unit, or both; anything else is refused.
  rule_sources:
  - SHEET TS-10
  - FEEDBACK split can also be department driven
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The Timesheet keeps the time before the switch, and a new Timesheet on the same Assignment, with split_from_id
    set, takes the time from the switch on.
  rule_sources:
  - SHEET TS-10
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    The new part copies the status, submission and approval details, rejected_reason, and
    exception_reasons of the Timesheet it came from, and its no_show is false.
  rule_sources: []
  rule_decisions:
  - D-33
  - D-59
- rule_id: R5
  rule_statement: >-
    break_minutes stay on the first part unless the user moves some to the new part, and the two parts'
    break_minutes always add up to the original.
  rule_sources: []
  rule_decisions:
  - D-59
- rule_id: R6
  rule_statement: >-
    A part whose Position changed takes the three Bill Rates of the Rate Line REQ-RATES-0005 finds for
    the Agency, that Position, the Unit, and the work date; any other part keeps the original rates.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  - SHEET TS-10
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    When no Rate Line exists for the new Position, the part keeps the original Bill Rates and carries
    RATE_VARIANCE whenever it is checked.
  rule_sources: []
  rule_decisions:
  - D-22
  - D-110
- rule_id: R8
  rule_statement: >-
    Each part is charged to its own Department's Cost Center, or to the Unit's when the part has no
    Department.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  - FEEDBACK Departments have their own cost centers
  rule_decisions: []
- rule_id: R9
  rule_statement: A part can be split again in the same way.
  rule_sources:
  - GRAPH data model one Timesheet per part
  rule_decisions:
  - D-59
- rule_id: R10
  rule_statement: >-
    A split of a Timesheet that has been submitted counts as a change to its hours, so REQ-TIME-0006 notifies
    the other party.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R11
  rule_statement: >-
    Both parts are saved through REQ-TIME-0001, which checks each part's times and recomputes its
    worked_minutes and hour classes.
  rule_sources:
  - SHEET TS-10
  rule_decisions:
  - D-229
