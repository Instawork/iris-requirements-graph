requirement_id: REQ-TIME-0006
requirement_target_layer: product
requirement_target_module: TIME
requirement_phase: MVP
requirement_title: Correct or reject a Timesheet with a reason
requirement_statement: >-
  A Unit User corrects the hours on a submitted or approved Timesheet, or rejects a submitted one back
  to the Agency, always with a reason. Each change to hours notifies the other party.
requirement_actors:
- UNIT_USER
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Unit User whose scope covers the Shift's Unit can correct clock_in, clock_out, and break_minutes
    on a SUBMITTED or APPROVED Timesheet that is not locked, and must give a reason.
  rule_sources:
  - SHEET TS-7
  - PRD §2 Shifts
  rule_decisions:
  - D-33
- rule_id: R2
  rule_statement: >-
    Corrected values must pass the same checks as hours entered under REQ-TIME-0001, or the correction
    is refused.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A correction replaces the billed values; the old values, the new values, who made it, and the reason
    stay in the Audit Trail, where both parties can see them.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    A corrected APPROVED Timesheet stays APPROVED, and a corrected SUBMITTED Timesheet is checked again
    by REQ-TIME-0005.
  rule_sources:
  - SHEET TS-7
  rule_decisions:
  - D-33
- rule_id: R5
  rule_statement: >-
    For a Timesheet with OUTSIDE_TOLERANCE, the Unit User can apply the Shift's scheduled start and end
    as the correction in one step, still with a reason.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-5
- rule_id: R6
  rule_statement: >-
    A Unit User can reject a SUBMITTED Timesheet with a required reason, which makes it REJECTED and sets
    rejected_reason; an APPROVED Timesheet cannot be rejected.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-33
- rule_id: R7
  rule_statement: >-
    On a rejection, Iris sends TIMESHEET_REJECTED with the reason, by email and in the app, to every active
    Agency User of the Worker's Agency.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    When hours, breaks, or no-show change on a Timesheet that has been submitted at least once, Iris sends
    TIMESHEET_CHANGED by email and in the app to the other party.
  rule_sources:
  - PRD Overview
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    For a Unit User's change the other party is every active Agency User of the Worker's Agency; for an
    Agency User's change it is every active Unit User whose scope covers the Unit.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
requirement_sources:
- SHEET TS-7
- PRD Overview
- PRD §2 Shifts
- SESSIONS Timesheets, Tips & Expenses
requirement_decisions:
