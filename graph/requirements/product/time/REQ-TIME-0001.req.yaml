requirement_id: REQ-TIME-0001
requirement_target_layer: product
requirement_target_module: TIME
requirement_phase: MVP
requirement_title: Hold a Timesheet for each assigned Worker
requirement_statement: >-
  Iris creates a Draft Timesheet for each assigned Worker when the Shift ends. It holds the hours the
  Agency bills, the Bill Rates, and the minutes in each hour class.
requirement_actors:
- SYSTEM
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    When a Shift's ends_at passes, Iris creates one DRAFT Timesheet for each ASSIGNED Assignment on it;
    an Assignment made after that gets its Timesheet at once.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
  - D-59
- rule_id: R2
  rule_statement: >-
    A new Timesheet takes the Shift's Position and Department and the Release's regular, overtime, and
    double-time Bill Rates, with no clock times, no break, and no_show false.
  rule_sources:
  - PRD Data Model
  - PRD §3 Supplier Rates
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    An Assignment has one Timesheet, or one for each part once it is split under REQ-TIME-0008.
  rule_sources:
  - SHEET TS-10
  - GRAPH data model Timesheet
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    An Agency User of the Worker's Agency enters or changes clock_in, clock_out, break_minutes, and regular_bill_rate
    while the Timesheet is DRAFT or REJECTED, and in no other status.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-33
- rule_id: R5
  rule_statement: >-
    A change is refused unless clock_out is later than clock_in and break_minutes, when given, is zero
    or more and less than the minutes between them.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R6
  rule_statement: Clock times are kept to the whole minute, with seconds dropped.
  rule_sources: []
  rule_decisions:
  - D-41
  - D-59
- rule_id: R7
  rule_statement: >-
    worked_minutes is clock_out minus clock_in minus break_minutes, and is 0 while either clock time is
    empty or no_show is true.
  rule_sources:
  - PRD §2 Shifts
  - GRAPH data model Timesheet
  rule_decisions: []
- rule_id: R8
  rule_statement: >-
    Whenever worked_minutes changes, Iris reclassifies the Worker's Timesheets at that Unit in that Work
    Week through REQ-LABOR-0005 and saves regular_minutes, overtime_minutes, and double_time_minutes on
    those not locked.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
- rule_id: R9
  rule_statement: >-
    After that, Iris gives the week's minutes before and after the change to REQ-LABOR-0003, which alerts
    when the change adds overtime.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
- rule_id: R10
  rule_statement: >-
    When an Agency User bills another regular_bill_rate, which must be above zero, the overtime and double-time
    Bill Rates change by the same ratio, rounded half up to the cent.
  rule_sources:
  - SHEET RC-10
  rule_decisions:
  - D-24
  - D-41
- rule_id: R11
  rule_statement: >-
    The amount for each hour class is its Bill Rate times its minutes divided by 60, rounded half up to
    the cent; it is computed, not stored.
  rule_sources:
  - PRD §3 Supplier Rates
  rule_decisions:
  - D-41
- rule_id: R12
  rule_statement: >-
    Every change to a Timesheet is written to the Audit Trail with who made it, when, and the old and
    new values.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
requirement_sources:
- SHEET 4.3
- PRD §2 Shifts
- PRD §2 Shift statuses
- PRD Data Model
