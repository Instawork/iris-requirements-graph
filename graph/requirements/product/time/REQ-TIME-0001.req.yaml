requirement_id: REQ-TIME-0001
requirement_target_layer: product
requirement_target_module: TIME
requirement_phase: MVP
requirement_title: Hold a Timesheet for each assigned Worker
requirement_statement: >-
  Iris creates a Draft Timesheet for each assigned Worker when the Shift ends. It holds the hours the
  Agency bills, the Bill Rates, and the minutes in each hour class.
requirement_actors:
- SYSTEM
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A job of REQ-JOBS-0001 runs every five minutes and creates one DRAFT Timesheet for each ASSIGNED
    Assignment that has none, on every Shift that is not CANCELLED and whose ends_at has passed.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
  - D-121
  - D-68
- rule_id: R2
  rule_statement: >-
    A new Timesheet takes the Shift's Position and Department and the Release's regular, overtime, and
    double-time Bill Rates, with no clock times, no break, and no_show false.
  rule_sources:
  - PRD Data Model
  - PRD §3 Supplier Rates
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    An Assignment has one Timesheet, or one for each part once it is split under REQ-TIME-0008.
  rule_sources:
  - SHEET TS-10
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    An Agency User of the Worker's Agency enters or changes clock_in, clock_out, and break_minutes
    while the Timesheet is DRAFT or REJECTED, and in no other status.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-33
- rule_id: R5
  rule_statement: >-
    A change is refused when clock_out is not later than clock_in, or when break_minutes is negative
    or not less than the minutes between them; an empty value is not checked.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R6
  rule_statement: Clock times are kept to the whole minute, with seconds dropped.
  rule_sources: []
  rule_decisions:
  - D-41
  - D-121
- rule_id: R7
  rule_statement: >-
    worked_minutes is clock_out minus clock_in minus break_minutes, and is 0 while either clock time
    is empty or no_show is true.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions:
  - D-121
- rule_id: R8
  rule_statement: >-
    Whenever worked_minutes changes, Iris reclassifies through REQ-LABOR-0005 every Timesheet of that
    Worker whose own Unit's Work Week holds the changed work date, and saves the three minute classes
    on those not locked.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
- rule_id: R9
  rule_statement: >-
    After that, Iris gives REQ-LABOR-0003 the Worker's Shifts in the Work Week of the changed
    Timesheet's Unit, before and after the change, and it alerts when the change adds overtime.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-4
- rule_id: R10
  rule_statement: >-
    Nobody enters or changes a Bill Rate on a Timesheet: its three rates stay those of R2, or of the
    Rate Line for a part REQ-TIME-0008 splits to another Position.
  rule_sources:
  - PRD §7 What the agent accepts
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions:
  - D-69
- rule_id: R11
  rule_statement: >-
    The amount for each hour class is its Bill Rate times its minutes divided by 60, rounded half up to
    the cent; it is computed, not stored.
  rule_sources:
  - PRD §3 Supplier Rates
  rule_decisions:
  - D-41
- rule_id: R12
  rule_statement: >-
    Every change to a Timesheet is written to the Audit Trail with who made it, when, and the old and
    new values.
  rule_sources:
  - PRD §2 Shifts
  rule_decisions: []
- rule_id: R13
  rule_statement: >-
    When REQ-WORKFORCE-0003 assigns a Worker after the Shift's ends_at, this requirement creates that
    Assignment's DRAFT Timesheet in the same transaction, so hours can be saved to it at once.
  rule_sources:
  - PRD §2 Shift statuses
  rule_decisions:
  - D-18
- rule_id: R14
  rule_statement: >-
    A clock time is a local date and time at the Unit; one that does not exist on a daylight-saving
    change is refused, and one that occurs twice means the occurrence nearest the scheduled time.
  rule_sources: []
  rule_decisions:
  - D-122
- rule_id: R15
  rule_statement: >-
    Each change to a Timesheet's hours or no-show is published as an event; REQ-TIPS-0001 re-splits
    its Tip Pools and REQ-TIME-0005 rechecks it while it is SUBMITTED.
  rule_sources:
  - SHEET TS-11
  - SHEET TS-7
  rule_decisions: []
