requirement_id: REQ-TIME-0005
requirement_target_layer: product
requirement_target_module: TIME
requirement_phase: MVP
requirement_title: Auto-approve within tolerance and surface exceptions
requirement_statement: >-
  Iris approves a submitted Timesheet whose billed times match the schedule within the Approval Tolerance
  and that has no other exception. Every other one goes to the Unit's exception list with its reasons.
requirement_actors:
- SYSTEM
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Iris checks a Timesheet each time it becomes SUBMITTED, and again whenever its hours, no-show, Bill
    Rates, or Expenses change while it is SUBMITTED.
  rule_sources:
  - SHEET TS-7
  rule_decisions:
  - D-22
- rule_id: R2
  rule_statement: >-
    Each check replaces exception_reasons with every reason that applies; when none applies, the Timesheet
    becomes APPROVED with approved_at set and approved_by left empty.
  rule_sources:
  - SHEET TS-7
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    MISSING_TIMES applies when no_show is false and clock_in or clock_out is empty.
  rule_sources:
  - SHEET TS-7
  rule_decisions:
  - D-22
- rule_id: R4
  rule_statement: >-
    OUTSIDE_TOLERANCE applies when clock_in differs from the Shift's starts_at, or clock_out from its
    ends_at, by more than APPROVAL_TOLERANCE_MINUTES minutes, resolved for the Shift's Unit.
  rule_sources:
  - SHEET TS-7
  rule_decisions:
  - D-16
- rule_id: R5
  rule_statement: >-
    MISSED_BREAK and BELOW_MINIMUM_WAGE apply when REQ-LABOR-0002 returns them for the billed times, the
    break, and the regular Pay Rate of the Timesheet's Rate Line.
  rule_sources:
  - SHEET WA-18
  rule_decisions:
  - D-22
- rule_id: R6
  rule_statement: >-
    The Timesheet's Rate Line is its Release's rate_line_id, or for a part split to another Position,
    the line REQ-RATES-0005 finds for that Position.
  rule_sources: []
  rule_decisions:
  - D-22
  - D-69
- rule_id: R7
  rule_statement: >-
    A Timesheet that bills its Release's Bill Rates never carries RATE_VARIANCE; only a part split to
    another Position can, as R13 says.
  rule_sources:
  - SHEET RC-10
  rule_decisions:
  - D-22
  - D-69
- rule_id: R8
  rule_statement: PENDING_EXPENSE applies when any Expense on the Timesheet is PENDING.
  rule_sources:
  - SHEET TS-12
  rule_decisions:
  - D-22
- rule_id: R9
  rule_statement: >-
    Overtime or double-time minutes alone add no reason, and a no-show Timesheet can carry only PENDING_EXPENSE.
  rule_sources:
  - SHEET WA-19
  rule_decisions:
  - D-22
- rule_id: R10
  rule_statement: >-
    For a split Timesheet, the first part's clock_in, the last part's clock_out, and the parts' total
    break are compared with the schedule, the planned break, and the break rule, and every part
    carries the result.
  rule_sources: []
  rule_decisions:
  - D-22
  - D-59
- rule_id: R11
  rule_statement: >-
    A SUBMITTED Timesheet with any reason stays SUBMITTED and appears, with its reasons, on the exception
    list of each Unit User whose scope covers the Shift's Unit.
  rule_sources:
  - SHEET TS-7
  rule_decisions: []
- rule_id: R12
  rule_statement: >-
    exception_reasons are kept after approval, and are recomputed without changing the status when an
    APPROVED Timesheet is corrected.
  rule_sources:
  - SHEET RC-10
  rule_decisions:
  - D-33
- rule_id: R13
  rule_statement: >-
    For a part split to another Position, RATE_VARIANCE applies instead when REQ-RATES-0006 reports a
    rate variance, or no contracted rate, for that Position's regular Bill Rate.
  rule_sources:
  - SHEET RC-10
  rule_decisions:
  - D-22
  - D-117
- rule_id: R14
  rule_statement: >-
    Each Timesheet also shows the rate variance REQ-RATES-0006 finds between its three Bill Rates and
    the contracted Rate Line, before and after approval; that flag alone adds no reason.
  rule_sources:
  - SHEET RC-10
  rule_decisions:
  - D-22
- rule_id: R15
  rule_statement: >-
    AGENCY_TIP applies when the Timesheet has a tip with no pool and no cashier PIN, which only an Agency
    User enters.
  rule_sources: []
  rule_decisions:
  - D-22
  - D-28
- rule_id: R16
  rule_statement: >-
    Agency Users see the exception_reasons on the Timesheets of their own Agency's Workers.
  rule_sources:
  - 'SESSIONS Timesheets, Tips & Expenses'
  rule_decisions:
  - D-22
- rule_id: R17
  rule_statement: >-
    LATE_SUBMISSION applies when submitted_at is later than LOCK_WINDOW_HOURS hours, resolved for the
    Shift's Unit, after the Shift's ends_at.
  rule_sources:
  - SHEET TS-7
  - SHEET TS-9
  rule_decisions:
  - D-22
  - D-16
- rule_id: R18
  rule_statement: >-
    ADDED_AFTER_SHIFT applies when the Timesheet's Assignment has an assigned_at later than the
    Shift's ends_at, which REQ-WORKFORCE-0003 allows even beyond the Release's headcount.
  rule_sources:
  - SHEET TS-7
  rule_decisions:
  - D-22
  - D-18
- rule_id: R19
  rule_statement: >-
    SHORT_BREAK applies when no_show is false, both clock times are set, and break_minutes, counting
    empty as 0, are fewer than the Shift's planned break_minutes.
  rule_sources:
  - SHEET TS-7
  rule_decisions:
  - D-22
