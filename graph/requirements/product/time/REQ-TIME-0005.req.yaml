requirement_id: REQ-TIME-0005
requirement_target_layer: product
requirement_target_module: TIME
requirement_phase: MVP
requirement_title: Auto-approve within tolerance and surface exceptions
requirement_statement: >-
  Iris approves submitted Timesheets that match the schedule within the Approval Tolerance, and puts every
  other one on the Unit's exception list.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Timesheet matches when its billed clock-in and clock-out are each within the tolerance of the scheduled
    times.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Rate variance, a missed required break, overtime, a missing clock-out, or a no-show makes a Timesheet
    an exception.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Exceptions are listed with their reason and, where Iris has one, a proposed fix.
  rule_sources: []
  rule_decisions: []
- rule_id: R4
  rule_statement: The Approval Tolerance and whether auto-approval is on are Settings.
  rule_sources: []
  rule_decisions: []
