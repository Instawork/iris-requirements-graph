data_model:
  status: covered
  reads:
  - Timesheet.*
  - Assignment.status
  - Assignment.worker_id
  - Assignment.release_id
  - Release.shift_id
  - Shift.request_id
  - Request.unit_id
  - Worker.agency_id
  - Release.agency_id
  - Shift.position_id
  - Shift.starts_at
  - Shift.ends_at
  - Worker.first_name
  - Worker.last_name
  - Worker.email
  - Position.name
  - Unit.org_node_id
  - Unit.timezone
  - OrgNode.name
  writes:
  - Timesheet.assignment_id
  - Timesheet.position_id
  - Timesheet.clock_in
  - Timesheet.clock_out
  - Timesheet.break_minutes
  - Timesheet.no_show
  - Timesheet.worked_minutes
  - Timesheet.regular_minutes
  - Timesheet.overtime_minutes
  - Timesheet.double_time_minutes
  detail: >-
    assignment_id and position_id are only matched, to find the Timesheet a line belongs to; an upload
    never changes them. Hours are saved through REQ-TIME-0001, REQ-TIME-0006, and REQ-TIME-0009, which
    recompute worked_minutes and the hour classes.
