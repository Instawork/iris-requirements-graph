requirement_id: REQ-TIME-0003
requirement_target_layer: product
requirement_target_module: TIME
requirement_phase: MVP
requirement_title: Read Timesheets in any format and match them to Shifts
requirement_statement: >-
  A user sends hours as a template, PDF, CSV, spreadsheet, or photo of a paper sign-in sheet. Iris matches
  each line to a Worker's Timesheet and proposes the hours for approval.
requirement_actors:
- AGENCY_USER
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    The TIMESHEETS upload type takes the template or a PDF, CSV, spreadsheet, or image in any layout,
    including a photo of a paper sign-in sheet read with OCR.
  rule_sources:
  - SHEET TS-5
  - FEEDBACK OCR to match paper timesheets
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    An Agency User uploads hours for their own Agency's Workers, and a Unit User for Shifts at Units in
    their scope.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A line's Shift is the one with its shift_id, or else the single Shift at the named Unit on that work
    date for that Position.
  rule_sources:
  - SHEET TS-5
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    A line's Worker is matched by REQ-WORKFORCE-0002 within the Agency for an Agency User's file, and
    among the Workers assigned to the Shift for a Unit User's file.
  rule_sources:
  - SHEET TS-5
  - PRD §4 How the system matches a professional
  rule_decisions: []
- rule_id: R5
  rule_statement: >-
    A matched line points to the Timesheet of that Worker's Assignment on that Shift; a line with no single
    Shift, Worker, or unsplit Timesheet is a problem.
  rule_sources:
  - SHEET TS-5
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    Every line appears in a Proposal with the hours read, and the uploader matches problem lines by hand,
    edits them, or drops them before anything is saved.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A clock time given without a date is read as the occurrence of that time nearest the Shift's scheduled
    start, for clock_in, or end, for clock_out.
  rule_sources:
  - PRD §6 Templates
  rule_decisions:
  - D-230
- rule_id: R8
  rule_statement: >-
    When an Agency User's line names a Worker with no Assignment on the Shift, the Proposal offers to
    assign them through REQ-WORKFORCE-0003, creating a new Worker through REQ-WORKFORCE-0001 if needed.
  rule_sources:
  - PRD §4 Professionals
  rule_decisions:
  - D-164
- rule_id: R9
  rule_statement: >-
    An Agency User's accepted lines save clock_in, clock_out, and break_minutes to DRAFT and REJECTED
    Timesheets through REQ-TIME-0001, which checks them and recomputes worked_minutes and the hour
    classes.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-33
- rule_id: R10
  rule_statement: >-
    A Unit User's accepted lines are saved as corrections to SUBMITTED and APPROVED Timesheets under REQ-TIME-0006,
    each with the reason in its reason column.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-33
  - D-114
  - D-139
- rule_id: R11
  rule_statement: >-
    A line for a Timesheet the uploader may not change in its current status is reported as a problem
    and not saved.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions:
  - D-33
- rule_id: R12
  rule_statement: >-
    A line whose no_show is Yes marks the Timesheet a no-show under REQ-TIME-0009 instead of saving clock
    times.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R13
  rule_statement: >-
    An upload never submits or approves a Timesheet; those stay separate steps in REQ-TIME-0002.
  rule_sources:
  - SESSIONS Timesheets, Tips & Expenses
  rule_decisions: []
- rule_id: R14
  rule_statement: >-
    A line whose no_show is not Yes needs both clock_in and clock_out; a line missing either is a problem
    for the uploader to complete or drop.
  rule_sources:
  - PRD §6 Templates
  rule_decisions: []
- rule_id: R15
  rule_statement: >-
    A second line for the same Timesheet in one file is a duplicate of the first.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R16
  rule_statement: >-
    A Unit User's line with an empty reason is a problem for the uploader to complete or drop, because
    REQ-TIME-0006 and REQ-TIME-0009 take a Unit User's change only with a reason.
  rule_sources:
  - PRD §7 What the agent checks
  rule_decisions:
  - D-139
