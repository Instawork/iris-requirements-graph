requirement_id: REQ-TIME-0007
requirement_target_layer: product
requirement_target_module: TIME
requirement_phase: MVP
requirement_title: Lock approved Timesheets after the Lock Window
requirement_statement: >-
  An approved Timesheet locks once the Lock Window after its Shift has passed, 48 hours by default, and
  never sooner than 24 hours after its approval. A locked Timesheet cannot change, and an unapproved one
  stays open and shows as late. Each Timesheet locks on its own time, whatever Tip Pool covers it.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A Timesheet's lock time is the later of its Shift's ends_at plus LOCK_WINDOW_HOURS hours, resolved
    for the Shift's Unit, and its approved_at plus 24 hours.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-153
  - D-16
- rule_id: R2
  rule_statement: >-
    An interval job of REQ-JOBS-0001 sets locked_at on each APPROVED Timesheet whose lock time has passed.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-13
  - D-67
- rule_id: R3
  rule_statement: >-
    A Timesheet that is DRAFT, SUBMITTED, or REJECTED when the window closes does not lock; it stays open
    and shows as late to its Agency and its Unit until it is approved.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-13
- rule_id: R4
  rule_statement: >-
    Once locked_at is set, nobody can change the Timesheet's hours, no-show, Bill Rates, tips,
    Expenses, or status, or split it, and its minutes are never reclassified.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-33
- rule_id: R5
  rule_statement: >-
    Nothing unlocks a Timesheet in MVP, including a later change to LOCK_WINDOW_HOURS; corrections after
    lock arrive with invoicing in Phase 2.
  rule_sources:
  - SHEET TS-9
  - SHEET 5.2
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    Each Timesheet locks at its own lock time, whatever Tip Pool covers it, and from then
    REQ-TIPS-0001.R17 keeps its tips as they are.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-60
- rule_id: R8
  rule_statement: >-
    Each lock is published as an event, to which REQ-TIPS-0004 reacts under its own rules.
  rule_sources:
  - SHEET TS-9
  - SHEET TS-11
  rule_decisions:
  - D-135
