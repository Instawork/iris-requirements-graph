requirement_id: REQ-TIME-0007
requirement_target_layer: product
requirement_target_module: TIME
requirement_phase: MVP
requirement_title: Lock approved Timesheets after the Lock Window
requirement_statement: >-
  An approved Timesheet locks once the Lock Window after its Shift has passed, 48 hours by default. A
  locked Timesheet cannot change, and an unapproved one stays open and shows as late.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Iris sets locked_at on an APPROVED Timesheet once LOCK_WINDOW_HOURS hours, resolved for the Shift's
    Unit, have passed since the Shift's ends_at.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-13
  - D-16
- rule_id: R2
  rule_statement: >-
    A Timesheet approved after that time locks at the moment it is approved.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-13
- rule_id: R3
  rule_statement: >-
    A Timesheet that is DRAFT, SUBMITTED, or REJECTED when the window closes does not lock; it stays open
    and shows as late to its Agency and its Unit until it is approved.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-13
- rule_id: R4
  rule_statement: >-
    Once locked_at is set, nobody can change the Timesheet's hours, no-show, Bill Rates, or status, or
    split it, and its minutes are never reclassified.
  rule_sources:
  - SHEET TS-9
  rule_decisions:
  - D-33
- rule_id: R5
  rule_statement: >-
    Nothing unlocks a Timesheet in MVP, including a later change to LOCK_WINDOW_HOURS; corrections after
    lock arrive with invoicing in Phase 2.
  rule_sources:
  - SHEET TS-9
  - SHEET 5.2
  rule_decisions: []
requirement_sources:
- SHEET TS-9
