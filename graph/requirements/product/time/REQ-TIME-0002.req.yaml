requirement_title: Submit and approve Timesheets daily or per Event
requirement_statement: >-
  An Agency submits Timesheets as soon as a Shift is worked, and the Unit approves them the same day or
  per Event, not only at week end.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    An Agency User submits one Timesheet, or every Timesheet for a Shift or an Event, at once.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A Unit User approves, corrects, or rejects each submitted Timesheet that was not auto-approved.
  rule_sources: []
