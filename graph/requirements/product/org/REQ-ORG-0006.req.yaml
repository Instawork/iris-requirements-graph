requirement_id: REQ-ORG-0006
requirement_target_layer: product
requirement_target_module: ORG
requirement_phase: MVP
requirement_title: Resolve a Setting for a Unit
requirement_statement: >-
  Given a Setting key and a Unit, Iris returns the value in force there. The nearest override up the org
  tree wins, then the program default, then the catalog default.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    For a key the catalog scopes as any, the value is the Setting row at the Unit's node, else the row
    at its nearest ancestor that has one.
  rule_sources:
  - FAQ
  - SHEET WA-19
  rule_decisions:
  - D-16
- rule_id: R2
  rule_statement: >-
    When no node on that path has a row, the value is the program default row, which names no org node.
  rule_sources:
  - FAQ
  rule_decisions:
  - D-16
- rule_id: R3
  rule_statement: >-
    When there is no program default row, the value is the key's default in the settings catalog.
  rule_sources: []
  rule_decisions:
  - D-16
- rule_id: R4
  rule_statement: >-
    A key the catalog scopes as program needs no Unit and resolves only from the program default row,
    else the catalog default.
  rule_sources:
  - GRAPH a program-wide Setting has no Unit to resolve from
  rule_decisions:
  - D-16
- rule_id: R5
  rule_statement: >-
    The value is returned in the key's catalog type: a whole number, true or false, or a gate mode of
    SOFT or HARD.
  rule_sources:
  - GRAPH the settings catalog gives each key a type
  rule_decisions:
  - D-16
requirement_sources:
- FAQ
- SHEET TS-9
- SHEET WA-19
- SHEET RC-11
requirement_decisions:
- D-16
requirement_features: []
edges:
