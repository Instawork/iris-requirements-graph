requirement_id: REQ-ORG-0005
requirement_target_layer: product
requirement_target_module: ORG
requirement_phase: MVP
requirement_title: Grant a role within a scope
requirement_statement: >-
  A Role Grant gives one User one role and the scope it covers. Program Users, Agency Users, and Instawork
  Admins invite Users and grant or revoke roles within the limits below.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- AGENCY_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A UNIT_USER grant names one org node at any level and no Agency, and covers every Unit at or beneath
    that node.
  rule_sources:
  - SHEET PLT-1
  - SHEET PLT-2
  - FAQ Who uses Iris day to day?
  rule_decisions:
  - D-185
- rule_id: R2
  rule_statement: An AGENCY_USER grant names one Agency and no org node.
  rule_sources:
  - SHEET PLT-1
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    PROGRAM_USER and INSTAWORK_ADMIN grants name neither an org node nor an Agency, and a Program User
    covers the whole program.
  rule_sources:
  - SHEET PLT-1
  rule_decisions:
  - D-185
- rule_id: R4
  rule_statement: >-
    A Program User may grant UNIT_USER, AGENCY_USER, and PROGRAM_USER to any User.
  rule_sources:
  - SHEET PLT-1
  rule_decisions:
  - D-25
  - D-186
- rule_id: R5
  rule_statement: >-
    An Agency User may grant only AGENCY_USER, and only for the Agency of their own grant.
  rule_sources: []
  rule_decisions:
  - D-25
- rule_id: R6
  rule_statement: >-
    An Instawork Admin may grant only PROGRAM_USER, and only while no active User who has accepted their
    invite holds an unrevoked PROGRAM_USER grant.
  rule_sources: []
  rule_decisions:
  - D-83
- rule_id: R7
  rule_statement: >-
    At every start, when the User with the configured Instawork Admin email holds no INSTAWORK_ADMIN
    grant, Iris saves one with no granting User.
  rule_sources:
  - GRAPH the first grant has nobody to grant it
  rule_decisions:
  - D-98
- rule_id: R8
  rule_statement: >-
    The grantee is an existing User, or a new one invited through REQ-IDENTITY-0002 in the same action;
    nobody is invited without a grant.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-25
- rule_id: R9
  rule_statement: >-
    A User may hold several grants; one that repeats an unrevoked role and scope is refused, and
    granting a revoked one again clears its revoked_at and records the User who granted it again.
  rule_sources:
  - GRAPH a User may hold more than one Role Grant
  rule_decisions:
  - D-161
- rule_id: R10
  rule_statement: >-
    Whoever may grant a role and scope may revoke it; revoking sets revoked_at and ends that grant's access
    at once.
  rule_sources: []
  rule_decisions:
  - D-25
- rule_id: R11
  rule_statement: >-
    Through REQ-IDENTITY-0004, a Program User may deactivate or reactivate any User who is not an
    Instawork Admin, and an Agency User only one whose every grant is AGENCY_USER for their own Agency.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-25
- rule_id: R12
  rule_statement: >-
    An invite, grant, revoke, or deactivation outside these limits is refused, nothing is saved, and the
    User is told why.
  rule_sources:
  - PRD §7 When the agent is unsure
  rule_decisions:
  - D-25
- rule_id: R13
  rule_statement: >-
    Whoever may grant a User's role and scope may send that User's invite again through REQ-IDENTITY-0002
    until it is accepted.
  rule_sources:
  - SHEET PLT-4
  rule_decisions:
  - D-25
  - D-170
- rule_id: R14
  rule_statement: >-
    A Program User sees every User and their Role Grants, and an Agency User sees only the Users who
    hold an AGENCY_USER grant for their own Agency.
  rule_sources:
  - SHEET PLT-1
  rule_decisions:
  - D-25
- rule_id: R15
  rule_statement: >-
    An Instawork Admin may revoke a PROGRAM_USER grant, or send its invite again, only for a User who
    has not accepted their invite, and only while R6 would allow a grant.
  rule_sources: []
  rule_decisions:
  - D-83
- rule_id: R16
  rule_statement: >-
    An Instawork Admin sees only the Users who hold an unrevoked PROGRAM_USER grant and have not
    accepted their invite.
  rule_sources: []
  rule_decisions:
  - D-83
- rule_id: R17
  rule_statement: >-
    No User grants or revokes INSTAWORK_ADMIN.
  rule_sources: []
  rule_decisions:
  - D-26
  - D-98
requirement_sources:
- SHEET PLT-1
- SHEET PLT-4
requirement_decisions:
- D-25
- D-26
- D-83
- D-98
- D-161
- D-170
- D-185
- D-186
requirement_features:
- PLT-1
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-ORG-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-IDENTITY-0001
- edge_type: DEPENDS_ON
  requirement_id: REQ-IDENTITY-0002
- edge_type: DEPENDS_ON
  requirement_id: REQ-IDENTITY-0004
- edge_type: DEPENDS_ON
  requirement_id: REQ-AUDIT-0001
data_model:
  status: covered
  reads:
  - RoleGrant.*
  - OrgNode.*
  - User.active
  - User.invite_accepted_at
  writes:
  - RoleGrant.*
  detail: >-
    The caller gives agency_id; Agency records are not read here. User records change only through
    REQ-IDENTITY-0001, REQ-IDENTITY-0002, and REQ-IDENTITY-0004. REQ-ORG-0009 depends on this
    requirement, so these rules themselves state who may invite, grant, and deactivate; "a Program User"
    or "an Agency User" in them means the acting role of the request.
requirement_starting_flow: true
