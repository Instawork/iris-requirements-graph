requirement_id: REQ-ORG-0010
requirement_target_layer: product
requirement_target_module: ORG
requirement_phase: MVP
requirement_title: Change a Setting
requirement_statement: >-
  A Program User changes the program default of a Setting, or overrides it for one Sector, Region, District,
  or Unit. The change applies the next time the Setting is resolved.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: Only a Program User sets, changes, or removes a Setting value.
  rule_sources: []
  rule_decisions:
  - D-53
- rule_id: R2
  rule_statement: >-
    A key the catalog scopes as any takes a program default and an override at any Sector, Region, District,
    or Unit node, with one value per key and node.
  rule_sources:
  - FAQ Settings for each sector
  - SHEET WA-19
  - SHEET TS-9
  rule_decisions:
  - D-156
- rule_id: R3
  rule_statement: >-
    A key the catalog scopes as program takes only a program default, and an override at an org node is
    refused.
  rule_sources:
  - GRAPH a program-wide Setting has no Unit to resolve from
  rule_decisions:
  - D-156
- rule_id: R4
  rule_statement: >-
    A value that does not fit the key's catalog type (a whole number of 0 or more, true or false, or SOFT
    or HARD) is refused.
  rule_sources:
  - GRAPH the settings catalog gives each key a type
  rule_decisions:
  - D-79
- rule_id: R5
  rule_statement: >-
    Removing an override deletes its row so the next value up the tree applies, and removing the program
    default restores the catalog default.
  rule_sources: []
  rule_decisions:
  - D-156
requirement_sources:
- FAQ Settings for each sector
- SHEET TS-9
- SHEET WA-19
requirement_decisions:
- D-53
- D-79
- D-156
requirement_features: []
