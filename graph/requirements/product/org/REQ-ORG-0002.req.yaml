requirement_id: REQ-ORG-0002
requirement_target_layer: product
requirement_target_module: ORG
requirement_phase: MVP
requirement_title: Add a Unit and its Departments
requirement_statement: >-
  A Program User adds a Unit under a District by form, with its address, Company, Work Week start,
  and at least one Department. Iris sets the Unit's Market from its ZIP code.
requirement_actors:
- PROGRAM_USER
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Only a Program User adds a Unit; it is saved as a UNIT node under an active District, together with
    one Unit record.
  rule_sources:
  - SESSIONS Shift Creation
  - SHEET PLT-2
  rule_decisions:
  - D-53
- rule_id: R2
  rule_statement: >-
    In MVP a Unit enters Iris only by this form or a UNITS file, never by sync from another system (C-8).
  rule_sources:
  - SESSIONS Shift Creation
  - SHEET PLT-8
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    A Unit needs a name no other Unit has, address line, city, two-letter USPS state code, five-digit ZIP
    code, Company, and Work Week start day; one missing or malformed is refused.
  rule_sources:
  - PRD Data Model
  - SHEET WA-18
  - SHEET WA-20
  - SHEET PLT-2
  rule_decisions:
  - D-54
- rule_id: R4
  rule_statement: >-
    The Unit's Market is the Market that holds its ZIP code; a ZIP code in no Market is refused.
  rule_sources:
  - PRD §3 Supplier Rates
  rule_decisions:
  - D-21
- rule_id: R5
  rule_statement: >-
    The time zone is an IANA zone; when the form leaves it empty Iris fills it from the ZIP code, and
    refuses the Unit when it cannot place that ZIP code.
  rule_sources:
  - DEMO lib/types.ts
  - GRAPH every Shift time at a Unit is read in its time zone
  rule_decisions:
  - D-85
- rule_id: R6
  rule_statement: >-
    A Company name not yet on file is added as a new Company, and a name already on file is reused.
  rule_sources:
  - SESSIONS Shift Creation
  - SHEET PLT-2
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A Program User adds, renames, deactivates, or reactivates a Department; each has a name unique within its Unit
    and a cost center code no other Department has.
  rule_sources:
  - FEEDBACK Departments within venues
  - SHEET PLT-2
  rule_decisions:
  - D-53
- rule_id: R8
  rule_statement: >-
    The Program User may mark the Unit a secured site and set its default parking, entrance, directions,
    site contact, and attire.
  rule_sources:
  - SHEET WA-17
  - SHEET SC-6
  - SHEET SC-11
  rule_decisions: []
- rule_id: R9
  rule_statement: >-
    A Unit User whose Role Grant covers the Unit may change its default site instructions and no other
    Unit field.
  rule_sources:
  - SHEET SC-11
  - SHEET SC-6
  rule_decisions:
  - D-53
- rule_id: R10
  rule_statement: >-
    A Program User may later change any Unit field, and changing the ZIP code sets the Market again by
    the same rule.
  rule_sources: []
  rule_decisions:
  - D-21
  - D-53
- rule_id: R11
  rule_statement: >-
    A Program User deactivates or reactivates a Unit by changing its node's active flag, reactivating only
    under an active District; an inactive Unit keeps its records and accepts no new Request.
  rule_sources: []
  rule_decisions:
  - D-53
  - D-191
  - D-80
- rule_id: R12
  rule_statement: >-
    When REQ-CATALOG-0002 adds a ZIP code to a Market, every Unit with that ZIP code takes that Market;
    removing a ZIP code from a Market changes no Unit.
  rule_sources:
  - PRD §3 Supplier Rates
  rule_decisions:
  - D-219
- rule_id: R13
  rule_statement: >-
    Changing a Unit's time zone moves no stored instant, so the local times and work dates of that Unit's
    Shifts and Timesheets are read in the new zone from then on.
  rule_sources: []
  rule_decisions:
  - D-218
- rule_id: R14
  rule_statement: >-
    A new Department copies its address and default site instructions from its Unit unless given, and a
    Program User may change them later.
  rule_sources: []
  rule_decisions:
  - D-264
- rule_id: R15
  rule_statement: >-
    Changing a Unit's address or default site instructions leaves each Department's copy as it was saved.
  rule_sources: []
  rule_decisions:
  - D-264
- rule_id: R16
  rule_statement: >-
    A Unit User whose Role Grant covers the Unit may change a Department's default parking, entrance,
    directions, site contact, and attire.
  rule_sources: []
  rule_decisions:
  - D-264
- rule_id: R17
  rule_statement: >-
    A Program User may name a Unit's primary operator, an active User with an unrevoked UNIT_USER grant
    covering the Unit, or leave it empty.
  rule_sources:
  - GRAPH Instawork's Business keeps one contact name, phone, and email
  rule_decisions:
  - D-266
- rule_id: R18
  rule_statement: >-
    A primary operator who is deactivated or no longer covered by an unrevoked UNIT_USER grant is shown
    as none until a Program User names another.
  rule_sources: []
  rule_decisions:
  - D-266
- rule_id: R19
  rule_statement: >-
    A Unit is saved with at least one Department, and its last active Department cannot be deactivated
    while the Unit is active.
  rule_sources:
  - FEEDBACK Departments within venues, with their own cost centers
  rule_decisions:
  - D-276
