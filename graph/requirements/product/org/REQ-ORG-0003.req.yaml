requirement_id: REQ-ORG-0003
requirement_target_layer: product
requirement_target_module: ORG
requirement_phase: MVP
requirement_title: Load Units and Departments from a file
requirement_statement: >-
  A Program User loads many Units and their Departments at once from a UNITS file (C-8). The rows become
  a Proposal, and nothing is saved until the Program User approves it.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Only a Program User sends a UNITS file, with one row per Department, or one row for a Unit that has
    none.
  rule_sources:
  - SESSIONS Shift Creation
  - SHEET PLT-2
  rule_decisions:
  - D-53
- rule_id: R2
  rule_statement: >-
    Each row must give sector, region, district, unit, address_line, city, state, zip, unit_cost_center,
    and work_week_start; department_cost_center is required when department is set.
  rule_sources:
  - SESSIONS Shift Creation
  - SHEET PLT-2
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    The timezone, secured_site, and department columns are optional; an empty timezone is filled from
    the ZIP code and an empty secured_site means not secured.
  rule_sources:
  - DEMO lib/types.ts
  - SHEET WA-17
  rule_decisions:
  - D-88
- rule_id: R4
  rule_statement: >-
    Each row is checked and saved by the rules of REQ-ORG-0002, so a ZIP code in no Market or a name
    another Unit already has is a row problem.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-21
  - D-54
- rule_id: R5
  rule_statement: >-
    A row that repeats an earlier row's Unit and Department is reported as a duplicate, and rows for one
    Unit that disagree on a Unit column are row problems.
  rule_sources:
  - PRD §6 Uploads
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A Sector, Region, or District that a row names but the tree lacks is a row problem whose proposed
    fix adds it through REQ-ORG-0008 when accepted.
  rule_sources:
  - SESSIONS Shift Creation
  rule_decisions: []
requirement_sources:
- SESSIONS Shift Creation
- SHEET PLT-2
requirement_decisions:
- D-21
- D-53
