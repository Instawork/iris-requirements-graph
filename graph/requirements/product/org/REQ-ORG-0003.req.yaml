requirement_id: REQ-ORG-0003
requirement_target_layer: product
requirement_target_module: ORG
requirement_phase: MVP
requirement_title: Load Units and Departments from a file
requirement_statement: >-
  A Program User loads many Units and their Departments at once from a UNITS file (C-8). The rows become
  a Proposal, and nothing is saved until the Program User approves it.
requirement_actors:
- PROGRAM_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Only a Program User sends a UNITS file, with one row for each Department of each Unit.
  rule_sources:
  - SESSIONS Shift Creation
  - SHEET PLT-2
  rule_decisions:
  - D-53
- rule_id: R2
  rule_statement: >-
    Each row must give sector, region, district, unit, address_line, city, state, zip, company,
    work_week_start, department, and department_cost_center.
  rule_sources:
  - SESSIONS Shift Creation
  - SHEET PLT-2
  rule_decisions:
  - D-276
- rule_id: R3
  rule_statement: >-
    The timezone, secured_site, and department address columns are optional; an empty timezone is filled
    from the ZIP code and an empty secured_site means not secured.
  rule_sources:
  - DEMO lib/types.ts
  - SHEET WA-17
  rule_decisions:
  - D-85
- rule_id: R4
  rule_statement: >-
    Each row is checked before the Proposal is shown, without saving, and again when it is saved, against
    REQ-ORG-0002.R1, R3, R4, R5, and R7, so a ZIP code in no Market is a row problem.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-21
- rule_id: R5
  rule_statement: >-
    A row that repeats an earlier row's Unit and Department is reported as a duplicate, and rows for one
    Unit that disagree on a Unit column are row problems.
  rule_sources:
  - PRD §6 Uploads
  - PRD §7 What the agent checks
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    A Sector, Region, or District that a row names but the tree lacks is a row problem whose proposed
    fix adds it through REQ-ORG-0008 when accepted.
  rule_sources:
  - SESSIONS Shift Creation
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    The rows of one file that name the same Unit share one group_key and are saved in one call, as that
    Unit and one Department for each row that names one.
  rule_sources:
  - SESSIONS Shift Creation
  - SHEET PLT-2
  rule_decisions:
  - D-143
- rule_id: R8
  rule_statement: >-
    A row whose unit is already a Unit in Iris is a row problem whose fix drops the row, because a UNITS
    file adds Units and never changes one.
  rule_sources:
  - PRD §6 Uploads
  rule_decisions:
  - D-54
  - D-143
- rule_id: R9
  rule_statement: >-
    A Department saved from a row copies the Unit's address where its address columns are empty, and its
    five site instructions, since the file has no instruction columns.
  rule_sources: []
  rule_decisions:
  - D-264
requirement_sources:
