requirement_title: Load Units and Departments from a file
requirement_statement: >-
  A Program User loads many Units and Departments at once from a file, through File Intake.
requirement_actors: []
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Each row names the Sector, Region, District, Unit, address, ZIP code, and Cost Center code, and optionally
    a Department with its Cost Center code.
  rule_sources: []
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    Sectors, Regions, and Districts that do not exist yet are created from the rows once the user approves
    the Proposal.
  rule_sources: []
  rule_decisions: []
- rule_id: R3
  rule_statement: Every row is checked with the same rules as adding a Unit by hand.
  rule_sources: []
  rule_decisions: []
