requirement_id: REQ-ORG-0001
requirement_target_layer: product
requirement_target_module: ORG
requirement_phase: MVP
requirement_title: Hold the Compass org tree
requirement_statement: >-
  Iris holds the Compass org as a tree of Sectors, Regions, Districts, and Units, with Departments inside
  Units. Access, Settings, Agency approvals, and spend are all scoped by a node of this tree.
requirement_actors:
- SYSTEM
requirement_rules:
- rule_id: R1
  rule_statement: >-
    A SECTOR node has no parent, a REGION sits under one SECTOR, a DISTRICT under one REGION, and a UNIT
    node under one DISTRICT; the tree has no other levels (C-9).
  rule_sources:
  - SHEET PLT-2
  rule_decisions: []
- rule_id: R2
  rule_statement: >-
    A node is saved only when its parent exists and is exactly one level above it; otherwise it is refused
    and the user is told why.
  rule_sources:
  - SHEET PLT-2
  rule_decisions: []
- rule_id: R3
  rule_statement: >-
    Two nodes under the same parent never share a name, and two Sectors never share a name.
  rule_sources:
  - GRAPH files and forms find a record by its name
  rule_decisions: []
- rule_id: R4
  rule_statement: >-
    The ancestors of a node are its parent and each parent above that, up to its Sector.
  rule_sources:
  - SHEET PLT-2
  rule_decisions: []
- rule_id: R5
  rule_statement: A scope set at a node covers that node and every Unit beneath it.
  rule_sources:
  - SHEET PLT-2
  - FAQ
  rule_decisions: []
- rule_id: R6
  rule_statement: >-
    Each UNIT node holds exactly one Unit, and the Unit's name is the node's name.
  rule_sources:
  - SHEET PLT-2
  rule_decisions: []
- rule_id: R7
  rule_statement: >-
    A Department belongs to exactly one Unit and is not an org node; what is charged to it rolls up through
    its Unit.
  rule_sources:
  - SHEET PLT-2
  - FEEDBACK
  rule_decisions: []
requirement_sources:
- SHEET PLT-2
- FEEDBACK
requirement_decisions: []
requirement_features:
- PLT-2
edges:
- edge_type: DEPENDS_ON
  requirement_id: REQ-AUDIT-0001
data_model:
  status: covered
  reads: []
  writes:
  - OrgNode.*
  detail: >-
    Saves org nodes and answers which nodes sit above and beneath a node. Unit and Department records
    are saved by REQ-ORG-0002 and REQ-ORG-0003.
