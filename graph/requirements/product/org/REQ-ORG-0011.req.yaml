requirement_id: REQ-ORG-0011
requirement_target_layer: product
requirement_target_module: ORG
requirement_phase: MVP
requirement_title: Assign Instawork's account team to parts of the org
requirement_statement: >-
  Instawork Admins name the Instawork Account Manager, Account Owner, and Support Lead for the whole
  program or any org node. Each Unit's team resolves from the nearest node above it, so Compass, Agencies,
  and Iris's agents know whom at Instawork to reach.
requirement_actors:
- INSTAWORK_ADMIN
- PROGRAM_USER
- UNIT_USER
requirement_rules:
- rule_id: R1
  rule_statement: >-
    Only an Instawork Admin assigns or removes an account team member.
  rule_sources:
  - GRAPH Instawork staff set a Company's account manager and account reps in Django admin
  rule_decisions:
  - D-265
- rule_id: R2
  rule_statement: >-
    An assignment names one AccountTeamRole, an active User holding an unrevoked INSTAWORK_ADMIN grant, and
    one org node, or no node for the whole program.
  rule_sources: []
  rule_decisions:
  - D-265
- rule_id: R3
  rule_statement: >-
    A scope has at most one open assignment per role, so a new assignment there first sets removed_at and
    removed_by_id on the open one.
  rule_sources: []
  rule_decisions:
  - D-265
- rule_id: R4
  rule_statement: >-
    Removing sets removed_at and removed_by_id, and a removed assignment is kept as history.
  rule_sources: []
  rule_decisions:
  - D-265
- rule_id: R5
  rule_statement: >-
    A Unit's member for a role is the open assignment at the nearest node from its UNIT node up to its
    Sector, or else the program-wide one, or else nobody.
  rule_sources: []
  rule_decisions:
  - D-265
- rule_id: R6
  rule_statement: >-
    Resolving under R5 skips an assignment whose User is inactive or no longer holds an unrevoked
    INSTAWORK_ADMIN grant.
  rule_sources: []
  rule_decisions:
  - D-265
- rule_id: R7
  rule_statement: >-
    A Program User sees the resolved team of every Unit, and a Unit User of each Unit their grants cover,
    with each member's name, email, and phone.
  rule_sources: []
  rule_decisions:
  - D-265
requirement_sources:
- GRAPH Instawork's Company admin keeps am_member and account reps through team_directory roles ACCOUNT_MANAGER and ACCOUNT_OWNER
requirement_decisions:
- D-265
