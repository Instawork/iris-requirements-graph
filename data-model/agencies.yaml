module: AGENCIES
entities:
- entity: Agency
  phase: MVP
  description: A staffing vendor that supplies Workers to Compass Shifts.
  fields:
  - {name: name, type: text}
  - {name: is_active, type: bool, note: An inactive Agency receives no new Releases}
  unique:
  - [name]
- entity: AgencyApproval
  phase: MVP
  description: Permission for the Units under one org node to send Shifts to an Agency.
  fields:
  - {name: agency_id, type: ref:Agency}
  - {name: org_node_id, type: ref:OrgNode, note: 'A Sector, Region, District, or Unit node'}
  - {name: approved_by_id, type: ref:User}
  - {name: approved_at, type: timestamp}
  - {name: removed_by_id, type: ref:User, nullable: true}
  - {name: removed_at, type: timestamp, nullable: true}
  constraints:
  - An Agency has at most one approval without removed_at per org node.
