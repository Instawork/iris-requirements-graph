module: AGENT
enums:
- enum: ProposalKind
  values:
  - {value: FILE_ROWS, meaning: Rows read from an Upload.}
  - {value: REQUEST_DRAFT, meaning: A Request drafted from plain language or a message.}
  - {value: SHIFT_CHANGE, meaning: 'A change to a Shift''s headcount or times, or its cancellation, asked for in plain language.'}
  - {value: TIMESHEET_EDITS, meaning: Timesheet changes asked for in plain language.}
  - {value: TIP_ENTRY, meaning: Tips entered by chat.}
  - {value: EXPENSE_ENTRY, meaning: Expenses added by chat.}
  - {value: WORKER_ASSIGNMENT, meaning: Workers named in chat for a Release.}
- enum: ProposalStatus
  values:
  - {value: OPEN, meaning: Waiting for the person it was made for.}
  - {value: APPLIED, meaning: Every accepted item was saved.}
  - {value: PARTLY_APPLIED, meaning: Some accepted items failed the recheck on save.}
  - {value: REJECTED, meaning: The person rejected every item; nothing was saved.}
  transitions:
  - {from: null, to: OPEN, requirement: REQ-AGENT-0002}
  - {from: OPEN, to: APPLIED, requirement: REQ-AGENT-0002}
  - {from: OPEN, to: PARTLY_APPLIED, requirement: REQ-AGENT-0002}
  - {from: OPEN, to: REJECTED, requirement: REQ-AGENT-0002}
- enum: ItemAction
  values:
  - {value: CREATE, meaning: Add a record.}
  - {value: UPDATE, meaning: Change a record.}
  - {value: DELETE, meaning: Remove or cancel a record.}
- enum: ItemDecision
  values:
  - {value: ACCEPTED, meaning: 'Accepted as proposed, with each fix applied, or the picked candidate used where one was picked.'}
  - {value: EDITED, meaning: 'Accepted with the values as the person left them, changed or not, and no fix applied.'}
  - {value: REJECTED, meaning: 'Not to be saved. Also set by accepting a fix that drops the item.'}
- enum: ItemResult
  values:
  - {value: SAVED, meaning: Saved by the requirement that proposed it.}
  - {value: FAILED_RECHECK, meaning: 'The requirement that proposed it refused it on save; result_message says why.'}
entities:
- entity: Proposal
  phase: MVP
  description: Changes Iris prepared from a file or a message, waiting for a person to decide.
  fields:
  - {name: kind, type: enum:ProposalKind}
  - {name: channel, type: enum:Channel}
  - {name: created_for_id, type: ref:User}
  - {name: summary, type: longtext}
  - {name: status, type: enum:ProposalStatus}
  - {name: decided_by_id, type: ref:User, nullable: true}
  - {name: decided_at, type: timestamp, nullable: true}
- entity: ProposalItem
  phase: MVP
  description: One change in a Proposal, with any problems found and the person's decision.
  fields:
  - {name: proposal_id, type: ref:Proposal}
  - {name: row_no, type: int, nullable: true, note: The file row it came from}
  - {name: group_key, type: text, nullable: true, note: 'Items with the same key make one record together, such as the Shifts of one Request'}
  - {name: action, type: enum:ItemAction}
  - {name: record_type, type: text, note: 'The entity it changes; the main one when an item makes several records'}
  - {name: record_id, type: int, nullable: true, note: 'Empty for CREATE until the item is saved, then the record it made'}
  - {name: field_values, type: json, note: 'Names and values as proposed, with accepted fixes applied, or as edited'}
  - {name: problems, type: json, nullable: true, note: 'One entry for each problem a check found; empty when there is none'}
  - {name: decision, type: enum:ItemDecision, nullable: true}
  - {name: result, type: enum:ItemResult, nullable: true}
  - {name: result_message, type: longtext, nullable: true}
  constraints:
  - >-
    field_values is one flat object of name to value. For a FILE_ROWS item the names are the upload type's catalog
    columns and each value is the file's text; for any other kind the requirement that proposes the item
    names them.
  - >-
    Each entry of problems has field (a name in field_values, or empty when the problem is with the whole item),
    entry (empty, or the one name the problem is about when the field's value lists several), message
    (what is wrong), fix (what accepting does, in words, or empty when there is no fix), fix_value (the
    value that replaces the field's value, or only its entry when one is named, or empty when the fix
    changes no value), drops_item (true when the fix is to reject the item), candidates (empty, or a list
    of label and value the person may pick from), and picked (empty, or the value of the candidate picked).
  - An item is ACCEPTED only when each of its problems has a fix or a picked candidate.
