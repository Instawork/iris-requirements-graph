module: INVOICING
enums:
- enum: InvoiceStatus
  phase: P2
  values:
  - {value: OPEN, meaning: Collecting the week's Approved Timesheets.}
  - {value: ISSUED, meaning: Sent; lines change only through adjustments on a later invoice.}
  - {value: PARTLY_PAID, meaning: Some of it has been paid.}
  - {value: PAID, meaning: Paid in full.}
  transitions:
  - {from: null, to: OPEN, requirement: REQ-INVOICING-0001}
  - {from: OPEN, to: ISSUED, requirement: REQ-INVOICING-0001}
  - {from: ISSUED, to: PARTLY_PAID, requirement: REQ-INVOICING-0007}
  - {from: ISSUED, to: PAID, requirement: REQ-INVOICING-0007}
  - {from: PARTLY_PAID, to: PAID, requirement: REQ-INVOICING-0007}
- enum: FeeStatementStatus
  phase: P2
  values:
  - {value: ISSUED, meaning: Sent to the Agency and not yet paid.}
  - {value: PAID, meaning: Paid in full; never changes again.}
  transitions:
  - {from: null, to: ISSUED, requirement: REQ-INVOICING-0013}
  - {from: ISSUED, to: PAID, requirement: REQ-INVOICING-0013}
- enum: ContractType
  phase: P2
  values:
  - {value: CLIENT_PAY_PAYROLL, meaning: 'Client-pay payroll, as the sheet names it (INV-8). What it means for an invoice waits on D-35.'}
  - {value: PASS_THROUGH, meaning: 'Pass-through, as the sheet names it (INV-8). What it means for an invoice waits on D-35.'}
  - {value: FULL_SERVICE, meaning: 'Full service, as the sheet names it (INV-8). What it means for an invoice waits on D-35.'}
entities:
- entity: PaymentTerms
  phase: P2
  description: 'How many days after issue an Agency Invoice is due, such as Net 30 (D-268).'
  fields:
  - {name: name, type: text}
  - {name: days_due, type: int}
  - {name: is_active, type: bool, note: Inactive terms cannot be picked for new billing details}
  unique:
  - [name]
- entity: BillingProfile
  phase: P2
  description: Where Compass wants a Sector's invoices addressed (D-268).
  fields:
  - {name: sector_id, type: ref:OrgNode, note: A SECTOR-level node}
  - {name: bill_to_name, type: text}
  - {name: address_line, type: text}
  - {name: city, type: text}
  - {name: state, type: text, note: Two-letter code}
  - {name: zip, type: text, note: Five digits}
  unique:
  - [sector_id]
  constraints:
  - sector_id is a SECTOR-level node.
- entity: BillingRecipient
  phase: P2
  description: One email address that receives a Sector's issued Consolidated Invoices (D-271).
  fields:
  - {name: billing_profile_id, type: ref:BillingProfile}
  - {name: email, type: text}
  unique:
  - [billing_profile_id, email]
- entity: PurchaseOrder
  phase: P2
  description: A Compass purchase order that a Sector's Consolidated Invoices are charged against (D-269).
  fields:
  - {name: sector_id, type: ref:OrgNode, note: A SECTOR-level node}
  - {name: po_number, type: text}
  - {name: starts_on, type: date}
  - {name: ends_on, type: date, nullable: true, note: Empty while open-ended}
  - {name: amount_limit, type: money, nullable: true, note: 'Shown against invoiced totals, never enforced'}
  - {name: is_active, type: bool}
  unique:
  - [sector_id, po_number]
  constraints:
  - Two active purchase orders of one Sector never cover the same date.
- entity: AgencyBillingProfile
  phase: P2
  description: 'How an Agency is named and paid on its Agency Invoices, and the VMS fee Iris charges it (D-270, D-272).'
  fields:
  - {name: agency_id, type: ref:Agency}
  - {name: legal_name, type: text}
  - {name: remit_to_address_line, type: text}
  - {name: remit_to_city, type: text}
  - {name: remit_to_state, type: text, note: Two-letter code}
  - {name: remit_to_zip, type: text, note: Five digits}
  - {name: payment_terms_id, type: ref:PaymentTerms}
  - {name: compass_payee_number, type: text, nullable: true, note: The number Compass accounts payable uses for the Agency}
  - {name: vms_fee_pct, type: decimal, nullable: true, note: 'Percent of each issued Agency Invoice''s total that Iris charges the Agency, such as 2.5; set only by an Instawork Admin'}
  unique:
  - [agency_id]
- entity: ConsolidatedInvoice
  phase: P2
  description: One Sector's weekly invoice across every Agency that worked in it.
  fields:
  - {name: sector_id, type: ref:OrgNode, note: A SECTOR-level node}
  - {name: week_start, type: date}
  - {name: status, type: enum:InvoiceStatus}
  - {name: issued_at, type: timestamp, nullable: true}
  - {name: invoice_number, type: text, nullable: true, note: 'Iris''s reference for this summary, set when ISSUED from one program-wide sequence'}
  - {name: bill_to, type: longtext, nullable: true, note: 'The Billing Profile''s name and address as they were at issue; empty when the Sector had none'}
  - {name: purchase_order_id, type: ref:PurchaseOrder, nullable: true, note: The active purchase order covering week_start at issue}
  unique:
  - [sector_id, week_start]
  - [invoice_number]
  constraints:
  - sector_id is a SECTOR-level node.
- entity: AgencyInvoice
  phase: P2
  description: One Agency's part of a Consolidated Invoice.
  fields:
  - {name: consolidated_invoice_id, type: ref:ConsolidatedInvoice}
  - {name: agency_id, type: ref:Agency}
  - {name: agency_invoice_number, type: text, nullable: true, note: The Agency's own invoice number}
  - {name: contract_type, type: enum:ContractType, nullable: true, note: 'Empty until D-35 settles where it is set, on the Agency or the Unit'}
  - {name: status, type: enum:InvoiceStatus}
  - {name: paid_amount, type: money, note: 0 until a payment is recorded}
  - {name: due_on, type: date, nullable: true, note: 'Issue date plus the Agency''s Payment Terms days_due; empty when it has none'}
  - {name: vms_fee_amount, type: money, nullable: true, note: 'Set at issue from the Agency''s vms_fee_pct; never shown to Compass (D-272)'}
  - {name: fee_statement_id, type: ref:AgencyFeeStatement, nullable: true, note: The fee statement that charged vms_fee_amount}
  unique:
  - [consolidated_invoice_id, agency_id]
- entity: InvoiceLine
  phase: P2
  description: One Timesheet's charges on an Agency Invoice. Created whole by REQ-INVOICING-0001, or as an adjustment by REQ-INVOICING-0004.
  fields:
  - {name: agency_invoice_id, type: ref:AgencyInvoice}
  - {name: timesheet_id, type: ref:Timesheet}
  - {name: work_date, type: date, note: Never changes through revisions}
  - {name: regular_amount, type: money}
  - {name: overtime_amount, type: money}
  - {name: double_time_amount, type: money}
  - {name: tips_amount, type: money}
  - {name: expenses_amount, type: money}
  - {name: adjusts_line_id, type: ref:InvoiceLine, nullable: true, note: Set on a prior-period adjustment}
- entity: InvoiceCredit
  phase: P2
  description: Hours sent back on an issued invoice, and the Agency's credit.
  fields:
  - {name: invoice_line_id, type: ref:InvoiceLine}
  - {name: minutes, type: int}
  - {name: amount, type: money, nullable: true, note: Set when the Agency credits the hours}
  - {name: reason, type: longtext}
  - {name: requested_by_id, type: ref:User}
  - {name: credited_at, type: timestamp, nullable: true}
- entity: AgencyPayment
  phase: P2
  description: One payment Compass made to an Agency against an Agency Invoice (D-273).
  fields:
  - {name: agency_invoice_id, type: ref:AgencyInvoice}
  - {name: amount, type: money}
  - {name: paid_on, type: date}
  - {name: reference, type: text, nullable: true, note: 'Such as a check or ACH number'}
  - {name: recorded_by_id, type: ref:User}
- entity: AgencyFeeStatement
  phase: P2
  description: One month's VMS fees that Iris charges one Agency (D-272).
  fields:
  - {name: agency_id, type: ref:Agency}
  - {name: month_start, type: date, note: The first day of the month whose issued Agency Invoices it charges}
  - {name: fee_amount, type: money}
  - {name: status, type: enum:FeeStatementStatus}
  - {name: issued_at, type: timestamp}
  - {name: paid_on, type: date, nullable: true}
  - {name: marked_paid_by_id, type: ref:User, nullable: true}
  unique:
  - [agency_id, month_start]
