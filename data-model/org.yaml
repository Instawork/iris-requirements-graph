module: ORG
enums:
- enum: OrgLevel
  values:
  - {value: SECTOR, meaning: 'Top of the Compass org, such as Levy. Has no parent.'}
  - {value: REGION, meaning: Sits under one Sector.}
  - {value: DISTRICT, meaning: Sits under one Region.}
  - {value: UNIT, meaning: Sits under one District. Holds exactly one Unit record.}
- enum: Weekday
  values:
  - {value: MON, meaning: Monday}
  - {value: TUE, meaning: Tuesday}
  - {value: WED, meaning: Wednesday}
  - {value: THU, meaning: Thursday}
  - {value: FRI, meaning: Friday}
  - {value: SAT, meaning: Saturday}
  - {value: SUN, meaning: Sunday}
- enum: Role
  values:
  - {value: INSTAWORK_ADMIN, meaning: 'Instawork staff who load reference data and invite the first Program User (D-26, D-83). Has no scope.'}
  - {value: PROGRAM_USER, meaning: The Compass program office. Covers the whole program.}
  - {value: UNIT_USER, meaning: 'A Compass operator who books Shifts and approves hours, granted at an org node.'}
  - {value: AGENCY_USER, meaning: Staff of one Agency who staff Shifts and submit hours.}
- enum: GateMode
  values:
  - {value: SOFT, meaning: The action goes ahead with a required reason and is flagged.}
  - {value: HARD, meaning: The action is refused with the reason shown.}
- enum: SettingKey
  catalog: settings
entities:
- entity: OrgNode
  phase: MVP
  description: 'One node of the Compass org tree: a Sector, Region, District, or Unit.'
  fields:
  - {name: level, type: enum:OrgLevel}
  - {name: name, type: text}
  - {name: parent_id, type: ref:OrgNode, nullable: true, note: Empty only for a Sector; otherwise a node one level up}
  - {name: active, type: bool, note: 'An inactive node takes no new child, and an inactive UNIT node takes no new Request'}
  unique:
  - [parent_id, name]
  constraints:
  - Two UNIT nodes never share a name, whatever their parents (D-54).
- entity: CostCenter
  phase: MVP
  description: A Compass cost center code that spend is charged to.
  fields:
  - {name: code, type: text}
  unique:
  - [code]
- entity: Unit
  phase: MVP
  description: 'A Compass location that orders Shifts, such as a stadium or a hospital. Its name is its OrgNode name.'
  fields:
  - {name: org_node_id, type: ref:OrgNode, note: A UNIT-level node}
  - {name: address_line, type: text}
  - {name: city, type: text}
  - {name: state, type: text, note: Two-letter code; labor rules resolve from this and city}
  - {name: zip, type: text, note: Five digits}
  - {name: timezone, type: text, note: 'IANA zone, such as America/Chicago; every Shift time at the Unit is in this zone. Filled from zip when not given (D-86)'}
  - {name: market_id, type: ref:Market, note: 'The Market that holds zip; set when the Unit is saved and again when its ZIP code is added to a Market (D-237)'}
  - {name: cost_center_id, type: ref:CostCenter}
  - {name: work_week_start, type: enum:Weekday}
  - {name: is_secured_site, type: bool, note: Workers need a badge request here}
  - {name: default_parking, type: text, nullable: true}
  - {name: default_entrance, type: text, nullable: true}
  - {name: default_directions, type: text, nullable: true}
  - {name: default_site_contact, type: text, nullable: true}
  - {name: default_attire, type: text, nullable: true}
  unique:
  - [org_node_id]
- entity: Department
  phase: MVP
  description: 'Part of a Unit charged to its own Cost Center, such as suites or concessions.'
  fields:
  - {name: unit_id, type: ref:Unit}
  - {name: name, type: text}
  - {name: cost_center_id, type: ref:CostCenter}
  - {name: active, type: bool}
  unique:
  - [unit_id, name]
- entity: RoleGrant
  phase: MVP
  description: 'One role a User holds, and the scope it covers. A revoked grant is restored, never added a second time.'
  fields:
  - {name: user_id, type: ref:User}
  - {name: role, type: enum:Role}
  - {name: org_node_id, type: ref:OrgNode, nullable: true, note: Set only for a Unit User; covers every Unit beneath it}
  - {name: agency_id, type: ref:Agency, nullable: true, note: Set only for an Agency User}
  - {name: granted_by, type: ref:User, nullable: true, note: 'Empty for a seeded Instawork Admin; after a revoked grant is restored, the User who restored it'}
  - {name: revoked_at, type: timestamp, nullable: true}
  unique:
  - [user_id, role, org_node_id, agency_id]
  constraints:
  - A UNIT_USER grant has org_node_id and no agency_id.
  - An AGENCY_USER grant has agency_id and no org_node_id.
  - PROGRAM_USER and INSTAWORK_ADMIN grants have neither.
- entity: Setting
  phase: MVP
  description: An override of one Setting at one org node, or a new program default. Unset keys use the catalog default.
  fields:
  - {name: key, type: enum:SettingKey}
  - {name: value, type: text, note: 'Parsed by the type the settings catalog gives the key; a whole number is 0 or more (D-80)'}
  - {name: org_node_id, type: ref:OrgNode, nullable: true, note: Empty means the program default}
  unique:
  - [key, org_node_id]
  constraints:
  - A key the catalog marks program-only has no row with org_node_id set.
