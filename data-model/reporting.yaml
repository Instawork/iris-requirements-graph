module: REPORTING
enums:
- enum: Measure
  values:
  - {value: SPEND, meaning: 'Approved spend plus pending spend, as REQ-REPORTING-0001 defines.'}
  - {value: APPROVED_SPEND, meaning: Spend on Approved Timesheets and approved expenses.}
  - {value: PENDING_SPEND, meaning: Spend not yet approved (D-29).}
  - {value: HOURS, meaning: 'The minutes behind Spend, shown as hours: worked minutes on Approved Timesheets plus pending minutes (D-29).'}
  - {value: OVERTIME_HOURS, meaning: Overtime plus double-time minutes within Hours.}
  - {value: HEADCOUNT_REQUESTED, meaning: Headcount on Shifts that are not cancelled.}
  - {value: FILL_RATE, meaning: 'Assigned Workers over headcount on Shifts that started; for one Agency, over the headcount released to it.'}
  - {value: NO_SHOW_RATE, meaning: No-show Timesheets over assigned Workers on worked Shifts.}
  - {value: BUDGET, meaning: 'Budget amount for the period, prorated by days.'}
  - {value: LABOR_PCT_OF_SALES, meaning: 'Spend over revenue, on dates that have revenue.'}
  - {value: LATE_TIMESHEETS, meaning: 'Timesheets not approved when their Lock Window closed, by work date.'}
  - {value: MISSED_BREAK_TIMESHEETS, meaning: 'Timesheets whose exception reasons include a missed break, by work date.'}
- enum: Dimension
  values:
  - {value: SECTOR, meaning: Sector}
  - {value: REGION, meaning: Region}
  - {value: DISTRICT, meaning: District}
  - {value: UNIT, meaning: Unit}
  - {value: DEPARTMENT, meaning: Department}
  - {value: COST_CENTER, meaning: Cost Center}
  - {value: AGENCY, meaning: Agency}
  - {value: POSITION, meaning: Position}
  - {value: EVENT, meaning: Event}
  - {value: WORK_DATE, meaning: Work date}
  - {value: WORK_WEEK, meaning: The Unit's Work Week}
  - {value: MONTH, meaning: Calendar month}
- enum: RelativePeriod
  values:
  - {value: THIS_WORK_WEEK, meaning: 'The current Work Week to date, for each Unit its own.'}
  - {value: LAST_WORK_WEEK, meaning: 'The last full Work Week, for each Unit its own.'}
  - {value: LAST_4_WORK_WEEKS, meaning: 'The last four full Work Weeks, for each Unit its own.'}
  - {value: THIS_MONTH, meaning: The current calendar month to date.}
  - {value: LAST_MONTH, meaning: The last full calendar month.}
entities:
- entity: Budget
  phase: MVP
  description: A Unit's labor budget for a date range (D-14, D-154).
  fields:
  - {name: unit_id, type: ref:Unit}
  - {name: period_start, type: date}
  - {name: period_end, type: date, note: Inclusive}
  - {name: amount, type: money}
  - {name: upload_id, type: ref:Upload, nullable: true}
  constraints:
  - Budgets for the same Unit never overlap in dates.
- entity: SalesRecord
  phase: MVP
  description: A Unit's sales for one date.
  fields:
  - {name: unit_id, type: ref:Unit}
  - {name: date, type: date}
  - {name: revenue, type: money, nullable: true}
  - {name: events_held, type: int, nullable: true}
  - {name: meals_served, type: int, nullable: true}
  - {name: upload_id, type: ref:Upload, nullable: true}
  unique:
  - [unit_id, date]
- entity: SavedReport
  phase: MVP
  description: A chart, table, or dashboard a User saved from a question.
  fields:
  - {name: owner_id, type: ref:User}
  - {name: name, type: text}
  - {name: measures, type: 'list:enum:Measure'}
  - {name: group_by, type: 'list:enum:Dimension'}
  - {name: filters, type: json, note: Dimension values to keep}
  - {name: period_start, type: date, nullable: true}
  - {name: period_end, type: date, nullable: true}
  - {name: relative_period, type: enum:RelativePeriod, nullable: true, note: 'Used instead of fixed dates; resolved when the report is opened'}
  constraints:
  - Either period_start and period_end are both set, or relative_period is set, never both.
